AL en diminuant les doses d’AL et donc la toxicité La Morphine 100µg : installation en 30 min et pendant 12h Le Sufentanil 2,5 à 5 µg : analgésie s’installe en quelques min et dure 2 à 4h Mécanismes :","- Bloc sympathique T4","- Déséquilibre sympatho vagal","- Diminution du volume de LCR par compression","- Compression aorto cave","- injection lente de l’AL","- Réduction de la stase veineuse dans le MI avec BAT","- DLG","- Concernant le remplissage vasculaire :","- Co-remplissage avec cristalloïdes","- Vasopresseurs d’emblée, NAD diluée (pas de chute du Qc et moins de bradycardie)","- VVP 18G minimum"],"points":2,"instruction":"","id":"c3","num":3,"page":1,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%202.4.pdf"},{"title":"Parmi ces propositions concernant L'arrêt des anti plaquettaires avant une intervention chirurgicale, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Il est déterminé par la balance entre le risque thrombotique et le risque hémorragique","Il est rarement nécessaire pour l'aspirine","Il doit être de 15 jours pour l'aspirine","Il doit être de 5 jours pour le clopidogrel","Il est évité pour le Ticagrelor® grâce à l'existence d’un antidote"],"kind":"QCM","unit":"2.4","sourcePage":13,"topic":"Antiagregants plaquettaires, anticoagulant oraux direct, avk, heparine","session":"2020-2022","figures":[],"ue":"2.4","refs":[["Corrigé d’époque · p. 24","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%202.4%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=24"]],"correct":"ABD","note":"","optionNotes":[["Il doit être de 5 jours pour le clopidogrel","Plavix"],["Il est évité pour le Ticagrelor® grâce à l'existence d’un antidote","arrêt 3 5 jrs brilique sans antidote"]],"ungraded":false,"points":1,"instruction":"Cocher les propositions exactes.","id":"c4","num":4,"page":1,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%202.4.pdf"},{"title":"Parmi les propositions concernant L'antibioprophylaxie au bloc opératoire laquelle est vraie ? L’antibioprophylaxie lors d'une césarienne est l'administration de céfazoline 2g, 30 minutes avant l'incision et non après le clampage du cordon\n\nCAR\n\nLa prolongation de l'antibioprophylaxie au bloc opératoire réduit les infections du site opératoire (ISO)","options":["Les propositions sont toutes 2 vraies et il existe entre elles une relation de cause à effet","Les propositions sont toutes 2 vraies sans qu'il existe entre elles de relations de cause à effet","La première proposition est vraie, mais la 2e fausse","La première proposition est fausse, mais la 2e vraie","Les 2 propositions sont fausses"],"kind":"QCU","unit":"2.4","sourcePage":15,"topic":"Antibioprophylaxie","session":"2020-2022, 2021-2023","figures":[],"ue":"2.4","refs":[["Corrigé d’époque · p. 29","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%202.4%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=29"],["Cours à consulter · 3.3 Chirurgie urologique avec note (p. 13)","../../../cours/S1/3.3/3.3%20Chirurgie%20urologique%20avec%20note.pdf#page=13"]],"correct":"D","note":"Réponses repérées dans le corrigé de la promotion.","optionNotes":[],"ungraded":false,"points":1,"instruction":"Cocher une seule proposition.","id":"c5","num":5,"page":2,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%202.4.pdf"},{"title":"Parmi les propositions concernant le Dantrolène, laquelle ou lesquelles est (sont) vraie(s) ?","options":["C’est un myorelaxant","La dose initiale est de 2,5 mg/kg","La dose d'entretien du Dantrolène est de 1mg/kg/12h pendant 24h à 48h","Le délai d'action du dantrolène est de 25 à 30 min","Le kit doit contenir un nombre fixe de flacons de dantrolène, quelle que soit la présentation disponible."],"kind":"QCM","unit":"2.4","sourcePage":23,"topic":"Dantrolene","session":"2016-2018, 2020-2022","figures":[],"ue":"2.4","refs":[["Corrigé d’époque · p. 9","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%202.4%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=9"],["SFAR · Hyperthermie maligne","https://sfar.org/recommandations-dexperts-pour-le-risque-dhyperthermie-maligne-en-anesthesie-reanimation/"]],"correct":"AB","note":"La dose initiale est de 2,5 mg/kg IV. Les réinjections et le stock dépendent du protocole et de la présentation disponible.","optionNotes":[],"ungraded":false,"points":1,"instruction":"Cocher les propositions exactes.","id":"c6","num":6,"page":2,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%202.4.pdf"},{"title":"Donner l'indication du dantrolène® DANTRIUM. Décrire sa présentation, la posologie et les modalités d'utilisation, ainsi que le stock nécessaire","options":[],"kind":"QUESTION","unit":"2.4","sourcePage":23,"topic":"Dantrolene","session":"2020-2022","figures":[],"ue":"2.4","refs":[["SFAR · Hyperthermie maligne","https://sfar.org/recommandations-dexperts-pour-le-risque-dhyperthermie-maligne-en-anesthesie-reanimation/"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["Le dantrolène est le traitement spécifique de la crise d’hyperthermie maligne.","Dans la présentation historique Dantrium® IV, un flacon de 20 mg se reconstitue avec 60 mL d’eau pour préparations injectables. La préparation dépend de la spécialité disponible.","La fiche SFAR indique une dose initiale IV de 2,5 mg/kg, puis des réinjections selon la réponse. Pour un patient de 60 kg, 10 mg/kg représentent 600 mg, soit 30 flacons de 20 mg. Vérifier le stock prévu par le protocole de l’établissement."],"points":2,"instruction":"","id":"c7","num":7,"page":2,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%202.4.pdf"},{"title":"Parmi ces propositions concer f#page=62"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["Nom commercial Sufenta Rapifen Ultiva Dose induction habituelle 0,1 à 0,5µg/kg VS 5 à 10 µg/kg PSE 0,2 à 1µg/kg/min VC 20 à 40 µg/kg Dose entretien 5 à 10 µg VS 5 à 10 µg/kg 0,05 à 2 µg/kg/min en VC 15µg/kg IVSE Délai d’action 2 à 3 min 20s 30s Durée d’action 45 à 70 min 5-15 min 10 min max après stop","TTT Métabolisme Hépatique Hépatique Estérases plasmatiques et tissulaires AIVOC concentration cible 0,3 à 0,4 ng/mL Non utilisé en 4 à 6 ng/mL Induction/IOT AIVOC AIVOC concentration cible 0,1 à 0,5ng/mL 2-8ng/mL AIVOC concentration cible Réveil 0,1ng/mL < 1ng/mL"],"points":2,"instruction":"","id":"c14","num":14,"page":4,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%202.4.pdf"},{"title":"Décrire les trois mécanismes de dépression respiratoire induit par la morphine","options":[],"kind":"QUESTION","unit":"2.4","sourcePage":42,"topic":"Morphiniques","session":"2020-2022","figures":[],"ue":"2.4","refs":[["Cours à consulter · 3.1 SSPI Avec notes (p. 31)","../../../cours/S1/3.1/3.1%20SSPI%20Avec%20notes.pdf#page=31"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["La morphine diminue la réponse ventilatoire au CO₂ et à l’hypoxie par action centrale.","La baisse de la fréquence respiratoire et de la ventilation minute peut s’accompagner d’une obstruction des voies aériennes supérieures favorisée par la sédation."],"points":2,"instruction":"","id":"c15","num":15,"page":4,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%202.4.pdf"},{"title":"Citer 5 signes cliniques d'un surdosage en morphine. Décrire la conduite à tenir dans ce cas en précisant la thérapeutique à administrer et sa mise en œuvre. Citer 5 effets indésirables du médicament indiqué dans ce cas.","options":[],"kind":"QUESTION","unit":"2.4","sourcePage":42,"topic":"Morphiniques","session":"2020-2022","figures":[],"ue":"2.4","refs":[],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["Rechercher notamment bradypnée, hypoventilation, baisse de conscience, myosis et désaturation.","Arrêter l’administration, alerter, assurer l’oxygénation et la ventilation. Utiliser la naloxone titrée selon le protocole et surveiller une récidive.","La naloxone peut déclencher douleur aiguë, agitation, nausées ou vomissements, tachycardie et hypertension, notamment en cas de sevrage brutal."],"points":2,"instruction":"","id":"c16","num":16,"page":4,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%202.4.pdf"},{"title":"Parmi les propositions concernant la notion de seuil transfusionnel, laquelle ou lesquelles est (sont) vraie(s) ?","options":["L'âge et les antécédents médicaux déterminent le seuil transfusionnel","La tolérance clinique et la cinétique de l'anémie déterminent le seuil transfusionnel","L’hypotension artérielle associée à une tachycardie déterminent le seuil transfusionnel","Un taux d'hémoglobine à 10g/dl représente le seuil à partir duquel un patient coronarien doit être transfusé","Un taux d'hémoglobine à 9 g/dl représente le seuil à partir duquel un patient sans antécédent cardio-vasculaire doit être transfusé"],"kind":"QCM","unit":"2.4","sourcePage":46,"topic":"Transfusion et medicaments derives du sang","session":"2020-2022","figures":[],"ue":"2.4","refs":[["HAS · Gestion du capital sanguin","https://www.has-sante.fr/jcms/p_3363219/fr/gestion-du-capital-sanguin-en-pre-per-et-post-operatoire-et-en-obstetrique-recommandation"]],"correct":"AB","note":"Le taux d’hémoglobine s’interprète avec la tolérance, la cinétique de l’anémie et le contexte cardiovasculaire. Un seuil unique ne suffit pas pour toutes les situations.","optionNotes":[],"ungraded":false,"points":1,"instruction":"Cocher les propositions exactes.","id":"c17","num":17,"page":4,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%202.4.pdf"}],"figures":{"2.4-38-487.7-0":"/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/2wBDAQUFBQcGBw0HBw0cEhASHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBz/wAARCAE9AtkDASIAAhEBAxEB/8QAHAABAQADAQEBAQAAAAAAAAAAAAcFBggEAwIB/8QAWhAAAAUCAwIHDQQFCQQJAwUAAAECAwQFEQYHEhchExgxWKbS0wgUFSI4QVZXZ5WWpeMWMlG0I0dhhIYlM0JIcXeHw8UkNGKBJjZDUlNykaGxKEaCVHSisrP/xAAUAQEAAAAAAAAAAAAAAAAAAAAA/8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEQMRAD8A7+HiqNYp1HJhVRnxIZSHCZaOS8lvhFnyJTqMrqP8C3j2iSoPwj3Sb7cgtaKRhZDkVKt5NrfkqJxRfgZpaSV/wAUlNfpK6odKTVIR1Mi1HDKQjhiL8dF7/wDsPousU5uot01c+KmouJ1oiqeSTqk/iSL3Mv22EcrOE6NiPG9BomGafFhQsLVtNdq1SaQRWlK1KKMlXKpxw3CUvfuTYj3qIhM60tyVlpjbEakl9p4uYSTYkW/SoW3MaZaQR8pFwR6bfgo/xAdVya/SYVQYp8mqQmZ7/wDNRnZCEuuf+VJnc/8AkPpOq9OpjkZqdPixXJK+DZQ+8lBuq/7qSM95/sIRzNTCdGxZJm4LolOitVuuSI1UrVUJBXgstLSaXlL/APEUTWhtP/mVuIjvr+MIsbEWLs+Way2h1FOwzFZicKV+BaUw86pSb8n6Qr3LzoL8AHSAx0av0mbUHqdGqkJ6oMFd2M1IQp1sv+JBHcv+Y0LLPG8qfh/BtJqVHrrk+ZRoz79SOGZxNZsEo9T1/vHa3JymNdgYTo1dzEwx9l4Eam4awE9JSqWwgklKluoNCozZ8qkp1Gpw9/jWLeZKsFj8L07wl4M7/i+EtHCd6cMnhdP/AHtF72/bYfNVfpKKomlKqkIqmorlDOQjhjLlvovf/wBhymS3JGWkHEukvtRtH1d8W/S6+/zYNF+W3A+Jb/ukKZjDCNFxRiin4Xw7T40PwZWmcRVyqtIIjYeJWtLZL5TedO1yv4qL35UkYWCTX6TCqDFPk1SEzPf/AJqM7IQl1z/ypM7n/wAh9IlZp0+ZLhRahEfmQzJMhhp5KnGDPeRLSR3Tf9ojmauE6NiyVNwXRKfFarVckRqpWqoSCvBYaWk0vKX/AOIomtDaf/MrcRHfK47tTs7srJsctD89FRp8hSdxus8CTqUq/EiWgjL8LmArYDQ85sUVXBWWlfxBRVx01KnNJdbKQ3rbV46SNJkRke8j5RpmJ8ZY1wrW8OYefqLdQmYmfkSESafSvHhxmWUqU2htThktRrV95R7k33GYC3gIOjHeYzr2XVMmtQ6LVa/KnwpvfMI1npZQtbb6EE54pqSkj0mZkRq/ZY8azmrjhzBVLqcltRxItUqNOrdYpVNOS7HTHcWhp4o2oz0KNN1mklWtuIr3IOih+dadejUWu19N99vxHPc/NfF1SnN0TDUhmqTYmHWKt4Qp1 const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

function fields(q) {
  if (isChoice(q)) {
    return `<div class="choices ${q.options?'written-choices':''}" role="${q.kind==='QCU'?'radiogroup':'group'}" aria-labelledby="title-${q.id}">${q.options.map((_,i)=>values[i]).map((letter,i)=>`<label class="option" id="option-${q.id}-${letter}"><input type="${q.kind==='QCU'?'radio':'checkbox'}" name="${q.id}" value="${letter}"><span><strong>${letter}</strong>${q.options?' · '+escape(q.options[i]):''}<small></small></span></label>`).join('')}</div>`;
  }
  return `<div class="field"><textarea id="answer-${q.id}" aria-labelledby="title-${q.id}" rows="5" placeholder="Ta réponse…"></textarea></div>`;
}
function render() {
  $('cards').innerHTML = active.map((q, index) => {
    const section = q.kind === 'context' ? '<span>Dossier</span>' : `<span>${q.ungraded?'Hors barème':format(q.points)+' pt'} · ${escape(q.session)} · PDF p. ${q.page}</span>`;
    const anchor = active.findIndex(card=>card.kind===q.kind)===index ? ` id="section-${q.kind}"` : '';
    return `<section class="card"${anchor} data-card="${q.id}"><div class="meta"><strong id="title-${q.id}">${escape(questionLabel(q))}</strong>${section}</div>${prompt(q)}${q.kind==='context'?'':fields(q)+`<div class="feedback" id="feedback-${q.id}" hidden></div>`}</section>`;
  }).join('');
  for(const link of document.querySelectorAll('[data-kind]')){
    const kind=link.dataset.kind;
    const index=active.findIndex(q=>kind==='open'?isOpen(q):q.kind===kind);
    link.hidden=index<0;
    if(index>=0) link.hash='section-'+active[index].kind;
  }
}
function response(q) {
  if (isChoice(q)) {
    return [...form.querySelectorAll(`[name="${q.id}"]:checked`)].map(input=>input.value);
  }
  return $(`answer-${q.id}`).value.trim();
}
function progress() {
  const current=active.filter(q=>q.kind!=='context');
  const count=current.filter(q=>response(q).length>0).length;
  $('progress').textContent=`${count} / ${current.length} questions renseignées`;
  $('bar').max=current.length;
  $('bar').value=count;
}
function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.slice(0,q.options.length).filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Évalue ta réponse à partir des éléments du corrigé.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0,ungraded:q.ungraded};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values.slice(0,q.options.length)){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(!q.ungraded&&q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  if (isOpen(q)) {
    panel.innerHTML=`${answerBox(q)}${sources(q)}${q.ungraded?'<p class="small">Question hors barème.</p>':rubricPanel(q,grade)+assessmentControls(q,grade)}${sourceCopy(q)}`;
    return;
  }
  const answers=q.correct.split('').filter(Boolean).map(letter=>q.options[values.indexOf(letter)]);
  const key=`<strong>${q.ungraded?'Hors barème':format(grade.autoScore)+' / 1 point'}</strong><div class="answer-key" style="margin-top:10px"><h3>${q.ungraded?'Éléments pour vérifier':'Correction'}</h3>${answers.length?`<ul class="correct-options">${answers.map(a=>`<li>${escape(a)}</li>`).join('')}</ul>`:''}${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
  const notes=q.optionNotes?.length?`<div class="answer-key"><h3>Précisions du corrigé</h3><ul>${q.optionNotes.map(([option,note])=>`<li><strong>${escape(option)}</strong><br>${escape(note)}</li>`).join('')}</ul></div>`:'';
  panel.innerHTML=key+notes+sources(q)+sourceCopy(q);
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return !grade.ungraded&&(grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max)));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const adjusted=list.some(g=>g.review && g.review!=='blank' || g.analysis?.some(c=>c.override!==null));
  if(adjusted) $('summary').textContent+=' Note ajustée.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(g=>g.ungraded||isComplete(g));
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!q.ungraded&&!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function shuffledCard(q) {
  if (!isChoice(q)) return q;
  const indexes=q.options.map((_,i)=>i);
  for(let i=indexes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
  }
  const correct=indexes.map((index,i)=>q.correct.includes(values[index])?values[i]:'').join('');
  return {...q,options:indexes.map(i=>q.options[i]),correct};
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!g.ungraded&&!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>(!$('topic').value||q.topic===$('topic').value)&&(!keep||keep.has(q.id))).map(shuffledCard);
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
for(const topic of new Set(DATA.cards.map(q=>q.topic))) $('topic').add(new Option(topic,topic));
$('topic').addEventListener('change',()=>start());
start();
</script>

<script>window.MEMO_QUIZ={"id": "annales-nf/S2/2.4-2020-2022", "href": "annales-nf/S2/2.4-2020-2022.html", "collection": "annales-nf", "sem": "S2", "ue": "2.4", "periode": "2020-2022", "titre": "Pharmacologie spécifique — 2020-2022"};</script>
<script>
/* Mémo : enregistre la note obtenue, pour l'écran « Mes résultats » de l'app.
   Même origine que l'app, donc même localStorage. Une tentative par correction ;
   si la note est ajustée à la main ensuite, la tentative en cours est mise à jour. */
(function () {
  var CLE = 'memo-resultats', INFO = window.MEMO_QUIZ;
  if (!INFO) return;
  var resultats = document.getElementById('results'), score = document.getElementById('score');
  if (!resultats || !score) return;
  var tentative = null;

  function lire() { try { return JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { return []; } }
  function noteDe(txt) {
    var m = String(txt).match(/(-?[\d  ]+(?:[.,]\d+)?)\s*\/\s*20/);
    return m ? parseFloat(m[1].replace(/[  ]/g, '').replace(',', '.')) : null;
  }
  function enregistrer() {
    if (resultats.hidden) return;
    var note = noteDe(score.textContent);
    if (note === null || !isFinite(note)) return;
    var liste = lire();
    var ligne = tentative && liste.find(function (x) { return x.cle === tentative; });
    if (!ligne) {
      tentative = INFO.id + '#' + Date.now();
      ligne = { cle: tentative, id: INFO.id, href: INFO.href, collection: INFO.collection,
        sem: INFO.sem, ue: INFO.ue, periode: INFO.periode, titre: INFO.titre };
      liste.push(ligne);
    }
    ligne.note = Math.round(note * 100) / 100;
    ligne.date = new Date().toISOString();
    try { localStorage.setItem(CLE, JSON.stringify(liste.slice(-300))); } catch (e) {}
  }

  new MutationObserver(enregistrer).observe(score, { childList: true, characterData: true, subtree: true });
  new MutationObserver(enregistrer).observe(resultats, { attributes: true, attributeFilter: ['hidden'] });
  // « Tout recommencer » : la prochaine correction comptera comme une nouvelle tentative.
  document.getElementById('reset') && document.getElementById('reset').addEventListener('click', function () { tentative = null; });
})();
</script>
