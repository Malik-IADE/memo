le","pour les sujets présentant un souffle cardiaque"],"kind":"QCM","unit":"3.3","sourcePage":20,"topic":"Chirurgie : orl","session":"2020-2022","figures":[],"ue":"3.3","refs":[["Corrigé d’époque · p. 31","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.3%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=31"],["Cours à consulter · 3.1 SSPI Avec notes (p. 63)","../../../cours/S1/3.1/3.1%20SSPI%20Avec%20notes.pdf#page=63"]],"correct":"C","note":"","optionNotes":[["pour les sujets âgés","CI"],["pour les sujets dysautonomiques","CI"],["pour les sujets présentant une insuffisance vasculaire cérébrale","CI"],["pour les sujets présentant un souffle cardiaque","CI"]],"ungraded":false,"points":1,"instruction":"Cocher les propositions exactes.","id":"c7","num":7,"page":2,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.3.pdf"},{"title":"Dans le cadre de la chirurgie ORL, citer la posture d'installation du patient per-opératoire permettant la réduction des saignements. citer les risques de celle-ci et expliquer leurs mécanismes de survenu","options":[],"kind":"QUESTION","unit":"3.3","sourcePage":20,"topic":"Chirurgie : orl","session":"2020-2022","figures":[],"ue":"3.3","refs":[["Corrigé d’époque · p. 55","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.3%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=55"],["Cours à consulter · 3.1 Positions chirurgicales acec notes (p. 4)","../../../cours/3.1%20Positions%20chirurgicales%20acec%20notes.pdf#page=4"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["Position proclive pour favoriser le drainage veineux. Surveiller la pression artérielle et la perfusion cérébrale, en tenant compte du gradient de hauteur.","Protéger les points d’appui et vérifier l’installation cervicale et la sécurité de la sonde."],"points":2,"instruction":"","id":"c8","num":8,"page":2,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.3.pdf"},{"title":"Parmi ces propositions concernant les signes cliniques habituels du phéochromocytome, laquelle ou lesquelles est (sont) vraie(s) ?","options":["le patient présente une HTA sévère, paroxystique ou permanente","le patient présente des céphalées","le patient présente des sueurs nocturnes","le patient présente des accès de tachycardie","le patient présente des hypoglycémies"],"kind":"QCM","unit":"3.3","sourcePage":26,"topic":"Chirurgie : surrenale","session":"2020-2022","figures":[],"ue":"3.3","refs":[["Corrigé d’époque · p. 32","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.3%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=32"]],"correct":"ABD","note":"","optionNotes":[["le patient présente des sueurs nocturnes","Hypersudation sans précision"],["le patient présente des hypoglycémies","Hyperglycémies liées aux catécholamines"]],"ungraded":false,"points":1,"instruction":"Cocher les propositions exactes.","id":"c9","num":9,"page":2,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.3.pdf"},{"title":"Définir le phéochromocytome. Citer le risque per-opératoire induit par la chirurgie du phéochromocytome. Expliquer les mécanismes de survenue de ce risque.","options":[],"kind":"QUESTION","unit":"3.3","sourcePage":26,"topic":"Chirurgie : surrenale","session":"2013-2015 / 2014-2016 / 2020-2022","figures":[],"ue":"3.3","refs":[["Corrigé d’époque · p. 53","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.3%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=53"],["Cours à consulter · 3.1 Processus d'anesthésie avec notes (p. 35)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=35"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["Phéochromocytome = tumeur bénigne de la médullo-surrénale induisant une sécrétion trop importante de catécholamines. Risque per op = instabilité HDQ:","- accès hypertensif par mobilisation de la tumeur avant clampage des pédicules, et par insufflation pneumopéritoine (coelio) libérant des catécholamines","- ttt par inhibiteur calcique, B bloquants, stop manipulation, approfondissement anesthésie","- hypoTA par sevrage brutal en catécholamines après exclusion vasculaire de la tumeur entraînant une hypovolémie relative","- ttt par RV cristalloïdes en première intention, puis éphédrine/néo/NAD"],"points":2,"instruction":"","id":"c10","num":10,"page":2,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.3.pdf"},{"title":"Dans le cadre de la chirurgie endocrinienne. citer les risques post-opératoires immédiat d'une thyroïdectomie totale et en donner les signes cliniques ainsi que les conséquences. préciser votre conduite à tenir pour chaque situation","options":[],"kind":"QUESTION","unit":"3.3","sourcePage":27,"topic":"Chirurgie : thyroïde","session":"2020-2022","figures":[],"ue":"3.3","refs":[["Cours à consulter · Chirurgie diges avec note 3.3 (p. 11)","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf#page=11"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["Hématome cervical compressif : gonflement, dysphonie, stridor, détresse respiratoire. Alerter immédiatement l’équipe chirurgicale et anesthésique et anticiper la prise en charge des voies aériennes et la décompression.","Paralysie récurrentielle : dysphonie ou, si bilatérale, obstruction inspiratoire. Évaluer les voies aériennes et la mobilité laryngée.","Hypocalcémie liée à une atteinte parathyroïdienne : paresthésies, crampes ou tétanie, parfois QT prolongé. Contrôler la calcémie et traiter selon la gravité."],"points":2,"instruction":"","id":"c11","num":11,"page":2,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.3.pdf"},{"title":"Parmi ces propositions concernant la ventilation uni-pulmonaire en chirurgie thoracique, laquelle ou lesquelles est (sont) vraie(s) ?","options":["elle est indiquée pour la fistule bronchopleurale à gros débit en pression positive","Elle est contre-indiquée pour un pneumothorax","l'exclusion pulmonaire du poumon malade est faite d'emblée après l'intubation","elle permet la ventilation en pression positive du poumon sain qu'après avoir mis en place la sonde d'intubation sélective","la tamponnade gazeuse est un des risques de la ventilation uni-pulmonaire"],"kind":"QCM","unit":"3.3","sourcePage":30,"topic":"Chirurgie : thoracique","session":"2020-2022","figures":[],"ue":"3.3","refs":[["Corrigé d’époque · p. 34","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.3%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=34"],["Cours à consulter · 2.2 Physiologie respi avec notes (p. 5)","../../../cours/S1/2.2/2.2%20Physiologie%20respi%20avec%20notes.pdf#page=5"]],"correct":"ACD","note":"","optionNotes":[["Elle est contre-indiquée pour un pneumothorax","Indiquée"],["l'exclusion pulmonaire du poumon malade est faite d'emblée après l'intubation","dans le cours"]],"ungraded":false,"points":1,"instruction":"Cocher les propositions exactes.","id":"c12","num":12,"page":2,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.3.pdf"},{"title":"Définir la ventilation Uni-pulmonaire. énoncer le but et les indications relatives d'une intubation sélective à une ventilation uni-pulmonaire (VUP)","options":[],"kind":"QUESTION","unit":"3.3","sourcePage":31,"topic":"Chirurgie : thoracique","session":"2020-2022","figures":[],"ue":"3.3","refs":[["Corrigé d’époque · p. 47","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.3%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=47"],["Cours à consulter · CAPNOGRAPHIE (p. 9)","../../../cours/S1/3.1/CAPNOGRAPHIE.pdf#page=9"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["Mise en place d’un dispositif intra trachéal permettant une ventilation uni pulmonaire cela permettra une ventilation séparée de chaque poumon séparément par un canal de la sonde. Ventilation que d’un côté BUTS:","- Protéger le poumon et diminuer les mouvements du poumons","- faciliter l' abord chirurgical INDICATION RELATIVES :","- toutes les chirurgies portant sur l’hémi thorax","- Anévrisme aorte thoracique","- chirurgie oesophage","- chirurgie rachis"],"points":2,"instruction":"","id":"c13","num":13,"page":3,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.3.pdf"},{"title":"Vous avez en soins monsieur R, intubé en ventilation uni-pulmonaire. énoncer et argumenter les modalités et les précautions ventilatoires préventives.","options":[],"kind":"QUESTION","unit":"3.3","sourcePage":31,"topic":"Chirurgie : thoracique","session":"2020-2022","figures":[],"ue":"3.3","refs":[["Corrigé d’époque · p. 47","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.3%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=47"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["Ventilation protective en chir tho","- VC 4 - 5 ml /kg ( poids idéal théorique)","- pep + fio2 minimal adapté à la sat ( atélectasie + toxicité) + I/E ⅓","- recrutement à différent temps","- eviter hyperoxie","- hypercapnie modéré toléré OPHTALMOLOGIE"],"points":2,"instruction":"","id":"c14","num":14,"page":3,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.3.pdf"},{"title":"Vous êtes IADE au bloc opératoire et vous avez en soins, monsieur Dupont qui va bénéficier d'une endartériectomie carotidienne. énoncer les complications peropératoires liées à la chirurgie","options":[],"kind":"QUESTION","unit":"3.3","sourcePage":36,"topic":"Chirurgie : vasculaire","session":"2020-2022","figures":[],"ue":"3.3","refs":[["Corrigé d’époque · p. 42","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.3%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=42"],["Cours à consulter · Chirurgie diges avec note 3.3 (p. 128)","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf#page=128"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["Risque instabilité HDM","- Monitorage invasif de la PA : o HTA (clampage carotidien) par inhibition du sinus carotidien approfondir l’AG ou antihypertenseurs IV (loxen, eupressyl, brevibloc) o HypoTA / Bradycardie : au début lors de la manipulation du glomus carotidien (barorécepteurs) et lors du déclampage vasoconstricteurs","o Ischémie myocardique secondaire Risque d’accident neurologique :","- Embolique (dissection/ declampage)","- Ischémique (bas débit lors du clampage)","- Reperfusion (après ischémie chronique)","- Hémorragique","- Monitorage neuro sous AL/ALR (bloc plexus cervical superficiel ou profond) ou sous AG (EEG / potentiels évoqués / doppler transcrânien / oxymétrie cérébrale / pression résiduelle dans la carotide)","- FDR : ATCD AIT ou AVC récent, thrombose carotide controlatéral, mauvais réseau artériel de suppléance, plaque ulcérée ou chirurgie en urgence","- Préservation de la PPC : maintien d’une PA haute (> 20% de la PAS pendant le clampage) et prévention des ACSOS (capnie, glycémie, natrémie, normoxie)","- Contrôle strict de la PA en post-op (PAS < 160mmHg)"],"points":2,"instruction":"","id":"c15","num":15,"page":3,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.3.pdf"},{"title":"Parmi ces propositions concernant la fonction pancréatique, laquelle ou lesquelles est (sont) vraie(s) ?","options":["les îlots de Langerhans représentent 1 % des cellules pancréatiques","Les cellules 𝛃 sécrètent le glucagon","les cellules 𝛅 sécrètent la somatostatine","les cellules PP sécrètent le polypeptide pancréatique","les cellules 𝛂 sécrètent l'insuline"],"kind":"QCM","unit":"3.3","sourcePage":42,"topic":"Terrain : diabetique","session":"2020-2022","figures":[],"ue":"3.3","refs":[["Corrigé d’époque · p. 32","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.3%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=32"]],"correct":"ACD","note":"","optionNotes":[["Les cellules 𝛃 sécrètent le glucagon","Insuline ++, orexine, leptine, ghréline"],["les cellules 𝛂 sécrètent l'insuline","Glucagon"]],"ungraded":false,"points":1,"instruction":"Cocher les propositions exactes.","id":"c16","num":16,"page":3,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.3.pdf"},{"title":"Énoncer les principes du traitement de l'acidocétose","options":[],"kind":"QUESTION","unit":"3.3","sourcePage":43,"topic":"Terrain : diabetique","session":"2020-2022","figures":[],"ue":"3.3","refs":[["Corrigé d’époque · p. 63","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.3%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=63"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["- insulinothérapie IVSE","- à poursuivre tant que cétonémie >1,5 mmol/L:","- diminuer doses et ajouter une perfusion de glucosé dès que glycémie <11 mmol/L","- relais par insuline lente SC dès l’arrêt de l’IVSE","- Supplémentation potassique (insuline = hypokaliémie)","- réhydratation"],"points":2,"instruction":"","id":"c17","num":17,"page":3,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.3.pdf"},{"title":"Parmi ces propositions concernant les états de choc, le choc distributif est, laquelle ou lesquelles est (sont) vraie(s) ?","options":["un choc hémorragique","un choc obstructif","un choc cardiogénique","un choc septique","un choc anaphylactique"],"kind":"QCM","unit":"3.3","sourcePage":47,"topic":"Terrain : etat de choc","session":"2020-2022","figures":[],"ue":"3.3","refs":[["Corrigé d’époque · p. 31","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.3%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=31"]],"correct":"DE","note":"Réponses repérées dans le corrigé de la promotion.","optionNotes":[],"ungraded":false,"points":1,"instruction":"Cocher les propositions exactes.","id":"c18","num":18,"page":3,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.3.pdf"},{"title":"Expliquer les mécanismes adaptatifs à l'état de choc","options":[],"kind":"QUESTION","unit":"3.3","sourcePage":48,"topic":"Terrain : etat de choc","session":"2020-2022","figures":[],"ue":"3.3","refs":[["Corrigé d’époque · p. 64","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.3%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=64"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["1. Activation du Système Nerveux Sympathique Mécanisme : La diminution du débit cardiaque et de la pression artérielle stimule les barorécepteurs situés dans les sinus carotidiens et l'arc aortique. Ces récepteurs envoient des signaux au cerveau, qui activent le système nerveux sympathique (SNS). Réponse Adaptative : Vasoconstriction périphérique : La noradrénaline et d'autres catécholamines sont","libérées, provoquant une vasoconstriction des vaisseaux sanguins périphériques pour rediriger le sang vers les organes vitaux (cœur et cerveau). Augmentation de la fréquence cardiaque : Le SNS stimule le cœur pour augmenter la fréquence cardiaque et la contractilité, augmentant ainsi le débit cardiaque.","Libération de catécholamines : Les glandes surrénales libèrent de l'adrénaline et de la noradrénaline, renforçant ces effets.","2. Activation du Système Rénine-Angiotensine-Aldostérone (RAA) Mécanisme : La diminution de la perfusion rénale est détectée par les cellules juxtaglomérulaires des reins, qui libèrent de la rénine. Réponse Adaptative : Conversion de l'angiotensinogène en angiotensine II : La rénine convertit l'angiotensinogène (produit par le foie) en angiotensine I, qui est ensuite convertie en angiotensine II par","l'enzyme de conversion de l'angiotensine (ECA). Vasoconstriction systémique : L'angiotensine II provoque une vasoconstriction puissante, augmentant la pression artérielle. Libération d'aldostérone : L'angiotensine II stimule les glandes surrénales à sécréter de l'aldostérone, qui favorise la réabsorption de sodium et d'eau par les reins, augmentant ainsi le volume sanguin et la","pression artérielle.","3. Libération d'Antidiurétique (ADH) Mécanisme : La diminution de la perfusion sanguine et la stimulation des osmorécepteurs hypothalamiques entraînent la libération de l'ADH (hormone antidiurétique) par l'hypophyse postérieure. Réponse Adaptative : Réabsorption de l'eau : L'ADH augmente la perméabilité des tubules collecteurs des","reins, permettant une plus grande réabsorption de l'eau, ce qui aide à maintenir le volume sanguin et la pression artérielle.","4. Redistribution du Débit Sanguin Mécanisme : Le corps tente de préserver la perfusion des organes vitaux (cerveau et cœur) au détriment des organes moins critiques (peau, muscles squelettiques, reins). Réponse Adaptative : Vasoconstriction sélective : Les vaisseaux sanguin"],"points":2,"instruction":"","id":"c19","num":19,"page":3,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNI const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

}

function compute(q, answers) {

  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};

function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0,ungraded:q.ungraded};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values.slice(0,q.options.length)){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(!q.ungraded&&q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }

  const notes=q.optionNotes?.length?`<div class="answer-key"><h3>Précisions du corrigé</h3><ul>${q.optionNotes.map(([option,note])=>`<li><strong>${escape(option)}</strong><br>${escape(note)}</li>`).join('')}</ul></div>`:'';
  panel.innerHTML=key+notes+sources(q)+sourceCopy(q);
}

  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const adjusted=list.some(g=>g.review && g.review!=='blank' || g.analysis?.some(c=>c.override!==null));
  if(adjusted) $('summary').textContent+=' Note ajustée.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(g=>g.ungraded||isComplete(g));
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!q.ungraded&&!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function shuffledCard(q) {
  if (!isChoice(q)) return q;
  const indexes=q.options.map((_,i)=>i);
  for(let i=indexes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
  }
  const correct=indexes.map((index,i)=>q.correct.includes(values[index])?values[i]:'').join('');
  return {...q,options:indexes.map(i=>q.options[i]),correct};
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!g.ungraded&&!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>(!$('topic').value||q.topic===$('topic').value)&&(!keep||keep.has(q.id))).map(shuffledCard);
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
for(const topic of new Set(DATA.cards.map(q=>q.topic))) $('topic').add(new Option(topic,topic));
$('topic').addEventListener('change',()=>start());
start();
</script>
