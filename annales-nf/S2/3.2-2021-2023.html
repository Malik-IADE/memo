 signes cliniques neurologique et cardiologique d'une intoxication aux anesthésies locaux","options":[],"kind":"QUESTION","unit":"3.2","sourcePage":18,"topic":"Incidents et accidents en anesthesie : intoxication aux anesthesiques locaux","session":"2021-2023","figures":[],"ue":"3.2","refs":[["SFAR · Toxicité systémique des anesthésiques locaux","https://sfar.org/espace-professionel-anesthesiste-reanimateur/outils-professionnels/boite-a-outils/toxicite-aux-al/"],["Cours à consulter · 3.1 Processus d'anesthésie avec notes (p. 18)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=18"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["Signes neurologiques possibles : paresthésies péribuccales, goût métallique, acouphènes, agitation, convulsions ou coma.","Signes cardiovasculaires possibles : troubles de conduction ou du rythme, hypotension, puis arrêt circulatoire."],"points":2,"instruction":"","id":"c15","num":15,"page":3,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.2.pdf"},{"title":"Parmi ces propositions concernant les critères de ventilation au masque difficile chez l'adulte, laquelle ou lesquelles est (sont) vraie(s) ?","options":["le sexe","l'âge inférieur à 50 ans","un patient édenté","un patient barbu","Un patient avec un mallampati supérieur à 2"],"kind":"QCM","unit":"3.2","sourcePage":22,"topic":"Intubation difficile","session":"2021-2023","figures":[],"ue":"3.2","refs":[["Corrigé d’époque · p. 24","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.2%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=24"],["Cours à consulter · 3.3 Estomac plein avec note (p. 43)","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf#page=43"]],"correct":"CD","note":"","optionNotes":[["le sexe","Homme pour VMI"],["l'âge inférieur à 50 ans","> 55 ans"],["Un patient avec un mallampati supérieur à 2","Intubation 3 et 4 ou pour VMI"]],"ungraded":false,"points":1,"instruction":"Cocher les propositions exactes.","id":"c16","num":16,"page":3,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.2.pdf"},{"title":"Citer 12 critères prédictifs d'une intubation difficile","options":[],"kind":"QUESTION","unit":"3.2","sourcePage":22,"topic":"Intubation difficile","session":"2021-2023","figures":[],"ue":"3.2","refs":[["Corrigé d’époque · p. 39","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.2%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=39"],["Cours à consulter · 3.1 Processus d'anesthésie avec notes (p. 20)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=20"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["- ATCD d’ID","- Mallampati III et IV","- DTM < 6cm","- Ouverture de bouche < 3,5cm","- Diminution de la mobilité mandibulaire","- Diminution de l’angle de Belhouse (bascule de la tête en arrière)","- IMC > 35 kg/m²","- SAOS avec tour de cou > 45 cm","- Pathologie cervico-faciale","- Macroglossie","- Périmètre cou > 60 cm","- Pré-éclampsie"],"points":2,"instruction":"","id":"c17","num":17,"page":3,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.2.pdf"},{"title":"Selon les recommandations de la SFAR, énoncer l'algorithme décisionnel d'extubation d'un patient présentant des critères d'intubation et ventilation difficile","options":[],"kind":"QUESTION","unit":"3.2","sourcePage":22,"topic":"Intubation difficile","session":"2021-2023","figures":[],"ue":"3.2","refs":[["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"],["Cours à consulter · 3.1 SSPI Avec notes (p. 86)","../../../cours/S1/3.1/3.1%20SSPI%20Avec%20notes.pdf#page=86"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["Évaluer les facteurs généraux et locaux, la possibilité de réintubation et les conditions d’extubation. Préparer l’oxygénation, le matériel et l’équipe.","Selon le risque, envisager une extubation sur guide échangeur, différer l’extubation ou sécuriser les voies aériennes par une autre stratégie. Assurer la surveillance après extubation."],"points":2,"instruction":"","id":"c18","num":18,"page":3,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.2.pdf"},{"title":"Énoncer les dispositifs spécifiques pour assurer la ventilation et l'intubation dans des conditions sécuritaires au bloc opératoire","options":[],"kind":"QUESTION","unit":"3.2","sourcePage":22,"topic":"Intubation difficile","session":"2021-2023","figures":[],"ue":"3.2","refs":[["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"],["Cours à consulter · SUJET AGE Avec notes 3.3 (p. 24)","../../../cours/S1/3.3/SUJET%20AGE%20Avec%20notes%203.3.pdf#page=24"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["Prévoir matériel de ventilation au masque et canules, dispositif supraglottique, vidéolaryngoscope, mandrin ou bougie, fibroscope selon disponibilité, et matériel d’abord cervical d’urgence. Vérifier leur fonctionnement, la capnographie et la possibilité d’appeler du renfort."],"points":2,"instruction":"","id":"c19","num":19,"page":4,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.2.pdf"},{"title":"Parmi ces propositions concernant la transfusion massive, laquelle ou lesquelles est (sont) vraie(s) ?","options":["il s'agit d'une transfusion supérieure à 10 concentrés de globules rouges en 24 heures","il s'agit d'une transfusion supérieure à 4 concentrés de globules rouges en 2 heures","il s'agit d'une transfusion supérieure à 4 concentrés de globules rouges en une heure avec besoins supplémentaires prévisibles","il s'agit d'un remplacement de moins de 10 % de la masse sanguine en 2h par des produits sanguins labiles","Il s'agit d'un remplacement de moins de 50 % de la masse sanguine en 4 heures par des produits sanguins dérivés"],"kind":"QCM","unit":"3.2","sourcePage":24,"topic":"Transfusion et epargne sanguine","session":"2021-2023","figures":[],"ue":"3.2","refs":[],"correct":"","note":"Plusieurs définitions existent. Le volume total, le débit de transfusion et la persistance du saignement sont à interpréter dans leur contexte.","optionNotes":[],"ungraded":true,"points":0,"instruction":"Cocher les propositions exactes.","id":"c20","num":20,"page":4,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.2.pdf"},{"title":"Parmi ces propositions concernant les contre-indications de la récupération sanguine peropératoire, laquelle ou lesquelles est (sont) vraie(s) ?","options":["l'infection","le lavage à la bétadine","la chirurgie néoplasique","le refus du patient","les troubles de l'hémostase"],"kind":"QCM","unit":"3.2","sourcePage":24,"topic":"Transfusion et epargne sanguine","session":"2021-2023","figures":[],"ue":"3.2","refs":[["Corrigé d’époque · p. 23","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.2%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=23"]],"correct":"ABCD","note":"","optionNotes":[["le lavage à la bétadine","ou avoir 2 systèmes d’aspiration"],["le refus du patient","CI à tout"]],"ungraded":false,"points":1,"instruction":"Cocher les propositions exactes.","id":"c21","num":21,"page":4,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.2.pdf"},{"title":"Vous êtes IADE au bloc opératoire et vous prenez en soin Monsieur R pour un choc hémorragique. énoncer vos objectifs et vos actions de prise en soin.","options":[],"kind":"QUESTION","unit":"3.2","sourcePage":24,"topic":"Transfusion et epargne sanguine","session":"2021-2023","figures":[],"ue":"3.2","refs":[["Corrigé d’époque · p. 38","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.2%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=38"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["- Effectuer sans retard le diagnostic et le traitement des troubles de l’hémostase","- Acide tranexamique (1g en 10 min /8h) avant la 3ème heure","- Débuter la transfusion de plasmas dès la transfusion de CG: PFC/CGR= entre ½ et 1/1","- Transfusion précoce de plaquettes (>50 G/L ou 100G/L si TC ou saignement persistant)","- Il faut probablement transfuser des plaquettes chez les patients présentant une hémorragie sévère et/ou intracrânienne traités par prasugrel et clopidogrel","- L’administration de concentrés de fibrinogène (3g) est recommandée en cas d’hypofibrinémie (<1,5g/L) ou de paramètres thromboélastographiques","- Le monitorage du calcium ionisé est recommandé afin de le maintenir dans des valeurs normales"],"points":2,"instruction":"","id":"c22","num":22,"page":4,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.2.pdf"},{"title":"Complétez le tableau ci-dessous en indiquant le seuil d'hémoglobine pour chacune des situations (unité attendue) Situation seuil d'hémoglobine le patient ne présente pas d'antécédents cardio- vasculaire le patient présente une cardiopathie stable le patient présente une cardiopathie avec une mauvaise tolérance clinique le patient présente une insuffisance coronarienne ou cardiaque aigu ou bêta-bloquée","options":[],"kind":"QUESTION","unit":"3.2","sourcePage":24,"topic":"Transfusion et epargne sanguine","session":"2021-2023","figures":["3.2-24-526.7-0"],"ue":"3.2","refs":[["Corrigé d’époque · p. 38","../../../Annales/Annales%20corrige%CC%81es/Annales%20corrige%CC%81e/UE%203.2%20-%20S2%20-%20Toutes%20les%20annales.pdf#page=38"],["HAS · Gestion du capital sanguin","https://www.has-sante.fr/jcms/p_3363219/fr/gestion-du-capital-sanguin-en-pre-per-et-post-operatoire-et-en-obstetrique-recommandation"],["Cours à consulter · 3.3 Patient HTA avec notes (p. 56)","../../../cours/S1/3.3/3.3%20Patient%20HTA%20avec%20notes.pdf#page=56"]],"correct":"","note":"Compare ta réponse avec le corrigé puis ajuste les points si nécessaire.","optionNotes":[],"ungraded":false,"answer":["Le corrigé historique propose 7, 9, 10 et 11 g/dL dans l’ordre du tableau.","Les recommandations HAS retiennent en postopératoire non cardiaque un seuil restrictif généralement situé entre 7 et 8 g/dL chez le patient stable. L’ischémie, la tolérance, les comorbidités et le saignement modifient la décision."],"points":2,"instruction":"","id":"c23","num":23,"page":4,"originalPdf":"../../../Annales/ANNALES%20PAR%20UE%20%E2%9A%A0%EF%B8%8F%20_non%20officiels_/ANNALES%20UNITE%203.2.pdf"}],"figures":{"3.2-24-526.7-0":"/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/2wBDAQUFBQcGBw0HBw0cEhASHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBz/wAARCAEaAtkDASIAAhEBAxEB/8QAHAABAQADAQEBAQAAAAAAAAAAAAcFBggEAwIB/8QAVRAAAQMDAgIECgcGBAIIBAUFAQIDBAAFEQYHEiETGDFnFBciQViWpabS4wgVKFFWYdMWIzJHd8MzOIa0QnEkJVJTYnKBoSYnNkM0RVSDkZKisbKz/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/EABQRAQAAAAAAAAAAAAAAAAAAAAD/2gAMAwEAAhEDEQA/AO/q8VxvFus4YVcZ8SGJDgZaMl5LfSLPYlPERlR+4c69tSVB+sfpJvtyBxotGlkORUq5htb8lQcUPuJS0kZ+6gpKb/aV3Q2pN0hG5gcRhiQjpgPv4M5/9q+i7xbm7i3bVz4qbi4njRFU8kOqT94RnJH54qOXnSdm1Hrew2TTNviwoWlr2m+3a5NIAxKVxKEZKu1TjhcCl8+ScA81AVM70tyVtprbUakj9p4u4SSxIx+ const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

}
function scanBlock(scans, label) {
  return `<div class="document"><div class="source-pictures" tabindex="0" aria-label="${escape(label)}">${images(scans,label)}</div><button type="button" class="secondary zoom" aria-expanded="false">Agrandir le scan</button></div>`;
}
function prompt(q) {
  if(q.images) return scanBlock(q.images,questionLabel(q));
  const table=q.table?`<div class="prompt-table">${q.table.map(cell=>`<span>${escape(cell)}</span>`).join('')}</div>`:'';
  return `<h2 class="question-stem">${escape(q.title)}</h2>${q.text?`<p class="context-text">${escape(q.text)}</p>`:''}${q.figures.length?`<div class="q-figure">${q.figures.map((id,i)=>`<img loading="lazy" src="data:image/jpeg;base64,${DATA.figures[id]}" class="question-figure" alt="Illustration ou tableau ${i+1} du sujet">`).join('')}</div>`:''}${q.instruction?`<p class="small">${escape(q.instruction)}</p>`:''}${table}`;
}
function fields(q) {
  if (isChoice(q)) {
    return `<div class="choices ${q.options?'written-choices':''}" role="${q.kind==='QCU'?'radiogroup':'group'}" aria-labelledby="title-${q.id}">${q.options.map((_,i)=>values[i]).map((letter,i)=>`<label class="option" id="option-${q.id}-${letter}"><input type="${q.kind==='QCU'?'radio':'checkbox'}" name="${q.id}" value="${letter}"><span><strong>${letter}</strong>${q.options?' · '+escape(q.options[i]):''}<small></small></span></label>`).join('')}</div>`;
  }
  return `<div class="field"><textarea id="answer-${q.id}" aria-labelledby="title-${q.id}" rows="5" placeholder="Ta réponse…"></textarea></div>`;
}
function render() {
  $('cards').innerHTML = active.map((q, index) => {
    const section = q.kind === 'context' ? '<span>Dossier</span>' : `<span>${q.ungraded?'Hors barème':format(q.points)+' pt'} · ${escape(q.session)} · PDF p. ${q.page}</span>`;
    const anchor = active.findIndex(card=>card.kind===q.kind)===index ? ` id="section-${q.kind}"` : '';
    return `<section class="card"${anchor} data-card="${q.id}"><div class="meta"><strong id="title-${q.id}">${escape(questionLabel(q))}</strong>${section}</div>${prompt(q)}${q.kind==='context'?'':fields(q)+`<div class="feedback" id="feedback-${q.id}" hidden></div>`}</section>`;
  }).join('');
  for(const link of document.querySelectorAll('[data-kind]')){
    const kind=link.dataset.kind;
    const index=active.findIndex(q=>kind==='open'?isOpen(q):q.kind===kind);
    link.hidden=index<0;
    if(index>=0) link.hash='section-'+active[index].kind;
  }
}
function response(q) {
  if (isChoice(q)) {
    return [...form.querySelectorAll(`[name="${q.id}"]:checked`)].map(input=>input.value);
  }
  return $(`answer-${q.id}`).value.trim();
}
function progress() {
  const current=active.filter(q=>q.kind!=='context');
  const count=current.filter(q=>response(q).length>0).length;
  $('progress').textContent=`${count} / ${current.length} questions renseignées`;
  $('bar').max=current.length;
  $('bar').value=count;
}
function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.slice(0,q.options.length).filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Évalue ta réponse à partir des éléments du corrigé.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0,ungraded:q.ungraded};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values.slice(0,q.options.length)){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(!q.ungraded&&q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  if (isOpen(q)) {
    panel.innerHTML=`${answerBox(q)}${sources(q)}${q.ungraded?'<p class="small">Question hors barème.</p>':rubricPanel(q,grade)+assessmentControls(q,grade)}${sourceCopy(q)}`;
    return;
  }
  const answers=q.correct.split('').filter(Boolean).map(letter=>q.options[values.indexOf(letter)]);
  const key=`<strong>${q.ungraded?'Hors barème':format(grade.autoScore)+' / 1 point'}</strong><div class="answer-key" style="margin-top:10px"><h3>${q.ungraded?'Éléments pour vérifier':'Correction'}</h3>${answers.length?`<ul class="correct-options">${answers.map(a=>`<li>${escape(a)}</li>`).join('')}</ul>`:''}${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
  const notes=q.optionNotes?.length?`<div class="answer-key"><h3>Précisions du corrigé</h3><ul>${q.optionNotes.map(([option,note])=>`<li><strong>${escape(option)}</strong><br>${escape(note)}</li>`).join('')}</ul></div>`:'';
  panel.innerHTML=key+notes+sources(q)+sourceCopy(q);
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return !grade.ungraded&&(grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max)));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const adjusted=list.some(g=>g.review && g.review!=='blank' || g.analysis?.some(c=>c.override!==null));
  if(adjusted) $('summary').textContent+=' Note ajustée.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(g=>g.ungraded||isComplete(g));
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!q.ungraded&&!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function shuffledCard(q) {
  if (!isChoice(q)) return q;
  const indexes=q.options.map((_,i)=>i);
  for(let i=indexes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
  }
  const correct=indexes.map((index,i)=>q.correct.includes(values[index])?values[i]:'').join('');
  return {...q,options:indexes.map(i=>q.options[i]),correct};
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!g.ungraded&&!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>(!$('topic').value||q.topic===$('topic').value)&&(!keep||keep.has(q.id))).map(shuffledCard);
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
for(const topic of new Set(DATA.cards.map(q=>q.topic))) $('topic').add(new Option(topic,topic));
$('topic').addEventListener('change',()=>start());
start();
</script>
