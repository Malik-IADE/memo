</main><noscript><p>Active JavaScript pour répondre au partiel.</p></noscript><script>const DATA={"semester":1,"ue":"3.1","title":"Les techniques d'anesthésie, réanimation et urgences, principes et mises en œuvre","cards":[{"id":"c6","num":1,"page":1,"kind":"QUESTION","title":"définir l'anesthésie intraveineuse à objectif de concentration (AIVOC). énoncer les limites de l'anesthésie intraveineuse à objectif de concentration (AIVOC)","session":"2021-2023","topic":"Aivoc – sivoc – ainoc","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 AIVOC Avec notes (p. 3, à consulter)","../../../cours/3.1%20AIVOC%20Avec%20notes.pdf#page=3"]],"options":[],"correct":"","note":"","answer":["AIVOC : une pompe utilise un modèle pharmacocinétique et une cible plasmatique ou au site effet pour adapter le débit dans le temps. La concentration est estimée.","Le modèle intègre certaines covariables, mais ne suit pas en temps réel le débit cardiaque, la clairance réelle ou les interactions. Titrer selon la réponse clinique et le monitorage."],"sourcePage":2},{"id":"c10","num":2,"page":1,"kind":"QCM","title":"Parmi les propositions concernant le post -opératoire d'une chirurgie en ambulatoire, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Ambulatoire","points":1,"ungraded":false,"figures":[],"refs":[],"options":["il est recommandé d'imposer une réalimentation avant la sortie","il est recommandé d'utiliser systématiquement des morphiniques pour la gestion de la douleur post-opératoire","il est recommandé d'utiliser un score de sortie","il est recommandé après un bloc périmédullaire de vérifier la déambulation du patient avant de sortir","Il est recommandé de vérifier la présence d'un globe vésical après une anesthésie générale"],"correct":"CE","note":"Évaluer la stabilité des constantes et le retour à l’état attendu, la douleur, les NVPO, le saignement et l’autonomie selon l’intervention.","instruction":"Cocher les propositions exactes.","sourcePage":3},{"id":"c16","num":3,"page":1,"kind":"QCM","title":"Parmi les propositions concernant la check -list de la Haute Autorité de santé (HAS), laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Check list has – feuille anesthesie","points":1,"ungraded":false,"figures":[],"refs":[["HAS · Check-list du bloc","https://www.has-sante.fr/jcms/c_2607929/fr/check-list-securite-du-patient-au-bloc-operatoire-et-son-mode-d-emploi-version-2018"]],"options":["elle est rendue obligatoire depuis 01-01-2018","elle mentionne l'installation du patient","elle mentionne le risque hémorragique","elle mentionne si l'autorisation d'opérer est signée par les parents ou le représentant légal pour les mineurs","elle mentionne si le patient a un risque allergique MONITORAGE : CAPNO et SpO2 (3.1.2)"],"correct":"BCE","note":"","instruction":"Cocher les propositions exactes.","sourcePage":4},{"id":"c28","num":4,"page":2,"kind":"QCM","title":"Parmi les propositions concernant L'analyse de la courbe de capnogramme, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Monitorage : capno et spo2","points":1,"ungraded":false,"figures":["3.1-8-1"],"refs":[["Cours · CAPNOGRAPHIE","../../../cours/S1/3.1/CAPNOGRAPHIE.pdf"]],"options":["cette courbe évoque une déconnexion du respirateur","cette courbe évoque une obstruction totale des voies aériennes","cette courbe évoque une réinhalation","cette courbe évoque une intubation sélective","cette courbe évoque une apnée"],"correct":"C","note":"La PetCO₂ dépend de la production métabolique de CO₂, du débit sanguin pulmonaire, de la ventilation alvéolaire et du rapport ventilation/perfusion.","instruction":"Cocher les propositions exactes.","sourcePage":8},{"id":"c31","num":5,"page":2,"kind":"QUESTION","title":"Le schéma ci -dessous représente une courbe de capnogramme normale. Expliquer en complétant le tableau ci-dessous les différentes phases représentées. A AB BC C CD DA","session":"2021-2023","topic":"Monitorage : capno et spo2","points":2,"ungraded":false,"figures":["3.1-8-2"],"refs":[["Cours · CAPNOGRAPHIE (p. 8, à consulter)","../../../cours/S1/3.1/CAPNOGRAPHIE.pdf#page=8"]],"options":[],"correct":"","note":"","answer":["Au début de l’expiration, le CO₂ est quasi nul : gaz de l’espace mort. Puis le CO₂ augmente par mélange avec les gaz alvéolaires.","Le plateau correspond surtout à l’expiration alvéolaire. La PetCO₂ se lit juste avant la descente inspiratoire.","La descente correspond à l’entrée de gaz frais et la ligne de base inspiratoire revient vers zéro."],"sourcePage":8},{"id":"c34","num":6,"page":3,"kind":"QUESTION","title":"Compléter le tableau ci -dessous, les variations du PetCO2 en fin d'expiration, en fonction du reflet circulatoire, respiratoire et métabolique Augmentation PetCO2 en cas de : diminution PetCO2 en cas de : absence de PetCO2 en cas de : au niveau circulatoire au niveau respiratoire au niveau métabolique","session":"2021-2023","topic":"Monitorage : capno et spo2","points":2,"ungraded":false,"figures":[],"refs":[["Cours · CAPNOGRAPHIE (p. 9, à consulter)","../../../cours/S1/3.1/CAPNOGRAPHIE.pdf#page=9"]],"options":[],"correct":"","note":"","answer":["Augmentation : hypoventilation, augmentation du métabolisme, réinhalation ou hausse de perfusion.","Diminution : hyperventilation, faible débit cardiaque ou embolie pulmonaire. Disparition : vérifier circuit, sonde, ventilation et circulation."],"sourcePage":9},{"id":"c35","num":7,"page":3,"kind":"QUESTION","title":"citer les intérêts de l'oxymétrie pulsée.","session":"2021-2023","topic":"Monitorage : capno et spo2","points":2,"ungraded":false,"figures":[],"refs":[["Cours · CAPNOGRAPHIE","../../../cours/S1/3.1/CAPNOGRAPHIE.pdf"]],"options":[],"correct":"","note":"","answer":["Mesurer SpO₂ et fréquence pulsatile, dépister une désaturation, suivre son évolution sous traitement et apprécier la qualité de la perfusion pulsatile.","L’oxymètre ne mesure pas la ventilation et ne quantifie pas l’hyperoxie."],"sourcePage":9},{"id":"c36","num":8,"page":3,"kind":"QUESTION","title":"Énoncer ce que vous évoque cette courbe. justifier votre réponse.","session":"2021-2023","topic":"Monitorage : capno et spo2","points":2,"ungraded":false,"figures":["3.1-9-2"],"refs":[["Cours · CAPNOGRAPHIE","../../../cours/S1/3.1/CAPNOGRAPHIE.pdf"]],"options":[],"correct":"","note":"","answer":["Le tracé montre des cycles sans plateau net, avec montée expiratoire très oblique. Une obstruction expiratoire, notamment un bronchospasme, est une hypothèse.","Interpréter en tenant compte de la clinique et des pressions, en vérifiant notamment tube et circuit."],"sourcePage":9},{"id":"c40","num":9,"page":3,"kind":"QCM","title":"Parmi les propositions concernant le monitorage de la curarisation, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018 / 2021-2023","topic":"Monitorage : curarisation","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 2.2 Curares avec notes","../../../cours/2.2%20Curares%20avec%20notes.pdf"],["SFAR · Curarisation et décurarisation","https://sfar.org/curarisation-et-decurarisation-en-anesthesie/"]],"options":["l'adducteur laryngé et le muscle sourcilier sont des muscles résistants à la curarisation","L’adducteur du pouce et les muscles impliqués dans la déglutition sont des muscles résistants à la curarisation","le diaphragme est un muscle sensible à la curarisation","un bloc profond est objectivé par 2 réponses visuelles au TOF aux muscles sourciliers","un bloc profond est objectivé par 2 réponses visuelles au TOF à l'adducteur du pouce"],"correct":"A","note":"À l’induction, le muscle sourcilier peut aider à estimer l’installation du bloc laryngé. À la récupération, préférer la mesure quantitative à l’adducteur du pouce.","instruction":"Cocher les propositions exactes.","sourcePage":10},{"id":"c49","num":10,"page":4,"kind":"QCM","title":"Parmi les propositions concernant la pression de l'oreillette droite (POD), laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Monitorage : debit cardiaque","points":1,"ungraded":false,"figures":[],"refs":[],"options":["physiologiquement, la POD reste basse (0-5mmHg)","toute augmentation de POD doit s'accompagner d'une augmentation équivalente de la pression motrice du retour veineux pour que le débit soit maintenu","la pression qui règne dans l'oreillette droite est la pression qui s'impose au retour veineux","la POD est le reflet de la précharge du ventricule gauche","la loi de Poiseuille relie le débit à la POD"],"correct":"AD","note":"Le Doppler œsophagien fournit une estimation du débit aortique et de ses variations au lit du patient, avec une faible invasivité. Le positionnement, l’angle et les hypothèses du calcul en limitent la précision.","instruction":"Cocher les propositions exactes.","sourcePage":12},{"id":"c52","num":11,"page":4,"kind":"QCM","title":"Parmi les propositions concernant Le tracé d'électrocardiogramme (ECG) ci - dessous, laquelle ou lesquelles est (sont) vraie(s)?","session":"2015-2017 / 2021-2023","topic":"Monitorage : ecg","points":1,"ungraded":false,"figures":["3.1-13-1"],"refs":[["Cours · 3.1 ECG avec notes","../../../cours/S1/3.1/3.1%20ECG%20avec%20notes.pdf"]],"options":["L ‘E CG suivant témoigne d'une désynchronisation totale des ventricules","L ‘E CG suivant témoigne d’un bas débit circulatoire","L ‘E CG suivant est sinusal","L ‘E CG suivant nécessite un choc électrique externe","L’ECG suivant ne nécessite pas de massage cardiaque","L ‘E CG suivant présente un sus décalage ST"],"correct":"AD","note":"","instruction":"Cocher les propositions exactes.","sourcePage":13},{"id":"c64","num":12,"page":4,"kind":"QCM","title":"Parmi les propositions concernant le monitorage de l'indice Bispectral (BIS), laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Monitorage : sedation – bis","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 BIS avec notes (p. 14, à consulter)","../../../cours/3.1%20BIS%20avec%20notes.pdf#page=14"]],"options":["le BIS permet de prévenir le surdosage des médicaments d'anesthésie","le monitorage par le BIS permet de diminuer l'incidence des nausées et vomissements post-opératoire","les valeurs cibles peropératoires du BIS sont comprises entre 60 et 90","le BIS prévient les risques de mémorisation peropératoire","la valeur de BIS inférieur à 30 est le reflet d'une analgésie trop profonde"],"correct":"AC","note":"Le BIS dérive de l’EEG et renseigne sur la composante hypnotique. Interpréter l’indice avec la qualité du signal, l’EMG, le taux de suppression et les événements en cours.","instruction":"Cocher les propositions exactes.","sourcePage":15},{"id":"c75","num":13,"page":4,"kind":"QCM","title":"Parmi les propositions concernant la posture assise, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Postures et installations chirurgicales","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Positions chirurgicales acec notes","../../../cours/3.1%20Positions%20chirurgicales%20acec%20notes.pdf"]],"options":["elle provoque un risque d'hypotension artérielle","elle provoque une augmentation de la pression intra cérébrale","elle provoque une augmentation de la capacité résiduelle fonctionnelle (CRF)","elle provoque une baisse du retour veineux","elle provoque une baisse du débit cardiaque"],"correct":"ACDE","note":"Avant de mobiliser, coordonner l’équipe, sécuriser sonde, voies et moniteurs, puis protéger yeux, appuis et nerfs. Après mobilisation, vérifier ventilation, capnographie, pression, pouls, fixation et absence de traction.","instruction":"Cocher les propositions exactes.","sourcePage":17},{"id":"c77","num":14,"page":5,"kind":"QCM","title":"Parmi les propositions concernant le décubitus ventral (DV), laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Postures et installations chirurgicales","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Positions chirurgicales acec notes","../../../cours/3.1%20Positions%20chirurgicales%20acec%20notes.pdf"]],"options":["le DV provoque une limitation de l'expansion thoracique par compression abdominale","le DV provoque un risque d'altération de la mécanique ventilatoire","le DV provoque une hyperventilation","le DV provoque une hypocapnie","le DV provoque une intubation sélective"],"correct":"ABE","note":"Avant de mobiliser, coordonner l’équipe, sécuriser sonde, voies et moniteurs, puis protéger yeux, appuis et nerfs. Après mobilisation, vérifier ventilation, capnographie, pression, pouls, fixation et absence de traction.","instruction":"Cocher les propositions exactes.","sourcePage":17},{"id":"c81","num":15,"page":5,"kind":"QUESTION","title":"énoncer le Mécanisme Respiratoire lors d'une chirurgie avec une posture en déclive. Enoncer vos actions pour prévenir les répercussions respiratoires.","session":"2021-2023","topic":"Postures et installations chirurgicales","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Positions chirurgicales acec notes (p. 61, à consulter)","../../../cours/3.1%20Positions%20chirurgicales%20acec%20notes.pdf#page=61"]],"options":[],"correct":"","note":"","answer":["Le déclive et le pneumopéritoine remontent le diaphragme, diminuent la compliance et favorisent les atélectasies. La position assise ou proclive peut réduire le retour veineux et la perfusion cérébrale.","Surveiller pressions, volume courant, SpO₂ et capnographie. Adapter PEP, FiO₂ et ventilation et contrôler le positionnement du tube."],"sourcePage":18},{"id":"c97","num":16,"page":5,"kind":"QUESTION","title":"Citer 6 critères prédictifs d'une intubation difficile détectable lors de la consultation d'anesthésie","session":"2021-2023","topic":"Pre-oxygenation – ventilation manuelle – iot – ml","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Pré oxygénation avec notes","../../../cours/S1/3.1/Pre%CC%81%20oxyge%CC%81nation%20avec%20notes.pdf"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Rechercher antécédent d’intubation difficile, Mallampati élevé, ouverture buccale réduite, distance thyromentonnière courte, limitation cervicale, rétrognathie et dentition défavorable."],"sourcePage":20},{"id":"c100","num":17,"page":5,"kind":"QUESTION","title":"énoncer les étapes pour la pose d'un masque laryngé ave c coussinet","session":"2021-2023","topic":"Pre-oxygenation – ventilation manuelle – iot – ml","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Pré oxygénation avec notes (p. 2, à consulter)","../../../cours/S1/3.1/Pre%CC%81%20oxyge%CC%81nation%20avec%20notes.pdf#page=2"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Choisir la taille, vérifier le dispositif et préparer une solution de secours. Après profondeur anesthésique suffisante, introduire selon la technique du fabricant et gonfler le coussinet si nécessaire.","Confirmer ventilation, étanchéité, capnographie et fixation."],"sourcePage":21},{"id":"c101","num":18,"page":5,"kind":"QUESTION","title":"citer les 6 contre-indications du masque laryngé","session":"2021-2023","topic":"Pre-oxygenation – ventilation manuelle – iot – ml","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Pré oxygénation avec notes (p. 2, à consulter)","../../../cours/S1/3.1/Pre%CC%81%20oxyge%CC%81nation%20avec%20notes.pdf#page=2"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Masque laryngé : évaluer risque d’inhalation, accès buccal et pressions attendues. Vérifier la position, la ventilation, l’étanchéité et la capnographie. Un accès buccal impossible, un obstacle sus-glottique ou un risque d’inhalation majeur rendent la pose ou l’usage inadaptés selon le contexte."],"sourcePage":21},{"id":"c110","num":19,"page":5,"kind":"QCM","title":"Parmi les propositions concernant le score d'Apfel en cas de nausées vomissements post - opératoire (NVPO), laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Processus d’anesthesie","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":["le sexe féminin est un facteur de risque de NVPO","les patients traités par corticoïdes présentent un facteur de risque de NVPO","les patients consommant des morphiniques en post -opératoire, présentent un facteur de risque de NVPO","les patients fumeurs présentent un facteur de risque de NVPO","les patients ayant le mal des transports présentent un facteur de risque de NVPO"],"correct":"ACE","note":"Consultation : évaluer terrain, intervention, voies aériennes et traitements, planifier la stratégie, informer et tracer. Visite dans les 24 h : rechercher des changements et vérifier la préparation.","instruction":"Cocher les propositions exactes.","sourcePage":23},{"id":"c111","num":20,"page":5,"kind":"QCM","title":"Parmi les propositions concernant La consultation d'anesthésie, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Processus d’anesthesie","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":["Elle est une obligation légale","elle est systématiquement suivie d'une visite pré-anesthésique","elle a lieu la veille ou juste avant l'intervention de chirurgie programmée","elle permet une évaluation du risque lié à la chirurgie","elle détermine systématiquement une stratégie de prise en charge anesthésique"],"correct":"ABD","note":"Consultation : évaluer terrain, intervention, voies aériennes et traitements, planifier la stratégie, informer et tracer. Visite dans les 24 h : rechercher des changements et vérifier la préparation.","instruction":"Cocher les propositions exactes.","sourcePage":23},{"id":"c112","num":21,"page":6,"kind":"QCM","title":"Parmi les propositions concernant les objectifs de la visite pré -anesthésique, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Processus d’anesthesie","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":["elle a pour objectif de vérifier les éléments nouveaux depuis la consultation","elle a pour objectif de vérifier la compréhension des informations par la famille","elle a pour objectif de vérifier les informations données au patient","elle a pour objectif de vérifier la prise de la prémédication","elle a pour objectif de vérifier les résultats des examens complémentaires"],"correct":"ABCDE","note":"Consultation : évaluer terrain, intervention, voies aériennes et traitements, planifier la stratégie, informer et tracer. Visite dans les 24 h : rechercher des changements et vérifier la préparation.","instruction":"Cocher les propositions exactes.","sourcePage":24},{"id":"c122","num":22,"page":6,"kind":"QUESTION","title":"énoncer 4 objectifs de la consultation d'anesthésie","session":"2021-2023","topic":"Processus d’anesthesie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 9, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=9"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":[],"correct":"","note":"","answer":["Consultation : évaluer terrain, intervention, voies aériennes et traitements, planifier la stratégie, informer et tracer. Visite dans les 24 h : rechercher des changements et vérifier la préparation."],"sourcePage":24},{"id":"c126","num":23,"page":6,"kind":"QUESTION","title":"Décrire les différentes classes de Mallampati et les différents grades de Cormack","session":"2021-2023","topic":"Processus d’anesthesie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 21, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=21"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":[],"correct":"","note":"","answer":["Mallampati décrit les structures visibles chez un patient éveillé, assis, bouche ouverte et langue tirée, sans phonation.","I : voile, luette et piliers visibles. II : voile et partie de la luette. III : voile et base de la luette. IV : palais dur seul.","Grade I : glotte entière. Grade II : ouverture glottique partielle. Grade III : épiglotte sans glotte visible. Grade IV : ni épiglotte ni glotte visibles."],"sourcePage":25},{"id":"c139","num":24,"page":6,"kind":"QUESTION","title":"définir la classification NYHA. citer et expliquer les différentes classes.","session":"2021-2023","topic":"Le reveil en anesthesie – sspi","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 SSPI Avec notes","../../../cours/S1/3.1/3.1%20SSPI%20Avec%20notes.pdf"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["NYHA I : pas de limitation. II : limitation légère lors d’efforts habituels. III : limitation marquée pour de faibles efforts. IV : symptômes au repos ou incapacité à tout effort."],"sourcePage":27},{"id":"c133","num":25,"page":6,"kind":"QCM","title":"Parmi les propositions concernant les équipements réglementaires et obligatoires à chaque poste, en salle de surveillance post -interventionnelle (SSPI), laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Le reveil en anesthesie – sspi","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 SSPI Avec notes","../../../cours/S1/3.1/3.1%20SSPI%20Avec%20notes.pdf"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":["un système d'aspiration par le vide est obligatoire","des fluides médicaux (air, oxygène) sont obligatoires","un pousse seringue est obligatoire","un monitorage de la curarisation est obligatoire","un moniteur de la fréquence cardiaque est obligatoire"],"correct":"ABE","note":"Extubation : conscience adaptée, ventilation spontanée et échanges satisfaisants, stabilité circulatoire, absence de complication limitante et décurarisation quantitative. Prévoir une stratégie de secours.","instruction":"Cocher les propositions exactes.","sourcePage":27},{"id":"c140","num":26,"page":6,"kind":"QUESTION","title":"énoncer les répercussions physiopathologiques de l'hypot hermie chez un patient intubé et ventilé. compléter le tableau ci-dessous. Plan répercussion hémodynamique respiratoire pharmacologique hématologique hémostase infectieux oculaire psychologique","session":"2021-2023","topic":"Le reveil en anesthesie – sspi","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 SSPI Avec notes (p. 75, à consulter)","../../../cours/S1/3.1/3.1%20SSPI%20Avec%20notes.pdf#page=75"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Hypothermie : retard de réveil et de décurarisation, frissons et demande accrue en O₂, saignement et complications cardiovasculaires ou infectieuses. Rechercher aussi dépression ventilatoire ou instabilité en fonction du terrain."],"sourcePage":27},{"id":"c151","num":27,"page":7,"kind":"QCM","title":"Parmi les propositions concernant la courbe de Barcroft, l'affinité de l'oxygène pour l'hémoglobine varie en fonction de : laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Ventilation mecanique","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Ventilation mécanique avec notes","../../../cours/S1/3.1/3.1%20Ventilation%20me%CC%81canique%20avec%20notes.pdf"]],"options":["La Pet CO2","le pH","la température","les 2-3 DPG (diphosphoglycérate enzyme intra-érythrocytaire)","la saturation en oxygène"],"correct":"BCD","note":"En volume contrôlé, le volume est réglé et la pression varie. En pression contrôlée, la pression inspiratoire est réglée et le volume dépend de la mécanique. En aide inspiratoire, le patient déclenche ses cycles.","instruction":"Cocher les propositions exactes.","sourcePage":29},{"id":"c152","num":28,"page":7,"kind":"QCM","title":"Parmi les propositions concernant L'hypoxémie, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Ventilation mecanique","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Ventilation mécanique avec notes","../../../cours/S1/3.1/3.1%20Ventilation%20me%CC%81canique%20avec%20notes.pdf"]],"options":["L'hypoxémie est définie par une interruption de l'apport d'oxygène au tissu","l'hypoxémie est définie comme une diminution de la circulation artérielle dans un territoire localisé","l'hypoxémie est définie par un faible taux d'oxygène dans le sang","l'hypoxémie est définie par une PaO2 supérieure à 0,5 bars","l'hypoxémie est définie par un manque d'apport en oxygène au niveau des tissus de l'organisme"],"correct":"BC","note":"En volume contrôlé, le volume est réglé et la pression varie. En pression contrôlée, la pression inspiratoire est réglée et le volume dépend de la mécanique. En aide inspiratoire, le patient déclenche ses cycles.","instruction":"Cocher les propositions exactes.","sourcePage":30},{"id":"c156","num":29,"page":7,"kind":"QUESTION","title":"Citer le mécanisme le plus fréquent, en cau se chez le patient présentant une hypoxémie au bloc opératoire","session":"2021-2023","topic":"Ventilation mecanique","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Ventilation mécanique avec notes (p. 64, à consulter)","../../../cours/S1/3.1/3.1%20Ventilation%20me%CC%81canique%20avec%20notes.pdf#page=64"]],"options":[],"correct":"","note":"","answer":["Au bloc, les atélectasies et la baisse du rapport ventilation/perfusion sont des causes fréquentes. En cas de désaturation aiguë, vérifier d’abord patient, sonde, circuit et apport en oxygène."],"sourcePage":30},{"id":"c157","num":30,"page":7,"kind":"QUESTION","title":"vous décidez de ventiler un patient en pression contrôlée, quel est le paramètre que l'on ne peut pas régler? justifier votre réponse. énoncer le ou les éléments de surveillance à observer pour que la ventilation soit à la fois efficace et non traumatique","session":"2021-2023","topic":"Ventilation mecanique","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Ventilation mécanique avec notes (p. 39, à consulter)","../../../cours/S1/3.1/3.1%20Ventilation%20me%CC%81canique%20avec%20notes.pdf#page=39"]],"options":[],"correct":"","note":"","answer":["En pression contrôlée, l’opérateur fixe une pression inspiratoire. Le volume courant obtenu varie notamment avec la compliance, la résistance et le temps inspiratoire."],"sourcePage":30}],"figures":{"3.1-8-1":"/9j/4AAQ const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

const $ = id => document.getElementById(id);
const format = (value, digits=4) => value.toLocaleString('fr-FR', {maximumFractionDigits:digits});
const isChoice = q => q.kind === 'QCM' || q.kind === 'QCU';
const isOpen = q => !isChoice(q) && q.kind !== 'context';
const escape = value => String(value).replace(/[&<>"']/g, char => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]
));
const questionLabel = card => card.kind === 'context' ? card.title : `${card.kind} ${card.num}${card.series?' · '+card.series:''}`;
const values = [...'ABCDEFGHIJKL'];


const realCards=DATA.cards.filter(q=>q.kind!=='context');
const nCh=realCards.filter(q=>q.kind==='QCM'||q.kind==='QCU').length,nOp=realCards.length-nCh;
const nPts=Math.round(realCards.reduce((s,q)=>s+(q.points??1),0)*100)/100;
document.title=`UE ${DATA.ue} · Semestre ${DATA.semester} · Promotion 2021-2023 — ${DATA.title}`;
$('h-eyebrow').textContent=`École IADE · UE ${DATA.ue} · Semestre ${DATA.semester} · Promotion 2021-2023`;
$('h-title').textContent=DATA.name;
$('h-title').insertAdjacentHTML('afterend', `<p>${escape(DATA.title)}</p>`);
$('h-stats').innerHTML=[[realCards.length,'questions'],[nCh,'QCM / QCU'],[nOp,'questions ouvertes'],[nPts.toLocaleString('fr-FR'),'points au barème']].filter(([n])=>n!==0).map(([n,t])=>`<div class="hero-stat"><b>${n}</b><span>${t}</span></div>`).join('');
$('h-rules').innerHTML=`<p>QCM sur 1 point : une erreur ou un oubli = 0,5 point${DATA.twoErrors?`, deux erreurs ou oublis = ${String(DATA.twoErrors).replace('.',',')} point`:''}, au-delà 0. QCU sur 1 point.</p><p>Questions ouvertes : ta réponse est comparée aux éléments attendus. Si la détection n’a pas reconnu une bonne idée, clique sur <b>Valider cet élément</b> ou choisis une évaluation manuelle.</p><p>Les questions signalées « hors barème » sont consultables dans la correction. Leurs données, leur figure ou leur corrigé sont insuffisants pour attribuer une note. Les questions ouvertes sont corrigées automatiquement lorsque des critères ont pu être établis. Les autres peuvent être évaluées manuellement après lecture de la correction.</p>`;
$('h-footer').innerHTML=`Source · <a href="${DATA.pdf}">${escape(DATA.pdfLabel)}</a> · Fonctionne hors connexion.`;
$('h-rules').insertAdjacentHTML('beforeend',`<p>${escape(DATA.notes[0])}</p>`);
const srcTag=q=>q.source==='corrige'?'<span class="tag-src deduit">Réponse rectifiée</span>':'';
function sourceCopy(q) {
  return `<p class="small source-line"><a href="${escape(DATA.pdf)}#page=${q.page}">PDF de la promotion · p. ${q.page}</a> · <a href="${escape(DATA.originalPdf)}#page=${q.sourcePage}">Recueil d’origine · p. ${q.sourcePage}</a> · ${escape(q.session)} · ${escape(q.topic)}</p>`;
}
function sources(q) {
  return q.refs.length?`<ul class="small">${q.refs.map(([label,url])=>`<li><a href="${escape(url)}" target="_blank" rel="noopener">${escape(label)}</a></li>`).join('')}</ul>`:'';
}
function answerBox(q){
  let list=q.answer; if(!list) return ''; if(typeof list==='string') list=[list];
  const items=list.map(a=>{const add=a.startsWith('+');const t=add?a.replace(/^\+\s*/,''):a;return `<li class="${add?'added':''}">${escape(t)}${add?'<span class="tag-added">Complément</span>':''}</li>`;}).join('');
  return `<div class="answer-key"><h3>Correction ${srcTag(q)}</h3><ul>${items}</ul>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
}
let active, grades, locked, confirmed, targeted;
const form = $('quiz');
function images(list, label) {
  return list.map((item,i) => `<img loading="lazy" alt="${escape(label)}${list.length>1?' · extrait '+(i+1):''}" src="data:image/jpeg;base64,${item}">`).join('');
}
function scanBlock(scans, label) {
  return `<div class="document"><div class="source-pictures" tabindex="0" aria-label="${escape(label)}">${images(scans,label)}</div><button type="button" class="secondary zoom" aria-expanded="false">Agrandir le scan</button></div>`;
}
function prompt(q) {
  if(q.images) return scanBlock(q.images,questionLabel(q));
  const table=q.table?`<div class="prompt-table">${q.table.map(cell=>`<span>${escape(cell)}</span>`).join('')}</div>`:'';
  return `<h2 class="question-stem">${escape(q.title)}</h2>${q.text?`<p class="context-text">${escape(q.text)}</p>`:''}${q.figures.length?`<div class="q-figure">${q.figures.map((id,i)=>`<img loading="lazy" src="data:image/jpeg;base64,${DATA.figures[id]}" class="question-figure" alt="Figure ${i+1} de la question">`).join('')}</div>`:''}${q.instruction?`<p class="small">${escape(q.instruction)}</p>`:''}${table}`;
}
function fields(q) {
  if (isChoice(q)) {
    return `<div class="choices ${q.options?'written-choices':''}" role="${q.kind==='QCU'?'radiogroup':'group'}" aria-labelledby="title-${q.id}">${q.options.map((_,i)=>values[i]).map((letter,i)=>`<label class="option" id="option-${q.id}-${letter}"><input type="${q.kind==='QCU'?'radio':'checkbox'}" name="${q.id}" value="${letter}"><span><strong>${letter}</strong>${q.options?' · '+escape(q.options[i]):''}<small></small></span></label>`).join('')}</div>`;
  }
  return `<div class="field"><textarea id="answer-${q.id}" aria-labelledby="title-${q.id}" rows="5" placeholder="Ta réponse…"></textarea></div>`;
}
function render() {
  $('cards').innerHTML = active.map((q, index) => {
    const section = q.kind === 'context' ? '<span>Dossier</span>' : `<span>${q.ungraded?'Hors barème':format(q.points)+' pt'} · ${escape(q.session)} · PDF p. ${q.page}</span>`;
    const anchor = active.findIndex(card=>card.kind===q.kind)===index ? ` id="section-${q.kind}"` : '';
    return `<section class="card"${anchor} data-card="${q.id}"><div class="meta"><strong id="title-${q.id}">${escape(questionLabel(q))}</strong>${section}</div>${prompt(q)}${q.kind==='context'?'':fields(q)+`<div class="feedback" id="feedback-${q.id}" hidden></div>`}</section>`;
  }).join('');
  for(const link of document.querySelectorAll('[data-kind]')){
    const kind=link.dataset.kind;
    const index=active.findIndex(q=>kind==='open'?isOpen(q):q.kind===kind);
    link.hidden=index<0;
    if(index>=0) link.hash='section-'+active[index].kind;
  }
}
function response(q) {
  if (isChoice(q)) {
    return [...form.querySelectorAll(`[name="${q.id}"]:checked`)].map(input=>input.value);
  }
  return $(`answer-${q.id}`).value.trim();
}
function progress() {
  const current=active.filter(q=>q.kind!=='context');
  const count=current.filter(q=>response(q).length>0).length;
  $('progress').textContent=`${count} / ${current.length} questions renseignées`;
  $('bar').max=current.length;
  $('bar').value=count;
}
function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.slice(0,q.options.length).filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Évalue ta réponse à partir des éléments du corrigé.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0,ungraded:q.ungraded};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values.slice(0,q.options.length)){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(!q.ungraded&&q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  if (isOpen(q)) {
    panel.innerHTML=`${answerBox(q)}${sources(q)}${q.ungraded?'<p class="small">Question hors barème.</p>':rubricPanel(q,grade)+assessmentControls(q,grade)}${sourceCopy(q)}`;
    return;
  }
  const answers=q.correct.split('').filter(Boolean).map(letter=>q.options[values.indexOf(letter)]);
  const key=`<strong>${q.ungraded?'Hors barème':format(grade.autoScore)+' / 1 point'}</strong><div class="answer-key" style="margin-top:10px"><h3>${q.ungraded?'Éléments pour vérifier':'Correction'}</h3>${answers.length?`<ul class="correct-options">${answers.map(a=>`<li>${escape(a)}</li>`).join('')}</ul>`:''}${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
  panel.innerHTML=key+sources(q)+sourceCopy(q);
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return !grade.ungraded&&(grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max)));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const adjusted=list.some(g=>g.review && g.review!=='blank' || g.analysis?.some(c=>c.override!==null));
  if(adjusted) $('summary').textContent+=' Note ajustée.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(g=>g.ungraded||isComplete(g));
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!q.ungraded&&!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function shuffledCard(q) {
  if (!isChoice(q)) return q;
  const indexes=q.options.map((_,i)=>i);
  for(let i=indexes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
  }
  const correct=indexes.map((index,i)=>q.correct.includes(values[index])?values[i]:'').join('');
  return {...q,options:indexes.map(i=>q.options[i]),correct};
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!g.ungraded&&!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>(!$('topic').value||q.topic===$('topic').value)&&(!keep||keep.has(q.id))).map(shuffledCard);
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
for(const topic of new Set(DATA.cards.map(q=>q.topic))) $('topic').add(new Option(topic,topic));
$('topic').addEventListener('change',()=>start());
start();
</script>
