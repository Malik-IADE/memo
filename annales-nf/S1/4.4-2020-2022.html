16-novembre-2021-relative-a-la-realisation-de-l-acte-transfusionnel.pdf"],["HAS · Transfusion de globules rouges","https://www.has-sante.fr/jcms/c_2016516/fr/recommandations-transfusion-de-globules-rouges-homologues-produits-indications-alternatives"]],"options":[],"correct":"","note":"","answer":["Les erreurs d’identité et de concordance exposent à la transfusion du mauvais produit. Vérifier l’identité à chaque étape et réaliser le contrôle ultime au lit du patient, unité par unité."],"sourcePage":7},{"id":"c26","num":6,"page":1,"kind":"QUESTION","title":"cit er et hiérarchiser les 4 symptômes dominants consécutifs à un incident transfu sionnel immédiat","session":"2020-2022","topic":"Hemovigilance","points":2,"ungraded":false,"figures":[],"refs":[["Acte transfusionnel · Instruction nationale","https://ansm.sante.fr/uploads/2024/10/28/instruction-n0-2021-230-du-16-novembre-2021-relative-a-la-realisation-de-l-acte-transfusionnel.pdf"],["HAS · Transfusion de globules rouges","https://www.has-sante.fr/jcms/c_2016516/fr/recommandations-transfusion-de-globules-rouges-homologues-produits-indications-alternatives"]],"options":[],"correct":"","note":"","answer":["Fièvre ou frissons, dyspnée, anomalies tensionnelles jusqu’au collapsus et signes cutanés ou douleur doivent alerter. Prioriser les signes de détresse respiratoire ou circulatoire."],"sourcePage":7},{"id":"c40","num":7,"page":2,"kind":"QCM","title":"Parmi les propositions concernant l’hygiène des mains, laquelle ou lesquelles est (sont) vraies lorsque mes mains sont souillées par des produits biologiques, j'effectue :","session":"2020-2022","topic":"Infectiovigilance / hygiene des mains et tenue au bloc operatoire","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Hygiène des mains avec notes","../../../cours/S1/4.4/Hygie%CC%80ne%20des%20mains%20avec%20notes.pdf"],["Santé publique France · Surveillance des ISO","https://www.santepubliquefrance.fr/infections-associees-aux-soins/enquetesetudes/rapport-national-de-la-surveillance-semi-0"]],"options":["Un lavage simple","une friction hydroalcoolique","un séchage humide","un lavage simple avec un séchage complet","un lavage antiseptique des mains (avec bétadine scrub ou Hibiscrub)"],"correct":"D","note":"Friction hydroalcoolique sur mains sèches et propres. En cas de souillure visible, laver, rincer et sécher. Appliquer le protocole local en cas de germe sporulé.","instruction":"Cocher les propositions exactes.","sourcePage":10},{"id":"c49","num":8,"page":2,"kind":"QUESTION","title":"énoncer les impératifs en matière d'hygiène avant la prise de poste dans une unité de soins à l'hôpital","session":"2020-2022","topic":"Infectiovigilance / hygiene des mains et tenue au bloc operatoire","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Hygiène des mains avec notes (p. 34, à consulter)","../../../cours/S1/4.4/Hygie%CC%80ne%20des%20mains%20avec%20notes.pdf#page=34"],["Santé publique France · Surveillance des ISO","https://www.santepubliquefrance.fr/infections-associees-aux-soins/enquetesetudes/rapport-national-de-la-surveillance-semi-0"]],"options":[],"correct":"","note":"","answer":["Tenue professionnelle propre, cheveux attachés ou couverts selon la zone, avant-bras dégagés, ongles courts sans vernis ni faux ongles, absence de bijoux aux mains et poignets, hygiène des mains."],"sourcePage":11},{"id":"c53","num":9,"page":2,"kind":"QCM","title":"Parmi les propositions concernant les dispositifs médicaux (DM), laquelle ou lesquelles est (sont) vraies","session":"2016-2018 / 2019 -2021 / 2020-2022","topic":"Materiovigilance","points":1,"ungraded":false,"figures":[],"refs":[],"options":["Un lecteur de glycémie est un DM","Un respirateur est un DM","Un collecteur d’aiguille est un DM","Une seringue préremplie est un DM","Des gants chirurgicaux sont des DM","Le set de perfusion est un DM","Le stimulateur cardiaque est un DM","La poche d’un culot sanguin est un DM","La seringue préremplie d’éphédrine est un DM"],"correct":"BEFG","note":"Sécuriser le patient, arrêter d’utiliser le dispositif en cause et le mettre à l’écart. Conserver accessoires et éléments d’identification utiles.","instruction":"Cocher les propositions exactes.","sourcePage":12},{"id":"c54","num":10,"page":2,"kind":"QCM","title":"Parmi les propositions concernant les dispositifs médicaux (DM), laquelle ou lesquelles est (sont) vraies","session":"2016-2018 / 2019 -2021 / 2020-2022","topic":"Materiovigilance","points":1,"ungraded":false,"figures":[],"refs":[],"options":["L’arrêt d’un respirateur d’anesthésie en cours de fonctionnement avec émission d’une alarme sonore et visuelle est un incident de matériovigilance","La migration d’un cathéter veineux central après rupture est un incident de matériovigilance","Le bris d’une pince à biopsie à usage unique lors du test de bon fonctionnement est un incident de matériovigilance","L’arrêt d’une seringue de perfusion sans émettre de signal d’alarme est un incident de matériovigilance","L’arrêt de l’alimentation en O2 d’un respirateur est un incident de matériovigilance"],"correct":"ABCDE","note":"Sécuriser le patient, arrêter d’utiliser le dispositif en cause et le mettre à l’écart. Conserver accessoires et éléments d’identification utiles.","instruction":"Cocher les propositions exactes.","sourcePage":12},{"id":"c58","num":11,"page":2,"kind":"QCM","title":"Parmi les propositions concernant les dispositifs médicaux (DM), laquelle ou lesquelles est (sont) vraies","session":"2020-2022","topic":"Materiovigilance","points":1,"ungraded":false,"figures":[],"refs":[],"options":["Le ciment osseux est un DM","les gants chirurgicaux sont des DM","les pansements stériles sont des DM","les électrodes d’ECG sont des DM","la seringue préremplie est en DM"],"correct":"ABCD","note":"Sécuriser le patient, arrêter d’utiliser le dispositif en cause et le mettre à l’écart. Conserver accessoires et éléments d’identification utiles.","instruction":"Cocher les propositions exactes.","sourcePage":13},{"id":"c69","num":12,"page":3,"kind":"QCM","title":"Parmi les propositions concernant la pharmacovigilance, laquelle ou lesquelles est (sont) vraies","session":"2020-2022","topic":"Pharmacovigilance","points":1,"ungraded":false,"figures":[],"refs":[],"options":["elle inclut les effets indésirables d'un médicament","elle inclut le défaut de qualité sur un médicament","elle inclut les dispositifs médicaux","elle inclut les produits sanguins labiles","elle inclut la pharmacodépendance"],"correct":"AE","note":"Un signalement comporte un déclarant, un patient identifiable, un médicament suspect et un effet indésirable. Décrire chronologie, dose, voie, évolution et médicaments associés.","instruction":"Cocher les propositions exactes.","sourcePage":16},{"id":"c70","num":13,"page":3,"kind":"QCM","title":"Parmi les propositions concernant la Déclaration d'un effet indésirable d'un médicament, laquelle ou lesquelles est (sont) vraies","session":"2020-2022","topic":"Pharmacovigilance","points":1,"ungraded":false,"figures":[],"refs":[],"options":["l'identification du déclarant est un critère obligatoire","l'identification du cadre de santé est un critère obligatoire","l'identification du médicament suspect est un critère obligatoire","l'identification de l'effet indésirable est un critère obligatoire","l'identification du chef de service est un critère obligatoire"],"correct":"ACD","note":"Un signalement comporte un déclarant, un patient identifiable, un médicament suspect et un effet indésirable. Décrire chronologie, dose, voie, évolution et médicaments associés.","instruction":"Cocher les propositions exactes.","sourcePage":16},{"id":"c71","num":14,"page":3,"kind":"QUESTION","title":"Dans le cadre de la pharmacovig ilance, citer les cinq éléments à prendre en compte dans la règle des « 5B » tout erreur ou oublie entraîne zéro à la question","session":"2015-2017, 2020-2022","topic":"Pharmacovigilance","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["Bon patient, bon médicament, bonne dose, bonne voie, bon moment."],"sourcePage":17},{"id":"c75","num":15,"page":3,"kind":"QUESTION","title":"Etudiant infirmier anesthésiste, vous administrez un médicament dont vous connaissez parfaitement les effets pharmacologiques. Quelques minutes après le début de l’incision, vous constatez de façon objective l’apparition d’effets inattendus chez le patient. 1- Identifier deux étiologies possibles d’erreurs liées à la préparation des médicaments 2- Identifier trois étiologies possibles d’erreurs liées à l’administration du médicament","session":"2018-2020, 2020 -2022","topic":"Pharmacovigilance","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["Sécuriser le patient, avertir le prescripteur, recueillir signes, dose, horaires et évolution, tracer et déclarer via le circuit de pharmacovigilance."],"sourcePage":17},{"id":"c77","num":16,"page":3,"kind":"QUESTION","title":"lors d'une analyse d'effet indésirables d'un médicament définir le mot “ imputabilité”","session":"2020-2022","topic":"Pharmacovigilance","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["L’imputabilité estime dans quelle mesure un médicament a pu contribuer à un événement, d’après la chronologie, le tableau clinique, les causes alternatives et les données connues."],"sourcePage":17},{"id":"c80","num":17,"page":3,"kind":"QCM","title":"Parmi les propositions concernant la radioprotection, laquelle ou lesquelles est (sont) vraies","session":"2020-2022","topic":"Radioprotection","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 4.4 Radio Protection","../../../cours/S1/4.4/4.4%20Radio%20Protection.pdf"]],"options":["toutes les salles d'intervention disposent de protection collective","utiliser des EPI (équipement de protection individuel) permet une pro tection individuelle","utiliser un tablier de zinc permet une protection individuelle","sortir de la salle permet une protection individuelle","se positionner le plus loin possible de la source de rayonnement permet la protection individuelle"],"correct":"BDE","note":"Justification, optimisation et limitation structurent la radioprotection professionnelle. Limiter le temps d’exposition, augmenter la distance et utiliser des écrans.","instruction":"Cocher les propositions exactes.","sourcePage":18},{"id":"c88","num":18,"page":4,"kind":"QCM","title":"Parmi les propositions concernant la déclaration en cas d'incident, laquelle ou lesquelles est (sont) vraies","session":"2020-2022","topic":"Les vigilances","points":1,"ungraded":false,"figures":[],"refs":[["HAS · Check-list du bloc","https://www.has-sante.fr/jcms/c_2607929/fr/check-list-securite-du-patient-au-bloc-operatoire-et-son-mode-d-emploi-version-2018"]],"options":["nécessite d'identifier l'événement","nécessite le respect des suivis de l'information","nécessite la mobilisation des professionnels de santé","nécessite d'être déclaré dans les 48 heures suivant l'incident","nécessite la traçabilité de l'événement"],"correct":"ABCE","note":"La check-list organise les vérifications partagées avant l’induction, avant l’incision et avant la sortie. Vérifier identité, site, risques et mesures de secours.","instruction":"Cocher les propositions exactes.","sourcePage":19},{"id":"c92","num":19,"page":4,"kind":"QUESTION","title":"citer 10 vigilances","session":"2020-2022, 2021-2023","topic":"Les vigilances","points":2,"ungraded":false,"figures":[],"refs":[["HAS · Check-list du bloc","https://www.has-sante.fr/jcms/c_2607929/fr/check-list-securite-du-patient-au-bloc-operatoire-et-son-mode-d-emploi-version-2018"]],"options":[],"correct":"","note":"","answer":["Exemples : pharmacovigilance, matériovigilance, réactovigilance, hémovigilance, biovigilance, infectiovigilance, toxicovigilance, addictovigilance, cosmétovigilance et nutrivigilance."],"sourcePage":19},{"id":"c93","num":20,"page":4,"kind":"QUESTION","title"     const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

const $ = id => document.getElementById(id);
const format = (value, digits=4) => value.toLocaleString('fr-FR', {maximumFractionDigits:digits});
const isChoice = q => q.kind === 'QCM' || q.kind === 'QCU';
const isOpen = q => !isChoice(q) && q.kind !== 'context';
const escape = value => String(value).replace(/[&<>"']/g, char => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]
));
const questionLabel = card => card.kind === 'context' ? card.title : `${card.kind} ${card.num}${card.series?' · '+card.series:''}`;
const values = [...'ABCDEFGHIJKL'];


const realCards=DATA.cards.filter(q=>q.kind!=='context');
const nCh=realCards.filter(q=>q.kind==='QCM'||q.kind==='QCU').length,nOp=realCards.length-nCh;
const nPts=Math.round(realCards.reduce((s,q)=>s+(q.points??1),0)*100)/100;
document.title=`UE ${DATA.ue} · Semestre ${DATA.semester} · Promotion 2020-2022 — ${DATA.title}`;
$('h-eyebrow').textContent=`École IADE · UE ${DATA.ue} · Semestre ${DATA.semester} · Promotion 2020-2022`;
$('h-title').textContent=DATA.name;
$('h-title').insertAdjacentHTML('afterend', `<p>${escape(DATA.title)}</p>`);
$('h-stats').innerHTML=[[realCards.length,'questions'],[nCh,'QCM / QCU'],[nOp,'questions ouvertes'],[nPts.toLocaleString('fr-FR'),'points au barème']].filter(([n])=>n!==0).map(([n,t])=>`<div class="hero-stat"><b>${n}</b><span>${t}</span></div>`).join('');
$('h-rules').innerHTML=`<p>QCM sur 1 point : une erreur ou un oubli = 0,5 point${DATA.twoErrors?`, deux erreurs ou oublis = ${String(DATA.twoErrors).replace('.',',')} point`:''}, au-delà 0. QCU sur 1 point.</p><p>Questions ouvertes : ta réponse est comparée aux éléments attendus. Si la détection n’a pas reconnu une bonne idée, clique sur <b>Valider cet élément</b> ou choisis une évaluation manuelle.</p><p>Les questions signalées « hors barème » sont consultables dans la correction. Leurs données, leur figure ou leur corrigé sont insuffisants pour attribuer une note. Les questions ouvertes sont corrigées automatiquement lorsque des critères ont pu être établis. Les autres peuvent être évaluées manuellement après lecture de la correction.</p>`;
$('h-footer').innerHTML=`Source · <a href="${DATA.pdf}">${escape(DATA.pdfLabel)}</a> · Fonctionne hors connexion.`;
$('h-rules').insertAdjacentHTML('beforeend',`<p>${escape(DATA.notes[0])}</p>`);
const srcTag=q=>q.source==='corrige'?'<span class="tag-src deduit">Réponse rectifiée</span>':'';
function sourceCopy(q) {
  return `<p class="small source-line"><a href="${escape(DATA.pdf)}#page=${q.page}">PDF de la promotion · p. ${q.page}</a> · <a href="${escape(DATA.originalPdf)}#page=${q.sourcePage}">Recueil d’origine · p. ${q.sourcePage}</a> · ${escape(q.session)} · ${escape(q.topic)}</p>`;
}
function sources(q) {
  return q.refs.length?`<ul class="small">${q.refs.map(([label,url])=>`<li><a href="${escape(url)}" target="_blank" rel="noopener">${escape(label)}</a></li>`).join('')}</ul>`:'';
}
function answerBox(q){
  let list=q.answer; if(!list) return ''; if(typeof list==='string') list=[list];
  const items=list.map(a=>{const add=a.startsWith('+');const t=add?a.replace(/^\+\s*/,''):a;return `<li class="${add?'added':''}">${escape(t)}${add?'<span class="tag-added">Complément</span>':''}</li>`;}).join('');
  return `<div class="answer-key"><h3>Correction ${srcTag(q)}</h3><ul>${items}</ul>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
}
let active, grades, locked, confirmed, targeted;
const form = $('quiz');
function images(list, label) {
  return list.map((item,i) => `<img loading="lazy" alt="${escape(label)}${list.length>1?' · extrait '+(i+1):''}" src="data:image/jpeg;base64,${item}">`).join('');
}
function scanBlock(scans, label) {
  return `<div class="document"><div class="source-pictures" tabindex="0" aria-label="${escape(label)}">${images(scans,label)}</div><button type="button" class="secondary zoom" aria-expanded="false">Agrandir le scan</button></div>`;
}
function prompt(q) {
  if(q.images) return scanBlock(q.images,questionLabel(q));
  const table=q.table?`<div class="prompt-table">${q.table.map(cell=>`<span>${escape(cell)}</span>`).join('')}</div>`:'';
  return `<h2 class="question-stem">${escape(q.title)}</h2>${q.text?`<p class="context-text">${escape(q.text)}</p>`:''}${q.figures.length?`<div class="q-figure">${q.figures.map((id,i)=>`<img loading="lazy" src="data:image/jpeg;base64,${DATA.figures[id]}" class="question-figure" alt="Figure ${i+1} de la question">`).join('')}</div>`:''}${q.instruction?`<p class="small">${escape(q.instruction)}</p>`:''}${table}`;
}
function fields(q) {
  if (isChoice(q)) {
    return `<div class="choices ${q.options?'written-choices':''}" role="${q.kind==='QCU'?'radiogroup':'group'}" aria-labelledby="title-${q.id}">${q.options.map((_,i)=>values[i]).map((letter,i)=>`<label class="option" id="option-${q.id}-${letter}"><input type="${q.kind==='QCU'?'radio':'checkbox'}" name="${q.id}" value="${letter}"><span><strong>${letter}</strong>${q.options?' · '+escape(q.options[i]):''}<small></small></span></label>`).join('')}</div>`;
  }
  return `<div class="field"><textarea id="answer-${q.id}" aria-labelledby="title-${q.id}" rows="5" placeholder="Ta réponse…"></textarea></div>`;
}
function render() {
  $('cards').innerHTML = active.map((q, index) => {
    const section = q.kind === 'context' ? '<span>Dossier</span>' : `<span>${q.ungraded?'Hors barème':format(q.points)+' pt'} · ${escape(q.session)} · PDF p. ${q.page}</span>`;
    const anchor = active.findIndex(card=>card.kind===q.kind)===index ? ` id="section-${q.kind}"` : '';
    return `<section class="card"${anchor} data-card="${q.id}"><div class="meta"><strong id="title-${q.id}">${escape(questionLabel(q))}</strong>${section}</div>${prompt(q)}${q.kind==='context'?'':fields(q)+`<div class="feedback" id="feedback-${q.id}" hidden></div>`}</section>`;
  }).join('');
  for(const link of document.querySelectorAll('[data-kind]')){
    const kind=link.dataset.kind;
    const index=active.findIndex(q=>kind==='open'?isOpen(q):q.kind===kind);
    link.hidden=index<0;
    if(index>=0) link.hash='section-'+active[index].kind;
  }
}
function response(q) {
  if (isChoice(q)) {
    return [...form.querySelectorAll(`[name="${q.id}"]:checked`)].map(input=>input.value);
  }
  return $(`answer-${q.id}`).value.trim();
}
function progress() {
  const current=active.filter(q=>q.kind!=='context');
  const count=current.filter(q=>response(q).length>0).length;
  $('progress').textContent=`${count} / ${current.length} questions renseignées`;
  $('bar').max=current.length;
  $('bar').value=count;
}
function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.slice(0,q.options.length).filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Évalue ta réponse à partir des éléments du corrigé.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0,ungraded:q.ungraded};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values.slice(0,q.options.length)){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(!q.ungraded&&q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  if (isOpen(q)) {
    panel.innerHTML=`${answerBox(q)}${sources(q)}${q.ungraded?'<p class="small">Question hors barème.</p>':rubricPanel(q,grade)+assessmentControls(q,grade)}${sourceCopy(q)}`;
    return;
  }
  const answers=q.correct.split('').filter(Boolean).map(letter=>q.options[values.indexOf(letter)]);
  const key=`<strong>${q.ungraded?'Hors barème':format(grade.autoScore)+' / 1 point'}</strong><div class="answer-key" style="margin-top:10px"><h3>${q.ungraded?'Éléments pour vérifier':'Correction'}</h3>${answers.length?`<ul class="correct-options">${answers.map(a=>`<li>${escape(a)}</li>`).join('')}</ul>`:''}${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
  panel.innerHTML=key+sources(q)+sourceCopy(q);
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return !grade.ungraded&&(grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max)));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const adjusted=list.some(g=>g.review && g.review!=='blank' || g.analysis?.some(c=>c.override!==null));
  if(adjusted) $('summary').textContent+=' Note ajustée.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(g=>g.ungraded||isComplete(g));
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!q.ungraded&&!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function shuffledCard(q) {
  if (!isChoice(q)) return q;
  const indexes=q.options.map((_,i)=>i);
  for(let i=indexes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
  }
  const correct=indexes.map((index,i)=>q.correct.includes(values[index])?values[i]:'').join('');
  return {...q,options:indexes.map(i=>q.options[i]),correct};
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!g.ungraded&&!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>(!$('topic').value||q.topic===$('topic').value)&&(!keep||keep.has(q.id))).map(shuffledCard);
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
for(const topic of new Set(DATA.cards.map(q=>q.topic))) $('topic').add(new Option(topic,topic));
$('topic').addEventListener('change',()=>start());
start();
</script>
