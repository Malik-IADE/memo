</main><noscript><p>Active JavaScript pour répondre au partiel.</p></noscript><script>const DATA={"semester":1,"ue":"3.3","title":"Les modalités spécifiques d'anesthésie, réanimation et urgence dans les différents types d'intervention","cards":[{"id":"c15","num":1,"page":1,"kind":"QCM","title":"Parmi les propositions concernant les contre -indications de la coelioscopie, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Chirurgie : coelioscopie","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf"]],"options":["l'insuffisance respiratoire chronique","l'hypertension intracrânienne","le reflux gastro-œsophagien","l'hypertension portale","l'état de choc non compensé"],"correct":"BE","note":"Le pneumopéritoine remonte le diaphragme, réduit la compliance et la CRF et favorise des atélectasies. L’absorption de CO₂ peut augmenter la PaCO₂.","instruction":"Cocher les propositions exactes.","sourcePage":5},{"id":"c22","num":2,"page":1,"kind":"QUESTION","title":"au d écours d'une cholécystectomie sous coelioscopie, Monsieur P, présente les si gnes d'une embolie. Enoncer les signes cliniques et paracliniques évoquant une embolie gazeuse. définir le mécanisme de l'embolie gazeuse. énoncer les actions immédiates","session":"2021-2023","topic":"Chirurgie : coelioscopie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3 (p. 57, à consulter)","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf#page=57"]],"options":[],"correct":"","note":"","answer":["Une embolie gazeuse sous cœlioscopie peut provoquer chute brutale de PetCO₂, hypotension, désaturation et collapsus.","Alerter, interrompre l’insufflation et demander l’exsufflation. Oxygéner et soutenir la circulation selon le tableau."],"sourcePage":5},{"id":"c34","num":3,"page":1,"kind":"QUESTION","title":"citer les facteurs majorant les complications respiratoires, induite par la chirurgie abdominale en post-opératoire","session":"2021-2023","topic":"Chirurgie : digestive","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3 (p. 16, à consulter)","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf#page=16"]],"options":[],"correct":"","note":"","answer":["Après chirurgie abdominale, douleur et dysfonction diaphragmatique diminuent volumes pulmonaires et toux. Prévenir atélectasies et complications par analgésie, mobilisation et soutien respiratoire adapté.","Le site sus-mésocolique, la douleur, le terrain respiratoire, l’obésité et les opioïdes majorent le risque."],"sourcePage":7},{"id":"c38","num":4,"page":1,"kind":"QCM","title":"Parmi les propositions concernant l’irrigation avec du sérum physiologique lors d'une hystéroscopie, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Chirurgie : gynecologique","points":1,"ungraded":false,"figures":[],"refs":[["Service public · Délais de l’IVG","https://www.service-public.fr/particuliers/actualites/A15545"]],"options":["Le volume maximum de sérum physiologique à utiliser e st de 12 litres","la durée maximum de l'irrigation au sérum physiologique e st fixée à une heure","l'irrigation au sérum physiologique entraîne une ouverture des vaisseaux endométriaux","l'irrigation au sérum physiologique entraîne une absorption extravasculaire","l'irrigation au sérum physiologique entraîne une hypernatrémie"],"correct":"CD","note":"","instruction":"Cocher les propositions exactes.","sourcePage":8},{"id":"c59","num":5,"page":1,"kind":"QCM","title":"Parmi les propositions concernant la cimentation d'une prothèse totale de hanche, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Chirurgie : orthopedie","points":1,"ungraded":false,"figures":[],"refs":[["Association of Anaesthetists · Ciment orthopédique","https://associationofanaesthetists-publications.onlinelibrary.wiley.com/doi/10.1111/anae.13036"]],"options":["le ciment est contre-indiqué chez les patients présentant une ostéoporose","la prévention de l'embolie au ciment est réalisée par la mise en place d'un drain de Redon dans la cavité médullaire par le chirurgien","il s'agit d'un temps douloureux de la chirurgie","l'administration de N2O est arrêtée lors du scellement de la prothèse","l'utilisation de ciment est responsable de troubles de rythme","l'administration de N2O est arrêtée au moment du scellement de la prothèse"],"correct":"CE","note":"Anticiper embolisation au ciment : communication avant scellement, surveillance rapprochée de la PA, SpO₂ et PetCO₂, soutien hémodynamique et oxygénation. Signes : hypotension, chute de PetCO₂, désaturation ou perte de conscience.","instruction":"Cocher les propositions exactes.","sourcePage":23},{"id":"c70","num":6,"page":2,"kind":"QCM","title":"Parmi les propositions concernant La prise en charge anesthésique lors d'une chirurgie maxillo-faciale type LEFORT, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Chirurgie : plastique","points":1,"ungraded":false,"figures":[],"refs":[],"options":["l'extubation sera systématiquement réalisée en SSPI","l'intubation nasotrachéale sera systématiquement réalisée","l'ablation du packing avant le blocage du maxillaire","l'intubation sera réalisée avec une sonde armée","la pose d'une sonde gastrique sera systématique"],"correct":"CD","note":"En chirurgie faciale, l’accès aux voies aériennes est partagé. Anticiper hémorragie, aspiration de sang, œdème, obstruction et NVPO.","instruction":"Cocher les propositions exactes.","sourcePage":25},{"id":"c80","num":7,"page":2,"kind":"QCM","title":"Parmi les propositions concernant Les conséquences du TURP syndrome, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Chirurgie : urologie","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Chirurgie urologique avec note","../../../cours/S1/3.3/3.3%20Chirurgie%20urologique%20avec%20note.pdf"]],"options":["une hyper osmolarité","une hyponatrémie","une hypoammoniémie","une hyperglycémie","une hypothermie"],"correct":"BE","note":"Néphrectomie : anticiper le saignement, protéger la fonction rénale restante et surveiller les appuis. En lombotomie, vérifier le billot, la ventilation, la sonde et la tolérance hémodynamique.","instruction":"Cocher les propositions exactes.","sourcePage":32},{"id":"c88","num":8,"page":2,"kind":"QUESTION","title":"énoncer les actions immédiates à mettre en place dans le cas d'un TURP syndrome","session":"2021-2023","topic":"Chirurgie : urologie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Chirurgie urologique avec note (p. 55, à consulter)","../../../cours/S1/3.3/3.3%20Chirurgie%20urologique%20avec%20note.pdf#page=55"]],"options":[],"correct":"","note":"","answer":["Alerter et faire interrompre la résection et l’irrigation. Évaluer ventilation, circulation, état neurologique, sodium et bilan hydrique.","Traiter la surcharge et les symptômes selon le tableau. Une hyponatrémie aiguë symptomatique sévère nécessite une correction surveillée."],"sourcePage":33},{"id":"c91","num":9,"page":2,"kind":"QCM","title":"Parmi les propositions concernant la prise en soins anesthésique des patients addictifs, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Terrain : addictif","points":0,"ungraded":true,"figures":[],"refs":[],"options":["elle consiste à administrer des hypnotiques en prémédication","elle consiste à éviter de débuter un sevrage préopératoire","elle consiste à augmenter les besoins morphiniques","elle consiste à utiliser la nalbuphine en post-opératoire","elle consiste à proposer systématiquement des benzodiazépines"],"correct":"","note":"La tolérance aux opioïdes peut augmenter les besoins chez certains patients, mais dépend de la substance et des traitements en cours. Éviter la prémédication ou les antagonistes partiels systématiques. Identifier les substances, la dernière prise, l’intoxication, le sevrage et les comorbidités. Adapter la stratégie d’analgésie et surveiller les interactions et le risque respiratoire.","instruction":"Cocher les propositions exactes.","sourcePage":37},{"id":"c92","num":10,"page":2,"kind":"QCM","title":"Parmi les propositions concernant l'addiction, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Terrain : addictif","points":1,"ungraded":false,"figures":[],"refs":[],"options":["c'est un besoin maîtrisé, de consommer une substance en connaissant ses dangers","c'est l'apparition de manifestation s cliniques dangereuses lors de l'arrêt de la prise de la substance","c'est l'apparition d'une dépendance irréversible","c'est la nécessité d'augmenter les doses de substance consommée pour obtenir un même effet","c'est l'apparition d'un système de récompense (dopamine)"],"correct":"DE","note":"Identifier les substances, la dernière prise, l’intoxication, le sevrage et les comorbidités. Adapter la stratégie d’analgésie et surveiller les interactions et le risque respiratoire.","instruction":"Cocher les propositions exactes.","sourcePage":37},{"id":"c115","num":11,"page":3,"kind":"QCM","title":"Parmi les propositions concernant les critères de ventilation difficile, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Terrain : estomac plein","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":["le sifflement est un critère de ventilation difficile","la rétrognathie est un critère de ventilation difficile","les petites mains de l'opérateur sont un critère de ventilation difficile","la protrusion mandibulaire est un critère de ventilation difficile","L'IMC>25 est un critère de ventilation difficile"],"correct":"BE","note":"Évaluer l’inhalation d’après le jeûne, la nature des ingesta, l’urgence, le reflux, l’occlusion et les troubles de vidange. Les liquides clairs et les repas ne suivent pas les mêmes délais.","instruction":"Cocher les propositions exactes.","sourcePage":45},{"id":"c116","num":12,"page":3,"kind":"QCM","title":"Parmi les propositions concernant les critères de la décurarisation complète, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Terrain : estomac plein","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":["La reprise de la ventilation spontanée","l'apparition de 4 réponses au train de 4","l'ouverture des yeux","la possibilité pour le patient de lever la tête pendant plus de 5 secondes","un ratio T4/T1>90%"],"correct":"E","note":"Évaluer l’inhalation d’après le jeûne, la nature des ingesta, l’urgence, le reflux, l’occlusion et les troubles de vidange. Les liquides clairs et les repas ne suivent pas les mêmes délais.","instruction":"Cocher les propositions exactes.","sourcePage":45},{"id":"c117","num":13,"page":3,"kind":"QCM","title":"Parmi les propositions concernant les règles du jeûne, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Terrain : estomac plein","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":["suite à un repas léger (solide) il est nécessaire de respecter un jeune de 6 heures avant l'intervention","suite à l'absorption de liquide non clair (lait, jus de fruits), il est nécessaire de respecter un jeune de 2h avant l'intervention","le tabac est autorisé si le jeûne est de minimum 2h avant l'intervention","suite à l'absorption de liquide clair sucré (eau, thé, Café) il est nécessaire de respecter un jeune jusqu'à 2h avant l'intervention","suite à l'absorption de liquide clair sucré (eau, thé, café, jusqu’à 400 ml), il est nécessaire de respecter un jeune jusqu'à 6h avant l'intervention"],"correct":"AD","note":"Évaluer l’inhalation d’après le jeûne, la nature des ingesta, l’urgence, le reflux, l’occlusion et les troubles de vidange. Les liquides clairs et les repas ne suivent pas les mêmes délais.","instruction":"Cocher les propositions exactes.","sourcePage":45},{"id":"c128","num":14,"page":3,"kind":"QUESTION","title":"citer 10 facteurs de risque d'inhalation bronchique chez un patient « estomac plein »","session":"2021-2023","topic":"Terrain : estomac plein","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note (p. 106, à consulter)","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf#page=106"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Rechercher jeûne, nature du dernier repas, reflux, obstruction, gastroparésie diabétique, opioïdes, grossesse, urgence, altération de conscience et difficulté d’accès aux voies aériennes.","L’inhalation survient si le contenu régurgité franchit le larynx alors que les réflexes protecteurs sont altérés."],"sourcePage":45},{"id":"c129","num":15,"page":3,"kind":"QUESTION","title":"décrire toutes les étapes de l'induction à séquence rapide chez un patient « estomac plein »","session":"2021-2023","topic":"Terrain : estomac plein","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note (p. 2, à consulter)","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf#page=2"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Préparer aspiration, préoxygénation, matériel d’intubation et stratégie de secours. L’induction séquence rapide utilise un hypnotique et un curare adapté, puis vérification par capnographie.","La pression cricoïdienne, si utilisée, doit être relâchée lorsqu’elle gêne la ventilation ou l’intubation."],"sourcePage":46},{"id":"c130","num":16,"page":3,"kind":"QUESTION","title":"citer les critères recherch és par le médecin anesthésique lors de la consultation d'anesthésie chez un patient considéré comme « estomac plein »","session":"2021-2023","topic":"Terrain : estomac plein","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note (p. 24, à consulter)","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf#page=24"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Rechercher jeûne, nature du dernier repas, reflux, obstruction, gastroparésie diabétique, opioïdes, grossesse, urgence, altération de conscience et difficulté d’accès aux voies aériennes.","L’inhalation survient si le contenu régurgité franchit le larynx alors que les réflexes protecteurs sont altérés."],"sourcePage":46},{"id":"c143","num":17,"page":3,"kind":"QUESTION","title":"Vous êtes IADE au bloc de chirurgie orthopédique. vous vous occupez de Monsieur R, qui doit bénéficier, ce jour, de la pose d'une prothèse totale de hanche gauche sous anesthésie générale avec intubation orotrachéale. la consultation d'anesthésie révèle la présence d'une hyp ertension artérielle, traitée et équilibrée par Triatec 1,25 mg par jour. énoncer les différentes actions que vous allez mettre en place afin de prévenir et de traiter l'hypotension artérielle peropératoire.","session":"2021-2023","topic":"Terrain : hypertendu","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Patient HTA avec notes (p. 55, à consulter)","../../../cours/S1/3.3/3.3%20Patient%20HTA%20avec%20notes.pdf#page=55"]],"options":[],"correct":"","note":"","answer":["Prévenir l’hypotension par titration, évaluation des pertes, volémie et monitorage. Si elle survient, vérifier la mesure et rechercher vasodilatation, hypovolémie, saignement, trouble du rythme ou autre cause. Adapter remplissage et vasopresseur avec le MAR."],"sourcePage":56},{"id":"c149","num":18,"page":4,"kind":"QCM","title":"Parmi les propositions concernant l’insuffisant cardiaque sévère, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Terrain : insuffisant cardiaque","points":1,"ungraded":false,"figures":[],"refs":[],"options":["son débit cardiaque, physiologiquement est abaissé","sa précharge, physiologiquement est augmenté","sa précharge est fortement diminuée par l'injection de sufentanil","sa précharge est diminuée par l'injection du propofol","sa précharge est diminuée par l'injection de kétamine"],"correct":"ABD","note":"Évaluer les symptômes, la fraction d’éjection et la congestion. Préserver l’équilibre apport-demande en oxygène, éviter hypotension, tachycardie et surcharge. Le monitorage dépend du risque.","instruction":"Cocher les propositions exactes.","sourcePage":58},{"id":"c150","num":19,"page":4,"kind":"QCM","title":"Parmi les propositions concernant l’insuffisance cardiaque (IC), laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Terrain : insuffisant cardiaque","points":1,"ungraded":false,"figures":[],"refs":[],"options":["l’IC est l'incapacité de la pompe cardiaque à satisfaire les besoins de l'organisme","l’IC diastolique est la capacité du cœur à se remplir","l’IC systolique est la capacité du cœur à éjecter","l’IC se caractérise par un ventricule droit endommagé et dilaté","l’IC droite entraîne une hépatomégalie"],"correct":"AE","note":"Évaluer les symptômes, la fraction d’éjection et la congestion. Préserver l’équilibre apport-demande en oxygène, éviter hypotension, tachycardie et surcharge. Le monitorage dépend du risque.","instruction":"Cocher les propositions exactes.","sourcePage":58},{"id":"c151","num":20,"page":4,"kind":"QCM","title":"Parmi les propositions concernant les précautions à prendre chez un patient porteur d’un pacemaker (PM), laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Terrain : insuffisant cardiaque","points":1,"ungraded":false,"figures":[],"refs":[],"options":["mettre en place la plaque du générateur haute fréquence le plus loin de la zone opératoire","disposer systématiquement d'un aimant dans la salle d'intervention","disposer d'un générateur haute fréquence","utiliser la noradrénaline en première intention","mettre les patchs de défibrillateur à moins de 5 cm du dispositif PM"],"correct":"B","note":"Évaluer les symptômes, la fraction d’éjection et la congestion. Préserver l’équilibre apport-demande en oxygène, éviter hypotension, tachycardie et surcharge. Le monitorage dépend du risque.","instruction":"Cocher les propositions exactes.","sourcePage":58},{"id":"c165","num":21,"page":4,"kind":"QUESTION","title":"vous devez endormir un patient in suffisant respiratoire, devant bénéficier d'une hépatectomie. citer les précautions à prendre de l'induction à l'entretien anesthésique du patient.","session":"2021-2023","topic":"Terrain : insuffisant hepatique et/ou cirrhotique","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["Évaluer l’atteinte respiratoire et le risque de saignement. Préoxygéner, protéger le poumon et éviter hypoxémie et hypercapnie non souhaitée.","Coordonner la stratégie de remplissage et de monitorage avec la chirurgie. Prévoir une surveillance adaptée après extubation."],"sourcePage":60},{"id":"c172","num":22,"page":4,"kind":"QUESTION","title":"Indiquer les répercussions physiopat hologiques de l'insuffisance rénale chronique. Pour chaque répercussion donner un exemple.","session":"2021-2023","topic":"Terrain : insuffisant renal","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["Exemples : hyperkaliémie et arythmie, surcharge et œdème pulmonaire, anémie par déficit d’EPO, trouble phosphocalcique et atteinte osseuse, acidose métabolique et accumulation de médicaments."],"sourcePage":61},{"id":"c173","num":23,"page":4,"kind":"QUESTION","title":"citer deux agents de choix pour les hypnotiques, les morphiniques et les m yorelaxants pour l'anesthésie d'un patient insuffisant rénal chronique 3.3.2)","session":"2021-2023","topic":"Terrain : insuffisant renal","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["Le choix dépend de la stabilité et des métabolites. Propofol ou étomidate peuvent être envisagés selon le contexte. Le rémifentanil est hydrolysé par des estérases non spécifiques. Les métabolites de morphine s’accumulent. Atracurium et cisatracurium ont une élimination largement indépendante du rein."],"sourcePage":61},{"id":"c186","num":24,"page":5,"kind":"QCM","title":"Parmi les propositions concernant le syndrome obstructif, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Terrain : insuffisant respiratoire / bpco","points":1,"ungraded":false,"figures":[],"refs":[["GOLD · BPCO","https://goldcopd.org/2026-gold-report-and-pocket-guide/"]],"options":["il se caractérise par une limitation de l'expansion pulmonaire","il se caractérise par une augmentation du calibre des bronches","il se traduit par une diminution des résistances aériennes","il peut être lié à l'asthme","il peut être lié à une maladie en rapport avec le tabagisme"],"correct":"DE","note":"Distinguer obstruction (rapport VEMS/CV abaissé) et restriction (CPT abaissée). Pour la BPCO, rechercher exacerbation, encombrement et rétention de CO₂.","instruction":"Cocher les propositions exactes.","sourcePage":64},{"id":"c187","num":25,"page":5,"kind":"QCM","title":"Parmi les propositions concernant la spondylarthrite ankylosante, laquelle ou lesquelles est (sont) vraie(s)?","session":"2021-2023","topic":"Terrain : insuffisant respiratoire / bpco","points":1,"ungraded":false,"figures":[],"refs":[["GOLD · BPCO","https://goldcopd.org/2026-gold-report-and-pocket-guide/"]],"options":["Elle est plus fréquente chez la femme","elle entraîne une atteinte articulaire axiale","elle entraîne une modification ligamentaire","elle est déformante","elle entraîne une insuffisance respiratoire restrictive"],"correct":"BCDE","note":"Distinguer obstruction (rapport VEMS/CV abaissé) et restriction (CPT abaissée). Pour la BPCO, rechercher exacerbation, encombrement et rétention de CO₂.","instruction":"Cocher les propositions exactes.","sourcePage":64},{"id":"c193","num":26,"page":5,"kind":"QUESTION","title":"définir l'asthme. citer les deux types d'asthme possible. décrire la physiopathologie de la crise d'asthme.","session":"2021-2023","topic":"Terrain : insuffisant respiratoire / bpco","points":2,"ungraded":false,"figures":[],"refs":[["GOLD · BPCO","https://goldcopd.org/2026-gold-report-and-pocket-guide/"]],"options":[],"correct":"","note":"","answer":["Asthme : inflammation chronique et hyperréactivité bronchique avec obstruction expiratoire variable. On distingue notamment des phénotypes allergique et non allergique.","La crise associe bronchoconstriction, œdème et sécrétions, avec piégeage expiratoire."],"sourcePage":64},{"id":"c194","num":27,"page":5,"kind":"QUESTION","title":"citer les intérêts de l'extubation chez un patient en insuffisance respiratoire en pression positive","session":"2021-2023","topic":"Terrain : insuffisant respiratoire / bpco","points":2,"ungraded":false,"figures":[],"refs":[["GOLD · BPCO","https://goldcopd.org/2026-gold-report-and-pocket-guide/"]],"options":[],"correct":"","note":"","answer":["La pression positive non invasive peut améliorer les échanges, réduire le travail respiratoire et maintenir le recrutement chez des patients sélectionnés.","En contexte postopératoire, vérifier état de conscience, protection des voies aériennes et tolérance. Ne pas retarder une réintubation nécessaire."],"sourcePage":65},{"id":"c195","num":28,"page":5,"kind":"QUESTION","title":"citer les bénéfices de la ventilation non invasive","session":"2021-2023","topic":"Terrain : insuffisant respiratoire / bpco","points":2,"ungraded":false,"figures":[],"refs":[["GOLD · BPCO","https://goldcopd.org/2026-gold-report-and-pocket-guide/"]],"options":[],"correct":"","note":"","answer":["La pression positive non invasive peut améliorer les échanges, réduire le travail respiratoire et maintenir le recrutement chez des patients sélectionnés.","En contexte postopératoire, vérifier état de conscience, protection des voies aériennes et tolérance. Ne pas retarder une réintubation nécessaire."],"sourcePage":65},{"id":"c196","num":29,"page":5,"kind":"QUESTION","title":"citer les signes du bronchospasme chez le patient intubé ventilé au bloc opératoire","session":"2021-2023","topic":"Terrain : insuffisant respiratoire / bpco","points":2,"ungraded":false,"figures":[],"refs":[["GOLD · BPCO","https://goldcopd.org/2026-gold-report-and-pocket-guide/"]],"options":[],"correct":"","note":"","answer":["Signes : sibilants ou silence auscultatoire, hausse de pression de crête, débit expiratoire prolongé et pente capnographique oblique.","Alerter, oxygéner, vérifier sonde et circuit et rechercher l’anaphylaxie. Administrer un bronchodilatateur selon la cause et allonger l’expiration."],"sourcePage":65},{"id":"c197","num":30,"page":5,"kind":"QUESTION","title":"Vous réalisez avec le MAR l'induction de Monsieur Z ayant pour antécédent un tabagisme actif. vous avez réalisé l'intubation du patient avec succès mais, au bout de 2 minutes, vous observez la courbe de capnogramme ci-dessous. que vous évoque-t-elle? énoncer vos actions immédiates.","session":"2021-2023","topic":"Terrain : insuffisant respiratoire / bpco","points":2,"ungraded":false,"figures":["3.3-65-1"],"refs":[["GOLD · BPCO","https://goldcopd.org/2026-gold-report-and-pocket-guide/"]],"options":[],"correct":"","note":"","answer":["La montée expiratoire lente en « aileron de requin » évoque une obstruction bronchique, notamment un bronchospasme. Vérifier circuit et sonde, sécrétions, pressions et auscultation.","Alerter, oxygéner, adapter la ventilation avec temps expiratoire suffisant et traiter selon la cause."],"sourcePage":65}],"figures":{"3.3-65-1":"/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgICAgMCAgIDAwMDBAYEBAQEBAgGBgUGCQgKCgkICQkKDA8MCgsOCwkJDRENDg8QEBEQCgwSExIQEw8QEBD/2wBDAQMDAwQDBAgEBAgQCwkLEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBD/wAARCAERAlQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDzqiioZpvJSoAmp1c7eeLdN019l1OkP+/UKePNDdf+PuF/+B0AdRRXOp420f8A5/of++6d/wAJnof/AD/JVgdHRXOf8Jno/wDBdQv/AMDqx/wlWlf8/af990AbdFYv/CT6V/z9w/8AfdOTxJpz/wDLegDborH/AOEi03/n6T/vupf7e0p/+X6FP+B0AadFZ/8AbFj/AATp/wB90f2xY/8APdKANKiqX9sWP/PQ0Jqtq/8Ay3oAu7/noql/atj/AKvz/nepvt9p/wA90oAnp9Vft9p/z3Snf2haf89KALFP3+1VPtkH/PRP++6elzA/8aUAWKdVfzk/57pS/aoP+ekdAEtFM+0p/fSmecn/AD0oAmeijzk/56Uzzk/56UAPp2/2qLclP3JQA6m0bko+SgAp1Np2/wBqAG7PenU3f7Ub/agB336KbTqAG0U75 const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'

    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {

}

function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};

function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Évalue ta réponse à partir des éléments du corrigé.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0,ungraded:q.ungraded};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values.slice(0,q.options.length)){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(!q.ungraded&&q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  if (isOpen(q)) {
    panel.innerHTML=`${answerBox(q)}${sources(q)}${q.ungraded?'<p class="small">Question hors barème.</p>':rubricPanel(q,grade)+assessmentControls(q,grade)}${sourceCopy(q)}`;
    return;
  }
  const answers=q.correct.split('').filter(Boolean).map(letter=>q.options[values.indexOf(letter)]);
  const key=`<strong>${q.ungraded?'Hors barème':format(grade.autoScore)+' / 1 point'}</strong><div class="answer-key" style="margin-top:10px"><h3>${q.ungraded?'Éléments pour vérifier':'Correction'}</h3>${answers.length?`<ul class="correct-options">${answers.map(a=>`<li>${escape(a)}</li>`).join('')}</ul>`:''}${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
  panel.innerHTML=key+sources(q)+sourceCopy(q);
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return !grade.ungraded&&(grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max)));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const adjusted=list.some(g=>g.review && g.review!=='blank' || g.analysis?.some(c=>c.override!==null));
  if(adjusted) $('summary').textContent+=' Note ajustée.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(g=>g.ungraded||isComplete(g));
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!q.ungraded&&!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function shuffledCard(q) {
  if (!isChoice(q)) return q;
  const indexes=q.options.map((_,i)=>i);
  for(let i=indexes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
  }
  const correct=indexes.map((index,i)=>q.correct.includes(values[index])?values[i]:'').join('');
  return {...q,options:indexes.map(i=>q.options[i]),correct};
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!g.ungraded&&!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>(!$('topic').value||q.topic===$('topic').value)&&(!keep||keep.has(q.id))).map(shuffledCard);
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
for(const topic of new Set(DATA.cards.map(q=>q.topic))) $('topic').add(new Option(topic,topic));
$('topic').addEventListener('change',()=>start());
start();
</script>

<script>window.MEMO_QUIZ={"id": "annales-nf/S1/3.3-2021-2023", "href": "annales-nf/S1/3.3-2021-2023.html", "collection": "annales-nf", "sem": "S1", "ue": "3.3", "periode": "2021-2023", "titre": "Modalités spécifiques — 2021-2023"};</script>
<script>
/* Mémo : enregistre la note obtenue, pour l'écran « Mes résultats » de l'app.
   Même origine que l'app, donc même localStorage. Une tentative par correction ;
   si la note est ajustée à la main ensuite, la tentative en cours est mise à jour. */
(function () {
  var CLE = 'memo-resultats', INFO = window.MEMO_QUIZ;
  if (!INFO) return;
  var resultats = document.getElementById('results'), score = document.getElementById('score');
  if (!resultats || !score) return;
  var tentative = null;

  function lire() { try { return JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { return []; } }
  function noteDe(txt) {
    var m = String(txt).match(/(-?[\d  ]+(?:[.,]\d+)?)\s*\/\s*20/);
    return m ? parseFloat(m[1].replace(/[  ]/g, '').replace(',', '.')) : null;
  }
  function enregistrer() {
    if (resultats.hidden) return;
    var note = noteDe(score.textContent);
    if (note === null || !isFinite(note)) return;
    var liste = lire();
    var ligne = tentative && liste.find(function (x) { return x.cle === tentative; });
    if (!ligne) {
      tentative = INFO.id + '#' + Date.now();
      ligne = { cle: tentative, id: INFO.id, href: INFO.href, collection: INFO.collection,
        sem: INFO.sem, ue: INFO.ue, periode: INFO.periode, titre: INFO.titre };
      liste.push(ligne);
    }
    ligne.note = Math.round(note * 100) / 100;
    ligne.date = new Date().toISOString();
    try { localStorage.setItem(CLE, JSON.stringify(liste.slice(-300))); } catch (e) {}
  }

  new MutationObserver(enregistrer).observe(score, { childList: true, characterData: true, subtree: true });
  new MutationObserver(enregistrer).observe(resultats, { attributes: true, attributeFilter: ['hidden'] });
  // « Tout recommencer » : la prochaine correction comptera comme une nouvelle tentative.
  document.getElementById('reset') && document.getElementById('reset').addEventListener('click', function () { tentative = null; });
})();
</script>
