</main><noscript><p>Active JavaScript pour répondre au partiel.</p></noscript><script>const DATA={"semester":1,"ue":"3.3","title":"Les modalités spécifiques d'anesthésie, réanimation et urgence dans les différents types d'intervention","cards":[{"id":"c6","num":1,"page":1,"kind":"QUESTION","title":"madame Simon va bénéficier d'une intervention de la cataracte en chirurgie ambulato ire. Quels sont les cinq critères pour intégrer le circuit ambulatoire?","session":"2020-2022","topic":"Chirurgie : ambulatoire","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["Évaluer compatibilité du geste et du terrain, autonomie, compréhension des consignes, organisation du retour avec accompagnement, et possibilité de contacter les soins en cas de problème."],"sourcePage":2},{"id":"c14","num":2,"page":1,"kind":"QCM","title":"Parmi les propositions concernant Les contre-indications à la réalisation d’une coeliochirurgie, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022R","topic":"Chirurgie : coelioscopie","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf"]],"options":["L'hypertension intracrânienne","la présence d'un emphysème bulleux","l'urgence","la présence d'un pneumothorax","l'obésité"],"correct":"AD","note":"Le pneumopéritoine remonte le diaphragme, réduit la compliance et la CRF et favorise des atélectasies. L’absorption de CO₂ peut augmenter la PaCO₂.","instruction":"Cocher les propositions exactes.","sourcePage":5},{"id":"c21","num":3,"page":1,"kind":"QUESTION","title":"vous êtes IADE au bloc opératoire, vous avez e n prise en soins une patiente qui va bénéficier d'une chirurgie des trompes et de l'ovaire sous coelioscopie. énoncer les retentissements hémodynamiques pour cette patiente.","session":"2020-2022","topic":"Chirurgie : coelioscopie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3 (p. 2, à consulter)","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf#page=2"]],"options":[],"correct":"","note":"","answer":["Anticiper effets ventilatoires et circulatoires du pneumopéritoine et du déclive, sécuriser tube et appuis, surveiller capnographie, pressions et hémodynamique. Adapter analgésie et prévention des NVPO."],"sourcePage":5},{"id":"c23","num":4,"page":1,"kind":"QUESTION","title":"énoncer les différentes actions mises en place par l'infirmière anesthésiste afin de prévenir le risque d'hypotension artérielle lors d’une cœlioscopie","session":"2020-2022R","topic":"Chirurgie : coelioscopie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3 (p. 56, à consulter)","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf#page=56"]],"options":[],"correct":"","note":"","answer":["Prévenir une hypotension par évaluation de la volémie, titration anesthésique et surveillance. Vérifier le retentissement de l’insufflation et du positionnement, puis traiter selon le mécanisme par ajustement anesthésique, remplissage ciblé ou vasopresseur."],"sourcePage":5},{"id":"c24","num":5,"page":1,"kind":"QUESTION","title":"expliquer les différents mécanismes pouvant être à l'origine de modifications hémodynamique lors d'une cœlioscopie","session":"2020-2022R","topic":"Chirurgie : coelioscopie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3 (p. 27, à consulter)","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf#page=27"]],"options":[],"correct":"","note":"","answer":["Une pression intra-abdominale élevée peut réduire le retour veineux, augmenter les résistances systémiques et modifier le débit cardiaque. Le résultat dépend de la volémie et de la posture. L’absorption de CO₂ et la stimulation sympathique modifient aussi la réponse."],"sourcePage":5},{"id":"c27","num":6,"page":1,"kind":"QCM","title":"Parmi les propositions concernant l'incision Pfannenstiel, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Chirurgie : digestive","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf"]],"options":["c'est une incision selon une ligne médiane","c'est une incision transversale basse","c'est une incision transversale haute","c'est une incision du péritoine selon une ligne médiane","c'est une incision des muscles droits abdominaux"],"correct":"B","note":"Après chirurgie abdominale, douleur et dysfonction diaphragmatique diminuent volumes pulmonaires et toux. Prévenir atélectasies et complications par analgésie, mobilisation et soutien respiratoire adapté.","instruction":"Cocher les propositions exactes.","sourcePage":6},{"id":"c28","num":7,"page":2,"kind":"QCM","title":"Parmi les propositions concernant la péritonite en chirurgie digestive, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Chirurgie : digestive","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf"]],"options":["la péritonite est une urgence chirurgicale","la péritonite a pour conséquence une perforation viscérale","la péritonite majore un risque de mortalité","la péritonite a pour conséquence un risque de choc septique","la péritonite est souvent d'origine appendiculaire"],"correct":"ACDE","note":"Après chirurgie abdominale, douleur et dysfonction diaphragmatique diminuent volumes pulmonaires et toux. Prévenir atélectasies et complications par analgésie, mobilisation et soutien respiratoire adapté.","instruction":"Cocher les propositions exactes.","sourcePage":6},{"id":"c29","num":8,"page":2,"kind":"QCM","title":"Parmi les propositions concernant La chirurgie abdominale, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022R","topic":"Chirurgie : digestive","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf"]],"options":["elle nécessite un bloc neuromusculaire avec pour objectif de 2 réponse au TOF (train de quatre)","elle nécessite une analgésie profonde","L’iléus post-opératoire est majoré par les agents anesthésiques","la capacité vitale est diminuée en post-opératoire","la fonction diaphragmatique est altérée en post-opératoire"],"correct":"BDE","note":"Après chirurgie abdominale, douleur et dysfonction diaphragmatique diminuent volumes pulmonaires et toux. Prévenir atélectasies et complications par analgésie, mobilisation et soutien respiratoire adapté.","instruction":"Cocher les propositions exactes.","sourcePage":6},{"id":"c32","num":9,"page":2,"kind":"QUESTION","title":"Énoncer les retentissements respiratoires lors d'une chirurgie dig estive sous laparotomie.","session":"2020-2022","topic":"Chirurgie : digestive","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3 (p. 16, à consulter)","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf#page=16"]],"options":[],"correct":"","note":"","answer":["Après chirurgie abdominale, douleur et dysfonction diaphragmatique diminuent volumes pulmonaires et toux. Prévenir atélectasies et complications par analgésie, mobilisation et soutien respiratoire adapté.","Le site sus-mésocolique, la douleur, le terrain respiratoire, l’obésité et les opioïdes majorent le risque."],"sourcePage":7},{"id":"c33","num":10,"page":2,"kind":"QUESTION","title":"citer les retentissements respiratoires induit par la chirurgie digestive sus mésocolique en per et post-opératoire","session":"2020-2022R","topic":"Chirurgie : digestive","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3 (p. 16, à consulter)","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf#page=16"]],"options":[],"correct":"","note":"","answer":["Après chirurgie abdominale, douleur et dysfonction diaphragmatique diminuent volumes pulmonaires et toux. Prévenir atélectasies et complications par analgésie, mobilisation et soutien respiratoire adapté.","Le site sus-mésocolique, la douleur, le terrain respiratoire, l’obésité et les opioïdes majorent le risque."],"sourcePage":7},{"id":"c35","num":11,"page":2,"kind":"QCM","title":"Parmi les propositions concernant les actes chirurgicaux rencontrés en gynécologie, laquelle ou lesquelles est (sont) vraie(s)?","session":"2018-2020, 2020 -2022R","topic":"Chirurgie : gynecologique","points":0,"ungraded":true,"figures":[],"refs":[["Service public · Délais de l’IVG","https://www.service-public.fr/particuliers/actualites/A15545"]],"options":["Pour les myomes intra-cavitaires, la coelioscopie est préconisée","L’hystérectomie subtotale correspond à l’ablation de l’utérus et du col de l’utérus","Pour une hystéroscopie opératoire sous rachianesthésie, le niveau sensitif doit être à D8","Lors d’une grossesse extra-utérine, la salpingectomie est un traitement conservateur","Pour une IVG, le terme légal est de moins de 14 semaines d'aménorrhée"],"correct":"","note":"Les propositions mêlent données anciennes, technique chirurgicale et niveau de bloc dépendant du geste. En France, l’IVG instrumentale est possible jusqu’à la fin de la 14e semaine de grossesse, soit 16 SA.","instruction":"Cocher les propositions exactes.","sourcePage":8},{"id":"c37","num":12,"page":2,"kind":"QCM","title":"Parmi les propositions concernant l'anesthésie en chirurgie gynécologique dans le cadre de l'interruption volontaire de grossesse (IVG), laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Chirurgie : gynecologique","points":1,"ungraded":false,"figures":[],"refs":[["Service public · Délais de l’IVG","https://www.service-public.fr/particuliers/actualites/A15545"]],"options":["la patiente peut présenter une rétention trophoblastique","le terme légal d'une IVG est avant la 12e semaine d'aménorrhée","la patiente peut présenter une déchirure cervicale","la patiente présentant un rhésus positif reçoit une injection d'immunoglobuline anti -D","la patiente bénéficie d'une induction à séquence rapide de façon systématique"],"correct":"AC","note":"Le délai légal de l’IVG instrumentale est la fin de la 14e semaine de grossesse, soit 16 SA. La stratégie d’induction dépend du risque d’inhalation.","instruction":"Cocher les propositions exactes.","sourcePage":8},{"id":"c42","num":13,"page":3,"kind":"QCM","title":"Parmi les propositions concernant L’anesthésie Hors bloc, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Chirurgie : hors bloc","points":1,"ungraded":false,"figures":[],"refs":[],"options":["une intubation orotrachéale e st systématiquement réalisée pour une anesthésie hors bloc","Lors d'une anesthésie hors bloc une intubation orotrachéale est autorisée","Une sédation est privilégiée pour une anesthésie hors bloc","une sédation est systématique pour une anesthésie hors bloc","lors d'une anesthésie hors bloc la Succinylcholine est systématiquement utilisée"],"correct":"C","note":"","instruction":"Cocher les propositions exactes.","sourcePage":9},{"id":"c43","num":14,"page":3,"kind":"QCM","title":"Parmi les propositions concernant L'anesthésie hors bloc, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Chirurgie : hors bloc","points":1,"ungraded":false,"figures":[],"refs":[],"options":["une anesthésie hors bloc se réalise sans visite pré-anesthésique","Une anesthésie hors bloc se réalise sans consultation d'anesthésie","une anesthésie hors bloc nécessite une visite pré-anesthésique","une anesthésie hors bloc nécessite une consultation d'anesthésie","une anesthésie hors bloc est réalisée systématiquement en chirurgie programmée"],"correct":"CD","note":"","instruction":"Cocher les propositions exactes.","sourcePage":9},{"id":"c44","num":15,"page":3,"kind":"QCM","title":"Parmi les propositions concernant l'anesthésie hors bloc, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022R","topic":"Chirurgie : hors bloc","points":1,"ungraded":false,"figures":[],"refs":[],"options":["la check-list reste identique","la surveillance paraclinique est à adapter en fonction du site hors bloc","la surveillance du patient lors du transfert est discontinue dû à l'éloignement de la SSPI","les médicaments à courte durée d'action sont à privilégier","les complications respiratoires sont plus fréquentes CHIRURGIE : NEUROLOGIE (S2-3.3.1 et 3.3.2)"],"correct":"BDE","note":"","instruction":"Cocher les propositions exactes.","sourcePage":9},{"id":"c50","num":16,"page":3,"kind":"QCM","title":"Parmi les propositions concernant l'utilisation du ciment en orthopédie, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022R","topic":"Chirurgie : orthopedie","points":1,"ungraded":false,"figures":[],"refs":[["Association of Anaesthetists · Ciment orthopédique","https://associationofanaesthetists-publications.onlinelibrary.wiley.com/doi/10.1111/anae.13036"]],"options":["la survenue d'une embolie se révèle par une PetCO2 très augmentée","En peropératoire, la PetCO2 risque de chuter brutalement en cas d'embolie majeure","l'embolie pulmonaire majeure peut conduire à une insuffisance circulatoire aiguë","en per-opératoire la PetCO2 reste stable en cas d'embolie majeure","l'agitation post-opératoire peut être révélateur d'un épisode embolique passé inaperçu en per-opératoire"],"correct":"BCE","note":"Anticiper embolisation au ciment : communication avant scellement, surveillance rapprochée de la PA, SpO₂ et PetCO₂, soutien hémodynamique et oxygénation. Signes : hypotension, chute de PetCO₂, désaturation ou perte de conscience.","instruction":"Cocher les propositions exactes.","sourcePage":22},{"id":"c56","num":17,"page":3,"kind":"QCM","title":"Parmi les propositions concernant la pression d'insufflation du garrot en orthopédie, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Chirurgie : orthopedie","points":1,"ungraded":false,"figures":[],"refs":[["Association of Anaesthetists · Ciment orthopédique","https://associationofanaesthetists-publications.onlinelibrary.wiley.com/doi/10.1111/anae.13036"]],"options":["la pression minimale est de 350mmHg pour le membre inférieur","la pression maximale est de 350mmHg pour le membre inférieur","la pression maximale est de 350mmHg pour le membre inférieur et supérieur","la pression est fixée théoriquement de manière arbitraire","la pression d'insufflation repose sur la pression d'occlusion artérielle (POA) + 50 à 75mmHg"],"correct":"E","note":"Anticiper embolisation au ciment : communication avant scellement, surveillance rapprochée de la PA, SpO₂ et PetCO₂, soutien hémodynamique et oxygénation. Signes : hypotension, chute de PetCO₂, désaturation ou perte de conscience.","instruction":"Cocher les propositions exactes.","sourcePage":23},{"id":"c57","num":18,"page":4,"kind":"QCM","title":"Parmi les propositions concernant la réhabilitation améliorée après chirurgie orthopédique (RAAC), laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Chirurgie : orthopedie","points":1,"ungraded":false,"figures":[],"refs":[["Association of Anaesthetists · Ciment orthopédique","https://associationofanaesthetists-publications.onlinelibrary.wiley.com/doi/10.1111/anae.13036"]],"options":["le principe de RAAC repose sur la réduction de l'agression chirurgicale","le principe de RAAC repose sur des mesures prises avant et après l'acte opératoire","le principe de RAAC repose pour un retour précoce aux fonctions physiques, psychiques","le principe de RAAC repose sur l'expérience clinique de toute mesure appliquée","le principe de RAAC repose sur la participation du patient qui devient un acteur privilégié de soins"],"correct":"ABCDE","note":"Anticiper embolisation au ciment : communication avant scellement, surveillance rapprochée de la PA, SpO₂ et PetCO₂, soutien hémodynamique et oxygénation. Signes : hypotension, chute de PetCO₂, désaturation ou perte de conscience.","instruction":"Cocher les propositions exactes.","sourcePage":23},{"id":"c58","num":19,"page":4,"kind":"QUESTION","title":"Parmi les propositions concernant le syndrome d'impaction au ciment chez un patient opéré d'une prothèse totale de hanche, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Chirurgie : orthopedie","points":2,"ungraded":false,"figures":[],"refs":[["Association of Anaesthetists · Ciment orthopédique","https://associationofanaesthetists-publications.onlinelibrary.wiley.com/doi/10.1111/anae.13036"]],"options":[],"correct":"","note":"","answer":["Anticiper embolisation au ciment : communication avant scellement, surveillance rapprochée de la PA, SpO₂ et PetCO₂, soutien hémodynamique et oxygénation. Signes : hypotension, chute de PetCO₂, désaturation ou perte de conscience.","Coordonner la préparation du canal médullaire et anticiper la prise en charge d’une hypoxémie ou d’un collapsus."],"sourcePage":23},{"id":"c67","num":20,"page":4,"kind":"QUESTION","title":"Expliciter les règles d'utilisation du garrot chirurgical. citer les complications en lien.","session":"2020-2022","topic":"Chirurgie : orthopedie","points":2,"ungraded":false,"figures":[],"refs":[["Association of Anaesthetists · Ciment orthopédique","https://associationofanaesthetists-publications.onlinelibrary.wiley.com/doi/10.1111/anae.13036"]],"options":[],"correct":"","note":"","answer":["Garrot : douleur, compression nerveuse ou cutanée, ischémie et reperfusion. À la levée, risque d’hypotension, d’augmentation du CO₂ et d’acidose transitoire.","Limiter la pression et la durée selon le membre et le protocole. Protéger la peau et prévenir l’équipe avant le dégonflage."],"sourcePage":24},{"id":"c68","num":21,"page":4,"kind":"QUESTION","title":"citer les moyens de prévention chirurgicaux et anesthésiques de l'accident thromboembolique lors du scellement en chirurgie orthopédique.","session":"2020-2022","topic":"Chirurgie : orthopedie","points":2,"ungraded":false,"figures":[],"refs":[["Association of Anaesthetists · Ciment orthopédique","https://associationofanaesthetists-publications.onlinelibrary.wiley.com/doi/10.1111/anae.13036"]],"options":[],"correct":"","note":"","answer":["Anticiper embolisation au ciment : communication avant scellement, surveillance rapprochée de la PA, SpO₂ et PetCO₂, soutien hémodynamique et oxygénation. Signes : hypotension, chute de PetCO₂, désaturation ou perte de conscience.","Coordonner la préparation du canal médullaire et anticiper la prise en charge d’une hypoxémie ou d’un collapsus."],"sourcePage":24},{"id":"c74","num":22,"page":4,"kind":"QUESTION","title":"vous êtes IADE au bloc opératoire, vous devez prendre en soin une patiente pour une réduction mammaire en chirurgie plastique. comment évaluez -vous le saignement chirurgical per opératoire?","session":"2020-2022R","topic":"Chirurgie : plastique","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["Sécuriser les appuis, éviter une abduction excessive des bras, anticiper l’accès au patient après le champage et adapter monitorage et voie veineuse. Surveiller douleur, hypothermie et saignement."],"sourcePage":25},{"id":"c79","num":23,"page":4,"kind":"QCM","title":"Parmi les propositions concernant les suites immédiates d'une néphrectomie par voie trans-péritonéale, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022R","topic":"Chirurgie : urologie","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Chirurgie urologique avec note","../../../cours/S1/3.3/3.3%20Chirurgie%20urologique%20avec%20note.pdf"]],"options":["elle expose au risque d'inhalation bronchique","elle expose au risque de pneumothorax","elle expose au risque de thrombose veineuse","elle expose au risque d'atélectasie pulmonaire","elle expose au risque d'infection urinaire"],"correct":"BCD","note":"Néphrectomie : anticiper le saignement, protéger la fonction rénale restante et surveiller les appuis. En lombotomie, vérifier le billot, la ventilation, la sonde et la tolérance hémodynamique.","instruction":"Cocher les propositions exactes.","sourcePage":32},{"id":"c86","num":24,"page":4,"kind":"QUESTION","title":"définir le TURP syndrome. quels sont les signes cliniques et paracliniques du TURP syndrome. énoncer les conséquences du TURP syndrome. énoncer le traitement et les actions de prévention.","session":"2020-2022","topic":"Chirurgie : urologie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Chirurgie urologique avec note (p. 50, à consulter)","../../../cours/S1/3.3/3.3%20Chirurgie%20urologique%20avec%20note.pdf#page=50"]],"options":[],"correct":"","note":"","answer":["Le TURP syndrome classique résulte d’une absorption du liquide d’irrigation hypotonique. Signes : hyponatrémie de dilution, troubles visuels ou neurologiques, désordres cardiovasculaires et surcharge.","L’absorption peut produire hypo-osmolalité, surcharge et signes neurologiques. L’ionogramme et la clinique orientent le diagnostic."],"sourcePage":33},{"id":"c87","num":25,"page":4,"kind":"QUESTION","title":"vous prenez en charge monsieur F en peropératoi re d'une RTUP sous rachianesthésie. énoncer la surveillance permettant de détecter l'apparition d'un T URP syndrome","session":"2020-2022R","topic":"Chirurgie : urologie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Chirurgie urologique avec note (p. 57, à consulter)","../../../cours/S1/3.3/3.3%20Chirurgie%20urologique%20avec%20note.pdf#page=57"]],"options":[],"correct":"","note":"","answer":["Prévenir et détecter précocement par coordination sur le liquide d’irrigation, la durée, les pertes et la clinique. La technique bipolaire sous sérum salé réduit le risque d’hyponatrémie classique, mais une surcharge reste possible.","Surveiller conscience si possible, pression, fréquence, oxygénation et bilan liquidien. Contrôler l’ionogramme si suspicion."],"sourcePage":33},{"id":"c89","num":26,"page":5,"kind":"QCM","title":"Parmi les propositions concernant Le patient addictif au tabac, laquelle ou lesquelles est (sont) vraie(s)?","session":"2019-2021, 2020-2022R","topic":"Terrain : addictif","points":1,"ungraded":false,"figures":[],"refs":[],"options":["Un taux de CO élevé est observé","un état pro inflammatoire est observé","une dysfonction immunitaire est observée","une sécrétion hyperadrénergique est observée","une diminution des infections opératoires est observée"],"correct":"ABCD","note":"Identifier les substances, la dernière prise, l’intoxication, le sevrage et les comorbidités. Adapter la stratégie d’analgésie et surveiller les interactions et le risque respiratoire.","instruction":"Cocher les propositions exactes.","sourcePage":37},{"id":"c90","num":27,"page":5,"kind":"QCM","title":"Parmi les propositions concernant l'anesthésie du patient addictif, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Terrain : addictif","points":1,"ungraded":false,"figures":[],"refs":[],"options":["l'alcool entraîne une très forte dépendance physique","l'alcool entraîne une très forte dépendance psychique","le cannabis entraîne peu de toxicité générale","le tabac entraîne peu de dépendance psychique","le tabac entraîne une très forte toxicité générale"],"correct":"ABE","note":"Identifier les substances, la dernière prise, l’intoxication, le sevrage et les comorbidités. Adapter la stratégie d’analgésie et surveiller les interactions et le risque respiratoire.","instruction":"Cocher les propositions exactes.","sourcePage":37},{"id":"c93","num":28,"page":5,"kind":"QUESTION","title":"citer les trois troubles métaboliques à rechercher lors d'une intoxication éthylique","session":"2020-2022R","topic":"Terrain : addictif","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["Rechercher hypoglycémie, troubles acido-basiques (dont acidocétose) et troubles hydroélectrolytiques. L’hypothermie est un risque clinique associé."],"sourcePage":37},{"id":"c101","num":29,"page":5,"kind":"QCM","title":"Parmi les propositions concernant le patient âgé, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Terrain : age & denutri","points":1,"ungraded":false,"figures":[],"refs":[["Cours · SUJET AGE Avec notes 3.3","../../../cours/S1/3.3/SUJET%20AGE%20Avec%20notes%203.3.pdf"],["Cours · SUJET DENUTRI avec notes 3.3","../../../cours/S1/3.3/SUJET%20DENUTRI%20avec%20notes%203.3.pdf"]],"options":["augmentation du volume de distribution des agents liposoluble s","baisse de la compliance ventriculaire","augmentation du compartiment vasculaire","diminution de la sensibilité des barorécepteurs","augmentation de la fraction libre des molécules liées à l'albumine"],"correct":"ABDE","note":"Le vieillissement réduit les réserves, la compliance vasculaire et le baroréflexe. Il augmente la sensibilité aux hypnotiques et expose à des complications respiratoires et à la confusion.","instruction":"Cocher les propositions exactes.","sourcePage":39},{"id":"c102","num":30,"page":5,"kind":"QCU","title":"Parmi les propositions concernant la fonction rénale chez le sujet âgé, laquelle est vraie? chez le sujet âgé il est recommandé de maintenir une créatinémie per -opératoire au -dessus d'un seuil à 5mg/l avant l'intervention\n\nCAR\n\nil est recommandé de traiter sans délai par un diurétique toute insuffisance rénale peropératoire du sujet âgé","session":"2020-2022","topic":"Terrain : age & denutri","points":1,"ungraded":false,"figures":[],"refs":[["Cours · SUJET AGE Avec notes 3.3 (p. 46, à consulter)","../../../cours/S1/3.3/SUJET%20AGE%20Avec%20notes%203.3.pdf#page=46"],["Cours · SUJET DENUTRI avec notes 3.3 (p. 26, à consulter)","../../../cours/S1/3.3/SUJET%20DENUTRI%20avec%20notes%203.3.pdf#page=26"]],"options":["les propositions sont toutes 2 vraies et il existe entre elles une relation cause à effet","les propositions sont toutes 2 vraies sans qu'il existe entre elles de relation de cause à effet","la première proposition est vraie mais la 2e est fausse","la première proposition est fausse mais la 2e est vraie","les 2 propositions sont fausses"],"correct":"E","note":"Le vieillissement réduit les réserves, la compliance vasculaire et le baroréflexe. Il augmente la sensibilité aux hypnotiques et expose à des complications respiratoires et à la confusion.","instruction":"Cocher une seule proposition.","sourcePage":39},{"id":"c103","num":31,"page":6,"kind":"QCM","title":"Parmi les propositions concernant le sujet âgé, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022R","topic":"Terrain : age & denutri","points":1,"ungraded":false,"figures":[],"refs":[["Cours · SUJET AGE Avec notes 3.3","../../../cours/S1/3.3/SUJET%20AGE%20Avec%20notes%203.3.pdf"],["Cours · SUJET DENUTRI avec notes 3.3","../../../cours/S1/3.3/SUJET%20DENUTRI%20avec%20notes%203.3.pdf"]],"options":["le sujet âgé présente une altération des réflexes de déglutition","le sujet âgé présente une augmentation de la capacité résiduelle fonctionnelle","le sujet âgé présente un risque d'apnée post-opératoire majorée","chez le sujet âgé, la clairance mucociliaire est augmentée","chez le sujet âgé, les rapports ventilation/perfusion sont augmentés"],"correct":"AC","note":"Le vieillissement réduit les réserves, la compliance vasculaire et le baroréflexe. Il augmente la sensibilité aux hypnotiques et expose à des complications respiratoires et à la confusion.","instruction":"Cocher les propositions exactes.","sourcePage":39},{"id":"c104","num":32,"page":6,"kind":"QCM","title":"Parmi les propositions concernant L’anesthésie du patient vieillard, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022R","topic":"Terrain : age & denutri","points":1,"ungraded":false,"figures":[],"refs":[["Cours · SUJET AGE Avec notes 3.3","../../../cours/S1/3.3/SUJET%20AGE%20Avec%20notes%203.3.pdf"],["Cours · SUJET DENUTRI avec notes 3.3","../../../cours/S1/3.3/SUJET%20DENUTRI%20avec%20notes%203.3.pdf"]],"options":["il présente une diminution de la sensibilité des barorécepteurs","il présente une diminution de la compliance ventriculaire","il présente une augmentation de la réactivité aux stimuli adrénergiques","il présente une difficulté d'adaptation au stress","il présente un débit cardiaque peu dépendant du retour veineux"],"correct":"ABD","note":"Le vieillissement réduit les réserves, la compliance vasculaire et le baroréflexe. Il augmente la sensibilité aux hypnotiques et expose à des complications respiratoires et à la confusion.","instruction":"Cocher les propositions exactes.","sourcePage":40},{"id":"c105","num":33,"page":6,"kind":"QCU","title":"Parmi les propositions concernant l’hémodynamique chez le sujet âgé, laquelle est vraie? il est recommandé de traiter sans délai par un inhibiteur calcique toute hypertension artérielle peropératoire du sujet âge\n\nCAR\n\nil est recommandé de maintenir la PAM peropératoire au-dessus d'un seuil correspondant à 70% de la PAM avant l'intervention","session":"2020-2022R","topic":"Terrain : age & denutri","points":0,"ungraded":true,"figures":[],"refs":[["Cours · SUJET AGE Avec notes 3.3 (p. 46, à consulter)","../../../cours/S1/3.3/SUJET%20AGE%20Avec%20notes%203.3.pdf#page=46"],["Cours · SUJET DENUTRI avec notes 3.3","../../../cours/S1/3.3/SUJET%20DENUTRI%20avec%20notes%203.3.pdf"]],"options":["les propositions sont toutes 2 vraies et il existe entre elles une relation cause à effet","les propositions sont toutes 2 vraies sans qu'il existe entre elles de relation de cause à effet","la première proposition est vraie mais la 2e est fausse","la première proposition est fausse mais la 2e est vraie","les 2 propositions sont fausses"],"correct":"","note":"La réponse exacte reste à vérifier pour cet énoncé. La question est hors barème. Le vieillissement réduit les réserves, la compliance vasculaire et le baroréflexe. Il augmente la sensibilité aux hypnotiques et expose à des complications respiratoires et à la confusion.","instruction":"Cocher une seule proposition.","sourcePage":40},{"id":"c106","num":34,"page":6,"kind":"QUESTION","title":"indiquer les conséquences du vieillissement sur la fonction cardiovasculaire","session":"2016-2018, 2020-2022R","topic":"Terrain : age & denutri","points":2,"ungraded":false,"figures":[],"refs":[["Cours · SUJET AGE Avec notes 3.3 (p. 2, à consulter)","../../../cours/S1/3.3/SUJET%20AGE%20Avec%20notes%203.3.pdf#page=2"],["Cours · SUJET DENUTRI avec notes 3.3","../../../cours/S1/3.3/SUJET%20DENUTRI%20avec%20notes%203.3.pdf"]],"options":[],"correct":"","note":"","answer":["Rigidité artérielle, moindre compliance ventriculaire, diminution du baroréflexe et de la réserve chronotrope. La tolérance à l’hypovolémie et à l’hypotension est réduite."],"sourcePage":40},{"id":"c109","num":35,"page":6,"kind":"QUESTION","title":"énoncer les trois règles d'or à observer, lors de l'administration de produits anesthésique s, chez le patient âgé.","session":"2020-2022R","topic":"Terrain : age & denutri","points":2,"ungraded":false,"figures":[],"refs":[["Cours · SUJET AGE Avec notes 3.3 (p. 42, à consulter)","../../../cours/S1/3.3/SUJET%20AGE%20Avec%20notes%203.3.pdf#page=42"],["Cours · SUJET DENUTRI avec notes 3.3 (p. 13, à consulter)","../../../cours/S1/3.3/SUJET%20DENUTRI%20avec%20notes%203.3.pdf#page=13"]],"options":[],"correct":"","note":"","answer":["Adapter la dose initiale, titrer selon la réponse et monitorer les effets ventilatoires, circulatoires et neuromusculaires. Tenir compte de la fonction rénale et des interactions."],"sourcePage":40},{"id":"c113","num":36,"page":6,"kind":"QCM","title":"Parmi les propositions concernant L’intubation orotrachéale, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Terrain : estomac plein","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":["utilisation systématique du vidéo laryngoscope","utilisation systématique d'un laryngoscope","utilisation systématique d'un mandrin","réalisation systématique d'une aspiration trachéale","réalisation recommandée de la manœuvre de Sellick"],"correct":"B","note":"Évaluer l’inhalation d’après le jeûne, la nature des ingesta, l’urgence, le reflux, l’occlusion et les troubles de vidange. Les liquides clairs et les repas ne suivent pas les mêmes délais.","instruction":"Cocher les propositions exactes.","sourcePage":44},{"id":"c114","num":37,"page":7,"kind":"QCU","title":"Parmi les propositions concernant Le sujet estomac plein, laquelle est vraie? l'utilisation de vidéo laryngoscope est à privilégier\n\nCAR\n\nla capacité résiduelle fonctionnelle est diminuée","session":"2020-2022R","topic":"Terrain : estomac plein","points":0,"ungraded":true,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note (p. 53, à consulter)","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf#page=53"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":["les propositions sont toutes 2 vraies et il existe entre elles une relation cause à effet","les propositions sont toutes 2 vraies sans qu'il existe entre elles de relation de cause à effet","la première proposition est vraie mais la 2e est fausse","la première proposition est fausse mais la 2e est vraie","les 2 propositions sont fausses"],"correct":"","note":"La réponse exacte reste à vérifier pour cet énoncé. La question est hors barème. Évaluer l’inhalation d’après le jeûne, la nature des ingesta, l’urgence, le reflux, l’occlusion et les troubles de vidange. Les liquides clairs et les repas ne suivent pas les mêmes délais.","instruction":"Cocher une seule proposition.","sourcePage":44},{"id":"c120","num":38,"page":7,"kind":"QUESTION","title":"citer 5 facteurs ralentissant la vidange gastrique","session":"2020-2022R","topic":"Terrain : estomac plein","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note (p. 26, à consulter)","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf#page=26"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Retard de vidange : repas gras ou volumineux, gastroparésie diabétique, obstruction, opioïdes, douleur ou stress aigu. Distinguer retard de vidange et risque de régurgitation lié au reflux."],"sourcePage":45},{"id":"c125","num":39,"page":7,"kind":"QUESTION","title":"expliciter le mécanisme physiopathologique de l'inhalation du contenu gastrique en anesthésie. citer les causes responsables de l’inhalation gastrique.","session":"2020-2022","topic":"Terrain : estomac plein","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note (p. 106, à consulter)","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf#page=106"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Rechercher jeûne, nature du dernier repas, reflux, obstruction, gastroparésie diabétique, opioïdes, grossesse, urgence, altération de conscience et difficulté d’accès aux voies aériennes.","L’inhalation survient si le contenu régurgité franchit le larynx alors que les réflexes protecteurs sont altérés."],"sourcePage":45},{"id":"c126","num":40,"page":7,"kind":"QUESTION","title":"quelles sont les actions immédiates à réaliser en cas de vomissement chez un patient non intubé lors de l'induction.","session":"2020-2022","topic":"Terrain : estomac plein","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note (p. 100, à consulter)","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf#page=100"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Alerter et arrêter le geste si possible. Limiter la contamination des voies aériennes, aspirer l’oropharynx, oxygéner et sécuriser la trachée selon la situation.","Après stabilisation, évaluer les échanges et la gravité. La bronchoscopie peut être discutée si des particules obstruent les voies aériennes."],"sourcePage":45},{"id":"c127","num":41,"page":7,"kind":"QUESTION","title":"énoncer les règles du jeûne préopératoire chez l'adulte","session":"2020-2022","topic":"Terrain : estomac plein","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note (p. 20, à consulter)","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf#page=20"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Chez un adulte en chirurgie programmée, sans risque particulier de retard de vidange : liquides clairs jusqu’à 2 heures avant, repas léger au moins 6 heures, repas gras ou copieux au moins 8 heures."],"sourcePage":45},{"id":"c139","num":42,"page":7,"kind":"QUESTION","title":"citer les organes cibles de l'hypertension artérielle","session":"2019-2021, 2020-2022R","topic":"Terrain : hypertendu","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Patient HTA avec notes (p. 6, à consulter)","../../../cours/S1/3.3/3.3%20Patient%20HTA%20avec%20notes.pdf#page=6"]],"options":[],"correct":"","note":"","answer":["Cœur : hypertrophie ventriculaire, coronaropathie, insuffisance cardiaque. Cerveau : AVC. Rein : néphropathie. Rétine : rétinopathie. Artères : athérosclérose et artériopathie."],"sourcePage":55},{"id":"c134","num":43,"page":7,"kind":"QCM","title":"Parmi les propositions concernant l'hypertension artérielle (HTA), laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Terrain : hypertendu","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Patient HTA avec notes","../../../cours/S1/3.3/3.3%20Patient%20HTA%20avec%20notes.pdf"]],"options":["HTA : PA > 140/90 mmHg","HTA grade 1 : 140-159/90-99 mmHg","HTA grade 2 : 160-179/100-109 mmHg","HTA grade 3 > 190/ >100 mmHg","HTA grade 1 : > 200/ > 110 mmHg"],"correct":"ABC","note":"Identifier ancienneté, traitements et retentissement cardiaque, cérébral, rénal et vasculaire. Confirmer les mesures et évaluer le risque de l’intervention.","instruction":"Cocher les propositions exactes.","sourcePage":55},{"id":"c140","num":44,"page":7,"kind":"QUESTION","title":"citer les conséquences de l'hypertension artérielle peropératoire. énoncer les actions immédiates.","session":"2020-2022","topic":"Terrain : hypertendu","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Patient HTA avec notes (p. 94, à consulter)","../../../cours/S1/3.3/3.3%20Patient%20HTA%20avec%20notes.pdf#page=94"]],"options":[],"correct":"","note":"","answer":["Une HTA marquée peut favoriser saignement, ischémie myocardique, insuffisance cardiaque ou complications neurologiques. Vérifier la mesure et traiter les causes : analgésie insuffisante, stimulation, hypoxie, hypercapnie ou surcharge. Alerter et titrer le traitement selon le contexte."],"sourcePage":55},{"id":"c141","num":45,"page":7,"kind":"QUESTION","title":"Énoncer les différentes actions que vous allez mettre en place afin de prévenir et de traiter l'hypotension artérielle à l'induction.","session":"2020-2022","topic":"Terrain : hypertendu","points":2,"ungraded":false,"figures":[],"refs":[["Cours const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

  if(q.images) return scanBlock(q.images,questionLabel(q));
  const table=q.table?`<div class="prompt-table">${q.table.map(cell=>`<span>${escape(cell)}</span>`).join('')}</div>`:'';
  return `<h2 class="question-stem">${escape(q.title)}</h2>${q.text?`<p class="context-text">${escape(q.text)}</p>`:''}${q.figures.length?`<div class="q-figure">${q.figures.map((id,i)=>`<img loading="lazy" src="data:image/jpeg;base64,${DATA.figures[id]}" class="question-figure" alt="Figure ${i+1} de la question">`).join('')}</div>`:''}${q.instruction?`<p class="small">${escape(q.instruction)}</p>`:''}${table}`;
}
function fields(q) {
  if (isChoice(q)) {
    return `<div class="choices ${q.options?'written-choices':''}" role="${q.kind==='QCU'?'radiogroup':'group'}" aria-labelledby="title-${q.id}">${q.options.map((_,i)=>values[i]).map((letter,i)=>`<label class="option" id="option-${q.id}-${letter}"><input type="${q.kind==='QCU'?'radio':'checkbox'}" name="${q.id}" value="${letter}"><span><strong>${letter}</strong>${q.options?' · '+escape(q.options[i]):''}<small></small></span></label>`).join('')}</div>`;
  }
  return `<div class="field"><textarea id="answer-${q.id}" aria-labelledby="title-${q.id}" rows="5" placeholder="Ta réponse…"></textarea></div>`;
}
function render() {
  $('cards').innerHTML = active.map((q, index) => {
    const section = q.kind === 'context' ? '<span>Dossier</span>' : `<span>${q.ungraded?'Hors barème':format(q.points)+' pt'} · ${escape(q.session)} · PDF p. ${q.page}</span>`;
    const anchor = active.findIndex(card=>card.kind===q.kind)===index ? ` id="section-${q.kind}"` : '';
    return `<section class="card"${anchor} data-card="${q.id}"><div class="meta"><strong id="title-${q.id}">${escape(questionLabel(q))}</strong>${section}</div>${prompt(q)}${q.kind==='context'?'':fields(q)+`<div class="feedback" id="feedback-${q.id}" hidden></div>`}</section>`;
  }).join('');
  for(const link of document.querySelectorAll('[data-kind]')){
    const kind=link.dataset.kind;
    const index=active.findIndex(q=>kind==='open'?isOpen(q):q.kind===kind);
    link.hidden=index<0;
    if(index>=0) link.hash='section-'+active[index].kind;
  }
}
function response(q) {
  if (isChoice(q)) {
    return [...form.querySelectorAll(`[name="${q.id}"]:checked`)].map(input=>input.value);
  }
  return $(`answer-${q.id}`).value.trim();
}
function progress() {
  const current=active.filter(q=>q.kind!=='context');
  const count=current.filter(q=>response(q).length>0).length;
  $('progress').textContent=`${count} / ${current.length} questions renseignées`;
  $('bar').max=current.length;
  $('bar').value=count;
}
function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.slice(0,q.options.length).filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Évalue ta réponse à partir des éléments du corrigé.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0,ungraded:q.ungraded};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values.slice(0,q.options.length)){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(!q.ungraded&&q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  if (isOpen(q)) {
    panel.innerHTML=`${answerBox(q)}${sources(q)}${q.ungraded?'<p class="small">Question hors barème.</p>':rubricPanel(q,grade)+assessmentControls(q,grade)}${sourceCopy(q)}`;
    return;
  }
  const answers=q.correct.split('').filter(Boolean).map(letter=>q.options[values.indexOf(letter)]);
  const key=`<strong>${q.ungraded?'Hors barème':format(grade.autoScore)+' / 1 point'}</strong><div class="answer-key" style="margin-top:10px"><h3>${q.ungraded?'Éléments pour vérifier':'Correction'}</h3>${answers.length?`<ul class="correct-options">${answers.map(a=>`<li>${escape(a)}</li>`).join('')}</ul>`:''}${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
  panel.innerHTML=key+sources(q)+sourceCopy(q);
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return !grade.ungraded&&(grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max)));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const adjusted=list.some(g=>g.review && g.review!=='blank' || g.analysis?.some(c=>c.override!==null));
  if(adjusted) $('summary').textContent+=' Note ajustée.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(g=>g.ungraded||isComplete(g));
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!q.ungraded&&!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function shuffledCard(q) {
  if (!isChoice(q)) return q;
  const indexes=q.options.map((_,i)=>i);
  for(let i=indexes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
  }
  const correct=indexes.map((index,i)=>q.correct.includes(values[index])?values[i]:'').join('');
  return {...q,options:indexes.map(i=>q.options[i]),correct};
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!g.ungraded&&!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>(!$('topic').value||q.topic===$('topic').value)&&(!keep||keep.has(q.id))).map(shuffledCard);
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
for(const topic of new Set(DATA.cards.map(q=>q.topic))) $('topic').add(new Option(topic,topic));
$('topic').addEventListener('change',()=>start());
start();
</script>

<script>
/* Mémo : enregistre la note obtenue, pour l'écran « Mes résultats » de l'app.
   Même origine que l'app, donc même localStorage. Une tentative par correction ;
   si la note est ajustée à la main ensuite, la tentative en cours est mise à jour. */
(function () {
  var CLE = 'memo-resultats', INFO = window.MEMO_QUIZ;
  if (!INFO) return;
  var resultats = document.getElementById('results'), score = document.getElementById('score');
  if (!resultats || !score) return;
  var tentative = null;

  function lire() { try { return JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { return []; } }
  function noteDe(txt) {
    var m = String(txt).match(/(-?[\d  ]+(?:[.,]\d+)?)\s*\/\s*20/);
    return m ? parseFloat(m[1].replace(/[  ]/g, '').replace(',', '.')) : null;
  }
  function enregistrer() {
    if (resultats.hidden) return;
    var note = noteDe(score.textContent);
    if (note === null || !isFinite(note)) return;
    var liste = lire();
    var ligne = tentative && liste.find(function (x) { return x.cle === tentative; });
    if (!ligne) {
      tentative = INFO.id + '#' + Date.now();
      ligne = { cle: tentative, id: INFO.id, href: INFO.href, collection: INFO.collection,
        sem: INFO.sem, ue: INFO.ue, periode: INFO.periode, titre: INFO.titre };
      liste.push(ligne);
    }
    ligne.note = Math.round(note * 100) / 100;
    ligne.date = new Date().toISOString();
    try { localStorage.setItem(CLE, JSON.stringify(liste.slice(-300))); } catch (e) {}
  }

  new MutationObserver(enregistrer).observe(score, { childList: true, characterData: true, subtree: true });
  new MutationObserver(enregistrer).observe(resultats, { attributes: true, attributeFilter: ['hidden'] });
  // « Tout recommencer » : la prochaine correction comptera comme une nouvelle tentative.
  document.getElementById('reset') && document.getElementById('reset').addEventListener('click', function () { tentative = null; });
})();
</script>
