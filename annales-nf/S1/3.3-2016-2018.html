ine remonte le diaphragme, réduit la compliance et la CRF et favorise des atélectasies. L’absorption de CO₂ peut augmenter la PaCO₂.","instruction":"Cocher les propositions exactes.","sourcePage":4},{"id":"c10","num":3,"page":1,"kind":"QCM","title":"Parmi les propositions concernant les contre-indications de la coeliochirurgie laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Chirurgie : coelioscopie","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf"]],"options":["elle est contre-indiquée chez un patient présentant une hypertension intracrânienne","elle est contre-indiquée chez un patient BPCO","elle est contre-indiquée en urgence","elle est contre-indiquée pour un patient présentant un pneumothorax","elle est contre-indiquée pour un patient obèse"],"correct":"AD","note":"Le pneumopéritoine remonte le diaphragme, réduit la compliance et la CRF et favorise des atélectasies. L’absorption de CO₂ peut augmenter la PaCO₂.","instruction":"Cocher les propositions exactes.","sourcePage":4},{"id":"c19","num":4,"page":1,"kind":"QUESTION","title":"énoncer les retentissements respiratoires de la coeliochirurgie","session":"2017-2019 / 2016-2018","topic":"Chirurgie : coelioscopie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf"]],"options":[],"correct":"","note":"","answer":["Le pneumopéritoine remonte le diaphragme, diminue CRF et compliance, augmente les pressions et favorise atélectasies et altération des rapports V/Q.","Le CO₂ absorbé peut augmenter la PaCO₂."],"sourcePage":5},{"id":"c25","num":5,"page":2,"kind":"QCM","title":"Parmi les propositions concernant la chirurgie abdominale, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018 / 2017 -2019 / 2018 -2020","topic":"Chirurgie : digestive","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Chirurgie diges avec note 3.3","../../../cours/S1/3.3/Chirurgie%20diges%20avec%20note%203.3.pdf"]],"options":["la chirurgie abdominale modérée nécessitent un bloc neuromusculaire avec pour objectif 2 réponses au TOF à l'adducteur du pouce","La chirurgie abdominale nécessite une analgésie profonde","L’iléus post opératoire est majoré par les agents anesthésiques","la capacité vitale est diminuée en postopératoire","la fonction diaphragmatique est altérée en post opératoire","la chirurgie abdominale augmente la capacité vitale en postopératoire","la chirurgie abdominale améliore la fonction diaphragmatique en postopératoire"],"correct":"BDE","note":"Après chirurgie abdominale, douleur et dysfonction diaphragmatique diminuent volumes pulmonaires et toux. Prévenir atélectasies et complications par analgésie, mobilisation et soutien respiratoire adapté.","instruction":"Cocher les propositions exactes.","sourcePage":6},{"id":"c46","num":6,"page":2,"kind":"QCM","title":"Parmi les propositions concernant le risque thromboembolique en chirurgie orthopédique, laquelle ou lesquelles est (sont) vraie(s)?","session":"2013-2015 / 2015-2017 / 2016-2018","topic":"Chirurgie : orthopedie","points":1,"ungraded":false,"figures":[],"refs":[["Association of Anaesthetists · Ciment orthopédique","https://associationofanaesthetists-publications.onlinelibrary.wiley.com/doi/10.1111/anae.13036"]],"options":["Le risque thromboembolique est lié à l’existence d’une stase veineuse secondaire à l’impotence fonctionnelle post opératoire","L’hypercoagulabilité relative au syndrome inflammatoire post opératoire majore le risque thromboembolique","La pose d’un garrot pneumatique en chirurgie orthopédique diminue le risque thromboembolique","Les héparines à bas poids moléculaires ne constituent pas la prophylaxie efficace pour ce type de chirurgie","Les héparines à bas poids moléculaires restent recommandées à doses prophylactiques","le risque thromboembolique est mineur dans ce type de chirurgie","les héparines à bas poids moléculaire restent recommandées à dose prophylactiques pour les prothèses de hanche et de genou"],"correct":"ABEG","note":"Anticiper embolisation au ciment : communication avant scellement, surveillance rapprochée de la PA, SpO₂ et PetCO₂, soutien hémodynamique et oxygénation. Signes : hypotension, chute de PetCO₂, désaturation ou perte de conscience.","instruction":"Cocher les propositions exactes.","sourcePage":21},{"id":"c48","num":7,"page":2,"kind":"QCM","title":"Parmi les propositions concernant la cimentation d'une prothèse totale de hanche, laquelle où lesquelles est (sont) vraie(s)?","session":"2015-2017 / 2016-2018","topic":"Chirurgie : orthopedie","points":1,"ungraded":false,"figures":[],"refs":[["Association of Anaesthetists · Ciment orthopédique","https://associationofanaesthetists-publications.onlinelibrary.wiley.com/doi/10.1111/anae.13036"]],"options":["l'utilisation de ciment est contre-indiquée chez les patients présentant une ostéoporose","la mise en place d'un drain de Redon dans la cavité médullaire par le chirurgien contribue à réduire le risque d'embolie gazeuse lors du scellement de la prothèse","l'utilisation de ciment est un temps douloureux de la chirurgie","l'administration de N2O est arrêtée avant le scellement de la prothèse","l'utilisation de ciment peut être responsable de troubles du rythme"],"correct":"CE","note":"Anticiper embolisation au ciment : communication avant scellement, surveillance rapprochée de la PA, SpO₂ et PetCO₂, soutien hémodynamique et oxygénation. Signes : hypotension, chute de PetCO₂, désaturation ou perte de conscience.","instruction":"Cocher les propositions exactes.","sourcePage":21},{"id":"c49","num":8,"page":2,"kind":"QCM","title":"Parmi ces propositions concernant le risque thromboembolique en chirurgie orthopédique, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Chirurgie : orthopedie","points":1,"ungraded":false,"figures":[],"refs":[["Association of Anaesthetists · Ciment orthopédique","https://associationofanaesthetists-publications.onlinelibrary.wiley.com/doi/10.1111/anae.13036"]],"options":["En per opératoire, la PetCO2 sera très augmentée en cas d'embolie majeur e","En per opératoire, la PetCO2 risque de chuter brutalement en cas d'embolie majeure","l'embolie pulmonaire majeure peut conduire à une insuffisance circulatoire aiguë","En per opératoire, la PetCO2 ne varie pas en cas d'embolie majeure","l'agitation postopératoire peut être révélatrice d'un épisode embolique passé inaperçu en peropératoire"],"correct":"BCE","note":"Anticiper embolisation au ciment : communication avant scellement, surveillance rapprochée de la PA, SpO₂ et PetCO₂, soutien hémodynamique et oxygénation. Signes : hypotension, chute de PetCO₂, désaturation ou perte de conscience.","instruction":"Cocher les propositions exactes.","sourcePage":22},{"id":"c76","num":9,"page":3,"kind":"QCU","title":"Parmi les propositions concernant la position de lombotomie en urologie ci-dessous, laquelle est vraie? Une seule réponse possible","session":"2016-2018","topic":"Chirurgie : urologie","points":0,"ungraded":true,"figures":[],"refs":[["Cours · 3.3 Chirurgie urologique avec note","../../../cours/S1/3.3/3.3%20Chirurgie%20urologique%20avec%20note.pdf"]],"options":["elle peut entraîner une compression aortique","elle peut entraîner une compression cave","elle peut entraîner une diminution du retour veineux","elle peut entraîner une modification du rapport ventilation/perfusion","elle peut entraîner fréquemment des atélectasies"],"correct":"","note":"Plusieurs effets sont possibles malgré la consigne à réponse unique. Le décubitus avec billot peut réduire le retour veineux et modifier ventilation/perfusion. La figure n’est pas présente sur la page source. Néphrectomie : anticiper le saignement, protéger la fonction rénale restante et surveiller les appuis. En lombotomie, vérifier le billot, la ventilation, la sonde et la tolérance hémodynamique.","instruction":"Cocher une seule proposition.","sourcePage":32},{"id":"c82","num":10,"page":3,"kind":"QUESTION","title":"citer les moyens de prévention du TURP syndrome lors d'une résection tran surétrale de la prostate","session":"2016-2018","topic":"Chirurgie : urologie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Chirurgie urologique avec note (p. 57, à consulter)","../../../cours/S1/3.3/3.3%20Chirurgie%20urologique%20avec%20note.pdf#page=57"]],"options":[],"correct":"","note":"","answer":["Prévenir et détecter précocement par coordination sur le liquide d’irrigation, la durée, les pertes et la clinique. La technique bipolaire sous sérum salé réduit le risque d’hyponatrémie classique, mais une surcharge reste possible.","Surveiller conscience si possible, pression, fréquence, oxygénation et bilan liquidien. Contrôler l’ionogramme si suspicion."],"sourcePage":33},{"id":"c94","num":11,"page":3,"kind":"QCM","title":"Parmi les propositions concernant la fonction respiratoire du sujet âgé, laquelle ou lesquelles est (sont) vraie(s)?","session":"2015-2017 / 2016 -2018 / 2017 -2019","topic":"Terrain : age & denutri","points":1,"ungraded":false,"figures":[],"refs":[["Cours · SUJET AGE Avec notes 3.3","../../../cours/S1/3.3/SUJET%20AGE%20Avec%20notes%203.3.pdf"],["Cours · SUJET DENUTRI avec notes 3.3","../../../cours/S1/3.3/SUJET%20DENUTRI%20avec%20notes%203.3.pdf"]],"options":["le sujet âgé présente une altération des réflexes de déglutition et de toux","le sujet âgé présente une augmentation de la capacité résiduelle fonctionnelle","le sujet âgé présente un risque majoré d'apnée post opératoire","le sujet âgé présente une clairance muco-ciliaire augmentée","le sujet âgé présente un rapport ventilation/perfusion augmenté"],"correct":"AC","note":"Le vieillissement réduit les réserves, la compliance vasculaire et le baroréflexe. Il augmente la sensibilité aux hypnotiques et expose à des complications respiratoires et à la confusion.","instruction":"Cocher les propositions exactes.","sourcePage":38},{"id":"c106","num":12,"page":3,"kind":"QUESTION","title":"indiquer les conséquences du vieillissement sur la fonction cardiovasculaire","session":"2016-2018, 2020-2022R","topic":"Terrain : age & denutri","points":2,"ungraded":false,"figures":[],"refs":[["Cours · SUJET AGE Avec notes 3.3 (p. 2, à consulter)","../../../cours/S1/3.3/SUJET%20AGE%20Avec%20notes%203.3.pdf#page=2"],["Cours · SUJET DENUTRI avec notes 3.3","../../../cours/S1/3.3/SUJET%20DENUTRI%20avec%20notes%203.3.pdf"]],"options":[],"correct":"","note":"","answer":["Rigidité artérielle, moindre compliance ventriculaire, diminution du baroréflexe et de la réserve chronotrope. La tolérance à l’hypovolémie et à l’hypotension est réduite."],"sourcePage":40},{"id":"c110","num":13,"page":3,"kind":"QCM","title":"Parmi les propositions concernant les patients « estomac plein », laquelle ou lesquelles est (sont) vraie(s)?","session":"2015-2017 / 2016-2018 / 2017-2019","topic":"Terrain : estomac plein","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":["un jeune homme porteur d'un anneau gastrique est considéré « estomac plein »","une femme admise pour une interruption de grossesse à 12 semaines d'aménorrhée est considérée « estomac plein » une femme admise pour une interruption de grossesse à 10 semaines d'aménorrhée est considérée « estomac plein »","une femme au 5e jour post partum est considérée « estomac plein »","un patient victime d'un accident de la voie publique est considéré « estomac plein », 6h après son dernier repas","un patient présentant un score à Apfel 4/4 est considéré « estomac plein »"],"correct":"AD","note":"Évaluer l’inhalation d’après le jeûne, la nature des ingesta, l’urgence, le reflux, l’occlusion et les troubles de vidange. Les liquides clairs et les repas ne suivent pas les mêmes délais.","instruction":"Cocher les propositions exactes.","sourcePage":44},{"id":"c119","num":14,"page":3,"kind":"QUESTION","title":"citer 5/6 facteurs ralentissant la vidange gastrique","session":"2015-2017 / 2016-2018 / 2017-2019","topic":"Terrain : estomac plein","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Estomac plein avec note (p. 26, à consulter)","../../../cours/S1/3.3/3.3%20Estomac%20plein%20avec%20note.pdf#page=26"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Retard de vidange : repas gras ou volumineux, gastroparésie diabétique, obstruction, opioïdes, douleur ou stress aigu. Distinguer retard de vidange et risque de régurgitation lié au reflux."],"sourcePage":45},{"id":"c135","num":15,"page":4,"kind":"QUESTION","title":"indiquer les circonstances favorisant un accès hypertensif en postopératoire chez un patient hypertendu","session":"2013-2015 / 2016 -2018 / 2017 -2019","topic":"Terrain : hypertendu","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Patient HTA avec notes (p. 146, à consulter)","../../../cours/S1/3.3/3.3%20Patient%20HTA%20avec%20notes.pdf#page=146"]],"options":[],"correct":"","note":"","answer":["Prévenir les écarts tensionnels par titration, analgésie, oxygénation et surveillance. Une poussée peut être déclenchée par douleur, hypoxie, hypercapnie, frissons, globe vésical ou interruption d’un traitement."],"sourcePage":55},{"id":"c137","num":16,"page":4,"kind":"QUESTION","title":"citer les organes cibles de l'hypertension artérielle. indiquer pour chacun d'entre eux le ou les conséquences induites par l'hypertension artérielle sur ces différents organes","session":"2016-2018","topic":"Terrain : hypertendu","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.3 Patient HTA avec notes (p. 20, à consulter)","../../../cours/S1/3.3/3.3%20Patient%20HTA%20avec%20notes.pdf#page=20"]],"options":[],"correct":"","note":"","answer":["Cœur : hypertrophie ventriculaire, coronaropathie, insuffisance cardiaque. Cerveau : AVC. Rein : néphropathie. Rétine : rétinopathie. Artères : athérosclérose et artériopathie."],"sourcePage":55},{"id":"c153","num":17,"page":4,"kind":"QUESTION","title":"énoncer le s risques liés à l'insuffisance coronarienne en péri opératoire. expliquer les conséquences d'une hausse de la fréquence cardiaque chez un sujet insuffisant coronaire","session":"2016-2018","topic":"Terrain : insuffisant cardiaque","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["Risques : ischémie myocardique, infarctus, troubles du rythme ou insuffisance cardiaque.","La tachycardie raccourcit la diastole et peut limiter la perfusion coronaire tout en augmentant la consommation d’oxygène."],"sourcePage":58},{"id":"c156","num":18,"page":4,"kind":"QCM","title":"Parmi les propositions concernant le patient cirrhotique, laquelle ou lesquelles est (sont) vraie(s)?","session":"2015-2017 / 2016-2018","topic":"Terrain : insuffisant hepatique et/ou cirrhotique","points":1,"ungraded":false,"figures":[],"refs":[],"options":["il présente des troubles de la coagulation avec une diminution de l'activité fibrinolytique","il présente des troubles de la coagulation avec une augmentation de l'activité fibrinolytique","il présente une vasodilatation systémique entraînant une hypotension artérielle","il présente une vasoconstriction systémique entraînant une hypertension artérielle","il présente une rétention hydro sodée"],"correct":"ACE","note":"Évaluer la fonction hépatique, l’ascite, le risque infectieux, la fonction rénale et l’hémostase. Le TP seul ne résume pas le risque de saignement de la cirrhose.","instruction":"Cocher les propositions exactes.","sourcePage":59},{"id":"c175","num":19,"page":4,"kind":"QCM","title":"Parmi les propositions concernant les pathologies respiratoires ci-dessous, laquelle ou lesquelles est (sont) vraie(s)?","session":"2015-2017 / 2016 -2018","topic":"Terrain : insuffisant respiratoire / bpco","points":1,"ungraded":false,"figures":[],"refs":[["GOLD · BPCO","https://goldcopd.org/2026-gold-report-and-pocket-guide/"]],"options":["L’emphysème est une pathologie restrictive","la bronchite chronique est une pathologie obstructive","la radio pulmonaire e st l'examen paraclinique de choix devant toute pathologie respiratoire","un rapport de Tiffeneau normal correspond à VEMS/CV supérieur ou égal à 80%","l'augmentation du temps expiratoire permet d'améliorer la vidange alvéolaire chez un patient présentant une BPCO (broncho-pneumopathie chronique obstructive)","l’asthme est une pathologie obstructive"],"correct":"BEF","note":"Distinguer obstruction (rapport VEMS/CV abaissé) et restriction (CPT abaissée). Pour la BPCO, rechercher exacerbation, encombrement et rétention de CO₂.","instruction":"Cocher les propositions exactes.","sourcePage":62},{"id":"c178","num":20,"page":4,"kind":"QCM","title":"Parmi les propositions concernant le patients BPCO, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Terrain : insuffisant respiratoire / bpco","points":1,"ungraded":false,"figures":[],"refs":[["GOLD · BPCO","https://goldcopd.org/2026-gold-report-and-pocket-guide/"]],"options":["il présente une hypertrophie des glandes muqueuses","il présente un amincissement de la paroi des voies aériennes","il présente une augmentation des résistances pulmonaires","il présente une inégalité du rapport ventilation/perfusion","il présente une diminution de l'espace mort"],"correct":"ACD","note":"Distinguer obstruction (rapport VEMS/CV abaissé) et restriction (CPT abaissée). Pour la BPCO, rechercher exacerbation, encombrement et rétention de CO₂.","instruction":"Cocher les propositions exactes.","sourcePage":62},{"id":"c179","num":21,"page":5,"kind":"QCM","title":"Parmi les propositions concernant la gaz ométrie artérielle lors de la décompensation d'une insuffisance respiratoire chronique, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018 / 2017 -2019","topic":"Terrain : insuffisant respiratoire / bpco","points":1,"ungraded":false,"figures":[],"refs":[["GOLD · BPCO","https://goldcopd.org/2026-gold-report-and-pocket-guide/"]],"options":["une PaO2 diminuée, une PaCO2 augmentée et un pH diminué","Une PaO2, une PaCO2 et un pH diminués","Une PaO2, une PaCO2 et un pH augmentés","Une PaO2 diminuée, une PaCO2 augmentée et un pH augmenté","Une variation de pH est isolée"],"correct":"A","note":"Distinguer obstruction (rapport VEMS/CV abaissé) et restriction (CPT abaissée). Pour la BPCO, rechercher exacerbation, encombrement et rétention de CO₂.","instruction":"Cocher les propositions exactes.","sourcePage":63},{"id":"c180","num":22,"page":5,"kind":"QCM","title":"Parmi les propositions concernant la courbe de capnographie, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Terrain : insuffisant respiratoire / bpco","points":1,"ungraded":false,"figures":["3.3-63-1"],"refs":[["GOLD · BPCO","https://goldcopd.org/2026-gold-report-and-pocket-guide/"]],"options":["une augmentation de l'activité métabolique","une déconnexion du système","une obstruction totale des voies aériennes liées à un tuyau coudé","une hypovolémie","une perfusion pulmonaire décroissante"],"correct":"BC","note":"Distinguer obstruction (rapport VEMS/CV abaissé) et restriction (CPT abaissée). Pour la BPCO, rechercher exacerbation, encombrement et rétention de CO₂.","instruction":"Cocher les propositions exactes.","sourcePage":63},{"id":"c188","num":23,"page":5,"kind":"QUESTION","title":"énoncer les éléments de prise en charge d’un bronchospasme chez un patient intubé ventilé sous anesthésie générale","session":"2016-2018","topic":"Terrain : insuffisant respiratoire / bpco","points":2,"ungraded":false,"figures":[],"refs":[["GOLD · BPCO","https://goldcopd.org/2026-gold-report-and-pocket-guide/"]],"options":[],"correct":"","note":"","answer":["Signes : sibilants ou silence auscultatoire, hausse de pression de crête, débit expiratoire prolongé et pente capnographique oblique.","Alerter, oxygéner, vérifier sonde et circuit et rechercher l’anaphylaxie. Administrer un bronchodilatateur selon la cause et allonger l’expiration."],"sourcePage":64},{"id":"c199","num":24,"page":5,"kind":"QCM","title":"Parmi les propositions concernant l'anesthésie du patient obèse, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Terrain : obese","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Pré oxygénation avec notes","../../../cours/S1/3.1/Pre%CC%81%20oxyge%CC%81nation%20avec%20notes.pdf"]],"options":["il présente une fréquence cardiaque peu modifiée malgré une augmentation du débit cardiaque","il présente une fréquence cardiaque élevée malgré une diminution du débit cardiaque","il présente une augmentation modérée du volume sanguin circulant","il présente une diminution modérée du volume sanguin circulant","Il présente un cœur dilaté moins bien perfusé"],"correct":"ACE","note":"L’obésité réduit souvent la CRF et la compliance, augmente le risque d’atélectasie et raccourcit la tolérance à l’apnée. Évaluer SAOS et voies aériennes.","instruction":"Cocher les propositions exactes.","sourcePage":66},{"id":"c200","num":25,"page":5,"kind":"QCM","title":"Parmi les propositions concernant l’ anesthésie du patient obèse, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Terrain : obese","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Pré oxygénation avec notes","../../../cours/S1/3.1/Pre%CC%81%20oxyge%CC%81nation%20avec%20notes.pdf"]],"options":["une circonférence du cou > 45cm majore le risque d'intubation difficile","le volume courant est calculé sur le poids réel","La préoxygénation a const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

const $ = id => document.getElementById(id);
const format = (value, digits=4) => value.toLocaleString('fr-FR', {maximumFractionDigits:digits});
const isChoice = q => q.kind === 'QCM' || q.kind === 'QCU';
const isOpen = q => !isChoice(q) && q.kind !== 'context';
const escape = value => String(value).replace(/[&<>"']/g, char => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]
));
const questionLabel = card => card.kind === 'context' ? card.title : `${card.kind} ${card.num}${card.series?' · '+card.series:''}`;
const values = [...'ABCDEFGHIJKL'];


const realCards=DATA.cards.filter(q=>q.kind!=='context');
const nCh=realCards.filter(q=>q.kind==='QCM'||q.kind==='QCU').length,nOp=realCards.length-nCh;
const nPts=Math.round(realCards.reduce((s,q)=>s+(q.points??1),0)*100)/100;
document.title=`UE ${DATA.ue} · Semestre ${DATA.semester} · Promotion 2016-2018 — ${DATA.title}`;
$('h-eyebrow').textContent=`École IADE · UE ${DATA.ue} · Semestre ${DATA.semester} · Promotion 2016-2018`;
$('h-title').textContent=DATA.name;
$('h-title').insertAdjacentHTML('afterend', `<p>${escape(DATA.title)}</p>`);
$('h-stats').innerHTML=[[realCards.length,'questions'],[nCh,'QCM / QCU'],[nOp,'questions ouvertes'],[nPts.toLocaleString('fr-FR'),'points au barème']].filter(([n])=>n!==0).map(([n,t])=>`<div class="hero-stat"><b>${n}</b><span>${t}</span></div>`).join('');
$('h-rules').innerHTML=`<p>QCM sur 1 point : une erreur ou un oubli = 0,5 point${DATA.twoErrors?`, deux erreurs ou oublis = ${String(DATA.twoErrors).replace('.',',')} point`:''}, au-delà 0. QCU sur 1 point.</p><p>Questions ouvertes : ta réponse est comparée aux éléments attendus. Si la détection n’a pas reconnu une bonne idée, clique sur <b>Valider cet élément</b> ou choisis une évaluation manuelle.</p><p>Les questions signalées « hors barème » sont consultables dans la correction. Leurs données, leur figure ou leur corrigé sont insuffisants pour attribuer une note. Les questions ouvertes sont corrigées automatiquement lorsque des critères ont pu être établis. Les autres peuvent être évaluées manuellement après lecture de la correction.</p>`;
$('h-footer').innerHTML=`Source · <a href="${DATA.pdf}">${escape(DATA.pdfLabel)}</a> · Fonctionne hors connexion.`;
$('h-rules').insertAdjacentHTML('beforeend',`<p>${escape(DATA.notes[0])}</p>`);
const srcTag=q=>q.source==='corrige'?'<span class="tag-src deduit">Réponse rectifiée</span>':'';
function sourceCopy(q) {
  return `<p class="small source-line"><a href="${escape(DATA.pdf)}#page=${q.page}">PDF de la promotion · p. ${q.page}</a> · <a href="${escape(DATA.originalPdf)}#page=${q.sourcePage}">Recueil d’origine · p. ${q.sourcePage}</a> · ${escape(q.session)} · ${escape(q.topic)}</p>`;
}
function sources(q) {
  return q.refs.length?`<ul class="small">${q.refs.map(([label,url])=>`<li><a href="${escape(url)}" target="_blank" rel="noopener">${escape(label)}</a></li>`).join('')}</ul>`:'';
}
function answerBox(q){
  let list=q.answer; if(!list) return ''; if(typeof list==='string') list=[list];
  const items=list.map(a=>{const add=a.startsWith('+');const t=add?a.replace(/^\+\s*/,''):a;return `<li class="${add?'added':''}">${escape(t)}${add?'<span class="tag-added">Complément</span>':''}</li>`;}).join('');
  return `<div class="answer-key"><h3>Correction ${srcTag(q)}</h3><ul>${items}</ul>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
}
let active, grades, locked, confirmed, targeted;
const form = $('quiz');
function images(list, label) {
  return list.map((item,i) => `<img loading="lazy" alt="${escape(label)}${list.length>1?' · extrait '+(i+1):''}" src="data:image/jpeg;base64,${item}">`).join('');
}
function scanBlock(scans, label) {
  return `<div class="document"><div class="source-pictures" tabindex="0" aria-label="${escape(label)}">${images(scans,label)}</div><button type="button" class="secondary zoom" aria-expanded="false">Agrandir le scan</button></div>`;
}
function prompt(q) {
  if(q.images) return scanBlock(q.images,questionLabel(q));
  const table=q.table?`<div class="prompt-table">${q.table.map(cell=>`<span>${escape(cell)}</span>`).join('')}</div>`:'';
  return `<h2 class="question-stem">${escape(q.title)}</h2>${q.text?`<p class="context-text">${escape(q.text)}</p>`:''}${q.figures.length?`<div class="q-figure">${q.figures.map((id,i)=>`<img loading="lazy" src="data:image/jpeg;base64,${DATA.figures[id]}" class="question-figure" alt="Figure ${i+1} de la question">`).join('')}</div>`:''}${q.instruction?`<p class="small">${escape(q.instruction)}</p>`:''}${table}`;
}
function fields(q) {
  if (isChoice(q)) {
    return `<div class="choices ${q.options?'written-choices':''}" role="${q.kind==='QCU'?'radiogroup':'group'}" aria-labelledby="title-${q.id}">${q.options.map((_,i)=>values[i]).map((letter,i)=>`<label class="option" id="option-${q.id}-${letter}"><input type="${q.kind==='QCU'?'radio':'checkbox'}" name="${q.id}" value="${letter}"><span><strong>${letter}</strong>${q.options?' · '+escape(q.options[i]):''}<small></small></span></label>`).join('')}</div>`;
  }
  return `<div class="field"><textarea id="answer-${q.id}" aria-labelledby="title-${q.id}" rows="5" placeholder="Ta réponse…"></textarea></div>`;
}
function render() {
  $('cards').innerHTML = active.map((q, index) => {
    const section = q.kind === 'context' ? '<span>Dossier</span>' : `<span>${q.ungraded?'Hors barème':format(q.points)+' pt'} · ${escape(q.session)} · PDF p. ${q.page}</span>`;
    const anchor = active.findIndex(card=>card.kind===q.kind)===index ? ` id="section-${q.kind}"` : '';
    return `<section class="card"${anchor} data-card="${q.id}"><div class="meta"><strong id="title-${q.id}">${escape(questionLabel(q))}</strong>${section}</div>${prompt(q)}${q.kind==='context'?'':fields(q)+`<div class="feedback" id="feedback-${q.id}" hidden></div>`}</section>`;
  }).join('');
  for(const link of document.querySelectorAll('[data-kind]')){
    const kind=link.dataset.kind;
    const index=active.findIndex(q=>kind==='open'?isOpen(q):q.kind===kind);
    link.hidden=index<0;
    if(index>=0) link.hash='section-'+active[index].kind;
  }
}
function response(q) {
  if (isChoice(q)) {
    return [...form.querySelectorAll(`[name="${q.id}"]:checked`)].map(input=>input.value);
  }
  return $(`answer-${q.id}`).value.trim();
}
function progress() {
  const current=active.filter(q=>q.kind!=='context');
  const count=current.filter(q=>response(q).length>0).length;
  $('progress').textContent=`${count} / ${current.length} questions renseignées`;
  $('bar').max=current.length;
  $('bar').value=count;
}
function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.slice(0,q.options.length).filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Évalue ta réponse à partir des éléments du corrigé.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0,ungraded:q.ungraded};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values.slice(0,q.options.length)){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(!q.ungraded&&q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  if (isOpen(q)) {
    panel.innerHTML=`${answerBox(q)}${sources(q)}${q.ungraded?'<p class="small">Question hors barème.</p>':rubricPanel(q,grade)+assessmentControls(q,grade)}${sourceCopy(q)}`;
    return;
  }
  const answers=q.correct.split('').filter(Boolean).map(letter=>q.options[values.indexOf(letter)]);
  const key=`<strong>${q.ungraded?'Hors barème':format(grade.autoScore)+' / 1 point'}</strong><div class="answer-key" style="margin-top:10px"><h3>${q.ungraded?'Éléments pour vérifier':'Correction'}</h3>${answers.length?`<ul class="correct-options">${answers.map(a=>`<li>${escape(a)}</li>`).join('')}</ul>`:''}${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
  panel.innerHTML=key+sources(q)+sourceCopy(q);
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return !grade.ungraded&&(grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max)));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const adjusted=list.some(g=>g.review && g.review!=='blank' || g.analysis?.some(c=>c.override!==null));
  if(adjusted) $('summary').textContent+=' Note ajustée.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(g=>g.ungraded||isComplete(g));
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!q.ungraded&&!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function shuffledCard(q) {
  if (!isChoice(q)) return q;
  const indexes=q.options.map((_,i)=>i);
  for(let i=indexes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
  }
  const correct=indexes.map((index,i)=>q.correct.includes(values[index])?values[i]:'').join('');
  return {...q,options:indexes.map(i=>q.options[i]),correct};
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!g.ungraded&&!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>(!$('topic').value||q.topic===$('topic').value)&&(!keep||keep.has(q.id))).map(shuffledCard);
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
for(const topic of new Set(DATA.cards.map(q=>q.topic))) $('topic').add(new Option(topic,topic));
$('topic').addEventListener('change',()=>start());
start();
</script>

<script>window.MEMO_QUIZ={"id": "annales-nf/S1/3.3-2016-2018", "href": "annales-nf/S1/3.3-2016-2018.html", "collection": "annales-nf", "sem": "S1", "ue": "3.3", "periode": "2016-2018", "titre": "Modalités spécifiques — 2016-2018"};</script>
<script>
/* Mémo : enregistre la note obtenue, pour l'écran « Mes résultats » de l'app.
   Même origine que l'app, donc même localStorage. Une tentative par correction ;
   si la note est ajustée à la main ensuite, la tentative en cours est mise à jour. */
(function () {
  var CLE = 'memo-resultats', INFO = window.MEMO_QUIZ;
  if (!INFO) return;
  var resultats = document.getElementById('results'), score = document.getElementById('score');
  if (!resultats || !score) return;
  var tentative = null;

  function lire() { try { return JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { return []; } }
  function noteDe(txt) {
    var m = String(txt).match(/(-?[\d  ]+(?:[.,]\d+)?)\s*\/\s*20/);
    return m ? parseFloat(m[1].replace(/[  ]/g, '').replace(',', '.')) : null;
  }
  function enregistrer() {
    if (resultats.hidden) return;
    var note = noteDe(score.textContent);
    if (note === null || !isFinite(note)) return;
    var liste = lire();
    var ligne = tentative && liste.find(function (x) { return x.cle === tentative; });
    if (!ligne) {
      tentative = INFO.id + '#' + Date.now();
      ligne = { cle: tentative, id: INFO.id, href: INFO.href, collection: INFO.collection,
        sem: INFO.sem, ue: INFO.ue, periode: INFO.periode, titre: INFO.titre };
      liste.push(ligne);
    }
    ligne.note = Math.round(note * 100) / 100;
    ligne.date = new Date().toISOString();
    try { localStorage.setItem(CLE, JSON.stringify(liste.slice(-300))); } catch (e) {}
  }

  new MutationObserver(enregistrer).observe(score, { childList: true, characterData: true, subtree: true });
  new MutationObserver(enregistrer).observe(resultats, { attributes: true, attributeFilter: ['hidden'] });
  // « Tout recommencer » : la prochaine correction comptera comme une nouvelle tentative.
  document.getElementById('reset') && document.getElementById('reset').addEventListener('click', function () { tentative = null; });
})();
</script>
