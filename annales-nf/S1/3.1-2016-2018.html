e":"Effectuer le schéma d'une courbe de capnogramme normale. identifier les différentes phases de cette courbe","session":"2016-2018 / 2017 -2019 / 2019 -2021","topic":"Monitorage : capno et spo2","points":2,"ungraded":false,"figures":["3.1-8-2"],"refs":[["Cours · CAPNOGRAPHIE (p. 8, à consulter)","../../../cours/S1/3.1/CAPNOGRAPHIE.pdf#page=8"]],"options":[],"correct":"","note":"","answer":["Au début de l’expiration, le CO₂ est quasi nul : gaz de l’espace mort. Puis le CO₂ augmente par mélange avec les gaz alvéolaires.","Le plateau correspond surtout à l’expiration alvéolaire. La PetCO₂ se lit juste avant la descente inspiratoire.","La descente correspond à l’entrée de gaz frais et la ligne de base inspiratoire revient vers zéro."],"sourcePage":8},{"id":"c38","num":6,"page":2,"kind":"QCM","title":"Parmi les propositions concernant le monitorage des patients anesthésiés, rendu obligatoire par le décret du 5 décembre 1994, laquelle où lesquelles est (sont) vraie(s)?","session":"2015-2017 / 2016 -2018","topic":"Monitorage : curarisation","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 2.2 Curares avec notes","../../../cours/2.2%20Curares%20avec%20notes.pdf"],["SFAR · Curarisation et décurarisation","https://sfar.org/curarisation-et-decurarisation-en-anesthesie/"]],"options":["Le monitorage du tracé électrocardioscopique est obligatoire","Le monitorage de la curarisation est obligatoire","Le monitorage de la concentration en gaz carbonique est obligatoire","Le monitorage de la saturation en oxygène est obligatoire","Le monitorage de la profondeur d’anesthésie est obligatoire"],"correct":"ACD","note":"À l’induction, le muscle sourcilier peut aider à estimer l’installation du bloc laryngé. À la récupération, préférer la mesure quantitative à l’adducteur du pouce.","instruction":"Cocher les propositions exactes.","sourcePage":10},{"id":"c40","num":7,"page":2,"kind":"QCM","title":"Parmi les propositions concernant le monitorage de la curarisation, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018 / 2021-2023","topic":"Monitorage : curarisation","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 2.2 Curares avec notes","../../../cours/2.2%20Curares%20avec%20notes.pdf"],["SFAR · Curarisation et décurarisation","https://sfar.org/curarisation-et-decurarisation-en-anesthesie/"]],"options":["l'adducteur laryngé et le muscle sourcilier sont des muscles résistants à la curarisation","L’adducteur du pouce et les muscles impliqués dans la déglutition sont des muscles résistants à la curarisation","le diaphragme est un muscle sensible à la curarisation","un bloc profond est objectivé par 2 réponses visuelles au TOF aux muscles sourciliers","un bloc profond est objectivé par 2 réponses visuelles au TOF à l'adducteur du pouce"],"correct":"A","note":"À l’induction, le muscle sourcilier peut aider à estimer l’installation du bloc laryngé. À la récupération, préférer la mesure quantitative à l’adducteur du pouce.","instruction":"Cocher les propositions exactes.","sourcePage":10},{"id":"c50","num":8,"page":3,"kind":"QUESTION","title":"citer 4 /5 avantages du doppler œsophagien","session":"2016-2018/ 2019-2021","topic":"Monitorage : debit cardiaque","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["Le Doppler œsophagien fournit une estimation du débit aortique et de ses variations au lit du patient, avec une faible invasivité. Le positionnement, l’angle et les hypothèses du calcul en limitent la précision. Il est continu ou répétable, réactif aux changements de débit et peut aider à évaluer la réponse au remplissage."],"sourcePage":12},{"id":"c51","num":9,"page":3,"kind":"QUESTION","title":"Dans le monitorage du débit cardiaque, indiquer la mesure qui vous permet d'adapter votre stratégie de remplissage. Justiﬁer votre réponse","session":"2016-2018","topic":"Monitorage : debit cardiaque","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["La variation du volume d’éjection systolique à une épreuve de remplissage aide à évaluer la réponse au volume. Interpréter avec le contexte hémodynamique et la ventilation."],"sourcePage":12},{"id":"c53","num":10,"page":3,"kind":"QCM","title":"Parmi les propositions concernant le tracé de l'électrocardiogramme ci -dessous, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Monitorage : ecg","points":1,"ungraded":false,"figures":["3.1-13-2"],"refs":[["Cours · 3.1 ECG avec notes","../../../cours/S1/3.1/3.1%20ECG%20avec%20notes.pdf"]],"options":["les ondes QRS sont élargies par rapport à un électrocardiogramme normal","l'espace RR est régulier","l'espace RR est irrégulier","le patient est arythmique","le patient n'est pas arythmique"],"correct":"CD","note":"","instruction":"Cocher les propositions exactes.","sourcePage":13},{"id":"c55","num":11,"page":3,"kind":"QUESTION","title":"identifier les tracés d’électrocardiogrammes ci-dessous","session":"2016-2018","topic":"Monitorage : ecg","points":2,"ungraded":false,"figures":["3.1-13-3","3.1-13-4"],"refs":[["Cours · 3.1 ECG avec notes (p. 126, à consulter)","../../../cours/S1/3.1/3.1%20ECG%20avec%20notes.pdf#page=126"]],"options":[],"correct":"","note":"","answer":["Décrire chaque tracé par fréquence, régularité, ondes P et largeur des QRS. Une activité chaotique sans QRS organisés évoque une fibrillation ventriculaire. Un tracé quasi plat évoque une asystolie après vérification des électrodes et du gain.","Les autres tracés sont dégradés sur le PDF. Leur identification fine est laissée à vérifier sur un ECG de meilleure qualité."],"sourcePage":13},{"id":"c56","num":12,"page":3,"kind":"QCM","title":"Parmi ces propositions concernant le stade 2 de la classification de Guedel, laquelle ou lesquelles est (sont) vraie(s)?","session":"2015-2017/ 2016-2018 / 2017-2019","topic":"Monitorage : sedation – bis","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 BIS avec notes","../../../cours/3.1%20BIS%20avec%20notes.pdf"]],"options":["Lors du stade 2, la ventilation du patient est régulière","Lors du stade 2, le risque de vomissements est présent","Lors du stade 2, le patient présente un état d’agitation","Lors du stade 2, le chirurgien peut débuter l’intervention","Lors du stade 2, les pupilles sont divergentes"],"correct":"BCE","note":"Le BIS dérive de l’EEG et renseigne sur la composante hypnotique. Interpréter l’indice avec la qualité du signal, l’EMG, le taux de suppression et les événements en cours.","instruction":"Cocher les propositions exactes.","sourcePage":14},{"id":"c58","num":13,"page":4,"kind":"QCM","title":"Parmi les propositions concernant le monitorage de l'indice Bispectral, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Monitorage : sedation – bis","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 BIS avec notes (p. 14, à consulter)","../../../cours/3.1%20BIS%20avec%20notes.pdf#page=14"]],"options":["pour un seuil de BIS supérieur à 90% le risque de réveil est probable","le BIS permet d'éviter le surdosage des médicaments d'anesthésie","le BIS permet de prédire la réaction aux stimuli douloureux","le BIS permet de diminuer la survenue des nausées vomissements p ostopératoires","le BIS permet d'évaluer le niveau de la narcose du patient"],"correct":"ABDE","note":"Le BIS dérive de l’EEG et renseigne sur la composante hypnotique. Interpréter l’indice avec la qualité du signal, l’EMG, le taux de suppression et les événements en cours.","instruction":"Cocher les propositions exactes.","sourcePage":14},{"id":"c59","num":14,"page":4,"kind":"QCM","title":"Parmi les propositions concernant les facteurs modifiant la qualité du signal de l'indice Bispectral, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Monitorage : sedation – bis","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 BIS avec notes (p. 14, à consulter)","../../../cours/3.1%20BIS%20avec%20notes.pdf#page=14"]],"options":["l'usage du bistouri électrique","l'usage du monitorage de la curarisation","l'usage d'une couverture chauffante","le patient porteur d'un pacemaker","l'usage d'une pression invasive"],"correct":"ABD","note":"Le BIS dérive de l’EEG et renseigne sur la composante hypnotique. Interpréter l’indice avec la qualité du signal, l’EMG, le taux de suppression et les événements en cours.","instruction":"Cocher les propositions exactes.","sourcePage":14},{"id":"c60","num":15,"page":4,"kind":"QCU","title":"Parmi les propositions concernant le BIS (indice Bispectral), laquelle est vraie? le monitorage de la profondeur de l'anesthésie est recommandé chez la patiente bénéficiant d'une césarienne sous anesthésie générale\n\nCAR\n\nil existe un risque de mémorisation peropératoire important","session":"2016-2018 / 2017-2019","topic":"Monitorage : sedation – bis","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 BIS avec notes (p. 15, à consulter)","../../../cours/3.1%20BIS%20avec%20notes.pdf#page=15"]],"options":["Les propositions sont toutes 2 vraies et il existe entre elles une relation de cause à effet","Les propositions sont toutes 2 vraies sans qu'il existe entre elles de relation de cause à effet","La première proposition est vraie, mais la 2e fausse","La première proposition est fausse, mais la 2e vraie","Les 2 propositions sont fausses"],"correct":"A","note":"Le BIS dérive de l’EEG et renseigne sur la composante hypnotique. Interpréter l’indice avec la qualité du signal, l’EMG, le taux de suppression et les événements en cours.","instruction":"Cocher une seule proposition.","sourcePage":14},{"id":"c68","num":16,"page":4,"kind":"QCM","title":"Parmi les propositions concernant les positions peropératoires, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Postures et installations chirurgicales","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Positions chirurgicales acec notes","../../../cours/3.1%20Positions%20chirurgicales%20acec%20notes.pdf"]],"options":["la position de Trendelenburg expose au risque d’intubation sélective","la position Génu pectorale, théoriquement, est limitée à 1h30","la position en décubitus dorsal ne modifie pas la CRF (capacité résiduelle fonctionnelle)","la position proclive augmente le débit cardiaque","la position de lithotomie expose au risque de compression fémorale"],"correct":"AE","note":"Avant de mobiliser, coordonner l’équipe, sécuriser sonde, voies et moniteurs, puis protéger yeux, appuis et nerfs. Après mobilisation, vérifier ventilation, capnographie, pression, pouls, fixation et absence de traction.","instruction":"Cocher les propositions exactes.","sourcePage":16},{"id":"c69","num":17,"page":4,"kind":"QCM","title":"Parmi les propositions concernant la mise en place d'un décubitus latéral droit, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Postures et installations chirurgicales","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Positions chirurgicales acec notes","../../../cours/3.1%20Positions%20chirurgicales%20acec%20notes.pdf"]],"options":["cette position favorise l'accumulation des sécrétions dans le poumon inférieur","cette position associée à un billot entraîne un risque de diminution du retour veineux","cette position associée à un billot entraîne une augmentation du retour veineux","cette position favorise le risque de compression oculaire","cette position entraîne une hausse du débit cardiaque"],"correct":"ABD","note":"Avant de mobiliser, coordonner l’équipe, sécuriser sonde, voies et moniteurs, puis protéger yeux, appuis et nerfs. Après mobilisation, vérifier ventilation, capnographie, pression, pouls, fixation et absence de traction.","instruction":"Cocher les propositions exactes.","sourcePage":16},{"id":"c78","num":18,"page":5,"kind":"QUESTION","title":"expliquer les différents impératifs à respecter avant l'installation d'un patient en position de Trendelenbourg","session":"2015-2017 / 2016-2018","topic":"Postures et installations chirurgicales","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Positions chirurgicales acec notes (p. 19, à consulter)","../../../cours/3.1%20Positions%20chirurgicales%20acec%20notes.pdf#page=19"]],"options":[],"correct":"","note":"","answer":["Avant de mobiliser, coordonner l’équipe, sécuriser sonde, voies et moniteurs, puis protéger yeux, appuis et nerfs. Après mobilisation, vérifier ventilation, capnographie, pression, pouls, fixation et absence de traction.","Adapter ventilation, appuis et surveillance au décubitus et à l’intervention. Le billot et les compressions peuvent modifier hémodynamique et ventilation."],"sourcePage":17},{"id":"c86","num":19,"page":5,"kind":"QCM","title":"Parmi les propositions concernant les critères de ventilation au masque difficile, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Pre-oxygenation – ventilation manuelle – iot – ml","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Pré oxygénation avec notes (p. 28, à consulter)","../../../cours/S1/3.1/Pre%CC%81%20oxyge%CC%81nation%20avec%20notes.pdf#page=28"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":["âge supérieur à 50 ans","indice de masse corporelle supérieure à 26 kg/m²","le patient édenté","un mallampati 2","un syndrome d'apnée du sommeil"],"correct":"ABCE","note":"Préoxygéner avec une FiO₂ élevée et un masque étanche pour dénitrogéner la CRF et augmenter le temps avant désaturation. Une FeO₂ proche de 90 % est un repère usuel.","instruction":"Cocher les propositions exactes.","sourcePage":19},{"id":"c91","num":20,"page":5,"kind":"QUESTION","title":"réaliser un schéma illustrant les différentes étapes d'une induction à séquence rapide","session":"2015-2017 / 2016-2018 / 2017 -2019 / 2019-2021","topic":"Pre-oxygenation – ventilation manuelle – iot – ml","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Pré oxygénation avec notes (p. 18, à consulter)","../../../cours/S1/3.1/Pre%CC%81%20oxyge%CC%81nation%20avec%20notes.pdf#page=18"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["L’induction en séquence rapide comprend préparation, préoxygénation, hypnotique et curare d’action rapide, intubation et confirmation par capnographie. La pression cricoïdienne dépend du contexte et peut gêner la ventilation ou l’intubation."],"sourcePage":20},{"id":"c93","num":21,"page":5,"kind":"QUESTION","title":") : définir le principe de la pré oxygénation en indiquant l'objectif thérapeutique attendu. Citer les 3 méthodes possibles de pré oxygénation","session":"2015-2017 / 2016-2018","topic":"Pre-oxygenation – ventilation manuelle – iot – ml","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Pré oxygénation avec notes (p. 10, à consulter)","../../../cours/S1/3.1/Pre%CC%81%20oxyge%CC%81nation%20avec%20notes.pdf#page=10"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Dénitrogéner la capacité résiduelle fonctionnelle pour augmenter les réserves en oxygène et retarder la désaturation pendant l’apnée.","Masque étanche, FiO₂ élevée et ventilation adaptée. FeO₂ proche de 90 % comme repère."],"sourcePage":20},{"id":"c104","num":22,"page":5,"kind":"QCM","title":"Sur la photo 1 du sujet, quelles propositions décrivent le risque d’intubation et la classe de Mallampati ?","session":"2015-2017 / 2016-2018 / 2017-2019 / 2019-2021","topic":"Processus d’anesthesie","points":1,"ungraded":false,"figures":["3.1-22-1"],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 20–21, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=20"]],"options":["Ce patient présente un risque potentiel d’intubation difficile.","Ce patient est coté Mallampati IV.","Ce patient est coté Cormack-Lehane IV.","Ce patient est coté Mallampati II.","Ce patient est coté Cormack-Lehane II."],"correct":"AD","note":"La photo 1 est compatible avec une classe II. Le cours retient un Mallampati ≥ 2 parmi les signes à rechercher. L’évaluation combine plusieurs critères. Le grade de Cormack-Lehane s’évalue sur la vue laryngoscopique.","instruction":"Cocher les propositions exactes.","sourcePage":22},{"id":"c105","num":23,"page":6,"kind":"QCM","title":"Parmi les propositions concernant les traitements à arrêter en préopératoire, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Processus d’anesthesie","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":["les diurétiques","les antagonistes des récepteurs de l'angiotensine 2 prescrits pour hypertension artérielle","les biguanides","les anti épileptiques","les corticoïdes au long cours"],"correct":"ABC","note":"Consultation : évaluer terrain, intervention, voies aériennes et traitements, planifier la stratégie, informer et tracer. Visite dans les 24 h : rechercher des changements et vérifier la préparation.","instruction":"Cocher les propositions exactes.","sourcePage":22},{"id":"c114","num":24,"page":6,"kind":"QUESTION","title":"définissez la classification ASA et expliquer les différentes classes","session":"2016-2018 / 2017-2019","topic":"Processus d’anesthesie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 26, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=26"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":[],"correct":"","note":"","answer":["ASA I sain, II affection systémique légère, III affection sévère, IV menace constante pour la vie, V moribond sans chirurgie, VI donneur en mort encéphalique. E signale l’urgence."],"sourcePage":24},{"id":"c117","num":25,"page":6,"kind":"QUESTION","title":"Citer les règles du jeûne chez un adulte, avant une intervention chirurgicale","session":"2016-2018","topic":"Processus d’anesthesie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 129, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=129"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":[],"correct":"","note":"","answer":["Chez un adulte en chirurgie programmée, sans risque particulier de retard de vidange : liquides clairs jusqu’à 2 heures avant, repas léger au moins 6 heures, repas gras ou copieux au moins 8 heures."],"sourcePage":24},{"id":"c118","num":26,"page":6,"kind":"QUESTION","title":"citer les facteurs prédictifs de la survenue des nausées vomissements postopératoires en précisant le score utilisé pour leur cotation et le seuil requis pour initier la prévention médicamenteuse","session":"2015-2017 / 2016 -2018","topic":"Processus d’anesthesie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 14, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=14"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":[],"correct":"","note":"","answer":["Score simplifié d’Apfel : sexe féminin, non-tabagisme, antécédent de NVPO ou mal des transports et opioïdes postopératoires. Le risque augmente avec leur nombre."],"sourcePage":24},{"id":"c128","num":27,"page":6,"kind":"QCM","title":"Parmi les propositions concernant les conséqu ences de l’hypothermie en salle de surveillance post opératoire, laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Le reveil en anesthesie – sspi","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 SSPI Avec notes","../../../cours/S1/3.1/3.1%20SSPI%20Avec%20notes.pdf"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":["une augmentation des pertes sanguines","une hypoventilation alvéolaire","une diminution de la demi-vie des morphiniques","une augmentation des sensations douloureuses","une augmentation du temps de décurarisation"],"correct":"ADE","note":"Extubation : conscience adaptée, ventilation spontanée et échanges satisfaisants, stabilité circulatoire, absence de complication limitante et décurarisation quantitative. Prévoir une stratégie de secours.","instruction":"Cocher les propositions exactes.","sourcePage":26},{"id":"c137","num":28,"page":6,"kind":"QUESTION","title":"citer l'ensemble des critères permettant l’extubation d'un patient intubé, ventilé, sous anesthésie générale en fin d'intervention","session":"2016-2018","topic":"Le reveil en anesthesie – sspi","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 SSPI Avec notes (p. 83, à consulter)","../../../cours/S1/3.1/3.1%20SSPI%20Avec%20notes.pdf#page=83"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Extubation : conscience adaptée, ventilation spontanée et échanges satisfaisants, stabilité circulatoire, absence de complication limitante et décurarisation quantitative. Prévoir une stratégie de secours."],"sourcePage":27},{"id":"c143","num":29,"page":6,"kind":"QCM","title":"Parmi les propositions concernant une augmentation de la pression maximale du respirateur en cours d'anesthésie (pression inspiratoire maximale), laquelle ou lesquelles est (sont) vraie(s)?","session":"2016-2018","topic":"Ventilation mecanique","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Ventilation mécanique avec notes (p. 66, à consulter)","../../../cours/S1/3.1/3.1%20Ventilation%20me%CC%81canique%20avec%20notes.pdf#page=66"]],"options":["Devant la hausse de la pression maximale, il faut rechercher une fuite dans le circuit","Devant la hausse de la pression maximale, il faut rechercher un obstacle dans la sonde d’intubation","Devant la hausse de la pression maximale, il faut alléger immédiatement l’anesthésie","Devant la hausse de la pression maximale, il faut ausculter le patient","Devant la hausse de la pression maximale, il faut vérifier l’intégrité du circuit","il ne faut pas aspirer le patient"],"correct":"BDE","note":"En volume contrôlé, le volume est réglé et la pression varie. En pression contrôlée, la pression inspiratoire est réglée et le volume dépend de la mécanique. En aide inspiratoire, le patient déclenche ses cycles.","instruction":"Cocher les propositions exactes.","sourcePage":28},{"id":"c153","num":30,"page":7,"kind":"QUESTION","title":"donner une définition de la valve APL. Expliquer le mode d'utilisation de la valve APL en ventilation spontanée et en ventilation contrôlée","session":"2016-2018 / 2017-2019","topic":"Ventilation mecanique","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Ventilation mécanique avec notes (p. 26, à consulter)","../../../cours/S1/3.1/3.1%20Ventilation%20me%CC%81canique%20avec%20notes.pdf#page=26"]],"options":[],"correct":"","note":"","answer":["La valve APL évacue le gaz excédentaire au-delà d’une pression réglée en mode manuel ou spontané.","En spontané, elle est largement ouverte selon la machine. En manuel, régler la limite et surveiller la pression au manomètre."],"sourcePage":30}],"figures":{"3.1-6-2":"/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgICAgMCAgIDAwMDBAYEBAQEBAgGBgUGCQgKCgkICQkKDA8MCgsOCwkJDRENDg8QEBEQCgwSExIQEw8QEBD/2wBDAQMDAwQDBAgEBAgQCwkLEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBD/wAARCAClAqMDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD9SH+Rv3dG/wD6Z0P9ymUAPpjvRUTvuoAieb56d52//lnUTpJ5tSoj7KAJqN8iUxPuUx3oAm859lO3+1Rb/wDnpUsPz0APR/8AppUtN8mP1omT/nnQBDuen7N+zzKr75PN2SVK8ybf3aUATfwUxKZ9s+b/AFdG/wCegCaiod/tUVzc7P3iUAW6Z/10qlDczu+zZ8lWt+9aAJvOT/npTHfdVd4Y6f8A346AJf8ApnQibFo3+1Mf737ugCb92nySUzf/ALdV97u/mPVf7T8n7ygDQ+/Vd3+emQvvT/Yp/wB+gCXfHt/3Ki37/wB3/cod/wDyJTP+mf8AcoAf/BRv+SonmjT/ALaVL+7+5QA/Yn9+mOnzfu5Kf9xKZv3/AOsoAYj0/wCfY/l0zfIlRPNQAxPMp9M/6aUO/wDzzoAbRv8AamI8jv8APT/46ACjfvamP9+mfx0ATUb/APlnVd3p256AH/x09/u+ZvplRXkMnlf3KAJXeP8A557EpiPtqum/bVtPufvI6AH/APXOmPT6Nkf/AC0oAdRT6Y9AEUz7P9ZJ/ufJTKH8t28x/wCCigB//XOimU+gA37KelM2SO9WPJ2f6ygARI/+WlNd5E3xpH8lO/65090egATy32U7+Om/8ApyJ89AB/33USeY71Y2pTHTetAEW/2p9Dw+TEuyhEfZQBLv9qP4KZ89Dv5KeZQA+ipURNiSVEPvvQAf9dKP+mdP2f8ALOmUAHzp8n36Ef5KKP3f/LSgB9Mq3sj21C9ADaE+5TEen/8AXSgB2/5KKP4KfQAym0fx0UAFH36Zs96fQAfPRTqKAHvRT3TYtMoAr3l5a6bay319JsigTe71ieFfGfhnxtbyz+HLv7TFA+x6PH/lzeD9Vj/6c3/9ArxX9jC5gfwVqccf30vH3/8AjlAH0O/36VKc/wB+m0AOqKn0ygA+4m+rFn83NVHf5KsWb0AW/vpRs96Y7/Lv8ujf8q/JQBE9nvl8zzKHhkqx9+mOlAFfZ8j0bPep const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

$('h-title').textContent=DATA.name;
$('h-title').insertAdjacentHTML('afterend', `<p>${escape(DATA.title)}</p>`);
$('h-stats').innerHTML=[[realCards.length,'questions'],[nCh,'QCM / QCU'],[nOp,'questions ouvertes'],[nPts.toLocaleString('fr-FR'),'points au barème']].filter(([n])=>n!==0).map(([n,t])=>`<div class="hero-stat"><b>${n}</b><span>${t}</span></div>`).join('');
$('h-rules').innerHTML=`<p>QCM sur 1 point : une erreur ou un oubli = 0,5 point${DATA.twoErrors?`, deux erreurs ou oublis = ${String(DATA.twoErrors).replace('.',',')} point`:''}, au-delà 0. QCU sur 1 point.</p><p>Questions ouvertes : ta réponse est comparée aux éléments attendus. Si la détection n’a pas reconnu une bonne idée, clique sur <b>Valider cet élément</b> ou choisis une évaluation manuelle.</p><p>Les questions signalées « hors barème » sont consultables dans la correction. Leurs données, leur figure ou leur corrigé sont insuffisants pour attribuer une note. Les questions ouvertes sont corrigées automatiquement lorsque des critères ont pu être établis. Les autres peuvent être évaluées manuellement après lecture de la correction.</p>`;
$('h-footer').innerHTML=`Source · <a href="${DATA.pdf}">${escape(DATA.pdfLabel)}</a> · Fonctionne hors connexion.`;
$('h-rules').insertAdjacentHTML('beforeend',`<p>${escape(DATA.notes[0])}</p>`);
const srcTag=q=>q.source==='corrige'?'<span class="tag-src deduit">Réponse rectifiée</span>':'';
function sourceCopy(q) {
  return `<p class="small source-line"><a href="${escape(DATA.pdf)}#page=${q.page}">PDF de la promotion · p. ${q.page}</a> · <a href="${escape(DATA.originalPdf)}#page=${q.sourcePage}">Recueil d’origine · p. ${q.sourcePage}</a> · ${escape(q.session)} · ${escape(q.topic)}</p>`;
}
function sources(q) {
  return q.refs.length?`<ul class="small">${q.refs.map(([label,url])=>`<li><a href="${escape(url)}" target="_blank" rel="noopener">${escape(label)}</a></li>`).join('')}</ul>`:'';
}
function answerBox(q){
  let list=q.answer; if(!list) return ''; if(typeof list==='string') list=[list];
  const items=list.map(a=>{const add=a.startsWith('+');const t=add?a.replace(/^\+\s*/,''):a;return `<li class="${add?'added':''}">${escape(t)}${add?'<span class="tag-added">Complément</span>':''}</li>`;}).join('');
  return `<div class="answer-key"><h3>Correction ${srcTag(q)}</h3><ul>${items}</ul>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
}
let active, grades, locked, confirmed, targeted;
const form = $('quiz');
function images(list, label) {
  return list.map((item,i) => `<img loading="lazy" alt="${escape(label)}${list.length>1?' · extrait '+(i+1):''}" src="data:image/jpeg;base64,${item}">`).join('');
}
function scanBlock(scans, label) {
  return `<div class="document"><div class="source-pictures" tabindex="0" aria-label="${escape(label)}">${images(scans,label)}</div><button type="button" class="secondary zoom" aria-expanded="false">Agrandir le scan</button></div>`;
}
function prompt(q) {
  if(q.images) return scanBlock(q.images,questionLabel(q));
  const table=q.table?`<div class="prompt-table">${q.table.map(cell=>`<span>${escape(cell)}</span>`).join('')}</div>`:'';
  return `<h2 class="question-stem">${escape(q.title)}</h2>${q.text?`<p class="context-text">${escape(q.text)}</p>`:''}${q.figures.length?`<div class="q-figure">${q.figures.map((id,i)=>`<img loading="lazy" src="data:image/jpeg;base64,${DATA.figures[id]}" class="question-figure" alt="Figure ${i+1} de la question">`).join('')}</div>`:''}${q.instruction?`<p class="small">${escape(q.instruction)}</p>`:''}${table}`;
}
function fields(q) {
  if (isChoice(q)) {
    return `<div class="choices ${q.options?'written-choices':''}" role="${q.kind==='QCU'?'radiogroup':'group'}" aria-labelledby="title-${q.id}">${q.options.map((_,i)=>values[i]).map((letter,i)=>`<label class="option" id="option-${q.id}-${letter}"><input type="${q.kind==='QCU'?'radio':'checkbox'}" name="${q.id}" value="${letter}"><span><strong>${letter}</strong>${q.options?' · '+escape(q.options[i]):''}<small></small></span></label>`).join('')}</div>`;
  }
  return `<div class="field"><textarea id="answer-${q.id}" aria-labelledby="title-${q.id}" rows="5" placeholder="Ta réponse…"></textarea></div>`;
}
function render() {
  $('cards').innerHTML = active.map((q, index) => {
    const section = q.kind === 'context' ? '<span>Dossier</span>' : `<span>${q.ungraded?'Hors barème':format(q.points)+' pt'} · ${escape(q.session)} · PDF p. ${q.page}</span>`;
    const anchor = active.findIndex(card=>card.kind===q.kind)===index ? ` id="section-${q.kind}"` : '';
    return `<section class="card"${anchor} data-card="${q.id}"><div class="meta"><strong id="title-${q.id}">${escape(questionLabel(q))}</strong>${section}</div>${prompt(q)}${q.kind==='context'?'':fields(q)+`<div class="feedback" id="feedback-${q.id}" hidden></div>`}</section>`;
  }).join('');
  for(const link of document.querySelectorAll('[data-kind]')){
    const kind=link.dataset.kind;
    const index=active.findIndex(q=>kind==='open'?isOpen(q):q.kind===kind);
    link.hidden=index<0;
    if(index>=0) link.hash='section-'+active[index].kind;
  }
}
function response(q) {
  if (isChoice(q)) {
    return [...form.querySelectorAll(`[name="${q.id}"]:checked`)].map(input=>input.value);
  }
  return $(`answer-${q.id}`).value.trim();
}
function progress() {
  const current=active.filter(q=>q.kind!=='context');
  const count=current.filter(q=>response(q).length>0).length;
  $('progress').textContent=`${count} / ${current.length} questions renseignées`;
  $('bar').max=current.length;
  $('bar').value=count;
}
function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.slice(0,q.options.length).filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Évalue ta réponse à partir des éléments du corrigé.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0,ungraded:q.ungraded};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values.slice(0,q.options.length)){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(!q.ungraded&&q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  if (isOpen(q)) {
    panel.innerHTML=`${answerBox(q)}${sources(q)}${q.ungraded?'<p class="small">Question hors barème.</p>':rubricPanel(q,grade)+assessmentControls(q,grade)}${sourceCopy(q)}`;
    return;
  }
  const answers=q.correct.split('').filter(Boolean).map(letter=>q.options[values.indexOf(letter)]);
  const key=`<strong>${q.ungraded?'Hors barème':format(grade.autoScore)+' / 1 point'}</strong><div class="answer-key" style="margin-top:10px"><h3>${q.ungraded?'Éléments pour vérifier':'Correction'}</h3>${answers.length?`<ul class="correct-options">${answers.map(a=>`<li>${escape(a)}</li>`).join('')}</ul>`:''}${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
  panel.innerHTML=key+sources(q)+sourceCopy(q);
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return !grade.ungraded&&(grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max)));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const adjusted=list.some(g=>g.review && g.review!=='blank' || g.analysis?.some(c=>c.override!==null));
  if(adjusted) $('summary').textContent+=' Note ajustée.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(g=>g.ungraded||isComplete(g));
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!q.ungraded&&!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function shuffledCard(q) {
  if (!isChoice(q)) return q;
  const indexes=q.options.map((_,i)=>i);
  for(let i=indexes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
  }
  const correct=indexes.map((index,i)=>q.correct.includes(values[index])?values[i]:'').join('');
  return {...q,options:indexes.map(i=>q.options[i]),correct};
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!g.ungraded&&!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>(!$('topic').value||q.topic===$('topic').value)&&(!keep||keep.has(q.id))).map(shuffledCard);
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
for(const topic of new Set(DATA.cards.map(q=>q.topic))) $('topic').add(new Option(topic,topic));
$('topic').addEventListener('change',()=>start());
start();
</script>
