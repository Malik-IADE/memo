</main><noscript><p>Active JavaScript pour répondre au partiel.</p></noscript><script>const DATA={"semester":1,"ue":"3.1","title":"Les techniques d'anesthésie, réanimation et urgences, principes et mises en œuvre","cards":[{"id":"c1","num":1,"page":1,"kind":"QCM","title":"Parmi les propositions concernant l'anesthésie intraveineuse à objectif de concentration (AIVOC), laquelle ou lesquelles est (sont) vraie(s)?","session":"2017-2019 / 2020 -2022","topic":"Aivoc – sivoc – ainoc","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 AIVOC Avec notes (p. 1, à consulter)","../../../cours/3.1%20AIVOC%20Avec%20notes.pdf#page=1"]],"options":["l’AIVOC tient compte de la variabilité interindividuelle","l’AIVOC tient compte de la variation du débit cardiaque","l’AIVOC tient compte de la durée d'administration","l’AIVOC tient compte de l’hémodynamique du patient","l’AIVOC tient compte des variations qui incombent de la clairance","l’AIVOC tient compte de la concentration des morphiniques","l’AIVOC tient compte de la variation du métabolisme"],"correct":"CE","note":"AIVOC : une pompe utilise un modèle pharmacocinétique et une cible plasmatique ou au site effet pour adapter le débit dans le temps. La concentration est estimée.","instruction":"Cocher les propositions exactes.","sourcePage":2},{"id":"c4","num":2,"page":1,"kind":"QCM","title":"Parmi les propositions concernant l’anesthésie en AIVOC, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Aivoc – sivoc – ainoc","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 AIVOC Avec notes","../../../cours/3.1%20AIVOC%20Avec%20notes.pdf"]],"options":["l'objectif est de perfuser un médicament en tenant compte du modèle pharmacocinétique","l'adaptation de la posologie est faite en débit massique","l'objectif de concentration est défini au niveau plasmatique","la concentration administrée varie en fonction du temps chirurgical","le logiciel adapte la vitesse en tenant compte du temps écoulé depuis le début de la perfusion"],"correct":"ACE","note":"AIVOC : une pompe utilise un modèle pharmacocinétique et une cible plasmatique ou au site effet pour adapter le débit dans le temps. La concentration est estimée.","instruction":"Cocher les propositions exactes.","sourcePage":2},{"id":"c5","num":3,"page":1,"kind":"QUESTION","title":"définir l’AIVOC et énoncer ses limites d'utilisation","session":"2020-2022","topic":"Aivoc – sivoc – ainoc","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 AIVOC Avec notes (p. 36, à consulter)","../../../cours/3.1%20AIVOC%20Avec%20notes.pdf#page=36"]],"options":[],"correct":"","note":"","answer":["AIVOC : une pompe utilise un modèle pharmacocinétique et une cible plasmatique ou au site effet pour adapter le débit dans le temps. La concentration est estimée.","Le modèle intègre certaines covariables, mais ne suit pas en temps réel le débit cardiaque, la clairance réelle ou les interactions. Titrer selon la réponse clinique et le monitorage."],"sourcePage":2},{"id":"c7","num":4,"page":1,"kind":"QUESTION","title":"définir et argumenter l'utilisation de l’AINOC","session":"2020-2022","topic":"Aivoc – sivoc – ainoc","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 AIVOC Avec notes (p. 37, à consulter)","../../../cours/3.1%20AIVOC%20Avec%20notes.pdf#page=37"]],"options":[],"correct":"","note":"","answer":["AINOC : l’appareil adapte l’administration pour atteindre une cible de concentration expirée d’agent volatil et maintenir l’oxygénation. La performance dépend du dispositif et du débit de gaz frais."],"sourcePage":2},{"id":"c15","num":5,"page":1,"kind":"QCM","title":"Parmi les propositions concernant la check -list de la Haute Autorité de santé (HAS), laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Check list has – feuille anesthesie","points":1,"ungraded":false,"figures":[],"refs":[["HAS · Check-list du bloc","https://www.has-sante.fr/jcms/c_2607929/fr/check-list-securite-du-patient-au-bloc-operatoire-et-son-mode-d-emploi-version-2018"]],"options":["elle est composée de 4 étapes","elle mentionne si le patient présente un risque thrombo-embolique","Elle mentionne le risque allergique du patient","elle mentionne la présence d'une autorisation d'opérer signée pour les mineurs","elle est obligatoire depuis le 30-12-2005"],"correct":"C","note":"","instruction":"Cocher les propositions exactes.","sourcePage":4},{"id":"c20","num":6,"page":2,"kind":"QCU","title":"Parmi les propositions concernant l'analyse clinique de la courbe de capnogramme ci-dessous, laquelle est vraie? Une seule réponse possible","session":"2015-2017 / 2020 -2022","topic":"Monitorage : capno et spo2","points":1,"ungraded":false,"figures":["3.1-6-1"],"refs":[["Cours · CAPNOGRAPHIE (p. 7, à consulter)","../../../cours/S1/3.1/CAPNOGRAPHIE.pdf#page=7"]],"options":["Le tracé évoque une reprise ventilatoire spontanée au réveil.","Le tracé évoque une réinhalation de CO₂.","Le tracé évoque une hyperthermie maligne.","Le tracé évoque une intubation œsophagienne.","Le tracé évoque un bronchospasme."],"correct":"A","note":"L’encoche sur le plateau peut traduire une reprise d’effort inspiratoire, notamment au réveil ou lors de la récupération du bloc. Une ligne de base à zéro n’évoque pas une réinhalation. Une encoche isolée ne suffit pas à distinguer un réveil d’une récupération de l’activité musculaire respiratoire.","instruction":"Cocher une seule proposition.","sourcePage":6},{"id":"c27","num":7,"page":2,"kind":"QCM","title":"Parmi les propositions concernant l’oxymétrie de pouls, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Monitorage : capno et spo2","points":1,"ungraded":false,"figures":[],"refs":[["Cours · CAPNOGRAPHIE","../../../cours/S1/3.1/CAPNOGRAPHIE.pdf"]],"options":["l'oxymétrie de pouls repose sur le principe de la pléthysmographie","L'oxymétrie de pouls permet de dépister les arythmies cardiaques","l'oxymétrie de pouls détecte l'hyperoxie","l'oxymétrie de pouls, mesure la fréquence cardiaque par le signa l pulsatile","l'oxymétrie de pouls calcule la saturation du flux pulsatile, en éliminant les valeurs correspondant au sang veineux et capillaire"],"correct":"ADE","note":"La PetCO₂ dépend de la production métabolique de CO₂, du débit sanguin pulmonaire, de la ventilation alvéolaire et du rapport ventilation/perfusion.","instruction":"Cocher les propositions exactes.","sourcePage":7},{"id":"c33","num":8,"page":3,"kind":"QUESTION","title":"Annoter le schéma ci-dessous. Indiquer à l'aide d'une flèche le moment où l’EtCO2 est mesuré. Décrire les phases 1 à 4","session":"2020-2022","topic":"Monitorage : capno et spo2","points":2,"ungraded":false,"figures":["3.1-9-1"],"refs":[["Cours · CAPNOGRAPHIE (p. 8, à consulter)","../../../cours/S1/3.1/CAPNOGRAPHIE.pdf#page=8"]],"options":[],"correct":"","note":"","answer":["Au début de l’expiration, le CO₂ est quasi nul : gaz de l’espace mort. Puis le CO₂ augmente par mélange avec les gaz alvéolaires.","Le plateau correspond surtout à l’expiration alvéolaire. La PetCO₂ se lit juste avant la descente inspiratoire.","La descente correspond à l’entrée de gaz frais et la ligne de base inspiratoire revient vers zéro."],"sourcePage":9},{"id":"c44","num":9,"page":3,"kind":"QCM","title":"Parmi les propositions concernant la curarisation résiduelle, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Monitorage : curarisation","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 2.2 Curares avec notes","../../../cours/2.2%20Curares%20avec%20notes.pdf"],["SFAR · Curarisation et décurarisation","https://sfar.org/curarisation-et-decurarisation-en-anesthesie/"]],"options":["le risque de survenue d'une pneumopathie est majoré en cas de curarisation résiduelle","La reprise d'une ventilation spontanée élimine une curarisation résiduelle","4 réponses au train de 4 à l'adducteur du pouce permettent d'éliminer une curarisation résiduelle","un rapport T4/T1> 90 % Au train de 4 aux sourciliers permet d'éliminer une curarisation résiduelle","l'antagonisation par Prostigmine/atropine permet de prévenir une curarisation résiduelle"],"correct":"A","note":"À l’induction, le muscle sourcilier peut aider à estimer l’installation du bloc laryngé. À la récupération, préférer la mesure quantitative à l’adducteur du pouce.","instruction":"Cocher les propositions exactes.","sourcePage":11},{"id":"c46","num":10,"page":3,"kind":"QUESTION","title":"définir la curarisation résiduelle. Enoncer les différentes conséquences liées à la curarisation résiduelle","session":"2020-2022","topic":"Monitorage : curarisation","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 2.2 Curares avec notes (p. 97, à consulter)","../../../cours/2.2%20Curares%20avec%20notes.pdf#page=97"],["SFAR · Curarisation et décurarisation","https://sfar.org/curarisation-et-decurarisation-en-anesthesie/"]],"options":[],"correct":"","note":"","answer":["À l’induction, le muscle sourcilier peut aider à estimer l’installation du bloc laryngé. À la récupération, préférer la mesure quantitative à l’adducteur du pouce.","Bloc résiduel : T4/T1 < 0,90. Risques : obstruction, dysphagie, inhalation et hypoxémie. Quatre réponses palpables seules ne suffisent pas."],"sourcePage":11},{"id":"c48","num":11,"page":3,"kind":"QCM","title":"Parmi les propositions concernant le score de LEE quels sont les éléments à rechercher parmi ces propositions","session":"2020-2022","topic":"Monitorage : debit cardiaque","points":1,"ungraded":false,"figures":[],"refs":[],"options":["chirurgie programmée","cardiopathie ischémique préexistante","antécédents d'insuffisance cardiaque","antécédent d'accident vasculaire cérébral","antécédent d'hypertension artérielle"],"correct":"BCD","note":"Le Doppler œsophagien fournit une estimation du débit aortique et de ses variations au lit du patient, avec une faible invasivité. Le positionnement, l’angle et les hypothèses du calcul en limitent la précision.","instruction":"Cocher les propositions exactes.","sourcePage":12},{"id":"c54","num":12,"page":4,"kind":"QCM","title":"Parmi les propositions concernant le tracé d'un électrocardiogramme (ECG) 12 dérivations, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Monitorage : ecg","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 ECG avec notes","../../../cours/S1/3.1/3.1%20ECG%20avec%20notes.pdf"]],"options":["La dérivation V2 est une dérivation précordiale","la dérivation AVF est une dérivation précordiale","un tracé au scope obtenu avec un câble 5 brins permet d'obtenir un tracé des dérivations précordiales","un tracé au scope obtenu avec un câble 5 brins permet d'obtenir des informations localisatrices d'un trouble de la repolarisation","le diagnostic d’une anomalie suspectée au sco pe doit faire réaliser un tracé ECG 12 dérivations"],"correct":"AE","note":"","instruction":"Cocher les propositions exactes.","sourcePage":13},{"id":"c63","num":13,"page":4,"kind":"QCM","title":"Parmi les propositions concernant le monitorage de l'indice Bispectral (BIS), laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Monitorage : sedation – bis","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 BIS avec notes (p. 14, à consulter)","../../../cours/3.1%20BIS%20avec%20notes.pdf#page=14"]],"options":["Pour un seuil de BIS supérieur à 90 %, le risque de réveil est probable","le seuil de BIS souhaité lors d'une intubation orotrachéale est de 65","un BIS inférieur à 30 est le reflet d'une analgésie trop profonde","la valeur affichée sur le moniteur de BIS est moyennée sur les dernières 15-30 secondes","l'administration de kétamine n'a aucune incidence sur les valeurs du BIS"],"correct":"AD","note":"Le BIS dérive de l’EEG et renseigne sur la composante hypnotique. Interpréter l’indice avec la qualité du signal, l’EMG, le taux de suppression et les événements en cours.","instruction":"Cocher les propositions exactes.","sourcePage":15},{"id":"c66","num":14,"page":4,"kind":"QUESTION","title":"Au cours d'une anesthésie générale, énoncer 5 situations responsables d'une chute brutale de la valeur du BIS","session":"2020-2022","topic":"Monitorage : sedation – bis","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 BIS avec notes (p. 61, à consulter)","../../../cours/3.1%20BIS%20avec%20notes.pdf#page=61"]],"options":[],"correct":"","note":"","answer":["Vérifier déconnexion d’électrode, chute de qualité du signal, changement d’EMG (notamment après curare), bolus hypnotique et diminution de perfusion cérébrale.","Recouper avec EEG brut, taux de suppression, PA et événements anesthésiques."],"sourcePage":15},{"id":"c76","num":15,"page":4,"kind":"QCU","title":"Parmi les propositions concernant L'altération du rapport ventilation/perfusion engendré par le décubitus latéral, laquelle est vraie? l'altération du rapport ventilation/perfusion lié au décubitus latéral a pour conséquence une hypoxie et une hypercapnie\n\nCAR\n\nle poumon déclive est bien ventilé mais mal perfusé","session":"2020-2022","topic":"Postures et installations chirurgicales","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Positions chirurgicales acec notes (p. 44, à consulter)","../../../cours/3.1%20Positions%20chirurgicales%20acec%20notes.pdf#page=44"]],"options":["Les propositions sont toutes 2 vraies et il existe entre elles une relation de cause à effet","Les propositions sont toutes 2 vraies sans qu’il existe entre elles de relation de cause à effet","La première proposition est vraie, mais la 2e fausse","La première proposition est fausse, mais la 2 e vraie","Les 2 propositions sont fausses"],"correct":"C","note":"Avant de mobiliser, coordonner l’équipe, sécuriser sonde, voies et moniteurs, puis protéger yeux, appuis et nerfs. Après mobilisation, vérifier ventilation, capnographie, pression, pouls, fixation et absence de traction.","instruction":"Cocher une seule proposition.","sourcePage":17},{"id":"c80","num":16,"page":4,"kind":"QUESTION","title":"vous êtes IADE au bloc de chirurgie digestive. Vous vous occupez de Madame L qui doit bénéficier ce jour d'une anesthésie générale avec intubation orotrachéale pour une cholécystectomie sous coelioscopie. cette intervention implique l'installation de votre patiente en proclive. Indiquer le risque encouru au niveau hémodynamique par cette posture chirurgicale ainsi que les mécanismes physiopathologiques qui contribue et leurs conséquences. Enoncer les différentes actions que vous allez mettre en place afin de prévenir ce risque.","session":"2020-2022","topic":"Postures et installations chirurgicales","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Positions chirurgicales acec notes (p. 19, à consulter)","../../../cours/3.1%20Positions%20chirurgicales%20acec%20notes.pdf#page=19"]],"options":[],"correct":"","note":"","answer":["Avant de mobiliser, coordonner l’équipe, sécuriser sonde, voies et moniteurs, puis protéger yeux, appuis et nerfs. Après mobilisation, vérifier ventilation, capnographie, pression, pouls, fixation et absence de traction.","Adapter ventilation, appuis et surveillance au décubitus et à l’intervention. Le billot et les compressions peuvent modifier hémodynamique et ventilation."],"sourcePage":18},{"id":"c90","num":17,"page":5,"kind":"QCM","title":"Parmi les propositions concernant la préoxygénation, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Pre-oxygenation – ventilation manuelle – iot – ml","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Pré oxygénation avec notes","../../../cours/S1/3.1/Pre%CC%81%20oxyge%CC%81nation%20avec%20notes.pdf"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":["la préoxygénation du patient est destinée à prévenir l'hypercapnie","la préoxygénation du patient remplace l'azote alvéolaire par de l'oxygène","la préoxygénation du patient permet d'augmenter la réserve en oxygène de l'organisme","la préoxygénation à FiO2 100 % permet d'atteindre une FiO2 ≥ à 80 %","La préoxygénation est corrélée à la capacité résiduelle fonctionnelle (CRF) du patient"],"correct":"ABCDE","note":"Préoxygéner avec une FiO₂ élevée et un masque étanche pour dénitrogéner la CRF et augmenter le temps avant désaturation. Une FeO₂ proche de 90 % est un repère usuel.","instruction":"Cocher les propositions exactes.","sourcePage":20},{"id":"c92","num":18,"page":5,"kind":"QUESTION","title":"énoncer le principe de l'induction de la séquence rapide. Réaliser un schéma illustrant les différentes étapes d'une induction à séquence rapide. toute erreur dans la chronologie d'une séquence rapide entraîne zéro à la question","session":"2020-2022","topic":"Pre-oxygenation – ventilation manuelle – iot – ml","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Pré oxygénation avec notes (p. 18, à consulter)","../../../cours/S1/3.1/Pre%CC%81%20oxyge%CC%81nation%20avec%20notes.pdf#page=18"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["L’induction en séquence rapide comprend préparation, préoxygénation, hypnotique et curare d’action rapide, intubation et confirmation par capnographie. La pression cricoïdienne dépend du contexte et peut gêner la ventilation ou l’intubation."],"sourcePage":20},{"id":"c96","num":19,"page":5,"kind":"QUESTION","title":"citer 6 facteurs prédictifs d'une ventilation au masque difficile. justifier le risque de ventilation au masque difficile.","session":"2020-2022","topic":"Pre-oxygenation – ventilation manuelle – iot – ml","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Pré oxygénation avec notes (p. 28, à consulter)","../../../cours/S1/3.1/Pre%CC%81%20oxyge%CC%81nation%20avec%20notes.pdf#page=28"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Facteurs prédictifs : barbe, édentation, obésité, âge, ronflement ou SAOS et protrusion mandibulaire limitée. Plusieurs critères associés majorent le risque."],"sourcePage":20},{"id":"c99","num":20,"page":5,"kind":"QUESTION","title":"énoncer les différents éléments qui permettent à l'infirmier anesthésiste d'évaluer l'efficacité de son geste lors de la ventilation manuelle","session":"2020-2022","topic":"Pre-oxygenation – ventilation manuelle – iot – ml","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Pré oxygénation avec notes (p. 2, à consulter)","../../../cours/S1/3.1/Pre%CC%81%20oxyge%CC%81nation%20avec%20notes.pdf#page=2"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Vérifier soulèvement thoracique, volume expiré, capnographie, pression raisonnable et stabilité de la SpO₂. Rechercher fuites, distension gastrique ou asymétrie."],"sourcePage":21},{"id":"c107","num":21,"page":5,"kind":"QCM","title":"Parmi les propositions concernant la consultation d'anesthésie, laquelle ou lesquelles est (sont) vraie(s)?","session":"2019-2021 / 2020 -2022","topic":"Processus d’anesthesie","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":["est rendue obligatoire par le décret du 5 décembre 1994 pour les interventions programmées","fait partie intégrante du dossier médical","concerne tous les actes chirurgicaux réalisés au bloc opératoire","à lieu au moins 72 h avant l'intervention","à lieu avant la consultation de chirurgie","elle est réalisée systématiquement 48 heures avant l'intervention","elle est incluse au dossier médical du patient"],"correct":"ABG","note":"Consultation : évaluer terrain, intervention, voies aériennes et traitements, planifier la stratégie, informer et tracer. Visite dans les 24 h : rechercher des changements et vérifier la préparation.","instruction":"Cocher les propositions exactes.","sourcePage":23},{"id":"c109","num":22,"page":5,"kind":"QCM","title":"Parmi les propositions concernant les facteurs de risque des NVPO (nausées, vomissement post-opératoire), laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Processus d’anesthesie","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":["patient bénéficiant de morphiniques post-opératoires","patient de sexe masculin","patient fumeur","patient ayant des antécédents de NVPO","patient ayant une consommation régulière d'alcool"],"correct":"AD","note":"Consultation : évaluer terrain, intervention, voies aériennes et traitements, planifier la stratégie, informer et tracer. Visite dans les 24 h : rechercher des changements et vérifier la préparation.","instruction":"Cocher les propositions exactes.","sourcePage":23},{"id":"c116","num":23,"page":5,"kind":"QUESTION","title":"définir et expliciter le score ASA","session":"2020-2022","topic":"Processus d’anesthesie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 26, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=26"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":[],"correct":"","note":"","answer":["ASA I sain, II affection systémique légère, III affection sévère, IV menace constante pour la vie, V moribond sans chirurgie, VI donneur en mort encéphalique. E signale l’urgence."],"sourcePage":24},{"id":"c121","num":24,"page":5,"kind":"QUESTION","title":"énoncer les objectifs de la consultation d'anesthésie","session":"2020-2022","topic":"Processus d’anesthesie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 9, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=9"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":[],"correct":"","note":"","answer":["Consultation : évaluer terrain, intervention, voies aériennes et traitements, planifier la stratégie, informer et tracer. Visite dans les 24 h : rechercher des changements et vérifier la préparation."],"sourcePage":24},{"id":"c123","num":25,"page":6,"kind":"QUESTION","title":"énoncer l'intérêt et les objectifs de la visite pré-anesthésique","session":"2020-2022","topic":"Processus d’anesthesie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 48, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=48"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":[],"correct":"","note":"","answer":["Dans les 24 heures précédant l’acte, rechercher un événement nouveau, confirmer l’état et les examens, vérifier jeûne, préparation et traitements, et revoir la stratégie si nécessaire."],"sourcePage":24},{"id":"c125","num":26,"page":6,"kind":"QUESTION","title":"Définir le score de Mallampati. pour chacune des images, décrire le Mallampati observé","session":"2020-2022","topic":"Processus d’anesthesie","points":2,"ungraded":false,"figures":["3.1-25-1"],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 134, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=134"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":[],"correct":"","note":"","answer":["Mallampati décrit les structures visibles chez un patient éveillé, assis, bouche ouverte et langue tirée, sans phonation.","I : voile, luette et piliers visibles. II : voile et partie de la luette. III : voile et base de la luette. IV : palais dur seul."],"sourcePage":25},{"id":"c132","num":27,"page":6,"kind":"QCM","title":"Parmi les propositions concernant Les critères de sortie de SSPI (salle de surveillance post interventionnelle), laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Le reveil en anesthesie – sspi","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 SSPI Avec notes","../../../cours/S1/3.1/3.1%20SSPI%20Avec%20notes.pdf"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":["le score d'Aldrete du patient doit être supérieur à 7","le médecin anesthésiste réanimateur prend la décision de sortie de la SSPI","l'infirmier(e) anesthésiste prend la décision de sortie de la SSPI","Seul le médecin anesthésiste assure les prescriptions pour le service d'aval","seul l'infirmier(e) anesthésiste assure les transmissions écrites pour le se rvice d'aval"],"correct":"BD","note":"Extubation : conscience adaptée, ventilation spontanée et échanges satisfaisants, stabilité circulatoire, absence de complication limitante et décurarisation quantitative. Prévoir une stratégie de secours.","instruction":"Cocher les propositions exactes.","sourcePage":27},{"id":"c136","num":28,"page":6,"kind":"QUESTION","title":"définir et expliciter le score d'Aldrete. donner le s core d'Aldrete permettant aux patients de sortir de la SSPI (salle de réveil poste interventionnelle)","session":"2020-2022","topic":"Le reveil en anesthesie – sspi","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 SSPI Avec notes (p. 92, à consulter)","../../../cours/S1/3.1/3.1%20SSPI%20Avec%20notes.pdf#page=92"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Le score d’Aldrete modifié cote activité, ventilation, circulation, conscience et saturation en oxygène, de 0 à 2 chacun. Le seuil usuel est 9/10 avec critères locaux et décision médicale."],"sourcePage":27},{"id":"c138","num":29,"page":6,"kind":"QUESTION","title":"citer les critères permettant l'extubation d'un patient selon les recommandations de la SFAR","session":"2020-2022","topic":"Le reveil en anesthesie – sspi","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 SSPI Avec notes (p. 83, à consulter)","../../../cours/S1/3.1/3.1%20SSPI%20Avec%20notes.pdf#page=83"],["SFAR · Intubation difficile et extubation","https://sfar.org/actualisation-de-recommandations-intubation-difficile-et-extubation-en-anesthesie-chez-ladulte/"]],"options":[],"correct":"","note":"","answer":["Extubation : conscience adaptée, ventilation spontanée et échanges satisfaisants, stabilité circulatoire, absence de complication limitante et décurarisation quantitative. Prévoir une stratégie de secours."],"sourcePage":27},{"id":"c146","num":30,"page":7,"kind":"QCM","title":"Parmi les propositions concernant les conséquences respiratoires induites par le pneumopéritoine crée lors d'une cœlioscopie, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Ventilation mecanique","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Ventilation mécanique avec notes","../../../cours/S1/3.1/3.1%20Ventilation%20me%CC%81canique%20avec%20notes.pdf"]],"options":["Le pneumopéritoine induit une hyperoxie","le pneumopéritoine crée des atélectasies","le pneumopéritoine induit une alcalose respiratoire","le pneumopéritoine induit un barotraumatisme","le pneumopéritoine induit une intubation sélective"],"correct":"B","note":"En volume contrôlé, le volume est réglé et la pression varie. En pression contrôlée, la pression inspiratoire est réglée et le volume dépend de la mécanique. En aide inspiratoire, le patient déclenche ses cycles.","instruction":"Cocher les propositions exactes.","sourcePage":28},{"id":"c147","num":31,"page":7,"kind":"QCM","title":"Parmi les propositions concernant la valve APL (applied pressure level), laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Ventilation mecanique","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Ventilation mécanique avec notes","../../../cours/S1/3.1/3.1%20Ventilation%20me%CC%81canique%20avec%20notes.pdf"]],"options":["Une valve APL assure l'échappement des gaz en excès dans le circuit filtre","la valve APL détermine le réglage de la pression intrathoracique","la valve APL est fermée en ventilation contrôlée","la valve APL est ouverte en ventilation spontanée","la valve APL est fermée en ventilation spontanée"],"correct":"ABD","note":"En volume contrôlé, le volume est réglé et la pression varie. En pression contrôlée, la pression inspiratoire est réglée et le volume dépend de la mécanique. En aide inspiratoire, le patient déclenche ses cycles.","instruction":"Cocher les propositions exactes.","sourcePage":29},{"id":"c148","num":32,"page":7,"kind":"QCM","title":"Parmi les propositions concernant Le sevrage de la ventilation mécanique au bloc opératoire, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Ventilation mecanique","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Ventilation mécanique avec notes","../../../cours/S1/3.1/3.1%20Ventilation%20me%CC%81canique%20avec%20notes.pdf"]],"options":["les facteurs de risque d'extubation difficile doivent être recherchés systématiquement au début de la chirurgie","l'extubation est réalisée systématiquement en SSPI","l'extubation chez un patient ASA 1, se fait sous contrôle de la SpO2 seule","durant l'extubation, l'application d'une pression positive est recommandée","avant l'extubation, la phase de ventilation spontanée doit toujours se faire en FiO2 100%"],"correct":"AE","note":"En volume contrôlé, le volume est réglé et la pression varie. En pression contrôlée, la pression inspiratoire est réglée et le volume dépend de la mécanique. En aide inspiratoire, le patient déclenche ses cycles.","instruction":"Cocher les propositions exactes.","sourcePage":29},{"id":"c149","num":33,"page":7,"kind":"QCM","title":"Parmi les propositions concernant Les modes de ventilation mécanique invasive, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Ventilation mecanique","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Ventilation mécanique avec notes (p. 31, à consulter)","../../../cours/S1/3.1/3.1%20Ventilation%20me%CC%81canique%20avec%20notes.pdf#page=31"]],"options":["dans la ventilation assistée -contrôlée en volume contrôlé, le débit est constant et la pression varie","dans la ventilation assistée-contrôlée en pression contrôlée, le débit est décélérant et la pression est constante","en ventilation spontanée avec aide inspiratoire, la consigne de cyclage expiratoire est un débit","en ventilation assistée-contrôlée, la consigne de cyclage expiratoire est un débit","en ventilation assistée-contrôlée, la fréquence respiratoire est fixe et égal à la fréquence réglée sur le ventilateur"],"correct":"ABC","note":"En volume contrôlé, le volume est réglé et la pression varie. En pression contrôlée, la pression inspiratoire est réglée et le volume dépend de la mécanique. En aide inspiratoire, le patient déclenche ses cycles.","instruction":"Cocher les propositions exactes.","sourcePage":29},{"id":"c150","num":34,"page":8,"kind":"QCM","title":"Parmi les propositions concernant la ventilation au bloc opératoire et ses complications, laquelle ou lesquelles est (sont) vraie(s)?","session":"2020-2022","topic":"Ventilation mecanique","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Ventilation mécanique avec notes (p. 45, à consulter)","../../../cours/S1/3.1/3.1%20Ventilation%20me%CC%81canique%20avec%20notes.pdf#page=45"]],"options":["l'utilisation d'une ventilation protectrice pour toute chirurgie de plus de 2h et pour tout patient est recommandée au bloc opératoire","l'utilisation d'une ventilation protectrice repose sur l'utilisation d'un volume courant à 6ml/kg de poids réel, et l'application d'une PEP minimale de 5 cmH2O","L'utilisation d'une FiO2 élevée, quel que soit la SpO2 du patient, est utile pour diminuer la fréquence des infections du site opératoire","la surveillance per -opératoire de la pression de plateau est importante pour prévenir les complications post-opératoires","les principales complications post -opératoires liées à la ventilation mécanique au bloc opératoire sont cardiovasculaires"],"correct":"ABDE","note":"En volume contrôlé, le volume est réglé et la pression varie. En pression contrôlée, la pression inspiratoire est réglée et le volume dépend de la mécanique. En aide inspiratoire, le patient déclenche ses cycles.","instruction":"Cocher les propositions exactes.","sourcePage":29}],"figures":{"3.1-6-1":"/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgICAgMCAgIDAwMDBAYEBAQEBAgGBgUGCQgKCgkICQkKDA8MCgsOCwkJDRENDg8QEBEQCgwSExIQEw8QEBD/2wBDAQMDAwQDBAgEBAgQCwkLEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBD/wAARCADJAbQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXq const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.slice(0,q.options.length).filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {

    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0,ungraded:q.ungraded};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values.slice(0,q.options.length)){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(!q.ungraded&&q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  if (isOpen(q)) {
    panel.innerHTML=`${answerBox(q)}${sources(q)}${q.ungraded?'<p class="small">Question hors barème.</p>':rubricPanel(q,grade)+assessmentControls(q,grade)}${sourceCopy(q)}`;
    return;
  }
  const answers=q.correct.split('').filter(Boolean).map(letter=>q.options[values.indexOf(letter)]);
  const key=`<strong>${q.ungraded?'Hors barème':format(grade.autoScore)+' / 1 point'}</strong><div class="answer-key" style="margin-top:10px"><h3>${q.ungraded?'Éléments pour vérifier':'Correction'}</h3>${answers.length?`<ul class="correct-options">${answers.map(a=>`<li>${escape(a)}</li>`).join('')}</ul>`:''}${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
  panel.innerHTML=key+sources(q)+sourceCopy(q);
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return !grade.ungraded&&(grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max)));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const adjusted=list.some(g=>g.review && g.review!=='blank' || g.analysis?.some(c=>c.override!==null));
  if(adjusted) $('summary').textContent+=' Note ajustée.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(g=>g.ungraded||isComplete(g));
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!q.ungraded&&!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function shuffledCard(q) {
  if (!isChoice(q)) return q;
  const indexes=q.options.map((_,i)=>i);
  for(let i=indexes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
  }
  const correct=indexes.map((index,i)=>q.correct.includes(values[index])?values[i]:'').join('');
  return {...q,options:indexes.map(i=>q.options[i]),correct};
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!g.ungraded&&!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>(!$('topic').value||q.topic===$('topic').value)&&(!keep||keep.has(q.id))).map(shuffledCard);
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
for(const topic of new Set(DATA.cards.map(q=>q.topic))) $('topic').add(new Option(topic,topic));
$('topic').addEventListener('change',()=>start());
start();
</script>

<script>
/* Mémo : enregistre la note obtenue, pour l'écran « Mes résultats » de l'app.
   Même origine que l'app, donc même localStorage. Une tentative par correction ;
   si la note est ajustée à la main ensuite, la tentative en cours est mise à jour. */
(function () {
  var CLE = 'memo-resultats', INFO = window.MEMO_QUIZ;
  if (!INFO) return;
  var resultats = document.getElementById('results'), score = document.getElementById('score');
  if (!resultats || !score) return;
  var tentative = null;

  function lire() { try { return JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { return []; } }
  function noteDe(txt) {
    var m = String(txt).match(/(-?[\d  ]+(?:[.,]\d+)?)\s*\/\s*20/);
    return m ? parseFloat(m[1].replace(/[  ]/g, '').replace(',', '.')) : null;
  }
  function enregistrer() {
    if (resultats.hidden) return;
    var note = noteDe(score.textContent);
    if (note === null || !isFinite(note)) return;
    var liste = lire();
    var ligne = tentative && liste.find(function (x) { return x.cle === tentative; });
    if (!ligne) {
      tentative = INFO.id + '#' + Date.now();
      ligne = { cle: tentative, id: INFO.id, href: INFO.href, collection: INFO.collection,
        sem: INFO.sem, ue: INFO.ue, periode: INFO.periode, titre: INFO.titre };
      liste.push(ligne);
    }
    ligne.note = Math.round(note * 100) / 100;
    ligne.date = new Date().toISOString();
    try { localStorage.setItem(CLE, JSON.stringify(liste.slice(-300))); } catch (e) {}
  }

  new MutationObserver(enregistrer).observe(score, { childList: true, characterData: true, subtree: true });
  new MutationObserver(enregistrer).observe(resultats, { attributes: true, attributeFilter: ['hidden'] });
  // « Tout recommencer » : la prochaine correction comptera comme une nouvelle tentative.
  document.getElementById('reset') && document.getElementById('reset').addEventListener('click', function () { tentative = null; });
})();
</script>
