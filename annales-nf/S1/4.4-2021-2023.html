ire de groupe sanguin O","il peut recevoir un culot globulaire de groupe sanguin AB","il manque le Rhésus pour vérifier la compatibilité"],"correct":"ABCD","note":"Avant transfusion : vérifier identité, prescription, groupe, RAI et concordance avec la fiche de délivrance, numéro et intégrité de la poche. Pour les CGR, contrôle ultime ABO en présence du patient.","instruction":"Cocher les propositions exactes.","sourcePage":6},{"id":"c27","num":5,"page":2,"kind":"QUESTION","title":"Le contrôle pré transfu sionnel ultime selon le modèle ABtest card. Déterminer le groupe sanguin du patient expliquer les réactions obtenues quel est le groupe sanguin de la patiente et celui du culot? indiquez si la transfusion est possible tout erreur, Absence d'explication ou explication incomplète, entraîne 0 à la question","session":"2021-2023","topic":"Hemovigilance","points":0,"ungraded":true,"figures":["4.4-7-2"],"refs":[["Acte transfusionnel · Instruction nationale","https://ansm.sante.fr/uploads/2024/10/28/instruction-n0-2021-230-du-16-novembre-2021-relative-a-la-realisation-de-l-acte-transfusionnel.pdf"],["HAS · Transfusion de globules rouges","https://www.has-sante.fr/jcms/c_2016516/fr/recommandations-transfusion-de-globules-rouges-homologues-produits-indications-alternatives"]],"options":[],"correct":"","note":"","answer":["Lire séparément les lignes anti-A et anti-B et les colonnes patient et culot. La couleur des réactifs n’est pas à elle seule un signe d’agglutination.","La photo est difficile à interpréter de façon fiable. En situation réelle, suspendre en cas de doute et demander un avis transfusionnel."],"sourcePage":7},{"id":"c28","num":6,"page":2,"kind":"QUESTION","title":"En cas d'incompatibilité transfusionnelle, quelle est la conduite à tenir? de quelle vigilance s'agit-il?","session":"2021-2023","topic":"Hemovigilance","points":2,"ungraded":false,"figures":[],"refs":[["Acte transfusionnel · Instruction nationale","https://ansm.sante.fr/uploads/2024/10/28/instruction-n0-2021-230-du-16-novembre-2021-relative-a-la-realisation-de-l-acte-transfusionnel.pdf"],["HAS · Transfusion de globules rouges","https://www.has-sante.fr/jcms/c_2016516/fr/recommandations-transfusion-de-globules-rouges-homologues-produits-indications-alternatives"]],"options":[],"correct":"","note":"","answer":["Arrêter la transfusion, garder la voie veineuse selon le protocole, prévenir le médecin et le site de délivrance, surveiller et traiter.","Vérifier l’identité et la concordance, conserver le produit et le matériel pour les investigations et signaler en hémovigilance."],"sourcePage":7},{"id":"c41","num":7,"page":2,"kind":"QCM","title":"Parmi les propositions concernant le(s) contre -indication(s) à la friction hydroalcoolique, laquelle ou lesquelles est (sont) vraies","session":"2021-2023","topic":"Infectiovigilance / hygiene des mains et tenue au bloc operatoire","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Hygiène des mains avec notes","../../../cours/S1/4.4/Hygie%CC%80ne%20des%20mains%20avec%20notes.pdf"],["Santé publique France · Surveillance des ISO","https://www.santepubliquefrance.fr/infections-associees-aux-soins/enquetesetudes/rapport-national-de-la-surveillance-semi-0"]],"options":["présence de plaie sur les mains","avant chaque ouverture de salle d'opération","après la prise en charge d'un patient infecté par clostridium difficile","Immédiatement avant tout contact direct avec un patient","présence de souillures sur les mains"],"correct":"CE","note":"Friction hydroalcoolique sur mains sèches et propres. En cas de souillure visible, laver, rincer et sécher. Appliquer le protocole local en cas de germe sporulé.","instruction":"Cocher les propositions exactes.","sourcePage":10},{"id":"c42","num":8,"page":2,"kind":"QCM","title":"Parmi les propositions concernant le lavage simple des mains avec du savon doux, laquelle ou lesquelles est (sont) vraies","session":"2021-2023","topic":"Infectiovigilance / hygiene des mains et tenue au bloc operatoire","points":1,"ungraded":false,"figures":[],"refs":[["Cours · Hygiène des mains avec notes (p. 23, à consulter)","../../../cours/S1/4.4/Hygie%CC%80ne%20des%20mains%20avec%20notes.pdf#page=23"],["Santé publique France · Surveillance des ISO","https://www.santepubliquefrance.fr/infections-associees-aux-soins/enquetesetudes/rapport-national-de-la-surveillance-semi-0"]],"options":["le savon doux nettoie les salissures","le savon doux élimine la flore transitoire","le savon doux élimine la flore résidente","le savon a une action mécanique et chimique","la durée du lavage est de 30 secondes"],"correct":"ABDE","note":"Friction hydroalcoolique sur mains sèches et propres. En cas de souillure visible, laver, rincer et sécher. Appliquer le protocole local en cas de germe sporulé.","instruction":"Cocher les propositions exactes.","sourcePage":11},{"id":"c50","num":9,"page":2,"kind":"QUESTION","title":"il existe deux types de Flore microbiennes cutanées. définissez chacune d'entre elles en argumentant votre réponse.","session":"2021-2023","topic":"Infectiovigilance / hygiene des mains et tenue au bloc operatoire","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Hygiène des mains avec notes (p. 9, à consulter)","../../../cours/S1/4.4/Hygie%CC%80ne%20des%20mains%20avec%20notes.pdf#page=9"],["Santé publique France · Surveillance des ISO","https://www.santepubliquefrance.fr/infections-associees-aux-soins/enquetesetudes/rapport-national-de-la-surveillance-semi-0"]],"options":[],"correct":"","note":"","answer":["La flore résidente est habituellement présente sur la peau et plus difficile à éliminer. La flore transitoire est acquise au contact des personnes ou surfaces et se transmet plus facilement."],"sourcePage":11},{"id":"c51","num":10,"page":2,"kind":"QUESTION","title":"vous exubez un patient covid 19 positif ou fortement suspect quelle précaution prenez-vous pour assurer la prise en soin au bloc opératoire?","session":"2021-2023","topic":"Infectiovigilance / hygiene des mains et tenue au bloc operatoire","points":2,"ungraded":false,"figures":[],"refs":[["Cours · Hygiène des mains avec notes","../../../cours/S1/4.4/Hygie%CC%80ne%20des%20mains%20avec%20notes.pdf"],["Santé publique France · Surveillance des ISO","https://www.santepubliquefrance.fr/infections-associees-aux-soins/enquetesetudes/rapport-national-de-la-surveillance-semi-0"]],"options":[],"correct":"","note":"","answer":["Prévoir les mesures respiratoires adaptées à la procédure et au risque, limiter le personnel exposé et porter la protection respiratoire et oculaire indiquée par le protocole. Organiser circuit, nettoyage et aération selon les règles locales."],"sourcePage":11},{"id":"c52","num":11,"page":3,"kind":"QCM","title":"Parmi les propositions concernant la matériovigilance, laquelle ou lesquelles est (sont) vraies","session":"2016-2018 / 2019-2021 / 2021-2023","topic":"Materiovigilance","points":1,"ungraded":false,"figures":[],"refs":[],"options":["La matériovigilance concerne les consommables à usage unique","La matériovigilance concerne les médicaments","La matériovigilance concerne les produits sanguins labiles","La matériovigilance concerne les dispositifs médicaux","La matériovigilance concerne les logiciels destinés par les fabricants à des fins diagnostiques ou thérapeutiques"],"correct":"ADE","note":"Sécuriser le patient, arrêter d’utiliser le dispositif en cause et le mettre à l’écart. Conserver accessoires et éléments d’identification utiles.","instruction":"Cocher les propositions exactes.","sourcePage":12},{"id":"c57","num":12,"page":3,"kind":"QCM","title":"Parmi les propositions concernant L’obligation de déclarer un Dispositif Médical (DM) défectueux pouvant entrainer ou susceptible d’entrainer la dégradation grave de l’état de santé des personnes à l’ANSM (Agence Nationale de Sécurité du Médicament et des Produits de Santé) : laquelle ou lesquelles est (sont) vraies 1- Le fabriquant motivé par une raison technique ou médicale est tenu d’informer l’ANSM du retrait ou rappel de tout DM défectueux Car 2- Lorsqu’un DM est susceptible d’entrainer la mort ou la dégradation grave de l’état de santé d’un patient, d’un utilisateur ou d’un tiers, la ou les personnes ayant connaissance de cet incident ou de ce risque d’incident mettant en cause ce DM, doit le signaler sans délai à l’ANSM","session":"2018-2020, 2021-2023","topic":"Materiovigilance","points":1,"ungraded":false,"figures":[],"refs":[],"options":["Les deux propositions sont toutes deux vraies et il existe entre elles une relation de cause à effet","Les propositions sont toutes les deux vraies sans qu’il n’existe entre elles une relation de cause à effet","La 1ère proposition est vraie, mais la 2ème est fausse","La 1ère proposition est fausse, mais la 1ère est vraie","Les deux propositions sont fausses"],"correct":"B","note":"Sécuriser le patient, arrêter d’utiliser le dispositif en cause et le mettre à l’écart. Conserver accessoires et éléments d’identification utiles.","instruction":"Cocher les propositions exactes.","sourcePage":13},{"id":"c59","num":13,"page":3,"kind":"QCU","title":"Parmi les propositions concernant Une panne du respirateur d'anesthésie, laquelle est vraie À l'ouverture du site, au moment du test, le respirateur d'anesthésie s'arrête sans alarme. Quelle est la première action de matériovigilance à réaliser?","session":"2021-2023","topic":"Materiovigilance","points":1,"ungraded":false,"figures":[],"refs":[],"options":["Faire redémarrer le respirateur","mettre à l'arrêt le respirateur pour la prochaine intervention","mettre en quarantaine le respirateur","transmettre le respirateur au service biomédical pour réparation","alerter le cadre du service"],"correct":"C","note":"Sécuriser le patient, arrêter d’utiliser le dispositif en cause et le mettre à l’écart. Conserver accessoires et éléments d’identification utiles.","instruction":"Cocher une seule proposition.","sourcePage":13},{"id":"c60","num":14,"page":3,"kind":"QCU","title":"Parmi les propositions concernant Une panne du respirateur d'anesthésie, laquelle est vraie À l'ouverture du site, au moment du test, le respirateur d'anesthésie s'arrête sans alarme. Quelle est la Deuxième action de matériovigilance à réaliser?","session":"2021-2023","topic":"Materiovigilance","points":1,"ungraded":false,"figures":[],"refs":[],"options":["prévenir le cadre du service","contacter l'atelier biomédical","appeler le correspondant local de pharmacovigilance","n'en parler à personne","remplacer le respirateur"],"correct":"A","note":"Sécuriser le patient, arrêter d’utiliser le dispositif en cause et le mettre à l’écart. Conserver accessoires et éléments d’identification utiles.","instruction":"Cocher une seule proposition.","sourcePage":13},{"id":"c61","num":15,"page":4,"kind":"QCU","title":"Parmi les propositions concernant la matériovigilance, comment nomme-t-on l'alerte au niveau local, laquelle est vraie","session":"2021-2023","topic":"Materiovigilance","points":1,"ungraded":false,"figures":[],"refs":[],"options":["L'alerte ascendante","l'alerte descendante","l'alerte montante","l'alerte primaire","l'alerte secondaire"],"correct":"A","note":"Sécuriser le patient, arrêter d’utiliser le dispositif en cause et le mettre à l’écart. Conserver accessoires et éléments d’identification utiles.","instruction":"Cocher une seule proposition.","sourcePage":14},{"id":"c62","num":16,"page":4,"kind":"QCM","title":"Parmi les propositions concernant Les dispositifs médicaux (DM), laquelle ou lesquelles est (sont) vraies","session":"2021-2023","topic":"Materiovigilance","points":1,"ungraded":false,"figures":[],"refs":[],"options":["les produits sanguins labile sont des DM","les implants mammaires sont des DM","les logiciels utilisés à des fins diagnostics et/ou thérapeutiques sont des DM","les produits cosmétiques sont des DM","les dispositifs intra-utérins sont des DM"],"correct":"BCE","note":"Sécuriser le patient, arrêter d’utiliser le dispositif en cause et le mettre à l’écart. Conserver accessoires et éléments d’identification utiles.","instruction":"Cocher les propositions exactes.","sourcePage":15},{"id":"c67","num":17,"page":4,"kind":"QCM","title":"Parmi les propositions concernant la pharmacovigilance, laquelle ou lesquelles est (sont) vraies","session":"2017-2019 / 2018 -2020 / 2019 -2021 / 2021-2023","topic":"Pharmacovigilance","points":1,"ungraded":false,"figures":[],"refs":[],"options":["L’utilisation des dispositifs médicaux réutilisables","La constatation d’effets indésirables lors d’une transfusion","Une situation de pharmacodépendance","L’apparition d’un défaut de qualité concernant un médicament","L’identification d’une erreur ou d’un risque d’erreur concernant un médicament","La constatation d’effets indésirables lors d’une prise médicamenteuse"],"correct":"CEF","note":"Un signalement comporte un déclarant, un patient identifiable, un médicament suspect et un effet indésirable. Décrire chronologie, dose, voie, évolution et médicaments associés.","instruction":"Cocher les propositions exactes.","sourcePage":16},{"id":"c78","num":18,"page":4,"kind":"QUESTION","title":"citer les rôles de la pharmacovigilance","session":"2021-2023","topic":"Pharmacovigilance","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["Recueillir, évaluer et prévenir les effets indésirables des médicaments. Détecter les signaux, apprécier le rapport bénéfice-risque, proposer des mesures et diffuser l’information."],"sourcePage":17},{"id":"c79","num":19,"page":4,"kind":"QUESTION","title":"lors de la préparation d'un flacon d'hydrocortisone injectable, vous réalise z la présence des bris de verre dans le flacon. Le ou la cadre de santé vous charge du signalement de cet incident. de quelle vigilance relève cet incident? De quelle catégorie relève cet incident? Que faites-vous?","session":"2021-2023","topic":"Pharmacovigilance","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["Ne pas utiliser le flacon. Isoler produit et lot, conserver l’emballage et les éléments de preuve, prévenir pharmacie et encadrement, puis tracer et signaler le défaut par le circuit prévu."],"sourcePage":17},{"id":"c81","num":20,"page":4,"kind":"QCM","title":"Parmi les propositions concernant les principes fondamentaux de radioprotection, laquelle ou lesquelles est (sont) vraies","session":"2021-2023","topic":"Radioprotection","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 4.4 Radio Protection","../../../cours/S1/4.4/4.4%20Radio%20Protection.pdf"]],"options":["le principe d'optimisation est un principe fondamental de radioprotection","le principe de rayonnement est un principe fondamental de radioprotection","le principe de limitation est un principe fondamental de radioprotection","le principe de justification est un principe fondamental de radioprotection","le principe de prévention est un principe fondamental de radioprotection"],"correct":"ACD","note":"Justification, optimisation et limitation structurent la radioprotection professionnelle. Limiter le temps d’exposition, augmenter la distance et utiliser des écrans.","instruction":"Cocher les propositions exactes.","sourcePage":18},{"id":"c82","num":21,"page":5,"kind":"QCM","title":"Parmi les propositions concernant l’utilisation d'un appareil de radiographie dans une salle d'opération, laquelle ou lesquelles est (sont) vraies","session":"2021-2023","topic":"Radioprotection","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 4.4 Radio Protection","../../../cours/S1/4.4/4.4%20Radio%20Protection.pdf"]],"options":["Un IADE doit porter un dosimètre passif et opérationnel sous le tablier de plomb","Un IADE doit porter un dosimètre passif à la poitrine, sous le tablier de plomb","Un IADE doit impérativement sortir de salle d'opération pendant les radiographies","Un IADE doit porter un dosimètre passif et un tablier de plomb","Un IADE doit porter un dosimètre opérationn const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

  $('bar').value=count;
}
function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.slice(0,q.options.length).filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Évalue ta réponse à partir des éléments du corrigé.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0,ungraded:q.ungraded};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values.slice(0,q.options.length)){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(!q.ungraded&&q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  if (isOpen(q)) {
    panel.innerHTML=`${answerBox(q)}${sources(q)}${q.ungraded?'<p class="small">Question hors barème.</p>':rubricPanel(q,grade)+assessmentControls(q,grade)}${sourceCopy(q)}`;
    return;
  }
  const answers=q.correct.split('').filter(Boolean).map(letter=>q.options[values.indexOf(letter)]);
  const key=`<strong>${q.ungraded?'Hors barème':format(grade.autoScore)+' / 1 point'}</strong><div class="answer-key" style="margin-top:10px"><h3>${q.ungraded?'Éléments pour vérifier':'Correction'}</h3>${answers.length?`<ul class="correct-options">${answers.map(a=>`<li>${escape(a)}</li>`).join('')}</ul>`:''}${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
  panel.innerHTML=key+sources(q)+sourceCopy(q);
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return !grade.ungraded&&(grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max)));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const adjusted=list.some(g=>g.review && g.review!=='blank' || g.analysis?.some(c=>c.override!==null));
  if(adjusted) $('summary').textContent+=' Note ajustée.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(g=>g.ungraded||isComplete(g));
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!q.ungraded&&!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function shuffledCard(q) {
  if (!isChoice(q)) return q;
  const indexes=q.options.map((_,i)=>i);
  for(let i=indexes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
  }
  const correct=indexes.map((index,i)=>q.correct.includes(values[index])?values[i]:'').join('');
  return {...q,options:indexes.map(i=>q.options[i]),correct};
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!g.ungraded&&!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>(!$('topic').value||q.topic===$('topic').value)&&(!keep||keep.has(q.id))).map(shuffledCard);
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
for(const topic of new Set(DATA.cards.map(q=>q.topic))) $('topic').add(new Option(topic,topic));
$('topic').addEventListener('change',()=>start());
start();
</script>
