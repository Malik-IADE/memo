gé. À la récupération, préférer la mesure quantitative à l’adducteur du pouce.","instruction":"Cocher les propositions exactes.","sourcePage":10},{"id":"c42","num":10,"page":3,"kind":"QCM","title":"Parmi les propositions concernant la curarisation résiduelle, laquelle ou lesquelles est (sont) vraie(s)?","session":"2019-2021","topic":"Monitorage : curarisation","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 2.2 Curares avec notes","../../../cours/2.2%20Curares%20avec%20notes.pdf"],["SFAR · Curarisation et décurarisation","https://sfar.org/curarisation-et-decurarisation-en-anesthesie/"]],"options":["elle engendre une dysfonction des muscles laryngés uniquement","elle engendre une hypoxie par obstruction des voies aériennes supérieures","elle engendre des troubles de la déglutition","elle engendre une inhalation, un encombrement bronchique","elle engendre une augmentation de la capacité d’adaptation à l’hypoxie"],"correct":"ABCD","note":"À l’induction, le muscle sourcilier peut aider à estimer l’installation du bloc laryngé. À la récupération, préférer la mesure quantitative à l’adducteur du pouce.","instruction":"Cocher les propositions exactes.","sourcePage":11},{"id":"c43","num":11,"page":3,"kind":"QCU","title":"Parmi les propositions concernant le monitorage de la curarisation, laquelle est vraie? Lors de l’extubation il n’est pas nécessaire de monitorer tous les patients curarisés\n\nCAR\n\nla surveillance clinique permet d’appréhender la profondeur de la curarisation","session":"2019-2021","topic":"Monitorage : curarisation","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 2.2 Curares avec notes","../../../cours/2.2%20Curares%20avec%20notes.pdf"],["SFAR · Curarisation et décurarisation","https://sfar.org/curarisation-et-decurarisation-en-anesthesie/"]],"options":["Les propositions sont toutes 2 vraies et il existe entre elles une relation de cause à effet","Les propositions sont toutes 2 vraies sans qu’il existe entre elles de relation de cause à effet","La première proposition est vraie, mais la 2e fausse","La première proposition est fausse, mais la 2 e vraie","Les 2 propositions sont fausses"],"correct":"E","note":"À l’induction, le muscle sourcilier peut aider à estimer l’installation du bloc laryngé. À la récupération, préférer la mesure quantitative à l’adducteur du pouce.","instruction":"Cocher une seule proposition.","sourcePage":11},{"id":"c45","num":12,"page":3,"kind":"QUESTION","title":"citer quels sites sont recommandés pour le monitorage des curares : à l'induction, à la décurarisation. Argumenter votre réponse","session":"2019-2021","topic":"Monitorage : curarisation","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 2.2 Curares avec notes (p. 104, à consulter)","../../../cours/2.2%20Curares%20avec%20notes.pdf#page=104"],["SFAR · Curarisation et décurarisation","https://sfar.org/curarisation-et-decurarisation-en-anesthesie/"]],"options":[],"correct":"","note":"","answer":["À l’induction, le muscle sourcilier peut aider à estimer l’installation du bloc laryngé. À la récupération, préférer la mesure quantitative à l’adducteur du pouce.","Bloc résiduel : T4/T1 < 0,90. Risques : obstruction, dysphagie, inhalation et hypoxémie. Quatre réponses palpables seules ne suffisent pas."],"sourcePage":11},{"id":"c50","num":13,"page":3,"kind":"QUESTION","title":"citer 4 /5 avantages du doppler œsophagien","session":"2016-2018/ 2019-2021","topic":"Monitorage : debit cardiaque","points":2,"ungraded":false,"figures":[],"refs":[],"options":[],"correct":"","note":"","answer":["Le Doppler œsophagien fournit une estimation du débit aortique et de ses variations au lit du patient, avec une faible invasivité. Le positionnement, l’angle et les hypothèses du calcul en limitent la précision. Il est continu ou répétable, réactif aux changements de débit et peut aider à évaluer la réponse au remplissage."],"sourcePage":12},{"id":"c62","num":14,"page":3,"kind":"QCM","title":"Parmi les propositions concernant oto 2 du sujet, quelles propositions décrivent le risque d’intubation et la classe de Mallampati ?","session":"2015-2017 / 2016-2018 / 2017-2019 / 2019-2021","topic":"Processus d’anesthesie","points":1,"ungraded":false,"figures":["3.1-22-2"],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 20–21, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=20"]],"options":["Ce patient présente un risque potentiel d’intubation difficile.","Ce patient est coté Mallampati IV.","Ce patient est coté Cormack-Lehane IV.","Ce patient est coté Mallampati II.","Ce patient est coté Cormack-Lehane II."],"correct":"AB","note":"La photo 2 est compatible avec une classe IV, qui fait rechercher une intubation difficile. Le grade de Cormack-Lehane s’évalue sur la vue laryngoscopique.","instruction":"Cocher les propositions exactes.","sourcePage":22},{"id":"c107","num":23,"page":5,"kind":"QCM","title":"Parmi les propositions concernant la consultation d'anesthésie, laquelle ou lesquelles est (sont) vraie(s)?","session":"2019-2021 / 2020 -2022","topic":"Processus d’anesthesie","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":["est rendue obligatoire par le décret du 5 décembre 1994 pour les interventions programmées","fait partie intégrante du dossier médical","concerne tous les actes chirurgicaux réalisés au bloc opératoire","à lieu au moins 72 h avant l'intervention","à lieu avant la consultation de chirurgie","elle est réalisée systématiquement 48 heures avant l'intervention","elle est incluse au dossier médical du patient"],"correct":"ABG","note":"Consultation : évaluer terrain, intervention, voies aériennes et traitements, planifier la stratégie, informer et tracer. Visite dans les 24 h : rechercher des changements et vérifier la préparation.","instruction":"Cocher les propositions exactes.","sourcePage":23},{"id":"c108","num":24,"page":5,"kind":"QCM","title":"Parmi les propositions concernant les grades du score de Cormack, laquelle ou lesquelles est (sont) vraie(s)?","session":"2019-2021","topic":"Processus d’anesthesie","points":1,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":["pour le grade 1 seule l’épiglotte est entièrement visible","pour le grade 2 seule la moitié ou le tiers postérieur de la glotte est visible avec les cartilages aryténoïdes","pour le grade 3 seule la glotte est visible","pour le grade 4 l’épiglotte est non visible","la classification de Cormack et Lehan se réalise lors de la laryngoscopie directe"],"correct":"BDE","note":"Consultation : évaluer terrain, intervention, voies aériennes et traitements, planifier la stratégie, informer et tracer. Visite dans les 24 h : rechercher des changements et vérifier la préparation.","instruction":"Cocher les propositions exactes.","sourcePage":23},{"id":"c115","num":25,"page":5,"kind":"QUESTION","title":"définissez les 5 classes du score American of Society of Anesthésiologists","session":"2019-2021","topic":"Processus d’anesthesie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 26, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=26"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":[],"correct":"","note":"","answer":["ASA I sain, II affection systémique légère, III affection sévère, IV menace constante pour la vie, V moribond sans chirurgie, VI donneur en mort encéphalique. E signale l’urgence."],"sourcePage":24},{"id":"c119","num":26,"page":5,"kind":"QUESTION","title":"Citer les facteurs de risque de survenue des nausées vomissements postopératoires. préciser le score utilisé pour leur cotation et le seuil requis pour initier la prévention médicamenteuse","session":"2019-2021","topic":"Processus d’anesthesie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 14, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=14"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":[],"correct":"","note":"","answer":["Score simplifié d’Apfel : sexe féminin, non-tabagisme, antécédent de NVPO ou mal des transports et opioïdes postopératoires. Le risque augmente avec leur nombre."],"sourcePage":24},{"id":"c120","num":27,"page":5,"kind":"QUESTION","title":"citer l'ensemble du matériel de sécurité indispensable hors salle d'opération","session":"2019-2021","topic":"Processus d’anesthesie","points":2,"ungraded":false,"figures":[],"refs":[["Cours · 3.1 Processus d'anesthésie avec notes (p. 56, à consulter)","../../../cours/S1/3.1/3.1%20Processus%20d%27anesthe%CC%81sie%20avec%20notes.pdf#page=56"],["Code de la santé publique · D6124-92","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037547268/2022-09-06"]],"options":[],"correct":"","note":"","answer":["Prévoir une source d’O₂ et une ventilation de secours, aspiration, monitorage adapté, matériel des voies aériennes et de réanimation, médicaments d’urgence et possibilité d’appeler du renfort."],"sourcePage":24},{"id":"c131","num":28,"page":6,"kind":"QCM","title":"Parmi les propositions concernant la détresse respiratoire en salle de soins post - interventionnelle, laquelle ou lesquelles est (sont) vraie(s)?","session":"2019-2021","topic":"Le reveil en anesthesie const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'

    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {

}

function compute(q, answers) {

}

    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0,ungraded:q.ungraded};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values.slice(0,q.options.length)){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(!q.ungraded&&q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  if (isOpen(q)) {
    panel.innerHTML=`${answerBox(q)}${sources(q)}${q.ungraded?'<p class="small">Question hors barème.</p>':rubricPanel(q,grade)+assessmentControls(q,grade)}${sourceCopy(q)}`;
    return;
  }
  const answers=q.correct.split('').filter(Boolean).map(letter=>q.options[values.indexOf(letter)]);
  const key=`<strong>${q.ungraded?'Hors barème':format(grade.autoScore)+' / 1 point'}</strong><div class="answer-key" style="margin-top:10px"><h3>${q.ungraded?'Éléments pour vérifier':'Correction'}</h3>${answers.length?`<ul class="correct-options">${answers.map(a=>`<li>${escape(a)}</li>`).join('')}</ul>`:''}${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
  panel.innerHTML=key+sources(q)+sourceCopy(q);
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return !grade.ungraded&&(grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max)));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const adjusted=list.some(g=>g.review && g.review!=='blank' || g.analysis?.some(c=>c.override!==null));
  if(adjusted) $('summary').textContent+=' Note ajustée.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(g=>g.ungraded||isComplete(g));
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!q.ungraded&&!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function shuffledCard(q) {
  if (!isChoice(q)) return q;
  const indexes=q.options.map((_,i)=>i);
  for(let i=indexes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
  }
  const correct=indexes.map((index,i)=>q.correct.includes(values[index])?values[i]:'').join('');
  return {...q,options:indexes.map(i=>q.options[i]),correct};
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!g.ungraded&&!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>(!$('topic').value||q.topic===$('topic').value)&&(!keep||keep.has(q.id))).map(shuffledCard);
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
for(const topic of new Set(DATA.cards.map(q=>q.topic))) $('topic').add(new Option(topic,topic));
$('topic').addEventListener('change',()=>start());
start();
</script>
