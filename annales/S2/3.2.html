en charge immédiate d’un arrêt cardio-respiratoire (ACR) en peropératoire chez un patient intubé et ventilé.","source":"complete","answer":["Alerter : appel à l’aide (MAR, renfort), arrêt de la chirurgie, chariot d’urgence et défibrillateur en salle","Arrêter les agents anesthésiques (halogénés, perfusions) ; FiO₂ 100 %, vérifier la ventilation (sonde, EtCO₂)","Débuter immédiatement le massage cardiaque externe : 100 à 120/min, dépression de 5 à 6 cm au milieu du sternum, relève toutes les 2 min, sans interruption ; l’EtCO₂ contrôle l’efficacité du MCE (> 10–20 mmHg)","Ventilation sur la sonde : 10 insufflations/min, sans interrompre le massage","Défibrillateur : patchs posés ; analyse du rythme toutes les 2 min","Rythme choquable (FV/TV sans pouls) : choc dès que possible ; adrénaline 1 mg IV après le 3e choc puis toutes les 3–5 min ; amiodarone (Cordarone®) 300 mg après le 3e choc, + 150 mg après le 5e","+ Rythme non choquable (asystolie, activité électrique sans pouls) : adrénaline 1 mg IV dès que possible puis toutes les 3–5 min","+ Rechercher et traiter les causes réversibles (4H/4T : hypoxie, hypovolémie, hypo/hyperkaliémie, hypothermie, pneumothorax suffocant, tamponnade, toxiques ou anesthésiques, thrombose) ; traçabilité des horaires et des actions"],"criteria":[{"weight":0.4,"label":"Alerter / appel à l’aide / arrêt de la chirurgie","yes":"(?:alert|aide|renfort|appel|arret (?:de la )?chirurgie)"},{"weight":0.4,"label":"FiO₂ 100 %, arrêt des agents anesthésiques","yes":"(?:fio2|100\\s*%|halogene|arret des agents)"},{"weight":0.5,"label":"MCE 100–120/min, 5–6 cm, relève toutes les 2 min","yes":"(?:massage|\\bmce\\b|compression|100.{0,6}120)"},{"weight":0.4,"label":"Défibrillateur / analyse du rythme / choc","yes":"(?:defibrill|choc|patch|analyse)"},{"weight":0.5,"label":"Adrénaline 1 mg toutes les 3–5 min","yes":"adrenaline"},{"weight":0.4,"label":"Amiodarone 300 mg puis 150 mg","yes":"(?:amiodarone|cordarone)"},{"weight":0.4,"label":"Causes réversibles (4H/4T) / EtCO₂","yes":"(?:cause|4h|4t|reversible|etco2|hypoxi|hypovolemi|kali)"}]},{"kind":"QROC","num":2,"page":193,"correct":"","points":1.7,"id":"c11","title":"Décrire la prise en charge d’un bronchospasme en peropératoire chez un patient intubé ventilé.","source":"complete","answer":["Diagnostic : augmentation brutale des pressions d’insufflation, baisse de l’EtCO₂ avec capnogramme qui perd son plateau (aspect « en pente »), désaturation secondaire, sibilants ou silence auscultatoire","Alerter (MAR, renfort, chirurgien) ; éliminer une cause mécanique (sonde plicaturée, obstruée, intubation sélective)","FiO₂ 100 % ; ventilation manuelle ; adapter le ventilateur : diminuer la fréquence respiratoire et le rapport I/E (allonger l’expiration) pour éviter l’auto-PEEP","Approfondir l’anesthésie (propofol, halogéné type sévoflurane, bronchodilatateur)","Salbutamol inhalé dans la sonde d’intubation (8 à 15 bouffées), à renouveler","Si le bronchospasme persiste : salbutamol IV (bolus 100–200 µg puis 5–25 µg/min) et/ou adrénaline IV titrée","+ Rechercher une anaphylaxie (signes cutanés, hypotension) et la traiter le cas échéant ; + corticoïdes (méthylprednisolone) en relais ; gaz du sang, surveillance"],"criteria":[{"weight":0.2,"label":"Alerter / éliminer une cause mécanique","yes":"(?:alert|aide|renfort|sonde|plicatur|obstru|mecanique)"},{"weight":0.3,"label":"FiO₂ 100 %","yes":"(?:fio2|100\\s*%|oxygene pur)"},{"weight":0.2,"label":"Adapter la ventilation (↓ FR, allonger l’expiration)","yes":"(?:frequence|i.?e|expirat|auto.?peep|ventilation manuelle)"},{"weight":0.3,"label":"Approfondir l’anesthésie (halogéné, propofol)","yes":"(?:approfondi|halogene|sevoflurane|propofol|ketamine)"},{"weight":0.3,"label":"Salbutamol inhalé dans la sonde","yes":"(?:salbutamol|ventoline|bouffee|beta.?2)"},{"weight":0.2,"label":"Adrénaline / salbutamol IV si échec","yes":"(?:adrenaline|\\biv\\b|intraveineu)"},{"weight":0.2,"label":"Rechercher une anaphylaxie / corticoïdes","yes":"(?:anaphyla|allergi|cortico|methylpred|solumedrol)"}]},{"kind":"QROC","num":3,"page":194,"correct":"","points":1,"id":"c12","title":"Citer 4 limites de la récupération sanguine en postopératoire.","source":"complete","answer":["Contre-indiquée en chirurgie carcinologique (risque de dissémination de cellules tumorales)","+ Contre-indiquée en cas de contamination bactérienne ou de chirurgie septique (risque infectieux)","+ Restitue uniquement des globules rouges : ni plaquettes ni facteurs de coagulation (risque de coagulopathie si gros volumes)","+ Délai de recueil et de retransfusion limité (≈ 6 h) ; risque d’hémolyse, d’embolie gazeuse ou graisseuse ; nécessite un saignement suffisant, du matériel, une formation et un coût"],"criteria":[{"weight":0.25,"label":"Chirurgie carcinologique","yes":"(?:tumeur|tumoral|cancer|carcino|malign)"},{"weight":0.25,"label":"Contamination bactérienne / infection","yes":"(?:infect|septique|bacteri|contamin)"},{"weight":0.25,"label":"Pas de plaquettes ni de facteurs de coagulation","yes":"(?:plaquett|facteur|coagul|globule)"},{"weight":0.25,"label":"Délai, hémolyse, embolie, coût","yes":"(?:delai|6\\s*h|hemolys|embolie|cout|volume|formation)"}]},{"kind":"QROC","num":4,"page":195,"correct":"","points":1.5,"criteria":[{"weight":0.3,"label":"Objectif : épargne sanguine / éviter la transfusion homologue","yes":"(?:epargne|eviter.{0,20}transfusion|homologue|allogeni|heterolog)"},{"weight":0.3,"label":"Prélèvement de sang autologue","yes":"(?:prelev|recuper|soustra|sang (?:du|autolog))"},{"weight":0.3,"label":"Compensation simultanée (remplissage)","yes":"(?:compens|remplissage|colloide|cristalloide)"},{"weight":0.3,"label":"Conservation en salle, étiquetage, ≤ 6 h","yes":"(?:conserv|etiquet|temperature ambiante|6\\s*h)"},{"weight":0.3,"label":"Restitution en ordre inverse","yes":"(?:restitu|retransfus|transfuser|ordre inverse)"}],"allOrNothing":false,"id":"c13","title":"Citer l’objectif de l’hémodilution normovolémique.\nÉnoncer les différentes étapes de cette dernière.","source":"complete","answer":["Objectif : épargne sanguine, éviter ou réduire la transfusion homologue (allogénique) et ses risques","Étape 1 · prélèvement de sang autologue en début d’intervention (après l’induction), dans des poches anticoagulées, jusqu’à l’hématocrite cible (≈ 25–30 %)","Étape 2 · compensation simultanée volume pour volume par des colloïdes (ou 3 volumes de cristalloïdes), pour maintenir la normovolémie","+ Étape 3 · conservation des poches en salle à température ambiante, identifiées et étiquetées (≤ 6 h)","+ Étape 4 · restitution en fin d’intervention ou en cas de saignement, en ordre inverse du prélèvement (la dernière poche prélevée, la moins riche, est rendue en premier)"]},{"kind":"QROC","num":5,"page":196,"correct":"","points":1.4,"criteria":[{"weight":0.2,"label":"Consentement éclairé","yes":"consentement"},{"weight":0.2,"label":"Absence d’infection","yes":"infect"},{"weight":0.2,"label":"Hémostase normale (plaquettes, anticoagulants)","yes":"(?:hemostase|plaquett|anticoagul|coagul)"},{"weight":0.2,"label":"Hypovolémie corrigée / stabilité hémodynamique","yes":"(?:hypovolemi|hemodynami|remplissage)"},{"weight":0.2,"label":"Pas d’allergie aux AL","yes":"allergi"},{"weight":0.2,"label":"Matériel d’AG / réanimation, monitorage","yes":"(?:intubation|\\bag\\b|reanimation|monitor|respirateur)"},{"weight":0.2,"label":"Médicaments d’urgence et Intralipide®","yes":"(?:intralipide|lipide|ephedrine|vasopresseur|atropine)"}],"allOrNothing":false,"id":"c14","title":"Énoncer les conditions nécessaires à respecter avant la réalisation d’un bloc périmédullaire.","source":"complete","answer":["Consentement éclairé du patient","Absence de contre-indication : infection locale ou systémique, troubles de l’hémostase (plaquettes > 80 000/mm³, anticoagulants et antiagrégants arrêtés selon les délais), hypovolémie non corrigée, allergie aux anesthésiques locaux","Patient à jeun, VVP fonctionnelle, monitorage (ECG, PNI, SpO₂)","Salle équipée comme pour une AG : plateau d’intubation, respirateur vérifié, aspiration, O₂","Médicaments d’urgence prêts : vasopresseurs (éphédrine, phényléphrine, noradrénaline), atropine, adrénaline, et Intralipide® 20 % disponible (toxicité des AL)"]},{"kind":"QROC","num":6,"page":197,"correct":"","points":1.6,"id":"c15","title":"Énoncer la surveillance immédiate après la réalisation d’une anesthésie péridurale.\nPréciser la conduite à tenir.","source":"complete","answer":["Surveiller les signes de passage intravasculaire des AL (dose test adrénalinée : tachycardie) : troubles de la conscience, dysarthrie, goût métallique, paresthésies péribuccales, acouphènes, troubles du rythme ou de la conduction cardiaque","Rechercher une rachianesthésie totale (injection intrathécale accidentelle) : bloc très étendu, dyspnée, apnée, collapsus","Surveiller les signes d’allergie : rash, hypotension, tachycardie, voire collapsus sévère","Surveiller la tolérance hémodynamique (PA, FC toutes les 2 à 5 min) et respiratoire (FR, SpO₂)","Évaluer l’efficacité et le niveau du bloc : sensitif (test au froid ou à l’effleurement), moteur (score de Bromage), analgésie (EVA)","+ Conduite à tenir : hypotension → remplissage et vasopresseurs (éphédrine, phényléphrine) ; bradycardie → atropine ; toxicité des AL → arrêt de l’injection, O₂, benzodiazépine si convulsions, Intralipide® 20 % ; rachianesthésie totale → ventilation au masque, intubation, vasopresseurs ; alerter le MAR"],"criteria":[{"weight":0.3,"label":"Passage intravasculaire / toxicité des AL","yes":"(?:intravascul|intraveineu|passage iv|toxicit|metallique|acouphene|dysarthri)"},{"weight":0.2,"label":"Rachianesthésie totale","yes":"rachi.{0,15}totale"},{"weight":0.2,"label":"Allergie","yes":"allergi"},{"weight":0.3,"label":"Surveillance hémodynamique (PA, FC)","yes":"(?:hemodynami|pression arterielle|\\bpa\\b|frequence cardiaque|\\bfc\\b|tension)"},{"weight":0.3,"label":"Efficacité / niveau du bloc","yes":"(?:efficacite|niveau|froid|bromage|s tion manuelle difficile.","source":"complete","answer":["+ Âge > 55 ans","IMC > 26 kg/m²","Présence d’une barbe","Édentation","Ronflements / syndrome d’apnées du sommeil (+ limitation de la protrusion mandibulaire)"]},{"kind":"QROC","num":9,"page":200,"correct":"","points":0.8,"criteria":[{"weight":0.2,"label":"Refus du patient","yes":"refus"},{"weight":0.2,"label":"Infection locale / systémique","yes":"infect"},{"weight":0.2,"label":"Troubles de l’hémostase","yes":"(?:hemostase|plaquett|anticoagul|coagul)"},{"weight":0.2,"label":"Allergie aux AL / hypovolémie / HTIC","yes":"(?:allergi|hypovolemi|htic|intracranien)"}],"allOrNothing":false,"id":"c18","title":"Énoncer 4 contre-indications à l’anesthésie locorégionale.","source":"complete","answer":["Refus du patient","Infection locale au point de ponction ou infection systémique (sepsis)","Troubles de l’hémostase (plaquettes < 80 000/mm³, anticoagulants non arrêtés)","+ Allergie vraie aux anesthésiques locaux","+ Hypovolémie non corrigée, hypertension intracrânienne (pour les blocs périmédullaires)","Note : « patient non coopérant » n’a pas été compté"]},{"kind":"QROC","num":10,"page":201,"correct":"","points":1.5,"criteria":[{"weight":0.3,"label":"Définition : sonde œsophagienne, vélocité dans l’aorte descendante","yes":"(?:aorte|velocite|effet doppler|sonde)"},{"weight":0.3,"label":"Mesure du VES / débit cardiaque","yes":"(?:volume d.?ejection|\\bves\\b|debit cardiaque)"},{"weight":0.3,"label":"Optimisation du remplissage, peu invasif","yes":"(?:remplissage|peu invasi|mini.?invasi|optimis)"},{"weight":0.3,"label":"Limites : patient intubé, contre-indications œsophagiennes","yes":"(?:intube|sedat|varice|oesophag|coagul)"},{"weight":0.3,"label":"Limites : déplacement de la sonde, opérateur-dépendant, bistouri","yes":"(?:deplacement|operateur|bistouri|interference|acces a la tete|70\\s*%)"}],"allOrNothing":false,"id":"c19","title":"Définir le doppler œsophagien.\nÉnoncer ses intérêts et ses limites.","source":"complete","answer":["+ Définition : technique de monitorage hémodynamique mini-invasive ; une sonde placée dans l’œsophage mesure par effet Doppler la vélocité du sang dans l’aorte thoracique descendante et en déduit le volume d’éjection systolique (VES) et le débit cardiaque","Intérêts : mesure du VES et du débit cardiaque battement par battement, pour optimiser le remplissage vasculaire (épreuve de remplissage, stratégie d’optimisation hémodynamique)","Peu invasif (moins qu’un cathéter de Swan-Ganz), facile d’utilisation, courbe d’apprentissage rapide","+ Limites : patient intubé et sédaté (mal toléré éveillé) ; contre-indications : pathologie ou chirurgie œsophagienne, varices œsophagiennes, troubles de la coagulation sévères","+ Mesure opérateur-dépendante, sensible au déplacement de la sonde ; ne mesure que le flux de l’aorte descendante (≈ 70 % du débit) ; interférences avec le bistouri électrique ; nécessite l’accès à la tête"]},{"kind":"context","page":202,"title":"Cas clinique (15 points)","id":"c20","text":"Vous êtes IADE ce jour en chirurgie orthopédique.\nVous prenez en charge Mme B., 52 ans, 63 kg pour 1,70 m (IMC 21,8 kg/m²), qui doit bénéficier d’une pose de prothèse de genou droit. Cette chirurgie programmée se déroulera sous rachianesthésie avec garrot. Durée prévue : 1 h 30.\n\nAntécédents médicaux : hypertension artérielle ; tabagisme à 20 paquets-années non sevré ; allergie : non connue ; anxiété importante post-traumatique suivie par un psychiatre.\nAntécédents chirurgicaux : extraction des dents de sagesse sous anesthésie locale (1973) ; césarienne sous anesthésie péridurale (2000).\nTraitement en cours : Renitec® (énalapril) 10 mg 1-0-0 ; Deroxat® (paroxétine) 20 mg 2-0-0.\nAccès aux voies aériennes : Mallampati 2, ouverture de bouche > 35 mm, distance thyro-mentonnière > 65 mm.\nPrescriptions : prémédication par Atarax® (hydroxyzine) 50 mg per os la veille et le matin de l’intervention ; arrêt du Renitec® 12 h avant ; traitement de l’anxiété à poursuivre ; à jeun liquides H-2 et solides H-6.\nStratégie d’anesthésie : ALR, rachianesthésie avec bupivacaïne et morphine."},{"kind":"context","page":203,"title":"Cas clinique (suite)","id":"c21","text":"Examen clinique et paraclinique : FC 57/min ; PA 135/66 mmHg ; SpO₂ en air ambiant 99 %. Lors des échanges, Mme B. accepte après beaucoup d’explications la rachianesthésie mais reste très angoissée par l’intervention.\nBilan : ECG normal. Biologie de la veille : Na⁺ 140 mmol/L ; K⁺ 4 mmol/L ; Cl⁻ 100 mmol/L ; créatinine 95 µmol/L ; GB 6 000/mm³ ; GR 4 235 000/mm³ ; hématocrite 41 % ; TP 100 % ; TCA 29/29. Mme B. est cotée ASA 2.\nVisite préanesthésique : rien à signaler depuis la consultation ; PCR Covid négative ; hémoglobine 13,2 g/dL ; 2 déterminations de groupe et RAI négative de la veille."},{"kind":"QUESTION","num":1,"page":204,"correct":"","points":2.8,"id":"c22","title":"Question 1 — Vous préparez la salle et le matériel pour une rachianesthésie. Décrivez les vérifications et la préparation de la salle que vous réalisez. Argumentez votre réponse.","source":"complete","answer":["Ouverture de salle selon la check-list (FOSO) : vérification du respirateur, de l’aspiration, de la source d’O₂, de la table opératoire","Matériel d’intubation et de ventilation prêt (laryngoscope, sondes de plusieurs tailles, masque, Guedel, masque laryngé, mandrin d’Eschmann) : une conversion en AG peut être nécessaire","+ Chariot d’ALR : kit de rachianesthésie stérile, aiguilles à pointe crayon 25–27 G, bupivacaïne hyperbare et morphine, antiseptique, champs et gants stériles, masque et charlotte (asepsie chirurgicale)","Médicaments d’urgence prêts à l’emploi : vasopresseurs (éphédrine, phényléphrine, noradrénaline), atropine, adrénaline ; Intralipide® 20 % disponible","+ Monitorage : scope ECG, PNI à intervalles rapprochés, SpO₂ (prévenir hypotension et bradycardie liées au bloc sympathique)","+ Voie veineuse périphérique fonctionnelle avec soluté de remplissage (cristalloïdes) avant chéale.\nProtocole : à l’induction sufentanil, propofol, cisatracurium ; en entretien sufentanil, sévoflurane (Sévorane®), cisatracurium. Après dénitrogénation (FeO₂ > 90 %), l’induction est débutée.\n\nÀ 10 h 00, la patiente est intubée et ventilée en mode contrôlé, FiO₂ 50 %, relais de la narcose par sévoflurane. Lors de l’installation chirurgicale : FC 62/min ; PA 120/67 mmHg ; SpO₂ 98 % ; PetCO₂ 32 mmHg ; TOF 0/4 ; BIS 45 ; T° 36,8 °C.\n\nÀ 10 h 10, avant l’incision, le chirurgien vous demande si la patiente est toujours curarisée. Monitorage : FC 90/min ; PA 110/60 mmHg ; SpO₂ 97 % en FiO₂ 50 % ; PetCO₂ 38 mmHg ; pression de crête 30 cmH₂O ; TOF 1/4 ; BIS 52 ; T° 37,5 °C."},{"kind":"QUESTION","num":4,"page":209,"correct":"","points":1.4,"id":"c26","title":"Question 4 — D’après les données cliniques disponibles, citez les différentes hypothèses diagnostiques possibles.","source":"complete","answer":["Anesthésie insuffisante (stimulation douloureuse, BIS qui remonte à 52, tachycardie)","Hyperthermie maligne (halogéné, tachycardie, hausse de l’EtCO₂ et de la température)","Bronchospasme (hausse de la pression de crête)","+ Réaction anaphylactique (tachycardie, baisse de la PA, hausse des pressions d’insufflation)","+ Problème mécanique de ventilation : sonde plicaturée ou obstruée, intubation sélective, hypoventilation","Début de décurarisation (TOF 1/4), à l’origine de la hausse des pressions"],"criteria":[{"weight":0.2,"label":"Anesthésie insuffisante","yes":"(?:insuffisan|profondeur|reveil|douleur|halogene insuff)"},{"weight":0.3,"label":"Hyperthermie maligne","yes":"hyperthermie maligne"},{"weight":0.2,"label":"Bronchospasme","yes":"bronchospasm"},{"weight":0.3,"label":"Anaphylaxie","yes":"(?:anaphyla|allergi)"},{"weight":0.2,"label":"Problème de sonde / ventilation","yes":"(?:sonde|selective|plicatur|obstru|hypoventil)"},{"weight":0.2,"label":"Décurarisation","yes":"(?:decurar|curare|tof)"}]},{"kind":"QUESTION","num":5,"page":210,"correct":"","points":1.1,"cr h (remplissage, diurétique) pour prévenir l’insuffisance rénale de la rhabdomyolyse ; prélèvements (GDS, K⁺, CPK, myoglobine, coagulation) ; traçabilité"],"criteria":[{"weight":0.4,"label":"Alerte / kit d’hyperthermie maligne","yes":"(?:alert|aide|kit|renfort)"},{"weight":0.5,"label":"Arrêt des halogénés, relais IV","yes":"(?:arret.{0,15}halogen|arret.{0,15}sevo|propofol|aivoc)"},{"weight":0.4,"label":"Hyperventilation FiO₂ 100 %, haut débit, circuit changé / filtres","yes":"(?:hyperventil|fio2|debit|circuit|tuyau|filtre|purge)"},{"weight":0.6,"label":"Dantrolène 2,5 mg/kg","yes":"dantrol|dantrium"},{"weight":0.4,"label":"Refroidissement","yes":"(?:refroidi|glace|froid|couverture)"},{"weight":0.4,"label":"Traiter l’hyperkaliémie et l’acidose","yes":"(?:hyperkali|insuline|glucose|bicarbonate|acidose|calcium)"},{"weight":0.3,"label":"Diurèse / prélèvements biologiques","yes":"(?:diurese|prelev|bilan|cpk|myoglobin|gaz du sang)"}]},{"kind":"QUESTION","num":8,"page":213,"correct":"","points":1.2,"id":"c30","title":"Question 8 — Énoncez la prise en charge de la patiente en postopératoire.","source":"complete","answer":["Surveillance en réanimation ou soins continus (au moins 24 h), scope, monitorage de la température et de l’EtCO₂ : risque de récidive","Poursuite du dantrolène (1 mg/kg toutes les 4 à 6 h pendant 24 à 48 h)","Surveillance biologique : kaliémie, gaz du sang, CPK, myoglobinémie et myoglobinurie, fonction rénale, coagulation (CIVD) ; maintien d’une diurèse abondante","Prise en charge de l’hyperkaliémie et de la rhabdomyolyse","Information de la patiente et de sa famille au réveil ; déclaration de pharmacovigilance ; remise d’une carte ou d’un courrier mentionnant le risque","+ Orientation vers un centre de référence de l’hyperthermie maligne (test de contracture in vitro) et dépistage familial ; anesthésies ultérieures sans halogénés ni succinylcholine"],"criteria":[{"weight":0.2,"label":"Surveillance en réa / SSPI, monitorage T° et EtCO₂","yes":"(?:reanimation|soins continus|sspi|scope|monitor|temperature)"},{"weight":0.2,"label":"Poursuite du dantrolène","yes":"dantrol"},{"weight":0.2,"label":"Bilan : kaliémie, CPK, myoglobine, fonction rénale","yes":"(?:kali|cpk|myoglobin|renal|diurese|coagul)"},{"weight":0.2,"label":"Information de la patiente et de sa famille","yes":"(?:inform|famille|expliqu)"},{"weight":0.2,"label":"Déclaration, carte ou courrier","yes":"(?:declar|carte|courrier|pharmacovigilance)"},{"weight":0.2,"label":"Centre de référence / test de contracture / dépistage familial","yes":"(?:centre|reference|contracture|depistage|consultation|biopsie)"}]}],"examTotal":40};
const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n,]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

function answerBox(q){
  let list=q.answer; if(!list) return ''; if(typeof list==='string') list=[list];
  const items=list.map(a=>{const add=a.startsWith('+');const t=add?a.replace(/^\+\s*/,''):a;return `<li class="${add?'added':''}">${escape(t)}${add?'<span class="tag-added">Complément</span>':''}</li>`;}).join('');
  return `<div class="answer-key"><h3>Correction ${srcTag(q)}</h3><ul>${items}</ul>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
}
let active, grades, locked, confirmed, targeted;
const form = $('quiz');
function images(list, label) {
  return list.map((item,i) => `<img loading="lazy" alt="${escape(label)}${list.length>1?' · extrait '+(i+1):''}" src="data:image/jpeg;base64,${item}">`).join('');
}
function scanBlock(scans, label) {
  return `<div class="document"><div class="source-pictures" tabindex="0" aria-label="${escape(label)}">${images(scans,label)}</div><button type="button" class="secondary zoom" aria-expanded="false">Agrandir le scan</button></div>`;
}
function prompt(q) {
  if(q.images) return scanBlock(q.images,questionLabel(q));
  const table=q.table?`<div class="prompt-table">${q.table.map(cell=>`<span>${escape(cell)}</span>`).join('')}</div>`:'';
  return `<h2 class="question-stem">${escape(q.title)}</h2>${q.text?`<p class="context-text">${escape(q.text)}</p>`:''}${q.figure_img?`<div class="q-figure"><img src="data:image/jpeg;base64,${q.figure_img}" alt="Figure de la question"></div>`:''}${q.instruction?`<p class="small">${escape(q.instruction)}</p>`:''}${table}`;
}
function fields(q) {
  if (isChoice(q)) {
    return `<div class="choices ${q.options?'written-choices':''}" role="${q.kind==='QCU'?'radiogroup':'group'}" aria-labelledby="title-${q.id}">${values.map((letter,i)=>`<label class="option" id="option-${q.id}-${letter}"><input type="${q.kind==='QCU'?'radio':'checkbox'}" name="${q.id}" value="${letter}"><span><strong>${letter}</strong>${q.options?' · '+escape(q.options[i]):''}<small></small></span></label>`).join('')}</div>`;
  }

}
function render() {
  $('cards').innerHTML = active.map((q, index) => {
    const section = q.kind === 'context' ? '<span>Cas clinique</span>' : `<span>${q.points==null?'':format(q.points)+' pt · '}PDF p. ${q.page}</span>`;
    const anchor = active.findIndex(card=>card.kind===q.kind)===index ? ` id="section-${q.kind}"` : '';
    return `<section class="card"${anchor} data-card="${q.id}"><div class="meta"><strong id="title-${q.id}">${escape(questionLabel(q))}</strong>${section}</div>${prompt(q)}${q.kind==='context'?'':fields(q)+`<div class="feedback" id="feedback-${q.id}" hidden></div>`}</section>`;
  }).join('');
  for(const link of document.querySelectorAll('[data-kind]')){
    const kind=link.dataset.kind;
    const index=active.findIndex(q=>kind==='open'?isOpen(q):q.kind===kind);
    link.hidden=index<0;
    if(index>=0) link.hash='section-'+active[index].kind;

function response(q) {
  if (isChoice(q)) {
    return [...form.querySelectorAll(`[name="${q.id}"]:checked`)].map(input=>input.value);
  }
  return $(`answer-${q.id}`).value.trim();
}
function progress() {
  const current=active.filter(q=>q.kind!=='context');
  const count=current.filter(q=>response(q).length>0).length;
  $('progress').textContent=`${count} / ${current.length} questions renseignées`;
  $('bar').max=current.length;
  $('bar').value=count;
}
function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Réponse à évaluer à partir de la copie annotée.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');

function correction(q) {
  const given=response(q);

  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);

      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;

    panel.innerHTML=`${answerBox(q)}${rubricPanel(q,grade)}${caution}${q.evidence&&!q.answer?scanBlock(q.evidence,'Réponse annotée · '+questionLabel(q)):''}${assessmentControls(q,grade)}${reference}`;

  const evidence=q.evidence?`<details><summary>Voir la copie annotée</summary><div class="source-pictures" tabindex="0">${images(q.evidence,'Copie annotée · '+questionLabel(q))}</div></details>`:'';
  panel.innerHTML=key+evidence+(q.correct?'':assessmentControls(q,grade))+reference;
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=targeted?available:DATA.examTotal??available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';

    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`

function submit() {

    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;

    return;
  }
  locked=true;
  current.forEach(correction);

  $('filters').hidden=false;
  $('submit').hidden=true;

function start(retry=false) {

  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';

form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;

    if(partial)partial.hidden=field.value!=='partial';
  }else{

  }

$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];

$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
start();
