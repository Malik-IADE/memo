t un ACT à 200 s avant de canuler","Il faut corriger une hypotension artérielle avant le départ en CEC","Il faut un ACT d’au moins 300 s pour démarrer la CEC","Il faut injecter un bolus d’héparine (100 UI/kg)"],"source":"deduit","note":"La copie (B, C, E) a obtenu 0. Avant la CEC, on injecte 300 UI/kg d’héparine (100 UI/kg concerne la chirurgie vasculaire), avec un ACT ≥ 300 s (souvent > 400 s). La protamine s’administre après la CEC. Correction reconstituée : vérifie avec ton cours.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":7,"page":221,"correct":"BCD","points":1,"id":"c7","title":"Parmi ces propositions concernant les complications du méningiome, laquelle ou lesquelles est (sont) vraie(s) ?","options":["La paralysie pharyngée","L’hématome du foyer opératoire","Les crises convulsives","L’empyème","L’encéphalite auto-immune"],"source":"deduit","note":"La copie (B, C) a obtenu 0,5, le correcteur signalant D (empyème) comme oubliée.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":8,"page":221,"correct":"C","points":1,"id":"c8","title":"Parmi ces propositions concernant la prise en charge anesthésique d’un patient atteint de myopathie, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Les halogénés sont contre-indiqués systématiquement","L’atracurium est contre-indiqué","La succinylcholine est contre-indiquée","Les anesthésiques locaux sont contre-indiqués","Le rémifentanil est contre-indiqué"],"source":"deduit","note":"La succinylcholine est contre-indiquée (hyperkaliémie, rhabdomyolyse). Les halogénés ne sont pas contre-indiqués systématiquement dans toutes les myopathies. La copie (A, C) a obtenu 0 : vérifie la réponse attendue avec ton cours.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":9,"page":222,"correct":"ACE","points":1,"id":"c9","title":"Parmi ces propositions concernant les complications de la jet ventilation, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Un emphysème sous-cutané","Un emphysème bulleux","Un pneumothorax","Une thrombose veineuse","Une hypercapnie"],"source":"deduit","note":"La copie (B, C) a obtenu 0, le correcteur signalant A comme oubliée et B comme erreur. La jet ventilation expose au barotraumatisme (emphysème sous-cutané, pneumothorax) et à l’hypercapnie.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":10,"page":222,"correct":"ACE","points":1,"id":"c10","title":"Parmi ces propositions concernant les retentissements physiologiques de la chirurgie de l’œsophage, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Une survenue de micro-inhalations postopératoires","Une augmentation de l’activité parasympathique","Une altération de la mécanique ventilatoire","Une augmentation du débit cardiaque","Une réaction pro-inflammatoire importante"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":11,"page":223,"correct":"ABD","points":1,"id":"c11","title":"Parmi ces propositions concernant les facteurs de mauvaise tolérance d’un clampage aortique, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Le niveau de clampage","La durée du clampage","Un antécédent de diabète","Un antécédent d’insuffisance cardiaque","Le diamètre de l’anévrisme"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":12,"page":223,"correct":"ACD","points":1,"id":"c12","title":"Parmi ces propositions concernant les facteurs prédictifs de succès d’une anesthésie péribulbaire en anesthésie ophtalmologique, laquelle ou lesquelles est (sont) vraie(s) ?","options":["La présence de ptosis","L’akinésie médiale immédiate","La présence d’œdème palpébral","La présence de chémosis","Le mouvement aller-retour du globe oculaire"],"source":"deduit","note":"La copie (B) a obtenu 0. Ptosis, œdème palpébral et chémosis témoignent d’une bonne diffusion de l’anesthésique. Correction reconstituée : vérifie avec ton cours.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":13,"page":224,"correct":"ABD","points":1,"id":"c13","title":"Parmi ces propositions concernant le diagnostic clinique du phéochromocytome, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Il se traduit par une HTA sévère paroxystique","Il provoque des sueurs importantes","Il provoque des bradycardies réflexogènes","Les céphalées font partie des signes cliniques du phéochromocytome","Il provoque des accès hyperthermiques"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":14,"page":224,"correct":"BC","points":1,"id":"c14","title":"Parmi ces propositions concernant le traitement d’un coma acidocétosique, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Supplémentation en calcium","Réhydratation","Insulinothérapie en IVSE","Biguanides","Antibiothérapie IV"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCU","num":1,"page":225,"correct":"D","points":1,"id":"c15","title":"Parmi ces propositions concernant le prélèvement sur donneur vivant, laquelle est vraie ?\n\nL’anonymat entre le donneur et le receveur est respecté\nCAR\nLe prélèvement d’organes est une activité médicale","options":["Les propositions sont toutes deux vraies et il existe entre elles une relation de cause à effet","Les propositions sont toutes deux vraies sans qu’il existe entre elles de relation de cause à effet","La 1re proposition est vraie, mais la 2e est fausse","La 1re proposition est fausse, mais la 2e est vraie","Les deux propositions sont fausses"],"instruction":"Cocher la réponse exacte (une seule réponse possible)"},{"kind":"QROC","num":1,"page":226,"correct":"","points":1.5,"id":"c16","title":"Dans le cadre de la chirurgie ORL, énoncer les moyens de prévenir les nausées et vomissements postopératoires (NVPO) :\n– en début d’intervention,\n– en peropératoire,\n– et en postopératoire.","source":"complete","answer":["Début d’intervention : packing pharyngé (évite le passage du sang et des sécrétions dans l’estomac) ; + dexaméthasone dès l’induction","Peropératoire : propofol en AIVOC (effet antiémétique), éviter les halogénés et le protoxyde d’azote, épargne morphinique (analgésie multimodale)","Prophylaxie médicamenteuse : dexaméthasone, dropéridol (Droleptan®), + ondansétron (Zophren®) en fin d’intervention","Fin d’intervention : aspiration pharyngée rigoureuse (et gastrique) après ablation du packing","Postopératoire : ondansétron (Zophren®) si besoin, position demi-assise, faire cracher les sécrétions dans un haricot ; + analgésie non morphinique, réalimentation progressive"],"criteria":[{"weight":0.2,"label":"Packing","yes":"packing|tamponnement"},{"weight":0.25,"label":"Propofol / AIVOC, éviter halogénés et N₂O","yes":"(?:propofol|aivoc|tiva|halogene|protoxyde)"},{"weight":0.2,"label":"Dexaméthasone","yes":"dexamethasone"},{"weight":0.2,"label":"Dropéridol","yes":"(?:droperidol|droleptan)"},{"weight":0.2,"label":"Ondansétron","yes":"(?:ondansetron|zophren|setron)"},{"weight":0.2,"label":"Aspiration pharyngée / gastrique","yes":"aspiration"},{"weight":0.25,"label":"Position demi-assise / épargne morphinique","yes":"(?:demi.?assis|morphin|multimodal)"}]},{"kind":"QROC","num":2,"page":227,"correct":"","points":1,"criteria":[{"weight":0.25,"label":"Brûlure de la face / inhalation","yes":"(?:brulure|inhalation|fumee)"},{"weight":0.25,"label":"Traumatisme maxillo-facial","yes":"(?:maxillo|facial|face|mandibul)"},{"weight":0.25,"label":"Traumatisme du rachis cervical","yes":"(?:rachis|cervical|minerve|vertebr)"},{"weight":0.25,"label":"Traumatisme laryngé / hématome / œdème des VAS","yes":"(?:laryn|trache|hematome|oedeme|quincke|anaphyla|epiglott)"}],"allOrNothing":false,"id":"c17","title":"Citer 4 pathologies aiguës associées à une intubation difficile lors d’un déchocage.","source":"complete","answer":["Brûlures de la face et des voies aériennes (inhalation de fumées, œdème)","+ Traumatisme maxillo-facial (fractures, saignement, déformation)","+ Traumatisme du rachis cervical (immobilisation, minerve, intubation en rectitude)","+ Traumatisme laryngé ou trachéal, hématome cervical compressif","+ Œdème des voies aériennes (angio-œdème, anaphylaxie) ; saignement des voies aériennes supérieures ; estomac plein","Note : le pneumothorax compressif et l’hémorragie digestive n’ont pas été comptés"]},{"kind":"QROC","num":3,"page":228,"correct":"","points":0.6,"criteria":[{"weight":0.2,"label":"AVC ischémique ou hémorragique","yes":"(?:avc|accident vasculaire|ischemi|embol)"},{"weight":0.2,"label":"Œdème cérébral / hyperperfusion","yes":"(?:oedeme|hyperperfusion|convuls|cephalee)"},{"weight":0.2,"label":"Lésions des nerfs crâniens","yes":"(?:nerf|hypoglosse|recurrent|facial|cranien|dysphoni)"}],"allOrNothing":false,"id":"c18","title":"Citer les complications neurologiques possibles lors d’une endartériectomie carotidienne.","source":"complete","answer":["Accident vasculaire cérébral ischémique (embolie, clampage mal toléré) ou hémorragique","Œdème cérébral / syndrome d’hyperperfusion cérébrale (céphalées, convulsions, hémorragie) après revascularisation","+ Lésions des nerfs crâniens : hypoglosse (XII), nerf laryngé récurrent (dysphonie), nerf facial (branche mandibulaire), glossopharyngien"]},{"kind":"QROC","num":4,"page":228,"correct":"","points":1,"criteria":[{"weight":0.2,"label":"Âge ≥ 3 ans","yes":"\\bage|3 ans"},{"weight":0.2,"label":"Chirurgie du strabisme / ORL","yes":"(?:strabisme|orl|amygdal)"},{"weight":0.2,"label":"Durée > 30 min","yes":"(?:duree|30\\s*min)"},{"weight":0.2,"label":"Antécédent de NVPO / mal des transports / familial","yes":"(?:antecedent|atcd|mal des transports|famil|parent)"},{"weight":0.2,"label":"Morphiniques","yes":"(?:morphin|opio)"}],"allOrNothing":false,"id":"c19","title":"Citer les facteurs de risque de NVPO en pédiatrie.","source":"complete","answer":["Âge : enfant de 3 ans et plus (risque maximal avant la puberté)","Type de chirurgie : strabisme, ORL (amygdalectomie, adénoïdectomie)","+ Durée de l’anesthésie > 30 min","+ Antécédent personnel de NVPO ou de mal des transports, antécédent familial (parents, fratrie)","+ Morphiniques peropératoires et postopératoires","Note : la prématurité n’est pas un facteur de risque reconnu"]},{"kind":"QROC","num":5,"page":229,"correct":"","points":1.6,"id":"c20","title":"Énoncer les moyens de prévention de l’hypotension artérielle post-rachianesthésie chez la femme enceinte. Justifier les réponses.","source":"complete","answer":["Remplissage vasculaire (co-remplissage par cristalloïdes au moment de l’injection) : compense la vasoplégie liée au bloc sympathique","Décubitus latéral gauche ou inclinaison de la table de 15 à 30° vers la gauche : limite le syndrome de compression aorto-cave par l’utérus gravide","+ Vasopresseurs en prophylaxie : phényléphrine (Néosynéphrine®) en IVSE dès l’injection (ou éphédrine), pour maintenir la PA ≥ 90 % de la valeur de base et préserver la perfusion utéro-placentaire","+ Doses réduites d’anesthésique local (bupivacaïne hyperbare 8 à 10 mg) associées à un morphinique, et surveillance rapprochée de la PA (toutes les 1 à 2 min) pour traiter sans délai"],"criteria":[{"weight":0.4,"label":"Remplissage / co-remplissage","yes":"(?:remplissage|cristalloide|co.?loading|preload)"},{"weight":0.4,"label":"Décubitus latéral gauche (compression aorto-cave)","yes":"(?:lateral gauche|gauche|aorto.?cave|compression)"},{"weight":0.4,"label":"Vasopresseurs prophylactiques (phényléphrine)","yes":"(?:phenylephrine|neosynephrine|ephedrine|vasopresseur|noradrenaline)"},{"weight":0.4,"label":"Doses réduites d’AL / surveillance PA rapprochée","yes":"(?:dose|bupivacaine|surveillance|monitor)"}]},{"kind":"QROC","num":6,"page":230,"correct":"","points":2.6,"criteria":[{"weight":0.4,"label":"Définition : ≥ 500 mL dans les 24 h","yes":"500"},{"weight":0.3,"label":"Alerte / poche de recueil / heure","yes":"(?:alert|poche|recueil|heure)"},{"weight":0.3,"label":"2e VVP gros calibre / monitorage","yes":"(?:vvp|voie veineuse|calibre|monitor|scope)"},{"weight":0.3,"label":"Bilan / EFS / carte de groupe","yes":"(?:efs|carte de groupe|bilan|fibrinogene|hemocue|culot|rai)"},{"weight":0.3,"label":"Remplissage / vasopresseurs","yes":"(?:remplissage|ephedrine|vasopresseur|noradrenaline|phenylephrine|neosynephrine)"},{"weight":0.3,"label":"Anesthésie : réinjection de la péridurale ou AG","yes":"(?:peridurale|anesthesie generale|\\bag\\b|reinjection)"},{"weight":0.4,"label":"Ocytocine / acide tranexamique / sulprostone","yes":"(?:ocytocine|syntocinon|tranexamique|exacyl|sulprostone|nalador)"},{"weight":0.3,"label":"Sonde urinaire / réchauffement / traçabilité","yes":"(?:sond|rechauff|tracab)"}],"allOrNothing":false,"id":"c21","title":"Définir une hémorragie de la délivrance (HPP).\nÉnoncer la prise en charge anesthésique lors des 30 premières minutes en cas d’HPP lors d’un accouchement par voie basse.","source":"complete","answer":["Définition : pertes sanguines ≥ 500 mL dans les 24 h suivant l’accouchement (HPP sévère ≥ 1 000 mL)","Alerter tous les acteurs (obstétricien, MAR, sage-femme) ; poche de recueil graduée ; noter l’heure du diagnostic (T0)","Vérifier ou poser une 2e voie veineuse de gros calibre ; monitorage (scope, PA, SpO₂), oxygénothérapie","+ Bilan : NFS, plaquettes, hémostase avec fibrinogène, groupe + RAI ; Hémocue ; prévenir l’EFS et faire le point sur la carte de groupe et les produits disponibles","Évaluer l’hémodynamique ; remplissage par cristalloïdes réchauffés, vasopresseurs (éphédrine, phényléphrine, noradrénaline) si besoin","Anesthésie pour la délivrance artificielle et la révision utérine : réinjection de la péridurale si hémodynamique stable, sinon AG (estomac plein, induction en séquence rapide)","+ Utérotoniques : ocytocine 5 à 10 UI IVL puis en entretien ; acide tranexamique 1 g IV ; sondage vésical ; massage utérin","+ Si échec à 30 min : sulprostone (Nalador®) et escalade (transfusion, fibrinogène, embolisation ou chirurgie) ; réchauffement ; traçabilité"]},{"kind":"QROC","num":7,"page":231,"correct":"","points":1.5,"id":"c22","title":"Décrire les caractéristiques de la prééclampsie sévère.","source":"complete","answer":["HTA sévère : PAS ≥ 160 mmHg et/ou PAD ≥ 110 mmHg (la copie indiquait ≥ 100 pour la PAD)","Protéinurie massive (> 3 g/24 h) ou atteinte rénale : oligurie < 500 mL/24 h, créatinine > 90 µmol/L","Atteinte hépatique et hématologique : HELLP syndrome (hémolyse, cytolyse hépatique, thrombopénie < 100 000/mm³), troubles de la coagulation","Signes neurologiques : céphalées, troubles visuels, ROT vifs et polycinétiques, troubles de la conscience (risque d’éclampsie)","+ Douleur épigastrique en barre, œdème aigu du poumon, et retentissement fœtal (retard de croissance intra-utérin, anomalies du rythme cardiaque fœtal), hématome rétroplacentaire"],"criteria":[{"weight":0.3,"label":"HTA sévère (≥ 160/110)","yes":"(?:160|hta|hypertension)"},{"weight":0.3,"label":"Protéinurie / atteinte rénale","yes":"(?:proteinurie|oligurie|renal|creatinin)"},{"weight":0.3,"label":"HELLP / thrombopénie / atteinte hépatique","yes":"(?:hellp|thrombopeni|hepati|hemolys|cytolys)"},{"weight":0.3,"label":"Signes neurologiques (céphalées, troubles visuels, ROT)","yes":"(?:cephalee|visuel|rot|reflexe|conscience|eclampsie|neuro)"},{"weight":0.3,"label":"Douleur épigastrique / OAP / retentissement fœtal","yes":"(?:epigastr|barre|oap|oedeme pulmonaire|foetal|rciu|croissance|retroplacentaire)"}]},{"kind":"QROC","num":8,"page":232,"correct":"","points":2,"criteria":[{"weight":0.5,"label":"Ouverture des yeux spontanée · 4","yes":"(?=.*(?:yeux|oculaire|\\by\\b|\\be\\b))(?=.*4)"},{"weight":0.5,"label":"Réponse verbale confuse · 4","yes":"(?=.*(?:verbal|\\bv\\b|confus))(?=.*4)"},{"weight":0.5,"label":"Score total 12/15 (M4)","yes":"12"},{"weight":0.5,"label":"Pas d’intubation : indication si Glasgow ≤ 8","yes":"(?:\\b8\\b|pas d.?intubation|ne necessite pas|non necessaire)"}],"allOrNothing":false,"caution":"La cotation motrice sur la copie diffère de la grille Glasgow. La réponse motrice et le total sont à vérifier.","id":"c23","title":"Vous êtes IADE en neurochirurgie. Vous prenez en charge un patient qui tient des propos confus. Il ouvre spontanément les yeux. Il présente une réponse motrice en flexion non appropriée.\nÉvaluer l’état de conscience du patient selon l’échelle de Glasgow.\nArgumenter votre réponse face à l’IDE qui vous demande si l’intubation est nécessaire en urgence.","source":"copie","note":"La copie (M4) a eu tous les points. Selon la grille, une flexion stéréotypée « anormale » (décortication) cote M3 : relis bien l’énoncé le jour de l’examen.","answer":["Ouverture des yeux spontanée : Y (E) = 4","Réponse verbale confuse : V = 4","Réponse motrice en flexion (retrait) : M = 4","Score de Glasgow = 12/15","Pas d’indication à une intubation en urgence sur ce critère : l’intubation est indiquée pour un Glasgow ≤ 8 (protection des voies aériennes) ; poursuivre la surveillance neurologique rapprochée (aggravation, pupilles) et alerter en cas de dégradation"]},{"kind":"QROC","num":9,"page":233,"correct":"","points":1.25,"id":"c24","title":"Définir la sclérose en plaques (SEP) en précisant les facteurs favorisants.\nCiter les précautions à prendre lors d’une anesthésie générale pour un patient atteint d’une SEP.","source":"complete","answer":["+ SEP : maladie inflammatoire chronique auto-immune démyélinisante du système nerveux central (et non périphérique), évoluant par poussées et rémissions puis de façon progressive","+ Facteurs favorisants : femme jeune (20–40 ans), prédisposition génétique, facteurs environnementaux (latitude, carence en vitamine D, tabac, infection par l’EBV)","+ Précautions pour l’AG : éviter l’hyperthermie (qui aggrave les symptômes), succinylcholine contre-indiquée si déficit moteur (hyperkaliémie), monitorage de la curarisation","+ Évaluer la fonction respiratoire et les troubles de déglutition (risque d’inhalation) ; poursuivre les traitements de fond, supplémenter en corticoïdes si corticothérapie au long cours ; limiter le stress et les infections, qui favorisent les poussées"],"criteria":[{"weight":0.25,"label":"Démyélinisante du SNC","yes":"(?:demyelin|systeme nerveux central|\\bsnc\\b)"},{"weight":0.2,"label":"Auto-immune, évolution par poussées","yes":"(?:auto.?immun|poussee|inflammatoire)"},{"weight":0.2,"label":"Facteurs favorisants (femme jeune, génétique, environnement)","yes":"(?:femme|jeune|genet|vitamine|tabac|latitude|ebv|environnement)"},{"weight":0.2,"label":"Éviter l’hyperthermie","yes":"(?:hyperthermi|temperature|fievre)"},{"weight":0.2,"label":"Succinylcholine contre-indiquée / curares","yes":"(?:succinylcholine|celocurine|curare|curarisation)"},{"weight":0.2,"label":"Fonction respiratoire / déglutition / corticoïdes","yes":"(?:respirat|deglutition|inhalation|cortico|traitement de fond)"}]},{"kind":"QROC","num":10,"page":234,"correct":"","points":1.25,"id":"c25","title":"Définir le donneur vivant.\nCiter 3 organes pouvant faire l’objet d’un don d’organe.","source":"complete","answer":["Donneur vivant : personne majeure (en principe), en bonne santé, qui donne de son vivant un organe (ou une partie d’organe) dans l’intérêt thérapeutique direct d’un receveur","+ Lien familial ou affectif étroit et stable (≥ 2 ans) avec le receveur ; consentement libre et éclairé exprimé devant le président du tribunal judiciaire, révocable à tout moment ; don gratuit (l’anonymat ne s’applique pas)","Organes : rein, lobe de foie, + lobe pulmonaire"],"criteria":[{"weight":0.2,"label":"Personne majeure, vivante","yes":"(?:majeur|vivant|de son vivant)"},{"weight":0.25,"label":"Consentement libre et éclairé (tribunal)","yes":"(?:consentement|tribunal|juge)"},{"weight":0.2,"label":"Lien familial / affectif","yes":"(?:famil|affectif|proche|lien)"},{"weight":0.15,"label":"Rein","yes":"rein"},{"weight":0.15,"label":"Foie","yes":"foie"},{"weight":0.15,"label":"Poumon","yes":"poumon|pulmon"},{"weight":0.15,"label":"Gratuité","yes":"(?:gratuit|benevol)"}]},{"kind":"QROC","num":11,"page":234,"correct":"","points":1.35,"criteria":[{"weight":0.25,"label":"Définition : ventilation d’un seul poumon","yes":"(?:seul poumon|un poumon|unipulmonaire|exclu)"},{"weight":0.25,"label":"Permettre la chirurgie","yes":"chirurg"},{"weight":0.3,"label":"Exposition chirurgicale (exclusion du poumon opéré)","yes":"(?:exposition|exclu|collab|affaiss)"},{"weight":0.3,"label":"Protéger le poumon sain d’une contamination","yes":"(?:proteg|contamin|pus|sang|abces|hemoptysie)"},{"weight":0.25,"label":"Fistule / lavage / contrôle de la ventilation","yes":"(?:fistule|bulle|lavage|distribution|rupture)"}],"allOrNothing":false,"id":"c26","title":"Définir la ventilation unipulmonaire.\nÉnoncer les objectifs d’une intubation sélective dans le cadre d’une ventilation unipulmonaire (VUP).","source":"complete","answer":["Ventilation unipulmonaire : ventilation d’un seul poumon, l’autre étant exclu, pour permettre la chirurgie et/ou protéger le poumon non ventilé","+ Objectifs de l’intubation sélective (sonde double lumière ou bloqueur bronchique) : exclure le poumon opéré pour améliorer l’exposition chirurgicale (chirurgie thoracique, œsophagienne, vidéothoracoscopie)","+ Protéger le poumon sain d’une contamination par le poumon pathologique (pus, sang, abcès, hémoptysie)","+ Contrôler la distribution de la ventilation : fistule bronchopleurale, bulle, rupture bronchique ; permettre un lavage bronchoalvéolaire unilatéral","Ventilation protectrice du poumon ventilé (VT 4–6 mL/kg, PEEP 5, recrutements) pour garantir l’oxygénation et prévenir les atélectasies"]},{"kind":"QROC","num":12,"page":235,"correct":"","points":1.6,"id":"c27","title":"Indiquer les conséquences physiopathologiques des déperditions thermiques du nouveau-né.","source":"complete","answer":["Thermogenèse sans frisson par catabolisme de la graisse brune → augmentation de la consommation d’O₂ → hypoxie","+ Augmentation de la consommation de glucose → hypoglycémie ; mé const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n,]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

$('h-footer').textContent=`Source · Annales 2022–2024, UE ${DATA.ue}, semestre ${DATA.semester}${DATA.start?`, pages ${DATA.start} à ${DATA.end} du PDF`:''}. Fonctionne hors connexion.`;
const srcTag=q=>q.source==='deduit'?'<span class="tag-src deduit">Reconstitué</span>':q.source==='complete'?'<span class="tag-src">Copie complétée</span>':q.source==='copie'?'<span class="tag-src">Copie notée au maximum</span>':'';
function answerBox(q){
  let list=q.answer; if(!list) return ''; if(typeof list==='string') list=[list];
  const items=list.map(a=>{const add=a.startsWith('+');const t=add?a.replace(/^\+\s*/,''):a;return `<li class="${add?'added':''}">${escape(t)}${add?'<span class="tag-added">Complément</span>':''}</li>`;}).join('');
  return `<div class="answer-key"><h3>Correction ${srcTag(q)}</h3><ul>${items}</ul>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
}
let active, grades, locked, confirmed, targeted;
const form = $('quiz');
function images(list, label) {
  return list.map((item,i) => `<img loading="lazy" alt="${escape(label)}${list.length>1?' · extrait '+(i+1):''}" src="data:image/jpeg;base64,${item}">`).join('');
}
function scanBlock(scans, label) {
  return `<div class="document"><div class="source-pictures" tabindex="0" aria-label="${escape(label)}">${images(scans,label)}</div><button type="button" class="secondary zoom" aria-expanded="false">Agrandir le scan</button></div>`;
}
function prompt(q) {
  if(q.images) return scanBlock(q.images,questionLabel(q));
  const table=q.table?`<div class="prompt-table">${q.table.map(cell=>`<span>${escape(cell)}</span>`).join('')}</div>`:'';
  return `<h2 class="question-stem">${escape(q.title)}</h2>${q.text?`<p class="context-text">${escape(q.text)}</p>`:''}${q.figure_img?`<div class="q-figure"><img src="data:image/jpeg;base64,${q.figure_img}" alt="Figure de la question"></div>`:''}${q.instruction?`<p class="small">${escape(q.instruction)}</p>`:''}${table}`;
}
function fields(q) {
  if (isChoice(q)) {
    return `<div class="choices ${q.options?'written-choices':''}" role="${q.kind==='QCU'?'radiogroup':'group'}" aria-labelledby="title-${q.id}">${values.map((letter,i)=>`<label class="option" id="option-${q.id}-${letter}"><input type="${q.kind==='QCU'?'radio':'checkbox'}" name="${q.id}" value="${letter}"><span><strong>${letter}</strong>${q.options?' · '+escape(q.options[i]):''}<small></small></span></label>`).join('')}</div>`;
  }
  return `<div class="field"><textarea id="answer-${q.id}" aria-labelledby="title-${q.id}" rows="5" placeholder="Ta réponse…"></textarea></div>`;
}
function render() {
  $('cards').innerHTML = active.map((q, index) => {
    const section = q.kind === 'context' ? '<span>Cas clinique</span>' : `<span>${q.points==null?'':format(q.points)+' pt · '}PDF p. ${q.page}</span>`;
    const anchor = active.findIndex(card=>card.kind===q.kind)===index ? ` id="section-${q.kind}"` : '';
    return `<section class="card"${anchor} data-card="${q.id}"><div class="meta"><strong id="title-${q.id}">${escape(questionLabel(q))}</strong>${section}</div>${prompt(q)}${q.kind==='context'?'':fields(q)+`<div class="feedback" id="feedback-${q.id}" hidden></div>`}</section>`;
  }).join('');
  for(const link of document.querySelectorAll('[data-kind]')){
    const kind=link.dataset.kind;
    const index=active.findIndex(q=>kind==='open'?isOpen(q):q.kind===kind);
    link.hidden=index<0;
    if(index>=0) link.hash='section-'+active[index].kind;
  }
}
function response(q) {
  if (isChoice(q)) {
    return [...form.querySelectorAll(`[name="${q.id}"]:checked`)].map(input=>input.value);
  }
  return $(`answer-${q.id}`).value.trim();
}
function progress() {
  const current=active.filter(q=>q.kind!=='context');
  const count=current.filter(q=>response(q).length>0).length;
  $('progress').textContent=`${count} / ${current.length} questions renseignées`;
  $('bar').max=current.length;
  $('bar').value=count;
}
function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Réponse à évaluer à partir de la copie annotée.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  const reference=`<p class="small">Page ${q.page} du PDF source.</p>`;
  if (isOpen(q)) {
    const caution=q.caution?`<p class="notice">${escape(q.caution)} <a href="https://www.glasgowcomascale.org/downloads/GCS-Assessment-Aid-English.pdf">Grille Glasgow</a></p>`:'';
    panel.innerHTML=`${answerBox(q)}${rubricPanel(q,grade)}${caution}${q.evidence&&!q.answer?scanBlock(q.evidence,'Réponse annotée · '+questionLabel(q)):''}${assessmentControls(q,grade)}${reference}`;
    return;
  }
  const key=q.correct?`<strong>${format(grade.autoScore)} / 1 point</strong><div class="answer-key" style="margin-top:10px"><h3>Correction ${srcTag(q)}</h3><div class="key-letters">Bonne${q.correct.length>1?'s':''} réponse${q.correct.length>1?'s':''} · ${q.correct.split('').join(', ')}</div>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`:`<strong>Corrigé à vérifier</strong><p>La copie comporte une note partielle ou nulle.${q.marked?' Choix cochés · '+escape(q.marked)+'.':''}</p>`;
  const evidence=q.evidence?`<details><summary>Voir la copie annotée</summary><div class="source-pictures" tabindex="0">${images(q.evidence,'Copie annotée · '+questionLabel(q))}</div></details>`:'';
  panel.innerHTML=key+evidence+(q.correct?'':assessmentControls(q,grade))+reference;
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=targeted?available:DATA.examTotal??available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(isComplete);
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';

  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>!keep||q.kind==='context'||keep.has(q.id));
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);

  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
start();

<script>window.MEMO_QUIZ={"id": "annales/S2/3.3", "href": "annales/S2/3.3.html", "collection": "annales", "sem": "S2", "ue": "3.3", "periode": "2022-2024", "titre": "Modalités spécifiques — 2022-2024"};</script>
<script>
/* Mémo : enregistre la note obtenue, pour l'écran « Mes résultats » de l'app.
   Même origine que l'app, donc même localStorage. Une tentative par correction ;
   si la note est ajustée à la main ensuite, la tentative en cours est mise à jour. */
(function () {
  var CLE = 'memo-resultats', INFO = window.MEMO_QUIZ;
  if (!INFO) return;
  var resultats = document.getElementById('results'), score = document.getElementById('score');
  if (!resultats || !score) return;
  var tentative = null;

  function lire() { try { return JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { return []; } }
  function noteDe(txt) {
    var m = String(txt).match(/(-?[\d  ]+(?:[.,]\d+)?)\s*\/\s*20/);
    return m ? parseFloat(m[1].replace(/[  ]/g, '').replace(',', '.')) : null;
  }
  function enregistrer() {
    if (resultats.hidden) return;
    var note = noteDe(score.textContent);
    if (note === null || !isFinite(note)) return;
    var liste = lire();
    var ligne = tentative && liste.find(function (x) { return x.cle === tentative; });
    if (!ligne) {
      tentative = INFO.id + '#' + Date.now();
      ligne = { cle: tentative, id: INFO.id, href: INFO.href, collection: INFO.collection,
        sem: INFO.sem, ue: INFO.ue, periode: INFO.periode, titre: INFO.titre };
      liste.push(ligne);
    }
    ligne.note = Math.round(note * 100) / 100;
    ligne.date = new Date().toISOString();
    try { localStorage.setItem(CLE, JSON.stringify(liste.slice(-300))); } catch (e) {}
  }

  new MutationObserver(enregistrer).observe(score, { childList: true, characterData: true, subtree: true });
  new MutationObserver(enregistrer).observe(resultats, { attributes: true, attributeFilter: ['hidden'] });
  // « Tout recommencer » : la prochaine correction comptera comme une nouvelle tentative.
  document.getElementById('reset') && document.getElementById('reset').addEventListener('click', function () { tentative = null; });
})();
</script>
