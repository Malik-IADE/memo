spholipide présent le long de l’axone","Elle dégrade l’acétylcholine dans la fente synaptique","Elle hydrolyse l’acétylcholine en Ca²⁺","Elle limite la durée de la dépolarisation musculaire","Elle est un dérivé de la pseudocholinestérase"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":8,"page":27,"correct":"ACDE","points":1,"id":"c8","title":"Parmi ces propositions concernant l’anatomie de la jonction neuromusculaire, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Le motoneurone est le neurone responsable de la transmission du message nerveux qui déclenche la contraction musculaire","La fente synaptique se situe entre les nœuds de Ranvier","Dans les invaginations de la fente synaptique, les crêtes portent les récepteurs cholinergiques","Dans le fond des invaginations de la fente synaptique se situent les canaux sodiques","Il y a une jonction neuromusculaire par cellule musculaire"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":9,"page":28,"correct":"BCE","points":1,"id":"c9","title":"Parmi ces propositions concernant la physiologie de la jonction neuromusculaire, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Les récepteurs à l’adrénaline participent à la fermeture des canaux sodiques","Les récepteurs à l’acétylcholine participent à l’ouverture des canaux sodiques","L’ouverture des canaux sodiques entraîne une dépolarisation qui permet la contraction musculaire","L’enzyme acétylcholinestérase libère l’acétylcholine","L’acétylcholine hydrolysée en acétate et choline marque la fin de la transmission synaptique"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":10,"page":28,"correct":"ACDE","points":1,"id":"c10","title":"Parmi ces propositions concernant la physiopathologie des œdèmes extracellulaires, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Les œdèmes extracellulaires sont dus à un blocage de la voie lymphatique","Les œdèmes extracellulaires sont dus à une diminution de la perméabilité capillaire","Les œdèmes extracellulaires sont dus à une diminution de la pression oncotique colloïde plasmatique","Les œdèmes extracellulaires sont dus à une augmentation de la pression capillaire","Les œdèmes extracellulaires sont dus à une rétention hydrosodée"],"source":"deduit","note":"La copie (A, C, D, E) a obtenu 0,5 avec une marque du correcteur sur C. D’après la loi de Starling, les œdèmes viennent d’une baisse de la pression oncotique, d’une hausse de la pression capillaire, d’une hausse de la perméabilité (B fausse), d’un blocage lymphatique et d’une rétention hydrosodée. Vérifie le point C avec ton cours.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":11,"page":29,"correct":"ABDE","points":1,"id":"c11","title":"Parmi ces propositions concernant les signes en faveur d’une déshydratation extracellulaire, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Hypotension associée à une tachycardie","Protides > 75 g/L","Hématocrite < 50 %","Oligurie","Fièvre"],"source":"deduit","note":"La copie (A, D) a obtenu 0,25, le correcteur signalant B et E comme oubliées. Hémoconcentration : protides > 75 g/L et hématocrite > 50 % (C fausse).","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":12,"page":29,"correct":"ABCE","points":1,"id":"c12","title":"Parmi ces propositions concernant le système rénine-angiotensine-aldostérone, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Le système rénine-angiotensine-aldostérone est un système hormonal lent","Le système rénine-angiotensine-aldostérone entraîne une régulation à long terme de la pression artérielle","L’angiotensine II entraîne une libération de l’aldostérone par la corticosurrénale","L’angiotensine II entraîne une vasodilatation des artérioles","L’aldostérone augmente la réabsorption de sodium et d’eau"],"source":"deduit","note":"La copie (A, B, E) a obtenu 0,5, le correcteur signalant C comme oubliée. L’angiotensine II est vasoconstrictrice (D fausse).","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":13,"page":30,"correct":"ACDE","points":1,"id":"c13","title":"Parmi ces propositions concernant les effets d’un remplissage avec un soluté hypotonique, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Augmentation du volume extracellulaire","Augmentation de la kaliémie","Diminution de l’osmolarité du compartiment intracellulaire","Diminution de l’osmolarité du compartiment extracellulaire","Augmentation du volume intracellulaire"],"source":"deduit","note":"La copie (C, E) a obtenu 0,25, le correcteur signalant A et D comme oubliées. Un soluté hypotonique augmente les volumes extra- et intracellulaire et diminue l’osmolarité des deux compartiments.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":14,"page":30,"correct":"ABCD","points":1,"id":"c14","title":"Parmi ces propositions concernant les chémorécepteurs, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Ils stimulent le centre vasomoteur","Ils sont sensibles aux variations en O₂, CO₂ et pH","Ils sont localisés dans des corpuscules carotidiens","Ils sont localisés dans des corpuscules aortiques","Les chémorécepteurs s’activent quand la pression augmente (40–80 mmHg)"],"source":"deduit","note":"La copie (B, C, D, E) a obtenu 0,25 : A oubliée et E fausse. Ce sont les barorécepteurs qui répondent aux variations de pression.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":15,"page":31,"correct":"DE","points":1,"id":"c15","title":"Parmi ces propositions concernant les récepteurs bêta-adrénergiques, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Les récepteurs β2 prédominent au niveau du myocarde","Les récepteurs β1 prédominent au niveau des bronches","La stimulation des récepteurs β1 entraîne une baisse de la fréquence cardiaque","Les récepteurs β2 prédominent au niveau des cellules musculaires lisses des vaisseaux","La stimulation des récepteurs β1 provoque une augmentation de l’excitabilité cardiaque"],"source":"deduit","note":"La copie (E) a obtenu 0,5, le correcteur signalant D comme oubliée. β1 prédomine au cœur (effets positifs), β2 aux bronches et aux muscles lisses vasculaires.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":16,"page":31,"correct":"ABD","points":1,"id":"c16","title":"Parmi ces propositions concernant l’insuffisance cardiaque droite, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Entraîne une diminution du débit cardiaque","Entraîne une diminution de la pression artérielle","Entraîne une diminution de la pression veineuse","Entraîne une diminution de la perfusion tissulaire","Entraîne une augmentation de la pression capillaire pulmonaire"],"source":"deduit","note":"La copie (A, B, C) a obtenu 0,25 : C fausse (la pression veineuse augmente) et D oubliée. L’augmentation de la pression capillaire pulmonaire relève de l’insuffisance cardiaque gauche.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":17,"page":32,"correct":"ABD","points":1,"id":"c17","title":"Parmi ces propositions concernant le débit cardiaque, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Il dépend du volume d’éjection systolique","Il dépend de la fréquence cardiaque","Il est de 3 L/min chez l’adulte au repos","Il varie avec l’activité physique","Il est réparti uniformément dans tous les organes"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCU","num":1,"page":33,"correct":"C","points":1,"id":"c18","title":"Parmi ces propositions concernant les effets d’une pression positive sur les ventricules cardiaques (VG gauche et VD droit), laquelle est vraie ?\n\nUne pression positive sur le VD provoque une baisse de la précharge\nCAR\nUne pression positive sur le VG provoque une baisse de la précharge","options":["Les propositions sont toutes deux vraies et il existe entre elles une relation de cause à "La copie (A) a obtenu 0 : les deux propositions sont vraies mais sans lien de cause à effet.","instruction":"Cocher la réponse exacte (une seule réponse possible)"},{"kind":"QUESTION","num":1,"page":35,"correct":"","points":2.75,"criteria":[{"weight":0.25,"label":"Infections du site opératoire","yes":"infect"},{"weight":0.25,"label":"Saignement / coagulopathie","yes":"(?:hemorragi|saign|coagul|plaquett)"},{"weight":0.25,"label":"Retard de réveil / pharmacocinétique","yes":"(?:reveil|curare|duree d.?action|pharmaco)"},{"weight":0.25,"label":"Frissons","yes":"frisson"},{"weight":0.25,"label":"Inconfort","yes":"inconfort"},{"weight":0.25,"label":"Complications cardiovasculaires","yes":"(?:cardi|ischemi|rythm|coronar)"},{"weight":0.25,"label":"Consommation d’O₂ ↑ / hypoxémie","yes":"(?:consommation|\\bo2\\b|hypox)"},{"weight":0.25,"label":"Durée de séjour","yes":"(?:sejour|hospitalisation|sspi)"},{"weight":0.75,"label":"Les 3 plus fréquentes identifiées (frissons, inconfort…)","yes":"(?=.*frisson)(?=.*inconfort)"}],"allOrNothing":false,"id":"c21","title":"Citer 8 conséquences de l’hypothermie. Indique (souligne) les 3 plus fréquentes.","source":"complete","answer":["Augmentation des infections du site opératoire","Augmentation du risque hémorragique (troubles de la coagulation et de l’agrégation plaquettaire)","Retard de réveil (allongement de la durée d’action des médicaments, surtout des curares)","Frissons (souligné : fréquent)","Inconfort thermique (souligné : fréquent)","Complications cardiovasculaires : ischémie myocardique, troubles du rythme","+ Augmentation de la consommation d’O₂ (frissons) avec risque d’hypoxémie","+ Allongement du séjour en SSPI et de la durée d’hospitalisation","Les 3 plus fréquentes à souligner : frissons, inconfort thermique, et saignement ou retard de réveil (à vérifier avec ton cours)"]},{"kind":"QUESTION","num":2,"page":36,"correct":"","points":2,"id":"c22","title":"Décrire la prise en charge du réchauffement cutané actif.","source":"complete","answer":["Préréchauffement avant l’induction (au moins 10 à 30 min) par une couverture à air pulsé, pour limiter la redistribution de la chaleur du centre vers la périphérie","Poursuite en peropératoire avec une couverture (ou un matelas) chauffante à air pulsé, en couvrant la plus grande surface cutanée possible, extrémités comprises","Monitorage de la température centrale ; objectif T° ≥ 36 °C (36,5 °C)","Associer le réchauffement des solutés de perfusion et d’irrigation (chirurgie > 1 h ou gros volumes) et une température de salle adaptée (≥ 21 °C)","+ Poursuite en SSPI jusqu’à normothermie (≥ 36 °C) avant la sortie"],"criteria":[{"weight":0.4,"label":"Préréchauffement préopératoire","yes":"(?:pre.?rechauff|pre.?operatoire|avant l.?induction)"},{"weight":0.4,"label":"Couverture à air pulsé / matelas chauffant en peropératoire","yes":"(?:air pulse|couverture|matelas|bair)"},{"weight":0.4,"label":"Monitorage de la température, cible ≥ 36 °C","yes":"(?:36|monitor|temperature centrale|thermometr)"},{"weight":0.4,"label":"Réchauffement des solutés / irrigation, T° de salle","yes":"(?:solute|perfusion|irrigation|salle)"},{"weight":0.4,"label":"Poursuite en SSPI / postopératoire","yes":"(?:sspi|post.?operatoire|reveil)"}]},{"kind":"QUESTION","num":3,"page":36,"correct":"","points":2,"criteria":[{"weight":0.35,"label":"Alvéole PO₂ ≈ 104","yes":"10[0-5]"},{"weight":0.3,"label":"Alvéole / sang oxygéné PCO₂ ≈ 40","yes":"(?<![\\d.])40(?![\\d.])"},{"weight":0.35,"label":"Sang désoxygéné PO₂ ≈ 40","yes":"(?=.*desoxygen|.*veineu)(?=.*(?<![\\d.])40)"},{"weight":0.4,"label":"Sang désoxygéné PCO₂ ≈ 45–46","yes":"4[5-7]"},{"weight":0.3,"label":"Sang oxygéné PO₂ ≈ 95–104","yes":"(?:9[5-9]|10[0-4])"},{"weight":0.3,"label":"Sang oxygéné PCO₂ ≈ 40","yes":"(?=.*oxygen)(?=.*(?<![\\d.])40)"}],"allOrNothing":false,"id":"c23","title":"Renseigner les valeurs de PO₂ et de PCO₂ (en mmHg) décrivant les échanges alvéolaires :\n– dans l’alvéole,\n– dans le sang désoxygéné (arrivant au capillaire pulmonaire),\n– dans le sang oxygéné (quittant le capillaire pulmonaire).","source":"complete","answer":["Alvéole : PO₂ ≈ 104 mmHg ; PCO₂ ≈ 40 mmHg","Sang désoxygéné (veineux, entrée du capillaire) : PO₂ ≈ 40 mmHg ; + PCO₂ ≈ 45 à 46 mmHg","Sang oxygéné (sortie du capillaire) : PO₂ ≈ 104 mmHg (≈ 95–100 mmHg dans le sang artériel systémique) ; PCO₂ ≈ 40 mmHg"]},{"kind":"QUESTION","num":4,"page":37,"correct":"","points":1.5,"criteria":[{"weight":0.25,"label":"pH 7,38–7,42","yes":"7.3[5-8].{0,6}7.4[2-5]"},{"weight":0.25,"label":"PaO₂ 80–100 mmHg","yes":"(?:80|90).{0,6}100\\s*mm"},{"weight":0.25,"label":"PaCO₂ 35–45 mmHg","yes":"35.{0,6}45\\s*mm"},{"weight":0.25,"label":"CO₂ total 24–30 mmol/L","yes":"(?:2[4-7]).{0,6}(?:3[0-2])\\s*mmol"},{"weight":0.25,"label":"Bicarbonates 22–26 mmol/L","yes":"22.{0,6}2[68]\\s*mmol"},{"weight":0.25,"label":"SaO₂ 95–100 %","yes":"(?:9[4-8]).{0,6}100\\s*%"}],"allOrNothing":false,"id":"c24","title":"Donner les normes biologiques, unités comprises, de la fonction respiratoire : pH, PaO₂, PaCO₂, CO₂ total, bicarbonates, saturation en oxygène.","source":"complete","answer":["pH : 7,38 – 7,42 (sans unité)","PaO₂ : 80 – 100 mmHg","PaCO₂ : 35 – 45 mmHg","+ CO₂ total : 24 – 30 mmol/L (et non en mmHg)","Bicarbonates : 22 – 26 mmol/L","+ Saturation en oxygène (SaO₂) : 95 – 100 % (et non en mmHg)"]},{"kind":"QUESTION","num":5,"page":37,"correct":"","points":3,"criteria":[{"weight":0.6,"label":"Urines ≈ 1,5 L","yes":"(?=.*urine)"},{"weight":0.6,"label":"Peau / sueurs ≈ 0,5 L","yes":"(?:sueur|peau|cutane|perspiration)"},{"weight":0.6,"label":"Respiration ≈ 0,4–0,5 L","yes":"(?:respirat|pulmon|expir)"},{"weight":0.6,"label":"Selles ≈ 0,1–0,2 L","yes":"(?:selle|fecal|digesti)"},{"weight":0.6,"label":"Total ≈ 2,5 L/jour","yes":"(?:2.5\\s*l|2\\s*500)"}],"allOrNothing":false,"id":"c25","title":"Sous quelles formes se traduisent les sorties d’eau dans le corps humain, et dans quelle proportion, pour un homme de 70 kg ?","source":"complete","answe const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n,]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Réponse à évaluer à partir de la copie annotée.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  const reference=`<p class="small">Page ${q.page} du PDF source.</p>`;
  if (isOpen(q)) {
    const caution=q.caution?`<p class="notice">${escape(q.caution)} <a href="https://www.glasgowcomascale.org/downloads/GCS-Assessment-Aid-English.pdf">Grille Glasgow</a></p>`:'';
    panel.innerHTML=`${answerBox(q)}${rubricPanel(q,grade)}${caution}${q.evidence&&!q.answer?scanBlock(q.evidence,'Réponse annotée · '+questionLabel(q)):''}${assessmentControls(q,grade)}${reference}`;
    return;
  }
  const key=q.correct?`<strong>${format(grade.autoScore)} / 1 point</strong><div class="answer-key" style="margin-top:10px"><h3>Correction ${srcTag(q)}</h3><div class="key-letters">Bonne${q.correct.length>1?'s':''} réponse${q.correct.length>1?'s':''} · ${q.correct.split('').join(', ')}</div>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`:`<strong>Corrigé à vérifier</strong><p>La copie comporte une note partielle ou nulle.${q.marked?' Choix cochés · '+escape(q.marked)+'.':''}</p>`;
  const evidence=q.evidence?`<details><summary>Voir la copie annotée</summary><div class="source-pictures" tabindex="0">${images(q.evidence,'Copie annotée · '+questionLabel(q))}</div></details>`:'';
  panel.innerHTML=key+evidence+(q.correct?'':assessmentControls(q,grade))+reference;
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=targeted?available:DATA.examTotal??available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(isComplete);
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>!keep||q.kind==='context'||keep.has(q.id));
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
start();
