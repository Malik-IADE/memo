","title":"Parmi ces propositions concernant l’acte transfusionnel, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Les femmes en âge de procréer présentent une indication de transfusion de culots globulaires (CG) phénotypés","Le phénotype complet et le groupe rhésus doivent obligatoirement être respectés pour transfuser tous les patients","La détermination du groupage sanguin doit être réalisée à deux moments différents","La personne qui transfuse est celle qui a réalisé le contrôle prétransfusionnel ultime (CPU)","Le CPU n’est pas obligatoire en situation d’urgence"],"source":"deduit","note":"La copie (B, C, D) a obtenu 0,25. Le phénotype complet n’est pas requis pour tous les patients ; les femmes en âge de procréer reçoivent des CGR phénotypés RH-KEL1 ; le CPU reste obligatoire, même en urgence.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":14,"page":64,"correct":"BE","points":1,"id":"c14","title":"Parmi ces propositions concernant les compétences non techniques, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Elles interviennent uniquement lors d’un incident anesthésique","Elles font intervenir le travail en équipe","Elles font intervenir les connaissances médicales","Elles font intervenir les connaissances physiopathologiques","Elles font intervenir la conscience de la situation"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":15,"page":65,"correct":"BDE","points":1,"id":"c15","title":"Parmi ces propositions concernant les principes fondamentaux de radioprotection, laquelle ou lesquelles est (sont) vraie(s) ?","options":["Le principe de rayonnement est un principe fondamental de radioprotection","Le principe d’optimisation est un principe fondamental de radioprotection","Le principe de prévention est un principe fondamental de radioprotection","Le principe de justification est un principe fondamental de radioprotection","Le principe de limitation est un principe fondamental de radiop traîne 0 à la question.)","source":"copie","answer":["Loi de Landsteiner : un individu possède dans son plasma les anticorps dirigés contre les antigènes absents de ses hématies","Patient : agglutination avec l’anti-A et avec l’anti-B, donc antigènes A et B sur ses hématies → groupe AB (pas d’anticorps anti-A ni anti-B dans son plasma)","Culot : agglutination avec l’anti-A, pas avec l’anti-B, donc antigène A seul → groupe A","Transfusion possible : le receveur AB n’a pas d’anticorps anti-A, donc pas d’incompatibilité ni de risque d’hémolyse"]},{"kind":"QUESTION","num":2,"page":67,"correct":"","points":1,"criteria":[{"weight":0.2,"label":"Flore résidente","yes":"(?:residente|commensale)"},{"weight":0.3,"label":"Définition résidente : permanente, profonde, protectrice","yes":"(?:permanen|profond|symbio|protect|equilibre)"},{"weight":0.2,"label":"Flore transitoire","yes":"transitoire"},{"weight":0.3,"label":"Définition transitoire : acquise par contact, éliminée par l’hygiène des mains","yes":"(?:acqui|contact|apport|exterieur|environnement)"}],"allOrNothing":false,"id":"c17","title":"Nommer les flores existantes à la surface de la peau.\nPour chacune d’elles, en donner une définition.","source":"complete","answer":["Flore résidente (commensale) : germes vivant en permanence à la surface et dans les couches profondes de la peau (follicules, glandes), en équilibre, avec un rôle protecteur ; peu pathogène mais pouvant le devenir dans certaines conditions (immunodépression, effraction cutanée, plaie…)","+ Elle n’est que partiellement réduite par l’antisepsie","Flore transitoire : germes acquis par contact avec l’environnement ou les patients, situés en surface, potentiellement pathogènes","+ Elle est facilement éliminée par l’hygiène des mains (FHA, lavage) et est responsable de la transmission croisée"]},{"kind":"QUESTION","num":3,"page":68,"correct":"","points":2,"criteria":[{"weight":0.5,"label":"Temps d’exposition","yes":"(?:temps|duree)"},{"weight":0.5,"label":"Distance","yes":"distance|eloign"},{"weight":0.5,"label":"Écrans individuels (tablier, cache-thyroïde)","yes":"(?:tablier|plomb|thyro|lunette)"},{"weight":0.5,"label":"Protections collectives (paravent, signalisation)","yes":"(?:paravent|panneau|ecran|collecti|signalis)"}],"allOrNothing":false,"id":"c18","title":"Quels sont les moyens de protection contre l’exposition aux rayonnements externes ?","source":"complete","answer":["+ Le temps : réduire la durée d’exposition (limiter la scopie)","+ La distance : s’éloigner de la source (la dose diminue avec le carré de la distance)","Les écrans de protection individuelle : tablier plombé à la bonne taille, cache-thyroïde, lunettes plombées","Les protections collectives : paravents plombés, signalisation des zones (panneaux, voyant lumineux)","Le dosimètre ne protège pas : il permet seulement de surveiller l’exposition"]},{"kind":"QUESTION","num":4,"page":68,"correct":"","points":1.2,"criteria":[{"weight":0.2,"label":"Retirer les bijoux","yes":"bijou"},{"weight":0.2,"label":"Ongles courts sans vernis","yes":"(?:ongle|vernis)"},{"weight":0.2,"label":"Lavage des mains","yes":"(?:lavage|laver|savon|\\bsha\\b|friction)"},{"weight":0.2,"label":"Retirer la tenue de ville","yes":"(?:tenue de ville|vetements? (?:perso|civil)|deshabill|retirer.{0,15}vetement)"},{"weight":0.2,"label":"Attacher les cheveux","yes":"(?:cheveu|coiffe|charlotte)"},{"weight":0.2,"label":"Maquillage / objets personnels","yes":"(?:maquillage|telephone|objets? perso|barbe)"}],"allOrNothing":false,"id":"c19","title":"Citer 6 actions à effectuer avant de mettre la tenue de bloc opératoire.","source":"complete","answer":["Retirer les bijoux (bagues, alliance, bracelets, montre)","Avoir les ongles courts, sans vernis ni faux ongles","Lavage simple des mains au savon puis séchage","+ Retirer la tenue de ville (vêtements personnels)","+ Attacher les cheveux (avant de mettre la coiffe)","+ Retirer le maquillage et laisser les objets personnels (téléphone…) au vestiaire" ptifs / allergènes","yes":"(?:sevrage|tabac|tabagi|contracept|allergene)"},{"weight":0.2,"label":"Mésusage / abus / erreurs / hors AMM","yes":"(?:mesusage|abus|erreur|hors amm|surdosage)"}],"allOrNothing":false,"id":"c24","title":"Citer cinq champs d’application de la pharmacovigilance.","source":"complete","answer":["Les médicaments (avec ou sans AMM, y compris hors AMM)","Les préparations hospitalières et magistrales (préparées en pharmacie)","Les médicaments dérivés du sang (MDS)","Les médicaments d’aide au sevrage tabagique","+ Le mésusage, l’abus et les erreurs médicamenteuses (+ les produits contraceptifs, les allergènes)","Attention : la pharmacodépendance relève de l’addictovigilance (0 point sur la copie)"]},{"kind":"QUESTION","num":10,"page":73,"correct":"","points":1.3,"id":"c25","title":"Prévention : les compétences non techniques (CNT).\nComplète le schéma en donnant les éléments de chacune des 4 catégories : prise de décision, travail en équipe, conscience de la situation, gestion des tâches.","source":"complete","answer":["Prise de décision : identifier les options, choisir et mettre en œuvre, réévaluer la décision, se positionner, éviter l’effet tunnel","Travail en équipe : communication (closed-loop), coordination, partage de l’information, connaître et respecter le rôle de chacun, leadership, soutien mutuel","Conscience de la situation : recueillir l’information, la comprendre et l’analyser, anticiper l’évolution","Gestion des tâches : planifier et anticiper, prioriser, utiliser les ressources disponibles (appel à l’aide), respecter les recommandations et standards (checklists)"],"criteria":[{"weight":0.3,"label":"Prise de décision : options, choix, réévaluation","yes":"(?:option|choi|reevalu|decid|tunnel|positionner)"},{"weight":0.3,"label":"Travail en équipe : communication, coordination, rôles","yes":"(?:communic|coordin|role|leader|soutien|partag)"},{"weight":0.35,"label":"Conscience de la situation : recueillir, comprendre, anticiper","yes":"( const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n,]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

const $ = id => document.getElementById(id);
const format = (value, digits=4) => value.toLocaleString('fr-FR', {maximumFractionDigits:digits});
const isChoice = q => q.kind === 'QCM' || q.kind === 'QCU';
const isOpen = q => !isChoice(q) && q.kind !== 'context';
const escape = value => String(value).replace(/[&<>"']/g, char => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]
));
const questionLabel = card => card.kind === 'context' ? card.title : card.kind + ' ' + card.num;
const values = ['A','B','C','D','E'];


const realCards=DATA.cards.filter(q=>q.kind!=='context');
const nCh=realCards.filter(q=>q.kind==='QCM'||q.kind==='QCU').length,nOp=realCards.length-nCh;
const nPts=Math.round(realCards.reduce((s,q)=>s+(q.points??1),0)*100)/100;
document.title=`UE ${DATA.ue} · Semestre ${DATA.semester} · Annales 2022-2024 — ${DATA.title}`;
$('h-eyebrow').textContent=`École IADE · UE ${DATA.ue} · Semestre ${DATA.semester} · Annales 2022-2024`;
$('h-title').textContent=DATA.title;
$('h-stats').innerHTML=[[realCards.length,'questions'],[nCh,'QCM / QCU'],[nOp,'questions ouvertes'],[nPts.toLocaleString('fr-FR'),'points au barème']].filter(([n])=>n!==0).map(([n,t])=>`<div class="hero-stat"><b>${n}</b><span>${t}</span></div>`).join('');
$('h-rules').innerHTML=`<p>QCM sur 1 point : une erreur ou un oubli = 0,5 point${DATA.twoErrors?`, deux erreurs ou oublis = ${String(DATA.twoErrors).replace('.',',')} point`:''}, au-delà 0. QCU sur 1 point.</p><p>Questions ouvertes : ta réponse est comparée aux éléments attendus. Si la détection n’a pas reconnu une bonne idée, clique sur <b>Valider cet élément</b> ou choisis une évaluation manuelle.</p><p>Les éléments marqués <span class="tag-added">Complément</span> complètent la réponse de la copie corrigée. Les corrigés <span class="tag-src deduit">Reconstitué</span> sont établis à partir du cours car la copie n’avait pas la note maximale.</p>`;
$('h-footer').textContent=`Source · Annales 2022–2024, UE ${DATA.ue}, semestre ${DATA.semester}${DATA.start?`, pages ${DATA.start} à ${DATA.end} du PDF`:''}. Fonctionne hors connexion.`;
const srcTag=q=>q.source==='deduit'?'<span class="tag-src deduit">Reconstitué</span>':q.source==='complete'?'<span class="tag-src">Copie complétée</span>':q.source==='copie'?'<span class="tag-src">Copie notée au maximum</span>':'';
function answerBox(q){
  let list=q.answer; if(!list) return ''; if(typeof list==='string') list=[list];
  const items=list.map(a=>{const add=a.startsWith('+');const t=add?a.replace(/^\+\s*/,''):a;return `<li class="${add?'added':''}">${escape(t)}${add?'<span class="tag-added">Complément</span>':''}</li>`;}).join('');
  return `<div class="answer-key"><h3>Correction ${srcTag(q)}</h3><ul>${items}</ul>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
}
let active, grades, locked, confirmed, targeted;
const form = $('quiz');
function images(list, label) {
  return list.map((item,i) => `<img loading="lazy" alt="${escape(label)}${list.length>1?' · extrait '+(i+1):''}" src="data:image/jpeg;base64,${item}">`).join('');
}
function scanBlock(scans, label) {
  return `<div class="document"><div class="source-pictures" tabindex="0" aria-label="${escape(label)}">${images(scans,label)}</div><button type="button" class="secondary zoom" aria-expanded="false">Agrandir le scan</button></div>`;
}
function prompt(q) {
  if(q.images) return scanBlock(q.images,questionLabel(q));
  const table=q.table?`<div class="prompt-table">${q.table.map(cell=>`<span>${escape(cell)}</span>`).join('')}</div>`:'';
  return `<h2 class="question-stem">${escape(q.title)}</h2>${q.text?`<p class="context-text">${escape(q.text)}</p>`:''}${q.figure_img?`<div class="q-figure"><img src="data:image/jpeg;base64,${q.figure_img}" alt="Figure de la question"></div>`:''}${q.instruction?`<p class="small">${escape(q.instruction)}</p>`:''}${table}`;
}
function fields(q) {
  if (isChoice(q)) {
    return `<div class="choices ${q.options?'written-choices':''}" role="${q.kind==='QCU'?'radiogroup':'group'}" aria-labelledby="title-${q.id}">${values.map((letter,i)=>`<label class="option" id="option-${q.id}-${letter}"><input type="${q.kind==='QCU'?'radio':'checkbox'}" name="${q.id}" value="${letter}"><span><strong>${letter}</strong>${q.options?' · '+escape(q.options[i]):''}<small></small></span></label>`).join('')}</div>`;
  }
  return `<div class="field"><textarea id="answer-${q.id}" aria-labelledby="title-${q.id}" rows="5" placeholder="Ta réponse…"></textarea></div>`;
}
function render() {
  $('cards').innerHTML = active.map((q, index) => {
    const section = q.kind === 'context' ? '<span>Cas clinique</span>' : `<span>${q.points==null?'':format(q.points)+' pt · '}PDF p. ${q.page}</span>`;
    const anchor = active.findIndex(card=>card.kind===q.kind)===index ? ` id="section-${q.kind}"` : '';
    return `<section class="card"${anchor} data-card="${q.id}"><div class="meta"><strong id="title-${q.id}">${escape(questionLabel(q))}</strong>${section}</div>${prompt(q)}${q.kind==='context'?'':fields(q)+`<div class="feedback" id="feedback-${q.id}" hidden></div>`}</section>`;
  }).join('');
  for(const link of document.querySelectorAll('[data-kind]')){
    const kind=link.dataset.kind;
    const index=active.findIndex(q=>kind==='open'?isOpen(q):q.kind===kind);
    link.hidden=index<0;
    if(index>=0) link.hash='section-'+active[index].kind;
  }
}
function response(q) {
  if (isChoice(q)) {
    return [...form.querySelectorAll(`[name="${q.id}"]:checked`)].map(input=>input.value);
  }
  return $(`answer-${q.id}`).value.trim();
}
function progress() {
  const current=active.filter(q=>q.kind!=='context');
  const count=current.filter(q=>response(q).length>0).length;
  $('progress').textContent=`${count} / ${current.length} questions renseignées`;
  $('bar').max=current.length;
  $('bar').value=count;
}
function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Réponse à évaluer à partir de la copie annotée.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  const reference=`<p class="small">Page ${q.page} du PDF source.</p>`;
  if (isOpen(q)) {
    const caution=q.caution?`<p class="notice">${escape(q.caution)} <a href="https://www.glasgowcomascale.org/downloads/GCS-Assessment-Aid-English.pdf">Grille Glasgow</a></p>`:'';
    panel.innerHTML=`${answerBox(q)}${rubricPanel(q,grade)}${caution}${q.evidence&&!q.answer?scanBlock(q.evidence,'Réponse annotée · '+questionLabel(q)):''}${assessmentControls(q,grade)}${reference}`;
    return;
  }
  const key=q.correct?`<strong>${format(grade.autoScore)} / 1 point</strong><div class="answer-key" style="margin-top:10px"><h3>Correction ${srcTag(q)}</h3><div class="key-letters">Bonne${q.correct.length>1?'s':''} réponse${q.correct.length>1?'s':''} · ${q.correct.split('').join(', ')}</div>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`:`<strong>Corrigé à vérifier</strong><p>La copie comporte une note partielle ou nulle.${q.marked?' Choix cochés · '+escape(q.marked)+'.':''}</p>`;
  const evidence=q.evidence?`<details><summary>Voir la copie annotée</summary><div class="source-pictures" tabindex="0">${images(q.evidence,'Copie annotée · '+questionLabel(q))}</div></details>`:'';
  panel.innerHTML=key+evidence+(q.correct?'':assessmentControls(q,grade))+reference;
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=targeted?available:DATA.examTotal??available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(isComplete);
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>!keep||q.kind==='context'||keep.has(q.id));
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
start();
