const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n,]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

  }
}
function response(q) {
  if (isChoice(q)) {
    return [...form.querySelectorAll(`[name="${q.id}"]:checked`)].map(input=>input.value);
  }
  return $(`answer-${q.id}`).value.trim();
}
function progress() {
  const current=active.filter(q=>q.kind!=='context');
  const count=current.filter(q=>response(q).length>0).length;
  $('progress').textContent=`${count} / ${current.length} questions renseignées`;
  $('bar').max=current.length;
  $('bar').value=count;
}
function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Réponse à évaluer à partir de la copie annotée.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  const reference=`<p class="small">Page ${q.page} du PDF source.</p>`;
  if (isOpen(q)) {
    const caution=q.caution?`<p class="notice">${escape(q.caution)} <a href="https://www.glasgowcomascale.org/downloads/GCS-Assessment-Aid-English.pdf">Grille Glasgow</a></p>`:'';
    panel.innerHTML=`${answerBox(q)}${rubricPanel(q,grade)}${caution}${q.evidence&&!q.answer?scanBlock(q.evidence,'Réponse annotée · '+questionLabel(q)):''}${assessmentControls(q,grade)}${reference}`;
    return;
  }
  const key=q.correct?`<strong>${format(grade.autoScore)} / 1 point</strong><div class="answer-key" style="margin-top:10px"><h3>Correction ${srcTag(q)}</h3><div class="key-letters">Bonne${q.correct.length>1?'s':''} réponse${q.correct.length>1?'s':''} · ${q.correct.split('').join(', ')}</div>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`:`<strong>Corrigé à vérifier</strong><p>La copie comporte une note partielle ou nulle.${q.marked?' Choix cochés · '+escape(q.marked)+'.':''}</p>`;
  const evidence=q.evidence?`<details><summary>Voir la copie annotée</summary><div class="source-pictures" tabindex="0">${images(q.evidence,'Copie annotée · '+questionLabel(q))}</div></details>`:'';
  panel.innerHTML=key+evidence+(q.correct?'':assessmentControls(q,grade))+reference;
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=targeted?available:DATA.examTotal??available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(isComplete);
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>!keep||q.kind==='context'||keep.has(q.id));
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
start();

<script>window.MEMO_QUIZ={"id": "annales/S1/2.3", "href": "annales/S1/2.3.html", "collection": "annales", "sem": "S1", "ue": "2.3", "periode": "2022-2024", "titre": "Pharmacologie générale — 2022-2024"};</script>
<script>
/* Mémo : enregistre la note obtenue, pour l'écran « Mes résultats » de l'app.
   Même origine que l'app, donc même localStorage. Une tentative par correction ;
   si la note est ajustée à la main ensuite, la tentative en cours est mise à jour. */
(function () {
  var CLE = 'memo-resultats', INFO = window.MEMO_QUIZ;
  if (!INFO) return;
  var resultats = document.getElementById('results'), score = document.getElementById('score');
  if (!resultats || !score) return;
  var tentative = null;

  function lire() { try { return JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { return []; } }
  function noteDe(txt) {
    var m = String(txt).match(/(-?[\d  ]+(?:[.,]\d+)?)\s*\/\s*20/);
    return m ? parseFloat(m[1].replace(/[  ]/g, '').replace(',', '.')) : null;
  }
  function enregistrer() {
    if (resultats.hidden) return;
    var note = noteDe(score.textContent);
    if (note === null || !isFinite(note)) return;
    var liste = lire();
    var ligne = tentative && liste.find(function (x) { return x.cle === tentative; });
    if (!ligne) {
      tentative = INFO.id + '#' + Date.now();
      ligne = { cle: tentative, id: INFO.id, href: INFO.href, collection: INFO.collection,
        sem: INFO.sem, ue: INFO.ue, periode: INFO.periode, titre: INFO.titre };
      liste.push(ligne);
    }
    ligne.note = Math.round(note * 100) / 100;
    ligne.date = new Date().toISOString();
    try { localStorage.setItem(CLE, JSON.stringify(liste.slice(-300))); } catch (e) {}
  }

  new MutationObserver(enregistrer).observe(score, { childList: true, characterData: true, subtree: true });
  new MutationObserver(enregistrer).observe(resultats, { attributes: true, attributeFilter: ['hidden'] });
  // « Tout recommencer » : la prochaine correction comptera comme une nouvelle tentative.
  document.getElementById('reset') && document.getElementById('reset').addEventListener('click', function () { tentative = null; });
})();
</script>
