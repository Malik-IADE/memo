5, le correcteur signalant A et D comme oubliées. Les modèles de l’AIVOC sont tricompartimentaux (avec un site effet) et dépendent du poids et de l’âge du patient.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":12,"page":82,"correct":"BCD","points":1,"id":"c12","title":"Parmi ces propositions concernant l’anesthésie inhalée à objectif de concentration (AINOC), laquelle (ou lesquelles) est (sont) vraie(s) ?","options":["Elle est dépendante du poids du patient","Elle nécessite de fixer un objectif de fraction expiratoire (Fe) en AVH","Elle nécessite de fixer une cible de FiO₂","Elle ajuste la quantité d’AVH dans le mélange inspiré","Elle laisse le débit de gaz frais inchangé tout au long de la procédure"],"source":"deduit","note":"La copie (A, B, D) a obtenu 0,25 : l’AINOC ne dépend pas du poids ; elle impose une cible de FeAVH et de FiO₂, et adapte le débit de gaz frais et la quantité d’AVH.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":13,"page":82,"correct":"BD","points":1,"id":"c13","title":"Parmi ces propositions concernant la chirurgie ambulatoire (CA), laquelle (ou lesquelles) est (sont) vraie(s) ?","options":["La reprise d’une diurèse mictionnelle est obligatoire pour obtenir l’aptitude à la rue","Le patient adulte doit disposer d’une personne présente à ses côtés durant la première nuit","Un score de Chung de 8/10 offre l’aptitude à la rue","Le patient de moins de 10 ans doit disposer de 2 accompagnants majeurs","La CA est contre-indiquée chez un patient dont le trajet hôpital-domicile est supérieur à 30 minutes"],"source":"deduit","note":"La copie (D) a obtenu 0,5, le correcteur signalant B comme oubliée. La reprise mictionnelle n’est plus obligatoire pour tous ; l’aptitude à la rue suppose un score de Chung ≥ 9 ; la limite de trajet est d’environ 1 h (et non 30 min).","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":14,"page":83,"correct":"BD","points":1,"id":"c14","title":"Parmi ces propositions concernant le monitorage de la curarisation, laquelle (ou lesquelles) est (sont) vraie(s) ?","options":["Le monitorage clinique est aussi efficace que le monitorage instrumental","Le monitorage du muscle sourcilier donne un bon reflet de la curarisation des muscles laryngés","Le monitorage du TOF du muscle sourcilier donne un bon reflet de la décurarisation","Le post-tetanic count (PTC) permet d’explorer les blocs profonds","Les électrodes pour le monitorage de l’adducteur du pouce sont placées sur le trajet du nerf radial"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":15,"page":83,"correct":"BCE","points":1,"id":"c15","title":"Parmi ces propositions concernant le monitorage de la sédation, laquelle (ou lesquelles) est (sont) vraie(s) ?","options":["Il est perturbé par l’utilisation de curares","Il est utilisable pour une narcose induite par sévoflurane","Il permet de diminuer le risque de déficit cognitif à 3 mois","Un BIS® > 60 indique un surdosage en hypnotique","L’index SR du BIS® caractérise les épisodes de tracés électroencéphalographiques plats"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":16,"page":84,"correct":"ADE","points":1,"id":"c16","title":"Parmi ces propositions concernant les éléments reportés sur la feuille d’anesthésie, laquelle (ou lesquelles) est (sont) vraie(s) ?","options":["L’indice de masse corporelle (IMC) du patient","Le groupe sanguin du patient","Les résultats de bilans sanguins préopératoires","La nature de l’intervention","La présence d’un reflux de liquide céphalorachidien (LCR) au cours d’une rachianesthésie"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":17,"page":84,"correct":"AC","points":1,"id":"c17","title":"Parmi ces propositions concernant la consultation d’anesthésie (CA), laquelle (ou lesquelles) est (sont) vraie(s) ?","options":["Le médecin anesthésiste y évalue systématiquement le score ASA","Le médecin anesthésiste y évalue systématiquement le score de Cormack et Lehane","Le médecin anesthésiste y établit la stratégie d’anesthésie","En cas d’intervention en urgence, le médecin anesthésiste y prescrit une recherche d’agglutinines irrégulières (RAI)","Dans le cas d’une intervention programmée non urgente, la CA peut être effectuée 24 h avant l’intervention"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":18,"page":85,"correct":"BDE","points":1,"id":"c18","title":"Parmi ces propositions concernant la salle de surveillance post-interventionnelle (SSPI), laquelle (ou lesquelles) est (sont) vraie(s) ?","options":["La sortie de SSPI est autorisée avec un score d’Aldrete à 8/10","Le passage en SSPI doit être d’au moins 2 h après une césarienne","Dans le cadre d’une chirurgie ambulatoire, l’aptitude à la rue (critère de sortie d’ambulatoire) doit toujours être validée avant la sortie de la SSPI","Les complications respiratoires sont les complications les plus fréquentes en SSPI","Les critères de sortie de SSPI doivent figurer sur le dossier du patient, même s’il n’effectue pas de séjour en SSPI"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":19,"page":85,"correct":"CDE","points":1,"id":"c19","title":"Parmi les propositions concernant l’oxymètre de pouls, laquelle (ou lesquelles) est (sont) vraie(s) ?","options":["Il permet de détecter l’hyperoxie","Il permet de détecter la méthémoglobine (MetHb)","En condition d’utilisation normale, sa marge d’erreur est de 5 %","Il fournit un chiffre qui reflète la saturation de l’hémoglobine en O₂","Une lumière d’ambiance forte (scialytiques) peut altérer son signal"],"source":"deduit","note":"La copie (C, D) a obtenu 0,5, le correcteur signalant E comme oubliée. L’oxymètre ne détecte ni l’hyperoxie ni la méthémoglobine.","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":20,"page":86,"correct":"BDE","points":1,"id":"c20","title":"Parmi les propositions concernant le capnographe, laquelle (ou lesquelles) est (sont) vraie(s) ?","options":["Il fournit la PetCO₂ qui représente la pression partielle du CO₂ en fin d’inspiration","Il fournit le capnogramme qui représente les variations du CO₂ dans les voies aériennes du patient au cours du cycle respiratoire","Il est obligatoire pour tout patient sous anesthésie locorégionale (ALR)","Le capnogramme est modifié lors d’un bronchospasme","Il est utile lors de la réanimation cardio-pulmonaire"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":21,"page":86,"correct":"AE","points":1,"id":"c21","title":"Parmi ces propositions concernant la pression expiratoire positive (PEP) durant la ventilation mécanique, laquelle (ou lesquelles) est (sont) vraie(s) ?","options":["Elle est recommandée dans le cadre de la ventilation protectrice","Elle doit être arrêtée bien avant l’extubation","Elle favorise les atélectasies","Elle ne varie pas durant les manœuvres de recrutement","La pression de plateau est prise en compte pour régler la PEP"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QROC","num":1,"page":87,"correct":"","points":1.6,"id":"c22","title":"Dans le contexte de l’anesthésie générale chez l’adulte, préciser les valeurs (minimum – maximum) de réglage du respirateur pour :\n– la ventilation en volume contrôlé,\n– la ventilation en pression contrôlée,\n– la VSAI.","source":"complete","answer":["Volume contrôlé : VT 6 à 8 mL/kg de poids idéal ; FR 10 à 15/min (12–20) ; PEP 5 à 10 cmH₂O ; I/E 1/2 ; pression de plateau < 30 cmH₂O ; FiO₂ adaptée (SpO₂ ≥ 94 %)","Pression contrôlée : pression inspiratoire réglée pour obtenir un VT de 6 à 8 mL/kg (≈ 15 à 25 cmH₂O, sans dépasser 30 cmH₂O) ; FR 10 à 15/min ; PEP 5 à 10 cmH₂O ; I/E 1/2","VSAI : aide inspiratoire 8 à 15 cmH₂O (selon le VT et la FR obtenus) ; PEP 5 cmH₂O ; trigger inspiratoire sensible (1 à 3 L/min ou −0,5 à −2 cmH₂O) ; trigger expiratoire ≈ 25 % ; ventilation d’apnée de sécurité","Attention  < 45 mmHg (PaO₂ > 70, PaCO₂ < 45 mmHg)","+ Réflexes de protection des voies aériennes présents : déglutition, toux","Décurarisation complète : TOF ≥ 0,9","Hémodynamique stable (PA et FC proches des valeurs de base, ± 20 %)","Normothermie : T° > 36 °C (36,5 °C chez le coronarien)","Absence de complication chirurgicale, environnement sécurisé (matériel de réintubation disponible) ; + analgésie efficace"]},{"kind":"QROC","num":3,"page":88,"correct":"","points":0.8,"criteria":[{"weight":0.2,"label":"Insuffisance cardiaque","yes":"(?:insuffisance cardiaque|cardiaque)"},{"weight":0.2,"label":"Classification fonctionnelle selon la dyspnée / l’effort","yes":"(?:fonctionnel|dyspnee|effort)"},{"weight":0.1,"label":"Stade I","yes":"(?:stade|classe)\\s*(?:1|i)\\b"},{"weight":0.1,"label":"Stade II","yes":"(?:stade|classe)\\s*(?:2|ii)\\b"},{"weight":0.1,"label":"Stade III","yes":"(?:stade|classe)\\s*(?:3|iii)\\b"},{"weight":0.1,"label":"Stade IV · dyspnée au repos","yes":"repos"}],"allOrNothing":false,"id":"c24","title":"Définir et préciser la classification NYHA.","source":"complete","answer":["+ NYHA (New York Heart Association) : classification fonctionnelle de l’insuffisance cardiaque, selon la dyspnée et la tolérance à l’effort","Stade I : aucune limitation, pas de dyspnée à l’effort habituel","Stade II : dyspnée pour des efforts importants (limitation modérée)","Stade III : dyspnée pour des efforts modestes, de la vie courante (limitation marquée)","Stade IV : dyspnée au moindre effort et au repos"]},{"kind":"QROC","num":4,"page":89,"correct":"","points":1,"criteria":[{"weight":0.2,"label":"Intérêt du score · prédire une intubation difficile","yes":"(?=.*(?:predi|risque|anticip))(?=.*intubation.{0,25}difficile)","bad":""},{"weight":0.2,"label":"Classe I · luette entièrement visible","yes":"(?=.*(?:classe\\s*|mallampati\\s*|^)(?:i\\b|1\\b))(?=.*luette)(?=.*(?:entier|totalit|complet))","bad":""},{"weight":0.2,"label":"Classe II · luette partiellement visible","yes":"(?=.*(?:classe\\s*|mallampati\\s*|^)(?:ii\\b|2\\b))(?=.*luette)(?=.*partiel)","bad":""},{"weight":0.2,"label":"Classe III · palais mou visible","yes":"(?=.*(?:classe\\s*|mallampati\\s*|^)(?:iii\\b|3\\b))(?=.*palais mou)","bad":""},{"weight":0.2,"label":"Classe IV · palais dur seul visible","yes":"(?=.*(?:classe\\s*|mallampati\\s*|^)(?:iv\\b|4\\b))(?=.*palais dur)(?=.*(?:seul|uniquement|seulement))","bad":""}],"allOrNothing":false,"id":"c25","title":"Définir et préciser le score de Mallampati.","source":"copie","answer":["Le score de Mallampati évalue, patient assis, bouche grande ouverte et langue tirée, les structures pharyngées visibles, pour prédire une intubation difficile","Classe I : luette (et piliers) entièrement visible","Classe II : luette partiellement visible","Classe III : palais mou (et base de la luette) visible","Classe IV : seul le palais dur est visible","Un Mallampati > 2 est un critère prédictif d’intubation difficile"]},{"kind":"QROC","num":5,"page":89,"correct":"","points":1.2,"criteria":[{"weight":0.2,"label":"ASA 1 · bonne santé","yes":"bonne sante"},{"weight":0.2,"label":"ASA 2 · maladie systémique légère","yes":"(?:legere|moderee|non incapacit|sans limitation)"},{"weight":0.2,"label":"ASA 3 · maladie systémique sévère","yes":"(?:severe|incapacit|limitation)"},{"weight":0.2,"label":"ASA 4 · menace vitale permanente","yes":"(?:menace vitale|invalidante)"},{"weight":0.2,"label":"ASA 5 · moribond","yes":"moribond"},{"weight":0.2,"label":"U · urgence / ASA 6","yes":"(?:urgence|mort encephalique|donneur)"}],"allOrNothing":false,"id":"c26","title":"Citer et expliquer la classification du score ASA.","source":"complete","answer":["ASA 1 : patient en bonne santé","ASA 2 : maladie systémique légère ou modérée, sans limitation fonctionnelle","ASA 3 : maladie systémique sévère, avec limitation fonctionnelle (mais non invalidante)","+ ASA 4 : maladie systémique sévère et invalidante, constituant une menace vitale permanente","+ ASA 5 : patient moribond dont l’espérance de vie ne dépasse pas 24 h, avec ou sans intervention","+ ASA 6 : patient en état de mort encéphalique, donneur d’organes","U : intervention réalisée en urgence (ajouté à la classe, ex. ASA 2U)"]},{"kind":"QROC","num":6,"page":90,"correct":"","points":1.3,"criteria":[{"weight":0.2,"label":"Hypotension / baisse du débit cardiaque","yes":"(?:hypotension|debit cardiaque)"},{"weight":0.2,"label":"Compression de la VCI / ↓ retour veineux","yes":"(?:veine cave|compression|retour veineux|precharge)"},{"weight":0.2,"label":"Hypoxémie / altération V/Q","yes":"(?:va.?q|ventilation.?perfusion|shunt|hypox|perfuse|ventile)"},{"weight":0.2,"label":"Atélectasie / hypoventilation / sonde","yes":"(?:atelectasi|hypoventil|sonde|selective)"},{"weight":0.25,"label":"Prévention hémodynamique (remplissage, vasopresseurs, billot)","yes":"(?:remplissage|vasopresseur|billot|progressi)"},{"weight":0.25,"label":"Prévention respiratoire (PEP, recrutement, FiO₂, sonde)","yes":"(?:pep|peep|recrutement|protectrice|fio2|auscult)"}],"allOrNothing":false,"id":"c27","title":"A. Citer et expliquer le ou les risques hémodynamiques et respiratoires (risques, mécanismes) pour un patient installé en décubitus latéral droit avec mise en place d’un billot au niveau lombaire.\nB. Citer les axes d’action préventifs.","source":"complete","answer":["Risque hémodynamique : hypotension, baisse du débit cardiaque","Mécanisme : compression de la veine cave inférieure par le billot, d’où une baisse du retour veineux et de la précharge","Risque respiratoire : hypoxémie, atélectasie du poumon déclive (droit), hypoventilation ; + déplacement de la sonde (intubation sélective) lors de la mobilisation","Mécanisme : altération du rapport ventilation/perfusion : le poumon déclive est bien perfusé mais mal ventilé (effet shunt), le poumon supérieur est bien ventilé mais mal perfusé (effet espace mort)","Prévention hémodynamique : remplissage adéquat (compensation du jeûne), vasopresseurs à portée de main, installation progressive et billot bien positionné (sous la région lombaire, sans comprimer l’abdomen)","Prévention respiratoire : ventilation protectrice avec PEP, manœuvres de recrutement, adaptation de la FiO₂, vérification et auscultation de la sonde après chaque changement de position"]},{"kind":"QROC","num":7,"page":91,"correct":"","points":1,"id":"c28","title":"Citer les 4 points à vérifier lors de l’analyse d’un ECG.","source":"complete","answer":["Le rythme : sinusal (une onde P devant chaque QRS), régulier ou non","+ La fréquence cardiaque","La conduction : intervalle PR (0,12 à 0,20 s, ≈ 1 grand carreau) et largeur des QRS (< 0,10–0,12 s, ≈ 2 à 3 petits carreaux)","La repolarisation : segment ST isoélectrique et ondes T (asymétriques, de même sens que le QRS)"],"criteria":[{"weight":0.25,"label":"Rythme (sinusal, P avant chaque QRS)","yes":"(?:sinusal|rythme|onde p)"},{"weight":0.25,"label":"Fréquence","yes":"frequence"},{"weight":0.25,"label":"Conduction (PR, QRS)","yes":"(?:\\bpr\\b|conduction|qrs)"},{"weight":0.25,"label":"Repolarisation (ST, T)","yes":"(?:\\bst\\b|onde t|repolaris)"}]},{"kind":"QROC","num":8,"page":92,"correct":"","points":1.4,"id":"c29","title":"Énoncer ce que vous évoque cette courbe (écran de monitorage : SpO₂ 93 %, pouls 91, EtCO₂ 26 mmHg, FR 14). Justifier votre réponse.","source":"complete","answer":["Bronchospasme","Capnogramme sans plateau, avec une montée lente « en aileron de requin » : obstacle, freinage expiratoire","+ Baisse de l’EtCO₂ (26 mmHg) par diminution de la ventilation alvéolaire efficace, et désaturation (SpO₂ 93 %)","+ À confirmer par l’augmentation des pressions d’insufflation et l’auscultation (sibilants ou silence auscultatoire)"],"criteria":[{"weight":0.4,"label":"Bronchospasme","yes":"bronchospasm"},{"weight":0.4,"label":"Absence de plateau / aileron de requin","yes":"(?:plateau|aileron|requin|pente)"},{"weight":0.2,"label":"Frein / obstruction expiratoire","yes":"(?:frein|obstruct|expirat)"},{"weight":0.2,"label": const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n,]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};

  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};

  const items=grade.analysis.map((c,i)=>{

    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  const reference=`<p class="small">Page ${q.page} du PDF source.</p>`;
  if (isOpen(q)) {
    const caution=q.caution?`<p class="notice">${escape(q.caution)} <a href="https://www.glasgowcomascale.org/downloads/GCS-Assessment-Aid-English.pdf">Grille Glasgow</a></p>`:'';
    panel.innerHTML=`${answerBox(q)}${rubricPanel(q,grade)}${caution}${q.evidence&&!q.answer?scanBlock(q.evidence,'Réponse annotée · '+questionLabel(q)):''}${assessmentControls(q,grade)}${reference}`;
    return;
  }
  const key=q.correct?`<strong>${format(grade.autoScore)} / 1 point</strong><div class="answer-key" style="margin-top:10px"><h3>Correction ${srcTag(q)}</h3><div class="key-letters">Bonne${q.correct.length>1?'s':''} réponse${q.correct.length>1?'s':''} · ${q.correct.split('').join(', ')}</div>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`:`<strong>Corrigé à vérifier</strong><p>La copie comporte une note partielle ou nulle.${q.marked?' Choix cochés · '+escape(q.marked)+'.':''}</p>`;
  const evidence=q.evidence?`<details><summary>Voir la copie annotée</summary><div class="source-pictures" tabindex="0">${images(q.evidence,'Copie annotée · '+questionLabel(q))}</div></details>`:'';
  panel.innerHTML=key+evidence+(q.correct?'':assessmentControls(q,grade))+reference;
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=targeted?available:DATA.examTotal??available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(isComplete);
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>!keep||q.kind==='context'||keep.has(q.id));
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
start();

<script>window.MEMO_QUIZ={"id": "annales/S1/3.1", "href": "annales/S1/3.1.html", "collection": "annales", "sem": "S1", "ue": "3.1", "periode": "2022-2024", "titre": "Techniques d'anesthésie — 2022-2024"};</script>
<script>
/* Mémo : enregistre la note obtenue, pour l'écran « Mes résultats » de l'app.
   Même origine que l'app, donc même localStorage. Une tentative par correction ;
   si la note est ajustée à la main ensuite, la tentative en cours est mise à jour. */
(function () {
  var CLE = 'memo-resultats', INFO = window.MEMO_QUIZ;
  if (!INFO) return;
  var resultats = document.getElementById('results'), score = document.getElementById('score');
  if (!resultats || !score) return;
  var tentative = null;

  function lire() { try { return JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { return []; } }
  function noteDe(txt) {
    var m = String(txt).match(/(-?[\d  ]+(?:[.,]\d+)?)\s*\/\s*20/);
    return m ? parseFloat(m[1].replace(/[  ]/g, '').replace(',', '.')) : null;
  }
  function enregistrer() {
    if (resultats.hidden) return;
    var note = noteDe(score.textContent);
    if (note === null || !isFinite(note)) return;
    var liste = lire();
    var ligne = tentative && liste.find(function (x) { return x.cle === tentative; });
    if (!ligne) {
      tentative = INFO.id + '#' + Date.now();
      ligne = { cle: tentative, id: INFO.id, href: INFO.href, collection: INFO.collection,
        sem: INFO.sem, ue: INFO.ue, periode: INFO.periode, titre: INFO.titre };
      liste.push(ligne);
    }
    ligne.note = Math.round(note * 100) / 100;
    ligne.date = new Date().toISOString();
    try { localStorage.setItem(CLE, JSON.stringify(liste.slice(-300))); } catch (e) {}
  }

  new MutationObserver(enregistrer).observe(score, { childList: true, characterData: true, subtree: true });
  new MutationObserver(enregistrer).observe(resultats, { attributes: true, attributeFilter: ['hidden'] });
  // « Tout recommencer » : la prochaine correction comptera comme une nouvelle tentative.
  document.getElementById('reset') && document.getElementById('reset').addEventListener('click', function () { tentative = null; });
})();
</script>
