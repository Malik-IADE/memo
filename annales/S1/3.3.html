uelle (ou lesquelles) est (sont) vraie(s) ?","options":["Pour un lifting cervico-facial, l’utilisation d’une sonde armée est recommandée","La pose de prothèses mammaires est peu douloureuse en postopératoire","Le lipofilling consiste en une réinjection de la propre graisse du patient dans une zone différente","Un lifting cervico-facial peut être à l’origine d’une lésion de cornée","La chirurgie du patient brûlé en phase initiale est peu pourvoyeuse de saignements"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":17,"page":108,"correct":"BCDE","points":1,"id":"c17","title":"Parmi ces propositions concernant l’anesthésie en chirurgie urologique, laquelle (ou lesquelles) est (sont) vraie(s) ?","options":["La prostatectomie radicale est classiquement pourvoyeuse de saignement jusqu’à 3 L","En dehors des interventions en urgence, les résultats d’un ECBU sont obligatoires","L’administration de Xylocaïne® intraveineuse en continu en peropératoire contribue à la réhabilitation améliorée après chirurgie (RAAC) de cystectomie","La chirurgie urologique est pourvoyeuse de risques thromboemboliques","La chirurgie robot-assistée nécessite une curarisation du patient"],"source":"deduit","note":"La copie (A, C, D, E) a obtenu 0,25 : A fausse (le saignement d’une prostatectomie radicale n’atteint pas classiquement 3 L) et B oubliée (ECBU obligatoire en programmé).","instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QCM","num":18,"page":108,"correct":"DE","points":1,"id":"c18","title":"Parmi ces propositions concernant l’anesthésie dans le cadre de l’électroconvulsivothérapie, laquelle (ou lesquelles) est (sont) vraie(s) ?","options":["Elle est réalisée par une sédation","Les curares sont contre-indiqués","Le propofol est contre-indiqué","L’utilisation d’un agent analgésique est non recommandée","L’étomidate est indiqué"],"source":"deduit","note":"La copie (D) a obtenu 0,5, le correcteur signalant E comme oubliée. La sismothérapie se fait sous ale)|\\bcv\\b|volumes? pulmonaire)"},{"weight":0.3,"label":"Hausse de la pression intra-abdominale / pneumopéritoine","yes":"(?:pression intra.?abdominale|pneumoperitoine|insufflation|abdomen)"},{"weight":0.3,"label":"Dysfonction diaphragmatique / douleur","yes":"(?:diaphragm|douleur|reflexe)"},{"weight":0.3,"label":"Atélectasies / hypoxémie","yes":"(?:atelectasi|hypoxemi)"},{"weight":0.3,"label":"Hypercapnie (CO₂)","yes":"(?:hypercapn|co2)"},{"weight":0.3,"label":"Syndrome restrictif / surinfection postopératoire","yes":"(?:restrictif|surinfection|pneumopathi|encombrement)"}]},{"kind":"QROC","num":2,"page":111,"correct":"","points":3,"criteria":[{"weight":0.5,"label":"Prévenir l’inhalation (estomac plein, Mendelson)","yes":"(?:inhalation|mendelson|estomac plein)"},{"weight":0.5,"label":"Sécuriser rapidement les VAS (délai court)","yes":"(?:rapide|delai|securis|minimum|vite)"},{"weight":0.25,"label":"Aspiration et matériel d’intubation prêts","yes":"(?:aspiration|plateau|materiel|eschmann)"},{"weight":0.25,"label":"Proclive","yes":"(?:proclive|tete surelevee|demi.?assis)"},{"weight":0.25,"label":"Préoxygénation FiO₂ 100 % / FeO₂ ≥ 90 %","yes":"(?:preoxygen|feo2|fio2|100\\s*%)"},{"weight":0.25,"label":"Hypnotique d’action rapide","yes":"(?:propofol|etomidate|ketamine|hypnotique)"},{"weight":0.25,"label":"Curare d’action rapide","yes":"(?:succinylcholine|celocurine|rocuronium|curare)"},{"weight":0.25,"label":"Pas de ventilation au masque / Sellick","yes":"(?:sellick|pas de ventilation|ne pas ventiler)"},{"weight":0.5,"label":"Ballonnet gonflé + capnographie avant de relâcher","yes":"(?:ballonnet|capno|etco2|auscult)"}],"allOrNothing":false,"id":"c21","title":"A. Préciser l’intérêt de la séquence rapide.\nB. Expliquer les vérifications préopératoires et le déroulé d’une séquence rapide.","source":"complete","answer":["A · Intérêt : chez le patient à estomac plein, sécuriser les voies aériennes le plus vite possible, en réduisant au minimum le délai entre la perte des réflexes de protection et l’intubation avec ballonnet gonflé, pour prévenir l’inhalation du contenu gastrique (syndrome de Mendelson)","B · Vérifications : aspiration fonctionnelle avec sonde de gros calibre, plateau d’intubation complet et matériel d’intubation difficile (mandrin d’Eschmann, vidéolaryngoscope), VVP, monitorage, médicaments préparés (+ sugammadex disponible si rocuronium)","+ Installation en proclive (tête surélevée), préoxygénation en FiO₂ 100 % jusqu’à FeO₂ ≥ 90 % (3 min ou 8 capacités vitales)","Induction : hypnotique d’action rapide (propofol, étomidate ou kétamine), puis curare d’action rapide (succinylcholine 1 mg/kg ou rocuronium 0,9–1,2 mg/kg)","Pas de ventilation au masque (sauf désaturation, en pression douce) ; manœuvre de Sellick possible, à relâcher si elle gêne","Intubation dès la curarisation obtenue (≈ 1 min) ; + gonfler immédiatement le ballonnet, vérifier la capnographie (6 courbes) et ausculter avant de relâcher le Sellick ; puis morphinique et entretien"]},{"kind":"QROC","num":3,"page":112,"correct":"","points":1,"id":"c22","title":"Nommer les différentes classifications en lien avec l’indice de masse corporelle (IMC, en kg/m²) : pour chaque tranche d’IMC, indique la classification correspondante.","source":"complete","note":"La copie a obtenu 0,1 : les seuils doivent suivre la classification de l’OMS.","answer":["IMC < 18,5 : maigreur (dénutrition)","IMC 18,5 à 24,9 : corpulence normale","IMC 25 à 29,9 : surpoids","IMC 30 à 34,9 : obésité modérée (classe I) ; IMC 35 à 39,9 : obésité sévère (classe II)","IMC ≥ 40 : obésité morbide ou massive (classe III)"],"criteria":[{"weight":0.2,"label":"< 18,5 · maigreur","yes":"(?=.*18.5)(?=.*(?:maigr|denutri|insuffisance ponderale))"},{"weight":0.2,"label":"18,5–25 · normal","yes":"(?=.*(?:normal|ideal))(?=.*(?:18.5|25))"},{"weight":0.2,"label":"25–30 · surpoids","yes":"surpoids"},{"weight":0.2,"label":"30–35 et 35–40 · obésité modérée / sévère","yes":"(?=.*obesite)(?=.*(?:30|35))"},{"weight":0.2,"label":"≥ 40 · obésité morbide","yes":"(?:morbide|massive|40)"}]},{"kind":"QROC","num":4,"page":112,"correct":"","points":2,"id":"c23","title":"Citer les causes possibles d’une insuffisance rénale fonctionnelle.","source":"complete","answer":["Hypovolémie vraie : hémorragie, déshydratation (vomissements, diarrhée, diurétiques, brûlures, 3e secteur)","État de choc, hypotension artérielle, baisse du débit rénal","+ Baisse du débit cardiaque : insuffisance cardiaque","Hypovolémie efficace : cirrhose (syndrome hépatorénal), syndrome néphrotique, sepsis","+ Médicaments altérant l’autorégulation rénale : AINS, IEC, ARA2 (surtout associés aux diurétiques) ; sténose de l’artère rénale","Note : la lithiase relève d’une insuffisance rénale obstructive, et non fonctionnelle"],"criteria":[{"weight":0.4,"label":"Déshydratation / hypovolémie","yes":"(?:deshydrat|hypovolemi|vomiss|diarrhe|diuretique)"},{"weight":0.4,"label":"Hémorragie","yes":"hemorragi"},{"weight":0.4,"label":"Choc / hypotension / insuffisance cardiaque","yes":"(?:choc|hypotension|insuffisance cardiaque|debit)"},{"weight":0.4,"label":"Cirrhose / syndrome hépatorénal / néphrotique / sepsis","yes":"(?:cirrhose|hepato.?renal|nephrotique|sepsis)"},{"weight":0.4,"label":"Médicaments (AINS, IEC, ARA2)","yes":"(?:ains|anti.?inflammatoire|\\biec\\b|ara\\s*2|ara ii|sartan)"}]},{"kind":"QROC","num":5,"page":113,"correct":"","points":2.7,"id":"c24","title":"Citer les médicaments anesthésiques de choix dans le cadre d’une insuffisance rénale chronique (hypnotiques, morphiniques et myorelaxants).","source":"complete","answer":["Hypnotiques : propofol, + étomidate ; halogénés utilisables (desflurane, isoflurane ; sévoflurane avec prudence)","Morphiniques : rémifentanil (métabolisé par les estérases, sans accumulation), + sufentanil ou fentanyl à doses adaptées ; éviter la morphine (accumulation de métabolites actifs)","Myorelaxants : atracurium et cisatracurium, éliminés par la voie d’Hofmann indépendamment du rein ; + émie, troubles visuels)","B · Signes neurologiques subjectifs : vertiges, sensation de malaise, confusion","+ Céphalées, troubles visuels (vision floue, cécité transitoire), nausées, agitation, anxiété, paresthésies"]},{"kind":"context","page":123,"title":"Cas clinique (9 points)","id":"c37","text":"Vous travaillez au bloc opératoire, en chirurgie digestive. Vous prenez en soin M. D., 50 ans, 1,75 m, 78 kg, opéré d’une colectomie droite sous cœlioscopie. Cette chirurgie d’environ 2 h 30 est programmée et se déroulera sous anesthésie générale avec intubation orotrachéale, en décubitus dorsal avec la possibilité d’un proclive à la demande du chirurgien.\n\nAntécédents médicaux : asthme stable et traité depuis l’enfance ; rhinite allergique (acariens, pollens, poussières) ; hypertension artérielle traitée et équilibrée par candésartan 8 mg, un comprimé le matin.\nAntécédents chirurgicaux : appendicectomie sous anesthésie générale en 2000.\nTraitement en cours : salbutamol (Ventoline®) spray 100 µg/dose, 1 à 2 bouffées en cas de gêne respiratoire ; kétotifène (Zaditen®), antihistaminique 1 mg, 1 gélule matin et soir ; candésartan 8 mg, 1 comprimé le matin.\nAccès aux voies aériennes : Mallampati 2, absence de prothèse dentaire, ouverture de bouche > 35 mm, distance thyro-mentonnière > 65 mm.\nPrescriptions : prémédication par hydroxyzine (Atarax®) 100 mg per os le matin de l’intervention ; à jeun depuis minuit.\nStratégie d’anesthésie : sufentanil (Sufenta®), propofol (Diprivan®), sévoflurane (Sévorane®). M. D. est coté ASA 2.\nVisite préanesthésique : rien à signaler depuis la consultation ; PCR Covid négative ; hémoglobine 11 g/dL ; RAI négative ; bilan biologique complet sans anomalie."},{"kind":"QUESTION","num":1,"page":124,"correct":"","points":1,"id":"c38","title":"Question 1 — Citez les questions spécifiques que vous allez poser à M. D. au regard de son terrain asthmatique. Expliquez-en l’intérêt. Citez le risque spécifique pouvant survenir.","source":"complete","answer":["Questions : ancienneté de l’asthme ; fréquence des crises et date de la dernière crise ; facteurs déclenchants (allergènes, effort, froid, infection, aspirine ou AINS) ; traitement de fond, observance et efficacité (recours à la Ventoline®)","+ Sévérité : hospitalisations, passages en réanimation ou intubation pour asthme, corticothérapie récente ; infection respiratoire récente, tabagisme","Intérêt : évaluer la sévérité et le contrôle de l’asthme, l’optimiser avant l’intervention (reporter si asthme non contrôlé), adapter la prémédication (bronchodilatateur avant l’induction) et la stratégie anesthésique","Risque spécifique : bronchospasme (à l’induction, à l’intubation ou au réveil)"],"criteria":[{"weight":0.2,"label":"Fréquence / dernière crise","yes":"(?:frequence|derniere crise|crise)"},{"weight":0.2,"label":"Facteurs déclenchants / allergies","yes":"(?:declench|allerg|aspirine|ains|stimul)"},{"weight":0.2,"label":"Traitement de fond / observance","yes":"(?:traitement|observance|ventoline|efficac)"},{"weight":0.2,"label":"Sévérité : hospitalisation, réanimation","yes":"(?:hospitalis|reanimation|intubation|severite|cortico|anciennete|depuis quand)"},{"weight":0.2,"label":"Risque : bronchospasme","yes":"bronchospasm"}]},{"kind":"QCM","num":1,"page":125,"correct":"CE","points":1,"id":"c39","title":"Lors de l’accueil de ce patient, vous le questionnez sur son jeûne.\nParmi ces propositions concernant les règles du jeûne opératoire, laquelle (ou lesquelles) est (sont) vraie(s) ?","options":["Le jeûne doit être de 8 h après l’absorption de solides","Le jeûne doit être de 2 h après l’absorption de café au lait","Le jeûne doit être de 6 h après l’absorption d’eau pétillante","Le jeûne doit être de 2 h après l’absorption d’un litre d’eau","Le jeûne doit être de 6 h après l’absorption de jus d’orange avec pulpe"],"instruction":"Cocher la ou les réponse(s) exacte(s)"},{"kind":"QUESTION","num":2,"page":125,"correct":"","points":0.4,"criteria":[{"weight":0.2,"label":"Hypertension artérielle","yes":"\\b(?:hta|hypertension(?: arterielle)?)\\b","bad":""},{"weight":0.2,"label":"Anxiété","yes":"\\b(?:anxiete|angoisse)\\b","bad":""}],"allOrNothing":false,"id":"c40","title":"La pression artérielle de référence prise à l’arrivée au bloc est de 150/92 mmHg, la fréquence cardiaque de 72/min.\nQuestion 2 — Interprétez ce chiffre de pression artérielle.","source":"copie","answer":["PA 150/92 mmHg : valeur supérieure aux seuils de l’HTA (≥ 140/90), donc pression élevée à l’arrivée au bloc","Explications probables : anxiété (effet « blouse blanche »), arrêt du candésartan avant l’intervention ; HTA connue, donc valeur de référence à garder pour fixer les objectifs peropératoires"]},{"kind":"QUESTION","num":3,"page":126,"correct":"","points":1,"criteria":[{"weight":0.2,"label":"Rigidité / ↑ résistances vasculaires","yes":"(?:rigid|resistance)"},{"weight":0.2,"label":"Hyperréactivité sympathique aux stimuli","yes":"(?:hyperreactiv|sympathi|stimul|laryngoscop)"},{"weight":0.2,"label":"Hypovolémie relative → hypotension à l’induction","yes":"(?:hypovolemi|hypotension|vasodilat|induction)"},{"weight":0.2,"label":"Blocage du SRAA (IEC, ARA2)","yes":"(?:renine|sraa|iec|ara|sartan|angiotensine)"},{"weight":0.2,"label":"HVG / autorégulation déplacée","yes":"(?:hypertrophie|\\bvg\\b|autoregulation|pam)"}],"allOrNothing":false,"id":"c41","title":"Vous craignez une instabilité hémodynamique en peropératoire.\nQuestion 3 — Expliquez les mécanismes physiologiques expliquant les variations tensionnelles chez le patient hypertendu en peropératoire.","source":"complete","answer":["Chez l’hypertendu chronique : rigidité artérielle et augmentation des résistances vasculaires systémiques, d’où une labilité tensionnelle","Hyperréactivité sympathique aux stimuli (laryngoscopie, intubation, incision) → poussées hypertensives","+ Hypovolémie relative (vasoconstriction chronique, diurétiques) → hypotension marquée à l’induction (vasodilatation, baisse du tonus sympathique)","+ Blocage du système rénine-angiotensine (IEC, ARA2 comme le candésartan) → hypotensions sévères, parfois réfractaires","Hypertrophie du VG (baisse de la compliance, dépendance à la précharge) et déplacement vers la droite de la courbe d’autorégulation cérébrale et rénale : une PAM plus élevée est nécessaire pour perfuser les organes"]},{"kind":"QUESTION","num":4,"page":127,"correct":"","points":1.4,"criteria":[{"weight":0.2,"label":"↑ pression intra-abdominale / compression VCI","yes":"(?:pression intra.?abdominale|compression|veine cave|pneumoperitoine)"},{"weight":0.2,"label":"↓ retour veineux / VES / débit cardiaque","yes":"(?:retour veineux|ves|debit cardiaque)"},{"weight":0.2,"label":"Hypotension aggravée par le proclive / ARA2","yes":"(?:proclive|sartan|ara|hypotension)"},{"weight":0.2,"label":"↑ postcharge / RVS / HTA","yes":"(?:postcharge|resistance|catecholamine|vasopressine|hta|hypertension)"},{"weight":0.2,"label":"Hypercapnie → sympathique / arythmies","yes":"(?:hypercapn|co2|arythm|tachycard)"},{"weight":0.2,"label":"Réflexe vagal / bradycardie","yes":"(?:vagal|bradycard|asystol)"},{"weight":0.2,"label":"Embolie gazeuse","yes":"embolie"}],"allOrNothing":false,"id":"c42","title":"Après l’intubation, M. D. est installé par l’équipe chirurgicale et anesthésique. L’équipe d’anesthésie valide la possibilité d’inciser. Le chirurgien demande un léger proclive. Le CO₂ est insufflé.\nQuestion 4 — Énoncez et argumentez les répercussions hémodynamiques de la cœlioscopie (insufflation de CO₂) chez M. D.","source":"complete","answer":["Le pneumopéritoine augmente la pression intra-abdominale : compression de la veine cave inférieure → baisse du retour veineux, du VES et du débit cardiaque","Hypotension majorée par le proclive (séquestration sanguine dans les membres inférieurs) et, chez M. D., par le traitement par ARA2 (candésartan) et l’HTA","+ Augmentation de la postcharge : compression de l’aorte et des vaisseaux splanchniques, libération de catécholamines, de vasopressine et activation du SRAA → hausse des résistances vasculaires systémiques et de la PA","+ Hypercapnie par absorption du CO₂ → stimulation sympathique (tachycardie, HTA) et risque d’arythmies","+ Réflexe vagal à l’insufflation (étirement péritonéal) : bradycardie, voire asystolie ; + risque d’embolie gazeuse"]},{"kind":"QUESTION","num":5,"page":128,"correct":"","points":0.8,"id":"c43","title":"Au moment de l’insufflation du CO₂, vous constatez que la courbe de capnogramme a la forme suivante sur le respirateur.\nQuestion 5 — Interprétez cette courbe et argumentez votre réponse.","source":"complete","answer":["Intubation sélective : l’insufflation du CO₂ fait remonter le diaphragme et la carène, la sonde migre dans une bronche souche","+ Argument : capnogramme biphasique (plateau en deux temps) traduisant une vidange asynchrone des deux poumons ; à confirmer par une auscultation asymétrique, la hausse des pressions d’insufflation et une éventuelle désaturation","+ Conduite : vérifier la position de la sonde et la retirer de quelques centimètres jusqu’à une auscultation symétrique"],"criteria":[{"weight":0.4,"label":"Intubation sélective","yes":"selective"},{"weight":0.2,"label":"Ascension de la carène / du diaphragme","yes":"(?:carene|diaphragme|ascension|remont)"},{"weight":0.2,"label":"Capnogramme biphasique / auscultation asymétrique","yes":"(?:biphasique|deux temps|asynchrone|asymetri|auscult)"}],"figure_img":"/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAGtBEwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEB const normalize = text => text.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,' ').replace(/(\d),(?=\d)/g,'$1.').trim();
const close = (a,b) => Math.abs(a-b)<1e-7;
const round = n => Math.round(n*10000)/10000;
const reviewOptions = [
  ['', 'À évaluer'],
  ['correct', 'Correcte'],
  ['partial', 'Partielle'],
  ['review', 'À revoir · 0 point']
];

function rubricAnalysis(raw, criteria) {
  const input=normalize(raw);
  const clauses=input.split(/[;!?\n,]+|\.(?!\d)|\b(?:mais|cependant|pourtant)\b/).map(s=>s.trim()).filter(Boolean);
  return criteria.map(criterion=>{
    const yes=new RegExp(criterion.yes.trim(),'i');
    const bad=criterion.bad ? new RegExp(criterion.bad,'i') : null;
    const conflict=bad && clauses.find(clause=>bad.test(clause));
    const matches=clauses.filter(clause=>yes.test(clause));
    const negated=!criterion.allowNegation && matches.find(clause=>
      /^(?:\w+\s+){0,5}(?:pas|aucun|aucune|non|jamais)\b|\bn\s+est\s+pas\b/.test(clause)
    );
    const evidence=conflict||negated||matches[0]||'';
    const status=conflict||negated?'ambiguous':matches.length?'recognized':'missing';
    return {...criterion,status,evidence,override:null};
  });
}

function analysisPoints(grade) {
  const recognized=grade.analysis.filter(c=>c.override ?? (c.status==='recognized'));
  const earned=round(recognized.reduce((sum,c)=>sum+c.weight,0));
  return grade.allOrNothing && !close(earned,grade.autoMax) ? 0 : earned;
}

function assessed(grade) {
  if(grade.review==='blank' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='correct' && grade.full!=null) return {score:grade.full,max:grade.full};
  if(grade.review==='review' && grade.full!=null) return {score:0,max:grade.full};
  if(grade.review==='partial' && grade.full!=null && grade.manualPoints!=null) {
    return {score:grade.manualPoints,max:grade.full};
  }
  return {score:grade.analysis ? analysisPoints(grade) : grade.autoScore,max:grade.autoMax};
}

function pointsEntry(q,grade) {
  const value=grade.manualPoints??'';
  const hidden=grade.review!=='partial'?' hidden':'';
  return q.kind==='QCM'
    ? `<label data-partial="${q.id}"${hidden}>Points attribués <select data-points="${q.id}"><option value="">À saisir</option><option value="0.5"${value===.5?' selected':''}>0,5</option>${DATA.twoErrors===.25?`<option value="0.25"${value===.25?' selected':''}>0,25</option>`:''}</select></label>`
    : `<label data-partial="${q.id}"${hidden}>Points attribués sur ${format(grade.full)} <input data-points="${q.id}" type="number" inputmode="decimal" min="0" max="${grade.full}" step="any" value="${value}"></label>`;
}

function assessmentControls(q,grade) {
  if(grade.review==='blank') return '<p class="small">Sans réponse.</p>';
  const partial=q.kind!=='QCU'&&!q.allOrNothing;
  const choices=reviewOptions.filter(([key])=>partial||key!=='partial');
  const options=choices.map(([key,label])=>`<option value="${key}"${key===grade.review?' selected':''}>${!key&&grade.analysis?'Selon l’analyse automatique':label}</option>`).join('');
  return `<div class="self-assessment"><label for="review-${q.id}">Évalue ta réponse</label><select id="review-${q.id}" data-review="${q.id}">${options}</select>${grade.full!=null&&partial?pointsEntry(q,grade):''}</div>`;
}

const nCh=realCards.filter(q=>q.kind==='QCM'||q.kind==='QCU').length,nOp=realCards.length-nCh;

document.title=`UE ${DATA.ue} · Semestre ${DATA.semester} · Annales 2022-2024 — ${DATA.title}`;
$('h-eyebrow').textContent=`École IADE · UE ${DATA.ue} · Semestre ${DATA.semester} · Annales 2022-2024`;
$('h-title').textContent=DATA.title;
$('h-stats').innerHTML=[[realCards.length,'questions'],[nCh,'QCM / QCU'],[nOp,'questions ouvertes'],[nPts.toLocaleString('fr-FR'),'points au barème']].filter(([n])=>n!==0).map(([n,t])=>`<div class="hero-stat"><b>${n}</b><span>${t}</span></div>`).join('');
$('h-rules').innerHTML=`<p>QCM sur 1 point : une erreur ou un oubli = 0,5 point${DATA.twoErrors?`, deux erreurs ou oublis = ${String(DATA.twoErrors).replace('.',',')} point`:''}, au-delà 0. QCU sur 1 point.</p><p>Questions ouvertes : ta réponse est comparée aux éléments attendus. Si la détection n’a pas reconnu une bonne idée, clique sur <b>Valider cet élément</b> ou choisis une évaluation manuelle.</p><p>Les éléments marqués <span class="tag-added">Complément</span> complètent la réponse de la copie corrigée. Les corrigés <span class="tag-src deduit">Reconstitué</span> sont établis à partir du cours car la copie n’avait pas la note maximale.</p>`;
$('h-footer').textContent=`Source · Annales 2022–2024, UE ${DATA.ue}, semestre ${DATA.semester}${DATA.start?`, pages ${DATA.start} à ${DATA.end} du PDF`:''}. Fonctionne hors connexion.`;
const srcTag=q=>q.source==='deduit'?'<span class="tag-src deduit">Reconstitué</span>':q.source==='complete'?'<span class="tag-src">Copie complétée</span>':q.source==='copie'?'<span class="tag-src">Copie notée au maximum</span>':'';
function answerBox(q){
  let list=q.answer; if(!list) return ''; if(typeof list==='string') list=[list];
  const items=list.map(a=>{const add=a.startsWith('+');const t=add?a.replace(/^\+\s*/,''):a;return `<li class="${add?'added':''}">${escape(t)}${add?'<span class="tag-added">Complément</span>':''}</li>`;}).join('');
  return `<div class="answer-key"><h3>Correction ${srcTag(q)}</h3><ul>${items}</ul>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`;
}
let active, grades, locked, confirmed, targeted;
const form = $('quiz');
function images(list, label) {
  return list.map((item,i) => `<img loading="lazy" alt="${escape(label)}${list.length>1?' · extrait '+(i+1):''}" src="data:image/jpeg;base64,${item}">`).join('');
}
function scanBlock(scans, label) {
  return `<div class="document"><div class="source-pictures" tabindex="0" aria-label="${escape(label)}">${images(scans,label)}</div><button type="button" class="secondary zoom" aria-expanded="false">Agrandir le scan</button></div>`;
}
function prompt(q) {
  if(q.images) return scanBlock(q.images,questionLabel(q));
  const table=q.table?`<div class="prompt-table">${q.table.map(cell=>`<span>${escape(cell)}</span>`).join('')}</div>`:'';
  return `<h2 class="question-stem">${escape(q.title)}</h2>${q.text?`<p class="context-text">${escape(q.text)}</p>`:''}${q.figure_img?`<div class="q-figure"><img src="data:image/jpeg;base64,${q.figure_img}" alt="Figure de la question"></div>`:''}${q.instruction?`<p class="small">${escape(q.instruction)}</p>`:''}${table}`;
}
function fields(q) {
  if (isChoice(q)) {
    return `<div class="choices ${q.options?'written-choices':''}" role="${q.kind==='QCU'?'radiogroup':'group'}" aria-labelledby="title-${q.id}">${values.map((letter,i)=>`<label class="option" id="option-${q.id}-${letter}"><input type="${q.kind==='QCU'?'radio':'checkbox'}" name="${q.id}" value="${letter}"><span><strong>${letter}</strong>${q.options?' · '+escape(q.options[i]):''}<small></small></span></label>`).join('')}</div>`;
  }
  return `<div class="field"><textarea id="answer-${q.id}" aria-labelledby="title-${q.id}" rows="5" placeholder="Ta réponse…"></textarea></div>`;
}
function render() {
  $('cards').innerHTML = active.map((q, index) => {
    const section = q.kind === 'context' ? '<span>Cas clinique</span>' : `<span>${q.points==null?'':format(q.points)+' pt · '}PDF p. ${q.page}</span>`;
    const anchor = active.findIndex(card=>card.kind===q.kind)===index ? ` id="section-${q.kind}"` : '';
    return `<section class="card"${anchor} data-card="${q.id}"><div class="meta"><strong id="title-${q.id}">${escape(questionLabel(q))}</strong>${section}</div>${prompt(q)}${q.kind==='context'?'':fields(q)+`<div class="feedback" id="feedback-${q.id}" hidden></div>`}</section>`;
  }).join('');
  for(const link of document.querySelectorAll('[data-kind]')){
    const kind=link.dataset.kind;
    const index=active.findIndex(q=>kind==='open'?isOpen(q):q.kind===kind);
    link.hidden=index<0;
    if(index>=0) link.hash='section-'+active[index].kind;
  }
}
function response(q) {
  if (isChoice(q)) {
    return [...form.querySelectorAll(`[name="${q.id}"]:checked`)].map(input=>input.value);
  }
  return $(`answer-${q.id}`).value.trim();
}
function progress() {
  const current=active.filter(q=>q.kind!=='context');
  const count=current.filter(q=>response(q).length>0).length;
  $('progress').textContent=`${count} / ${current.length} questions renseignées`;
  $('bar').max=current.length;
  $('bar').value=count;
}
function compute(q, answers) {
  if (!q.correct) return {autoMax:0,autoScore:0};
  const errors=values.filter(letter=>answers.includes(letter)!==q.correct.includes(letter)).length;
  const points=q.kind==='QCU' ? Number(errors===0) : answers.length===0 ? 0 : [1,.5,DATA.twoErrors][errors] ?? 0;
  return {autoMax:1,autoScore:points};
}
function rubricPanel(q, grade) {
  if(!grade.analysis) return `<p class="small">Réponse à évaluer à partir de la copie annotée.${q.allOrNothing?' Barème tout ou rien.':''}</p>`;
  const status={recognized:'Reconnu',missing:'À compléter',ambiguous:'À vérifier'};
  const items=grade.analysis.map((c,i)=>{
    const description=c.override===null?status[c.status]:c.override?'Validé manuellement':'Retiré manuellement';
    const evidence=c.evidence?`<span class="evidence">${escape(c.evidence.slice(0,180))}</span>`:'';
    const button=grade.review==='blank'?'':`<button type="button" data-criterion="${q.id}:${i}">${c.override!==null?'Rétablir l’analyse':c.status==='recognized'?'Retirer cet élément':'Valider cet élément'}</button>`;
    return `<div class="criterion"><span class="badge ${c.status==='recognized'?'':'missing'}">${description}</span><strong>${escape(c.label)}</strong> · ${format(c.weight)} pt${evidence}${button}</div>`;
  }).join('');
  return `<div id="analysis-${q.id}"><strong>Analyse automatique · ${format(analysisPoints(grade))} / ${format(grade.autoMax)} points${grade.full>grade.autoMax?' vérifiables':''}</strong>${grade.allOrNothing?'<p class="small">Barème tout ou rien pour cette question.</p>':''}${items}</div>`;
}
function correction(q) {
  const given=response(q);
  const grade={full:q.points,autoMax:0,autoScore:0};
  if(isChoice(q)){
    Object.assign(grade,compute(q,given));
    if(!q.correct) grade.review=given.length?'':'blank';
    for(const letter of values){
      const row=$(`option-${q.id}-${letter}`);
      row.querySelector('input').disabled=true;
      if(!q.correct) continue;
      const checked=given.includes(letter);
      const good=q.correct.includes(letter);
      row.classList.add(good?checked?'right':'missed':checked?'wrong':'unused');
      row.querySelector('small').textContent=good?checked?'Validée':'Oubliée':checked?'Fausse':'';
    }
  }else{
    $(`answer-${q.id}`).readOnly=true;
    grade.review=given?'':'blank';
    if(q.criteria?.length){
      grade.analysis=rubricAnalysis(given,q.criteria);
      grade.autoMax=round(q.criteria.reduce((sum,c)=>sum+c.weight,0));
      grade.allOrNothing=q.allOrNothing;
    }
  }
  grades.set(q.id,grade);
  const panel=$(`feedback-${q.id}`);
  panel.hidden=false;
  const reference=`<p class="small">Page ${q.page} du PDF source.</p>`;
  if (isOpen(q)) {
    const caution=q.caution?`<p class="notice">${escape(q.caution)} <a href="https://www.glasgowcomascale.org/downloads/GCS-Assessment-Aid-English.pdf">Grille Glasgow</a></p>`:'';
    panel.innerHTML=`${answerBox(q)}${rubricPanel(q,grade)}${caution}${q.evidence&&!q.answer?scanBlock(q.evidence,'Réponse annotée · '+questionLabel(q)):''}${assessmentControls(q,grade)}${reference}`;
    return;
  }
  const key=q.correct?`<strong>${format(grade.autoScore)} / 1 point</strong><div class="answer-key" style="margin-top:10px"><h3>Correction ${srcTag(q)}</h3><div class="key-letters">Bonne${q.correct.length>1?'s':''} réponse${q.correct.length>1?'s':''} · ${q.correct.split('').join(', ')}</div>${q.note?`<p class="answer-note">${escape(q.note)}</p>`:''}</div>`:`<strong>Corrigé à vérifier</strong><p>La copie comporte une note partielle ou nulle.${q.marked?' Choix cochés · '+escape(q.marked)+'.':''}</p>`;
  const evidence=q.evidence?`<details><summary>Voir la copie annotée</summary><div class="source-pictures" tabindex="0">${images(q.evidence,'Copie annotée · '+questionLabel(q))}</div></details>`:'';
  panel.innerHTML=key+evidence+(q.correct?'':assessmentControls(q,grade))+reference;
}
function isComplete(grade) {
  const {score,max}=assessed(grade);
  return grade.review==='correct'||(grade.full!=null&&close(max,grade.full)&&close(score,max));
}
function applyFilter() {
  const filter=$('filter').value==='imperfect';
  for(const q of active){
    const card=form.querySelector(`[data-card="${q.id}"]`);
    const grade=grades.get(q.id);
    card.hidden=filter&&Boolean(grade)&&isComplete(grade);
  }
}
function tally() {
  const list=[...grades.values()];
  const points=list.map(assessed);
  const sum=round(points.reduce((acc,g)=>acc+g.score,0));
  const max=round(points.reduce((acc,g)=>acc+g.max,0));
  const available=round(list.reduce((acc,g)=>acc+(g.full??0),0));
  const paper=targeted?available:DATA.examTotal??available;
  const remaining=Math.max(0,round(paper-max));
  const manual=$('global-mark');
  const globalScore=manual&&manual.value!==''&&manual.validity.valid?Number(manual.value):null;
  $('score').textContent=max>0?`${format(20*sum/max,2)} / 20`:globalScore!==null?`${format(globalScore,2)} / 20`:'Note sur 20 à établir';
  $('summary').textContent=max>0
    ? `${format(sum)} / ${format(max)} points évalués.${remaining>0?` Note provisoire · ${format(remaining)} points du barème restent à évaluer.`:''}`
    : globalScore!==null?'Note globale saisie manuellement.':'Aucun point évaluable automatiquement ou manuellement pour l’instant.';
  const incomplete=list.filter((g,i)=>g.full!=null&&g.full>points[i].max).length;
  $('manual-summary').textContent=incomplete
    ? `Complète la correction manuelle pour ${incomplete} question${incomplete===1?'':'s'}.`:'';
  $('retry').disabled=list.every(isComplete);
  applyFilter();
}
function submit() {
  if(locked) return;
  const current=active.filter(q=>q.kind!=='context');
  const missing=current.filter(q=>!response(q).length).length;
  if(missing&&!confirmed){
    $('message').textContent=`${missing} question(s) sans réponse. Clique de nouveau pour corriger la tentative.`;
    confirmed=true;
    return;
  }
  locked=true;
  current.forEach(correction);
  $('results').hidden=false;
  $('filters').hidden=false;
  $('submit').hidden=true;
  $('mode').textContent='Corrigé';
  $('message').textContent='';
  tally();
  $('results').focus();
  $('results').scrollIntoView({block:'start'});
}
function start(retry=false) {
  const keep=retry?new Set([...grades].filter(([,g])=>!isComplete(g)).map(([id])=>id)):null;
  targeted=retry;
  if($('global-mark'))$('global-mark').value='';
  active=DATA.cards.filter(q=>!keep||q.kind==='context'||keep.has(q.id));
  grades=new Map();
  locked=false;
  confirmed=false;
  $('results').hidden=true;
  $('filters').hidden=true;
  $('submit').hidden=false;
  $('message').textContent='';
  $('mode').textContent=retry?'Reprise ciblée':'Entraînement';
  $('filter').value='all';
  render();
  progress();
  if(retry) window.scrollTo(0,0);
}
form.addEventListener('submit', e=>{e.preventDefault(); submit();});
form.addEventListener('input',()=>{if(locked)return; confirmed=false; $('message').textContent=''; progress();});
form.addEventListener('change',event=>{
  const field=event.target.closest('[data-review],[data-points]');
  if(!locked||!field)return;
  const id=field.dataset.review??field.dataset.points;
  const grade=grades.get(id);
  if(field.hasAttribute('data-review')){
    grade.review=field.value;
    const partial=form.querySelector(`[data-partial="${id}"]`);
    if(partial)partial.hidden=field.value!=='partial';
  }else{
    const value=field.value===''?null:Number(field.value);
    grade.manualPoints=Number.isFinite(value)&&value>=0&&value<=grade.full?value:null;
  }
  tally();
});
$('global-mark')?.addEventListener('input',tally);
form.addEventListener('click',event=>{
  const criterion=event.target.closest('[data-criterion]');
  if(locked&&criterion){
    const [id,index]=criterion.dataset.criterion.split(':');
    const grade=grades.get(id);
    const item=grade.analysis[Number(index)];
    item.override=item.override===null?item.status!=='recognized':null;
    const q=active.find(card=>card.id===id);
    $('analysis-'+id).outerHTML=rubricPanel(q,grade);
    form.querySelector(`[data-criterion="${id}:${index}"]`)?.focus({preventScroll:true});
    tally();
    return;
  }
  const button=event.target.closest('.zoom');
  if(!button)return;
  const enlarged=button.closest('.document').classList.toggle('enlarged');
  button.setAttribute('aria-expanded',String(enlarged));
  button.textContent=enlarged?'Réduire le scan':'Agrandir le scan';
});
$('filter').addEventListener('change',applyFilter);
$('reset').addEventListener('click',()=>{start(); window.scrollTo(0,0);});
$('retry').addEventListener('click',()=>start(true));
start();

<script>window.MEMO_QUIZ={"id": "annales/S1/3.3", "href": "annales/S1/3.3.html", "collection": "annales", "sem": "S1", "ue": "3.3", "periode": "2022-2024", "titre": "Modalités spécifiques — 2022-2024"};</script>
<script>
/* Mémo : enregistre la note obtenue, pour l'écran « Mes résultats » de l'app.
   Même origine que l'app, donc même localStorage. Une tentative par correction ;
   si la note est ajustée à la main ensuite, la tentative en cours est mise à jour. */
(function () {
  var CLE = 'memo-resultats', INFO = window.MEMO_QUIZ;
  if (!INFO) return;
  var resultats = document.getElementById('results'), score = document.getElementById('score');
  if (!resultats || !score) return;
  var tentative = null;

  function lire() { try { return JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { return []; } }
  function noteDe(txt) {
    var m = String(txt).match(/(-?[\d  ]+(?:[.,]\d+)?)\s*\/\s*20/);
    return m ? parseFloat(m[1].replace(/[  ]/g, '').replace(',', '.')) : null;
  }
  function enregistrer() {
    if (resultats.hidden) return;
    var note = noteDe(score.textContent);
    if (note === null || !isFinite(note)) return;
    var liste = lire();
    var ligne = tentative && liste.find(function (x) { return x.cle === tentative; });
    if (!ligne) {
      tentative = INFO.id + '#' + Date.now();
      ligne = { cle: tentative, id: INFO.id, href: INFO.href, collection: INFO.collection,
        sem: INFO.sem, ue: INFO.ue, periode: INFO.periode, titre: INFO.titre };
      liste.push(ligne);
    }
    ligne.note = Math.round(note * 100) / 100;
    ligne.date = new Date().toISOString();
    try { localStorage.setItem(CLE, JSON.stringify(liste.slice(-300))); } catch (e) {}
  }

  new MutationObserver(enregistrer).observe(score, { childList: true, characterData: true, subtree: true });
  new MutationObserver(enregistrer).observe(resultats, { attributes: true, attributeFilter: ['hidden'] });
  // « Tout recommencer » : la prochaine correction comptera comme une nouvelle tentative.
  document.getElementById('reset') && document.getElementById('reset').addEventListener('click', function () { tentative = null; });
})();
</script>
